/* ---- styles/base.css ---- */
/* Reset and element defaults. */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 var(--ui); font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
math{font-family:var(--math)}

/* Typography shared by every page */
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:650;margin:0 0 6px}
.lede{margin:0;color:var(--muted);max-width:62ch}
.sym{font-family:var(--math);font-style:italic;color:var(--ink);font-size:17px;margin-right:4px}
.lede .sym{margin:0 1px;font-size:16px}

@media (max-width:620px){
  h1{font-size:24px}
}

/* ---- styles/components.css ---- */
/* Reusable controls: buttons, segmented toggles, number fields, sliders. */
.btn{
  height:30px;padding:0 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-size:13px;white-space:nowrap;
}
.btn:hover{background:var(--hover)}
.btn[hidden]{display:none}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:none;height:26px;padding:0 11px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* number field */
.num{
  width:100%;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);
  text-align:right;font-variant-numeric:tabular-nums;
}
.num:focus{background:var(--surface)}
.num[aria-invalid="true"]{border-color:var(--danger);color:var(--danger)}

/* range slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,50%) 100% no-repeat, var(--line)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}

/* checkbox with label */
.check{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.35;color:var(--muted);cursor:pointer}
.check input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.num:disabled, input[type=range]:disabled{opacity:.5;cursor:not-allowed}

/* ---- styles/shell.css ---- */
/* App shell: layout grid, sidebar, mobile top bar, main area. */
/* ---------------- Layout ---------------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}

/* ---------------- Sidebar ---------------- */
.side{
  position:sticky; top:0; height:100vh; overflow:auto;
  background:var(--side); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:18px 12px 12px;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font-weight:600;letter-spacing:-.01em}
.mark{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  background:var(--ink);color:var(--bg);font-family:var(--math);font-size:18px;line-height:1;
}
.side-tools{display:flex;gap:6px;margin:0 4px 12px}
.search{position:relative;display:block;flex:1;min-width:0}
.search input{
  width:100%; height:34px; padding:0 50px 0 10px; border-radius:7px; font-size:14px;
  border:1px solid var(--line); background:var(--surface);
}
.search input::placeholder{color:var(--faint)}
.search kbd{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  font:11px var(--ui); color:var(--faint); border:1px solid var(--line); border-radius:4px; padding:1px 5px;
}
.icon-btn{
  flex:none; width:34px; height:34px; display:grid; place-items:center; cursor:pointer;
  border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--muted);
}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}

/* ---- folder tree ---- */
nav{flex:1}
.folder-row{
  display:flex; align-items:center; gap:6px; width:100%;
  padding:5px 8px 5px 4px; border:0; border-radius:6px; background:none; cursor:pointer;
  color:var(--ink); font-size:14px; font-weight:550; text-align:left;
}
.folder-row:hover{background:var(--hover)}
.chev{width:12px;height:12px;flex:none;color:var(--faint);transition:transform .15s ease}
.folder[data-open="true"] > .folder-row .chev{transform:rotate(90deg)}
.ficon{display:grid;flex:none;color:var(--muted)}
.ficon svg{width:16px;height:16px;grid-area:1 / 1}
.ficon .open, .folder[data-open="true"] > .folder-row .ficon .closed{visibility:hidden}
.folder[data-open="true"] > .folder-row .ficon .open{visibility:visible}
.fname{flex:1;min-width:0}
.fcount{font-size:11.5px;font-weight:400;color:var(--faint)}
/* open/close animates the row height; closed bodies are inert so they can't be tabbed into */
.folder-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .18s ease}
.folder[data-open="true"] > .folder-body{grid-template-rows:1fr}
.folder-inner{overflow:hidden;min-height:0;margin-left:9px;padding-left:7px;border-left:1px solid var(--line)}
.folder[data-open="true"] > .folder-body > .folder-inner{padding-block:1px 4px}

.page-link{

.page-link:hover{background:var(--hover)}
.page-link.soon{color:var(--faint)}
.page-link[aria-current="page"]{

}
.folder-row:focus-visible, .page-link:focus-visible{outline-offset:-2px}
.nav-empty{padding:6px 10px;color:var(--faint);font-size:14px}
.side-foot{border-top:1px solid var(--line);padding-top:10px;margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-foot .seg button{padding:0 9px;font-size:12px}
.ghost{
  display:flex;align-items:center;gap:8px;flex:1;min-width:0;

.ghost:hover{background:var(--hover);color:var(--ink)}
.ghost svg{width:16px;height:16px}

/* mobile top bar */
.topbar{display:none}
.scrim{display:none}

/* ---------------- Main ---------------- */
main{min-width:0;padding:34px 40px 48px}
.page{max-width:1240px;margin:0 auto}

  }

  main{padding:22px 16px 40px}
}
@media (prefers-reduced-motion:reduce){ .side, .chev, .folder-body{transition:none} }

/* ---- styles/page.css ---- */
/* Shared page layout: formula panel, graph card, controls column, result box.
   Every calculator page uses these classes; page-specific styles go in pages/<id>.css. */
/* formulas: the centrepiece */
.formulas{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:6px 22px; margin-bottom:18px;
}
.frow{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center;padding:14px 0}
.frow + .frow{border-top:1px solid var(--grid)}
.flabel{font-size:13px;color:var(--muted)}
.fmath{overflow-x:auto;overflow-y:hidden;font-size:21px;padding:2px 0;scrollbar-width:thin}
.fmath math{display:block;margin:0;text-align:left}
.fmath math + math{margin-top:10px}
.fmath math.res{color:var(--muted)}

/* workspace */
.work{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:18px;align-items:start}
.plot-col{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 12px 10px; min-width:0;
}
.plot-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 2px 10px}
.bar-actions{display:flex;gap:6px;flex-wrap:wrap}
.plot-wrap{position:relative;height:clamp(300px,50vh,520px)}
canvas#plot{width:100%;height:100%;display:block;touch-action:pan-y;cursor:crosshair}
canvas#plot.dragging{cursor:ew-resize}
canvas#plot.panning{cursor:grabbing}
.readout{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.readout b{font-weight:500;color:var(--ink)}
.readout[hidden]{display:none}
.legend{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 4px 0;font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:2px 4px 2px 8px;border-radius:5px;background:var(--bg)}
.chip .sw{width:18px;height:0;border-top:2px solid var(--accent)}
.chip.pinned .sw{border-top:2px dashed var(--pin)}
.chip button{border:0;background:none;cursor:pointer;color:var(--faint);padding:0 4px;font-size:15px;line-height:1}
.chip button:hover{color:var(--ink)}
.chip:not(.pinned){padding-right:8px}
.hint{color:var(--faint)}
.hint[hidden]{display:none}

/* controls column */
.controls{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.group{padding:16px 18px}
.group + .group{border-top:1px solid var(--line)}
.group h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--ink)}
.param{display:grid;grid-template-columns:1fr 96px;align-items:center;gap:6px 10px;margin-bottom:14px}
.param:last-child{margin-bottom:0}
.param label{font-size:14px;color:var(--muted)}
.param input[type=range]{grid-column:1 / -1}

.result{background:var(--accent-soft)}
.p-big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.p-sub{font-size:13px;color:var(--muted);margin-top:4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;white-space:nowrap}

@media (max-width:1080px){
  .work{grid-template-columns:1fr}
  .controls{display:grid;grid-template-columns:1fr 1fr}
  .controls .group + .group{border-top:0}
  .controls .group{border-top:1px solid var(--line)}
  .controls .group:nth-child(-n+2){border-top:0}
  .controls .group:nth-child(even){border-left:1px solid var(--line)}
}
@media (max-width:860px){
  .frow{grid-template-columns:1fr;gap:6px}
  .fmath{font-size:18px}
  .formulas{padding:4px 16px}
}
@media (max-width:620px){
  .controls{display:flex}
  .controls .group:nth-child(even){border-left:0}
  .controls .group + .group{border-top:1px solid var(--line)}
}

/* ---- sections below the graph: examples, symbols, R code, notes, sources ---- */
.sections{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px 18px;min-width:0}
.sect-wide{grid-column:1 / -1}
.sect h2{font-size:15px;font-weight:600;margin:0 0 10px}
.sect-lede{margin:-4px 0 12px;font-size:13.5px;color:var(--muted)}
.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.example{
  display:grid;gap:3px;align-content:start;text-align:left;cursor:pointer;
  padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);
}
.example:hover{border-color:var(--faint)}
.example[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ex-title{font-size:14px;font-weight:550;line-height:1.3}
.ex-answer{font-size:13px;color:var(--accent)}
.ex-source{font-size:12px;color:var(--faint)}
.symbols{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;margin:0;font-size:14px;align-items:baseline}
.symbols dt{font-size:17px;text-align:right;white-space:nowrap}
.symbols dd{margin:0;color:var(--muted);line-height:1.45}
.code{
  margin:0;padding:12px 14px;overflow-x:auto;border:1px solid var(--grid);border-radius:7px;background:var(--bg);
  font:13px/1.6 ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-variant-numeric:normal;
}
.code .cmt{color:var(--faint)}
.sect-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sect-head h2{margin:0}
.copy{height:26px;padding:0 10px;font-size:12.5px}
.notes, .sources{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:var(--muted)}
.notes li + li, .sources li + li{margin-top:7px}
.sources em{color:var(--ink);font-style:italic}
@media (max-width:860px){
  .sections{grid-template-columns:minmax(0,1fr)}
  .sect{padding:14px 16px 16px}
}

/* ---- styles/pages/normal.css ---- */
/* Normal distribution page: region buttons, bounds, quick ranges, inverse lookup. */
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.modes button{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;
  border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;color:var(--muted);font-size:11.5px;
}
.modes button:hover{background:var(--hover)}
.modes button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.modes svg{width:34px;height:18px;display:block}
.bounds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bounds label{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px}
.bounds label[hidden]{display:none}
.bounds.single{grid-template-columns:1fr}
.quick{display:flex;gap:6px;margin-top:12px;align-items:center;flex-wrap:wrap}
.quick span{font-size:12.5px;color:var(--muted);margin-right:2px}
.quick .btn{height:26px;padding:0 8px;font-size:12.5px}
.qrow{display:grid;grid-template-columns:auto 96px;gap:8px 10px;align-items:center;font-size:14px}
.qrow .lbl{color:var(--muted)}
.qrow .lbl math{font-size:16px}
.qout{font-size:15px;text-align:right;padding-right:9px}
.qrow .btn{grid-column:1 / -1;justify-self:start;margin-top:4px}

/* ---- styles/pages/sample-size.css ---- */
/* Sample size (finite population) page. */
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}
.presets{display:flex;gap:6px;margin:-4px 0 12px}
.presets .btn{height:26px;padding:0 10px;font-size:12.5px}
.presets .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.zline{margin-bottom:8px;font-size:16px;color:var(--muted)}
.zline math{display:inline}
.unit{color:var(--faint);font-size:12.5px}
.note{font-size:12.5px;line-height:1.4;color:var(--faint);margin:-6px 0 14px}
.result .note{margin:12px 0 0;color:var(--muted)}
.check-gap{margin-bottom:14px}
#meanBox[hidden], #propBox[hidden]{display:none}
.chip.census .sw{border-top:2px dotted var(--faint)}
.seg-gap{margin-bottom:12px}
#pilotRow[hidden], #NRow[hidden]{display:none}

/* ---- styles/pages/placeholder.css ---- */
/* placeholder page */
.empty{
  max-width:520px;margin:12vh auto 0;text-align:left;
}
.empty p{color:var(--muted)}
.empty a{color:var(--accent)}
</style>

  <div class="topbar">
    <button id="menuBtn" aria-label="Open menu" aria-controls="side" aria-expanded="false">

        <button data-lang="pt" title="Português" lang="pt-BR" aria-pressed="false">PT</button>
      </div>
    </div>
  </aside>

  <main id="main"></main>
</div>

<script>
/* ---- js/core/util.js ---- */
"use strict";
/* ============================================================
   Small helpers shared by every file.
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MINUS = "\u2212";

/* Round to d decimals and drop trailing zeros: trim(1.500) -> "1.5". Always uses a dot. */
function trim(v, d = 4){
  if (!isFinite(v)) return "—";
  let s = (+v).toFixed(d);
  if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
  if (s === "-0") s = "0";
  return s;
}

/* localStorage that never throws (private windows, blocked storage). */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch {} }
};

/* ---- js/core/i18n.js ---- */
"use strict";
/* ============================================================
   Translation engine. The strings live in js/locales/<lang>.js,
   which each add one entry to I18N. Missing keys fall back to English.

  /* Regularized incomplete beta I_x(a, b), continued fraction (Numerical Recipes betacf). */
  ibeta(x, a, b){
    if (x <= 0) return 0; if (x >= 1) return 1;
    const front = Math.exp(Num.lgamma(a + b) - Num.lgamma(a) - Num.lgamma(b) + a * Math.log(x) + b * Math.log(1 - x));
    if (x > (a + 1) / (a + b + 2)) return 1 - Num.ibeta(1 - x, b, a);
    const TINY = 1e-300; let f = 1, C = 1, D = 1 - (a + b) * x / (a + 1);
    D = 1 / (Math.abs(D) < TINY ? TINY : D); f = D;
    for (let m = 1; m <= 300; m++){
      for (const num of [m * (b - m) * x / ((a + 2 * m - 1) * (a + 2 * m)), -(a + m) * (a + b + m) * x / ((a + 2 * m) * (a + 2 * m + 1))]){
        D = 1 + num * D; D = 1 / (Math.abs(D) < TINY ? TINY : D);
        C = 1 + num / C; if (Math.abs(C) < TINY) C = TINY;

  tCdf(t, df){

  tPdf(t, df){
    return Math.exp(Num.lgamma((df + 1) / 2) - Num.lgamma(df / 2) - 0.5 * Math.log(df * Math.PI) - (df + 1) / 2 * Math.log(1 + t * t / df));

  tInv(p, df){

      if (Math.abs(f) < 1e-14) break;

      let nx = x - f / Num.tPdf(x, df);
      if (!(nx > lo && nx < hi)) nx = (lo + hi) / 2;
      x = nx;

});

"use strict";
/* ============================================================

   ============================================================ */
const M = {
  n: v => { const s = loc(v); return s.startsWith("-") ? `<mrow><mo form="prefix">${MINUS}</mo><mn>${s.slice(1)}</mn></mrow>` : `<mn>${s}</mn>`; },
  i: s => `<mi>${s}</mi>`,
  up: s => `<mi mathvariant="normal">${s}</mi>`,
  o: s => `<mo>${s}</mo>`,
  text: s => `<mtext>${s}</mtext>`,
  t: s => `<mspace width="0.35em"></mspace><mtext>${s}</mtext><mspace width="0.35em"></mspace>`,
  row: (...a) => `<mrow>${a.join("")}</mrow>`,
  frac: (a, b) => `<mfrac>${a}${b}</mfrac>`,
  sqrt: a => `<msqrt>${a}</msqrt>`,
  sup: (a, b) => `<msup>${a}${b}</msup>`,
  sub: (a, b) => `<msub>${a}${b}</msub>`,
  subsup: (a, b, c) => `<msubsup>${a}${b}${c}</msubsup>`,
  paren: a => `<mrow><mo>(</mo>${a}<mo>)</mo></mrow>`,
  brack: a => `<mrow><mo>[</mo>${a}<mo>]</mo></mrow>`,
  minus: v => `<mo>${MINUS}</mo>` + (String(v).startsWith("-") ? M.paren(M.n(v)) : M.n(v)),
  math: (a, cls = "") => `<math display="block"${cls ? ` class="${cls}"` : ""}>${a}</math>`,
  prob(p){
    const s = fmtProb(p);
    if (s.includes("e")){
      const [m, e] = s.split("e");

"use strict";

  get ph(){ return this.h - this.pad.t - this.pad.b; }

  Y(y){ return this.pad.t + this.ph - (y - this.y0) / (this.y1 - this.y0) * this.ph; }

/* Text input for numbers (not type=number) so both "1.5" and "1,5" are accepted.
   Arrow keys step by `step` once bindNudge() has run on the page. */
const numInput = (id, step, extra = "") =>
  `<input class="num" id="${id}" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-step="${step}" ${extra}>`;

/* Set a range slider, widening its range if needed, and paint the filled part of the track. */
function setSlider(r, v){
  if (v < +r.min) r.min = v; if (v > +r.max) r.max = v;
  r.value = v; r.style.setProperty("--p", ((v - r.min) / (r.max - r.min) * 100) + "%");
}

/* Arrow Up/Down nudges every .num field inside root (Shift = ×10), like a native number input. */
function bindNudge(root){
  $$(".num", root).forEach(inp => inp.addEventListener("keydown", e => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    const v = parseNum(inp.value); if (v == null) return;
    e.preventDefault();
    const step = +inp.dataset.step * (e.shiftKey ? 10 : 1), d = Math.max(0, Num.decimalsFor(step));
    inp.value = loc(trim(v + (e.key === "ArrowUp" ? step : -step), Math.max(d, 4)));
    inp.dispatchEvent(new Event("input")); inp.dispatchEvent(new Event("change"));
  }));
}

    const text = b.closest(".sect").querySelector("pre").innerText;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {}
    if (!ok){
      const ta = Object.assign(document.createElement("textarea"), { value: text });
      ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
    }
    b.textContent = ok ? t("copied") : t("copyFailed");
    setTimeout(() => { b.textContent = t("copy"); }, 1600);
  });
}

/* ---- js/nav.js ---- */
"use strict";
/* ============================================================
   Navigation tree — edit this as formulas get added.

   A node is either a page id ("normal") or a folder:
     { folder: "<key>", items: [ ...nodes ] }
   Folders can be nested to any depth.
   Labels come from the locale files: "folder.<key>" and "nav.<id>".
   Pages with an entry in PAGES are live; the rest show a placeholder.
   ============================================================ */
const NAV = [
  { folder: "eda",              items: ["frequency-table", "descriptive-measures", "quartiles-boxplot", "two-variables"] },
  { folder: "probability",      items: ["events", "counting", "conditional", "bayes"] },
  { folder: "random-variables", items: ["discrete-rv", "continuous-rv"] },
  { folder: "discrete",         items: ["bernoulli-uniform", "binomial", "hypergeometric", "poisson", "geometric-negbin", "multinomial", "which-model"] },
  { folder: "continuous",       items: ["uniform", "exponential", "normal", "normal-approx", "student-t"] },
  { folder: "estimation",       items: ["sampling-mean", "sampling-proportion", "ci-mean", "ci-proportion", "sample-size"] },
  { folder: "tests",            items: ["test-proportion", "test-mean", "two-groups", "chi-square"] },
  { folder: "regression",       items: ["correlation", "linear-regression", "multiple-regression"] },
  { folder: "doe",              items: ["factorial-2k"] },
  { folder: "reference",        items: ["tables"] },
];
const PAGES = {};          // id -> (root) => cleanup fn
const DEFAULT_PAGE = "normal";

/* ---------- tree helpers ---------- */
/* Folders are identified by their path, e.g. "distributions/continuous". */
const isFolder = n => typeof n === "object";
const joinPath = (base, key) => base ? `${base}/${key}` : key;

/* Every page id under these nodes, in menu order. */
function navPages(nodes = NAV, out = []){
  for (const n of nodes) isFolder(n) ? navPages(n.items, out) : out.push(n);
  return out;
}
/* Every folder path under these nodes. */
function navFolders(nodes = NAV, base = "", out = []){
  for (const n of nodes) if (isFolder(n)){ const p = joinPath(base, n.folder); out.push(p); navFolders(n.items, p, out); }
  return out;
}
/* Paths of the folders that contain a page, outermost first; null if the page isn't in the menu. */
function navTrail(id, nodes = NAV, base = "", trail = []){
  for (const n of nodes){
    if (!isFolder(n)){ if (n === id) return trail; continue; }
    const p = joinPath(base, n.folder), found = navTrail(id, n.items, p, [...trail, p]);
    if (found) return found;
  }
  return null;
}

/* ---- js/pages/normal.js ---- */
"use strict";
/* ============================================================
   Page: Normal distribution
   ============================================================ */
PAGES.normal = function NormalPage(root){
  // State lives on the function so it survives re-renders (e.g. switching language).
  const S = NormalPage.state || (NormalPage.state = { mu: 0, sd: 1, mode: "between", a: -1, b: 1, view: "pdf", pins: [], qp: "0.95", range: null });
  const { Phi, PhiInv, normPdf } = Num;

  const glyph = mode => {
    const pts = []; for (let i = 0; i <= 32; i++) pts.push([i + 1, 16 - 13 * Math.exp(-0.5 * ((i - 16) / 5.5) ** 2)]);
    const line = "M" + pts.map(p => p.join(",")).join("L");
    const area = line + "L33,16L1,16Z";
    const rects = { left: [[0, 21]], right: [[13, 34]], between: [[11, 23]], outside: [[0, 11], [23, 34]] }[mode]
      .map(([a, b]) => `<rect x="${a}" y="0" width="${b - a}" height="18"/>`).join("");
    return `<svg viewBox="0 0 34 18" aria-hidden="true"><defs><clipPath id="g-${mode}">${rects}</clipPath></defs>
      <path d="${area}" fill="currentColor" opacity=".3" clip-path="url(#g-${mode})"/>
      <path d="${line}" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <path d="M1,16.5H33" stroke="currentColor" stroke-width="1" opacity=".5"/></svg>`;
  };
  const OR = t("or");
  const MODES = [["left", t("below"), "P(X ≤ x)"], ["right", t("above"), "P(X ≥ x)"], ["between", t("between"), "P(a ≤ X ≤ b)"], ["outside", t("outside"), `P(X ≤ a ${OR} X ≥ b)`]];
  const sym = s => `<span class="sym">${s}</span>`;

  root.innerHTML = `
  <div class="page">
    <header class="page-head">
      <div>
        <h1>${t("n.title")}</h1>
        <p class="lede">${t("n.lede", { mu: sym("μ"), sd: sym("σ") })}</p>
      </div>
    </header>

    <section class="formulas" aria-label="${t("formulas")}">
      <div class="frow"><span class="flabel" id="defLabel"></span><div class="fmath" id="fDef"></div></div>
      <div class="frow"><span class="flabel">${t("probability")}</span><div class="fmath" id="fProb"></div></div>
    </section>

    <section class="work">
      <div class="plot-col">
        <div class="plot-bar">
          <div class="seg" role="group" aria-label="${t("graphType")}">
            <button data-view="pdf" aria-pressed="true">${t("density")}</button>
            <button data-view="cdf" aria-pressed="false">${t("cumulative")}</button>
          </div>
          <div class="bar-actions">
            <button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button>
            <button class="btn" id="pinBtn" title="${t("pinTitle")}">${t("pin")}</button>
            <button class="btn" id="unpinBtn" hidden>${t("clearPins")}</button>
          </div>
        </div>
        <div class="plot-wrap">
          <canvas id="plot" role="img" aria-label="${t("n.graph")}"></canvas>
        </div>
        <div class="legend">
          <div class="chips" id="chips"></div>
          <span class="hint" id="hint">${t("hint")}</span>
          <span class="readout" id="readout" hidden></span>
        </div>
      </div>

      <aside class="controls" aria-label="${t("controls")}">
        <div class="group">
          <h2>${t("parameters")}</h2>
          <div class="param">
            <label for="muN">${sym("μ")}${t("mean")}</label>
            ${numInput("muN", 0.1)}
            <input id="muR" type="range" min="-10" max="10" step="0.1" aria-label="${t("meanSlider")}">
          </div>
          <div class="param">
            <label for="sdN">${sym("σ")}${t("sd")}</label>
            ${numInput("sdN", 0.1)}
            <input id="sdR" type="range" min="0.1" max="5" step="0.01" aria-label="${t("sdSlider")}">
          </div>
        </div>

        <div class="group">
          <h2>${t("probability")}</h2>
          <div class="modes" role="group" aria-label="${t("region")}">
            ${MODES.map(([k, l, tip]) => `<button data-mode="${k}" title="${tip}" aria-pressed="false">${glyph(k)}<span>${l}</span></button>`).join("")}
          </div>
          <div class="bounds" id="bounds">
            <label id="aLbl"><span class="sym" id="aSym">a</span>${numInput("aN", 0.1)}</label>
            <label id="bLbl"><span class="sym">b</span>${numInput("bN", 0.1)}</label>
          </div>
          <div class="quick"><span>${t("range")}</span>
            <button class="btn" data-k="1">μ ± 1σ</button><button class="btn" data-k="2">μ ± 2σ</button><button class="btn" data-k="3">μ ± 3σ</button>
          </div>
        </div>

        <div class="group result" aria-live="polite">
          <div class="p-big" id="pBig"></div>
          <div class="p-sub" id="pSub"></div>
          <dl class="facts" id="facts"></dl>
        </div>

        <div class="group">
          <h2>${t("findX")}</h2>
          <div class="qrow">
            <label class="lbl" for="qp"><math><mi>P</mi><mo>(</mo><mi>X</mi><mo>≤</mo><mi>x</mi><mo>)</mo><mo>=</mo></math></label>
            ${numInput("qp", 0.01)}
            <span class="lbl"><math><mi>x</mi><mo>=</mo></math></span>
            <output class="qout" id="qx"></output>
            <button class="btn" id="qUse">${t("markX")}</button>
          </div>
        </div>
      </aside>
    </section>
  </div>`;

  const el = id => $("#" + id, root);
  const muN = el("muN"), muR = el("muR"), sdN = el("sdN"), sdR = el("sdR"), aN = el("aN"), bN = el("bN"), qp = el("qp");
  const twoSided = () => S.mode === "between" || S.mode === "outside";
  const bounds = () => twoSided() ? [Math.min(S.a, S.b), Math.max(S.a, S.b)] : [S.a, S.a];

  /* ---- probability ---- */
  function prob(){
    const z = x => (x - S.mu) / S.sd, [lo, hi] = bounds();
    switch (S.mode){
      case "left":    return Phi(z(lo));
      case "right":   return Phi(-z(lo));
      case "between": return Math.max(0, Phi(z(hi)) - Phi(z(lo)));
      case "outside": return Phi(z(lo)) + Phi(-z(hi));
    }
  }
  function regions(){
    const [lo, hi] = bounds();
    return { left: [[-Infinity, lo]], right: [[lo, Infinity]], between: [[lo, hi]], outside: [[-Infinity, lo], [hi, Infinity]] }[S.mode];
  }

  /* ---- formulas ---- */
  function renderFormulas(){
    const mu = trim(S.mu, 4), sd = trim(S.sd, 4), [lo, hi] = bounds();
    const x = M.i("x"), mu_ = M.i("μ"), sg = M.i("σ"), P = M.i("P"), X = M.i("X"), Ph = M.up("Φ");
    const Phi_ = inner => M.row(Ph, M.paren(inner));
    const gFrac = v => M.frac(M.row(M.i(v), M.o(MINUS), mu_), sg);
    const nFrac = v => M.frac(M.row(M.n(trim(v, 4)), M.minus(mu)), M.n(sd));
    const zv = v => M.n(((v - S.mu) / S.sd).toFixed(2));

    if (S.view === "pdf"){
      el("defLabel").textContent = t("density");
      const gen = M.row(M.frac(M.n(1), M.row(sg, M.sqrt(M.row(M.n(2), M.up("π"))))),
        M.sup(M.up("e"), M.row(M.o(MINUS), M.frac(M.sup(M.paren(M.row(x, M.o(MINUS), mu_)), M.n(2)), M.row(M.n(2), M.sup(sg, M.n(2)))))));
      const sub = M.row(M.frac(M.n(1), M.row(M.n(sd), M.sqrt(M.row(M.n(2), M.up("π"))))),
        M.sup(M.up("e"), M.row(M.o(MINUS), M.frac(M.sup(M.paren(M.row(x, M.minus(mu))), M.n(2)), M.row(M.n(2), M.o("·"), M.sup(M.n(sd), M.n(2)))))));
      el("fDef").innerHTML = M.math(M.row(M.i("f"), M.paren(x), M.o("="), gen, M.o("="), sub));
    } else {
      el("defLabel").textContent = t("cumulative");
      const l1 = M.row(M.i("F"), M.paren(x), M.o("="), P, M.paren(M.row(X, M.o("≤"), x)), M.o("="), Phi_(gFrac("x")), M.o("="),
        Phi_(M.frac(M.row(x, M.minus(mu)), M.n(sd))));
      const l2 = M.row(Ph, M.paren(M.i("z")), M.o("="), M.frac(M.n(1), M.sqrt(M.row(M.n(2), M.up("π")))),
        M.subsup(M.o("∫"), M.row(M.o(MINUS), M.i("∞")), M.i("z")), M.sup(M.up("e"), M.row(M.o(MINUS), M.frac(M.sup(M.i("t"), M.n(2)), M.n(2)))),
        M.row(M.up("d"), M.i("t")));
      el("fDef").innerHTML = M.math(l1) + M.math(l2, "res");
    }

    const p = M.prob(prob()), L = M.n(trim(lo, 4)), H = M.n(trim(hi, 4));
    let g, s;
    switch (S.mode){
      case "left":
        g = M.row(P, M.paren(M.row(X, M.o("≤"), x)), M.o("="), Phi_(gFrac("x")));
        s = M.row(P, M.paren(M.row(X, M.o("≤"), L)), M.o("="), Phi_(nFrac(lo)), M.o("="), Phi_(zv(lo)), M.o("="), p);
        break;
      case "right":
        g = M.row(P, M.paren(M.row(X, M.o("≥"), x)), M.o("="), M.n(1), M.o(MINUS), Phi_(gFrac("x")));
        s = M.row(P, M.paren(M.row(X, M.o("≥"), L)), M.o("="), M.n(1), M.o(MINUS), Phi_(nFrac(lo)), M.o("="), M.n(1), M.o(MINUS), Phi_(zv(lo)), M.o("="), p);
        break;
      case "between":
        g = M.row(P, M.paren(M.row(M.i("a"), M.o("≤"), X, M.o("≤"), M.i("b"))), M.o("="), Phi_(gFrac("b")), M.o(MINUS), Phi_(gFrac("a")));
        s = M.row(P, M.paren(M.row(L, M.o("≤"), X, M.o("≤"), H)), M.o("="), Phi_(nFrac(hi)), M.o(MINUS), Phi_(nFrac(lo)),
          M.o("="), Phi_(zv(hi)), M.o(MINUS), Phi_(zv(lo)), M.o("="), p);
        break;
      case "outside":
        g = M.row(P, M.paren(M.row(X, M.o("≤"), M.i("a"), M.t(OR), X, M.o("≥"), M.i("b"))), M.o("="), M.n(1), M.o(MINUS),
          M.brack(M.row(Phi_(gFrac("b")), M.o(MINUS), Phi_(gFrac("a")))));
        s = M.row(P, M.paren(M.row(X, M.o("≤"), L, M.t(OR), X, M.o("≥"), H)), M.o("="), M.n(1), M.o(MINUS),
          M.brack(M.row(Phi_(zv(hi)), M.o(MINUS), Phi_(zv(lo)))), M.o("="), p);
        break;
    }
    el("fProb").innerHTML = M.math(g) + M.math(s);
  }

  /* ---- result panel ---- */
  function renderResult(){
    const p = prob(), [lo, hi] = bounds(), z = v => show(((v - S.mu) / S.sd).toFixed(3));
    el("pBig").textContent = show(fmtProb(p));
    const pct = show((p * 100).toFixed(p < 0.001 || p > 0.999 ? 4 : 2)) + "%";
    el("pSub").textContent = t("res." + S.mode, { pct, x: show(trim(lo)), a: show(trim(lo)), b: show(trim(hi)) });
    const rows = twoSided() ? [[t("zOf", { v: "a" }), z(lo)], [t("zOf", { v: "b" }), z(hi)]] : [[t("zOf", { v: "x" }), z(lo)]];
    rows.push([t("variance"), show(trim(S.sd * S.sd, 4))], [t("medianMode"), show(trim(S.mu, 4))]);
    el("facts").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  }

  function renderQuantile(){
    const p = parseNum(qp.value), ok = p != null && p > 0 && p < 1;
    qp.setAttribute("aria-invalid", ok ? "false" : "true");
    el("qx").textContent = ok ? show(trim(S.mu + S.sd * PhiInv(p), 4)) : t("pRange");
  }

  function renderChips(){
    const label = (m, s) => `μ = ${show(trim(m))}${t("listSep")}σ = ${show(trim(s))}`;
    el("chips").innerHTML = `<span class="chip"><span class="sw"></span>${label(S.mu, S.sd)}</span>` +
      S.pins.map((p, i) => `<span class="chip pinned"><span class="sw"></span>${label(p.mu, p.sd)}<button data-unpin="${i}" aria-label="${t("unpin")}">×</button></span>`).join("");
    el("unpinBtn").hidden = S.pins.length < 2;
  }

  /* ---- keep inputs in sync ---- */
  function syncInputs(skip){
    if (skip !== muN) muN.value = fmtIn(S.mu);
    if (skip !== sdN) sdN.value = fmtIn(S.sd);
    if (skip !== aN) aN.value = fmtIn(S.a);
    if (skip !== bN) bN.value = fmtIn(S.b);
    setSlider(muR, S.mu); setSlider(sdR, S.sd);
    $$(".modes button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
    $$(".seg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
    el("bLbl").hidden = !twoSided(); el("bounds").classList.toggle("single", !twoSided());
    el("aSym").textContent = twoSided() ? "a" : "x";
  }

  function update(skip){
    syncInputs(skip); renderFormulas(); renderResult(); renderQuantile(); renderChips(); plot.draw();
  }

  /* ---- view fitting ---- */
  function fit(){ plot.x0 = S.mu - 4 * S.sd; plot.x1 = S.mu + 4 * S.sd; plot.draw(); }
  function fitIfLost(){
    const r = plot.x1 - plot.x0;
    if (S.mu < plot.x0 || S.mu > plot.x1 || 8 * S.sd > 3 * r || 8 * S.sd < r / 10){
      fit();
      if (S.a < plot.x0 || S.a > plot.x1 || S.b < plot.x0 || S.b > plot.x1){ S.a = S.mu - S.sd; S.b = S.mu + S.sd; }
      update();
    }
  }

  /* ---- plot ---- */
  function drawPlot(p){
    const C = p.colors(), pdf = S.view === "pdf";
    const f = pdf ? x => normPdf(x, S.mu, S.sd) : x => Phi((x - S.mu) / S.sd);
    if (pdf){
      let peak = 1 / (S.sd * Num.SQRT2PI); for (const q of S.pins) peak = Math.max(peak, 1 / (q.sd * Num.SQRT2PI));
      p.y0 = 0; p.y1 = peak * 1.12;
    } else { p.y0 = 0; p.y1 = 1.05; }
    p.grid(C);

    // σ ticks along the baseline
    const c = p.ctx;
    for (let k = -3; k <= 3; k++){
      const x = S.mu + k * S.sd; if (x < p.x0 || x > p.x1) continue;
      const px = Math.round(p.X(x)) + .5, by = p.Y(p.y0);
      c.strokeStyle = k === 0 ? C.muted : C.faint; c.lineWidth = 1;
      c.beginPath(); c.moveTo(px, by); c.lineTo(px, by - (k === 0 ? 7 : 4)); c.stroke();
    }
    p.vline(S.mu, C.line, [3, 3], pdf ? normPdf(S.mu, S.mu, S.sd) : 1);

    for (const q of S.pins){
      p.curve(pdf ? x => normPdf(x, q.mu, q.sd) : x => Phi((x - q.mu) / q.sd), { color: C.pin, width: 1.5, dash: [5, 4] });
    }
    if (pdf) for (const [a, b] of regions()) p.area(f, a, b, C.fill);
    p.curve(f, { color: C.accent, width: 2.2 });

    // cumulative view: show probability as a bar on the y-axis
    if (!pdf){
      const [lo, hi] = bounds(), Fa = f(lo), Fb = f(hi);
      const spans = { left: [[0, Fa]], right: [[Fa, 1]], between: [[Fa, Fb]], outside: [[0, Fa], [Fb, 1]] }[S.mode];
      c.save(); c.setLineDash([3, 3]); c.strokeStyle = C.accent; c.lineWidth = 1;
      for (const x of twoSided() ? [lo, hi] : [lo]){
        if (x < p.x0 || x > p.x1) continue;
        c.beginPath(); c.moveTo(p.pad.l, p.Y(f(x))); c.lineTo(p.X(x), p.Y(f(x))); c.stroke();
      }
      c.restore();
      c.fillStyle = C.accent;
      for (const [u, v] of spans) c.fillRect(p.pad.l + 1, p.Y(v), 5, Math.max(1, p.Y(u) - p.Y(v)));
    }

    // handles
    const hs = handles(); let lastR = -Infinity;
    for (const h of hs){
      if (h.x < p.x0 || h.x > p.x1) continue;
      const px = p.X(h.x), py = p.Y(f(h.x));
      p.vline(h.x, C.accent, [], pdf ? f(h.x) : p.y1, 1.5);
      c.fillStyle = C.surface; c.strokeStyle = C.accent; c.lineWidth = 2;
      c.beginPath(); c.arc(px, py, 5, 0, Math.PI * 2); c.fill(); c.stroke();
      const txt = `${h.label} = ${show(trim(h.x, 3))}`;
      c.font = `600 12px ${C.font}`; const w = c.measureText(txt).width + 14;
      const y = (px - w / 2 < lastR + 4) ? 30 : 6;
      const [, r] = p.pill(px, y, txt, C, true); lastR = y === 6 ? r : lastR;
    }

    // hover crosshair
    if (p.hover != null && !p.drag){
      const y = f(p.hover);
      p.vline(p.hover, C.faint, [2, 3]);
      c.fillStyle = C.ink; c.beginPath(); c.arc(p.X(p.hover), p.Y(y), 3, 0, Math.PI * 2); c.fill();
    }
  }
  function handles(){
    return twoSided() ? [{ key: "a", x: S.a, label: "a" }, { key: "b", x: S.b, label: "b" }] : [{ key: "a", x: S.a, label: "x" }];
  }
  const plot = new Plot(el("plot"), {
    draw: drawPlot,
    handles,
    onFit: fit,
    onHandle(key, x){
      const dec = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 200));
      x = +x.toFixed(dec);
      if (key === "a") S.a = twoSided() ? Math.min(x, S.b) : x; else S.b = Math.max(x, S.a);
      syncInputs(); renderFormulas(); renderResult();
    },
    onHover(x){
      const r = el("readout");
      el("hint").hidden = x != null;
      if (x == null){ r.hidden = true; return; }
      const d = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 200));
      r.hidden = false;
      r.innerHTML = `<span>x <b>${show(x.toFixed(d))}</b></span><span>f(x) <b>${show(normPdf(x, S.mu, S.sd).toFixed(4))}</b></span><span>F(x) <b>${show(Phi((x - S.mu) / S.sd).toFixed(4))}</b></span>`;
    }
  });

  /* ---- events ---- */
  const num = inp => parseNum(inp.value);
  bindNudge(root);
  muR.addEventListener("input", () => { S.mu = +muR.value; update(); });
  sdR.addEventListener("input", () => { S.sd = +sdR.value; update(); });
  muN.addEventListener("input", () => { const v = num(muN); muN.setAttribute("aria-invalid", v == null); if (v != null){ S.mu = v; update(muN); } });
  sdN.addEventListener("input", () => { const v = num(sdN); const ok = v != null && v > 0; sdN.setAttribute("aria-invalid", !ok); if (ok){ S.sd = v; update(sdN); } });
  muN.addEventListener("change", () => { muN.removeAttribute("aria-invalid"); update(); fitIfLost(); });
  sdN.addEventListener("change", () => { sdN.removeAttribute("aria-invalid"); update(); fitIfLost(); });
  aN.addEventListener("input", () => { const v = num(aN); if (v != null){ S.a = v; update(aN); } });
  bN.addEventListener("input", () => { const v = num(bN); if (v != null){ S.b = v; update(bN); } });
  aN.addEventListener("change", () => update());
  bN.addEventListener("change", () => update());
  qp.addEventListener("input", () => { S.qp = qp.value; renderQuantile(); });

  $$(".modes button", root).forEach(b => b.addEventListener("click", () => {
    const was = twoSided(); S.mode = b.dataset.mode;
    if (twoSided() && !was && S.b <= S.a) S.b = S.a + S.sd;
    update();
  }));
  $$(".seg button", root).forEach(b => b.addEventListener("click", () => { S.view = b.dataset.view; update(); }));
  $$(".quick .btn", root).forEach(b => b.addEventListener("click", () => {
    const k = +b.dataset.k; S.mode = "between"; S.a = +(S.mu - k * S.sd).toFixed(6); S.b = +(S.mu + k * S.sd).toFixed(6);
    update(); fitIfLost();
  }));
  el("fitBtn").addEventListener("click", fit);
  el("pinBtn").addEventListener("click", () => {
    if (!S.pins.some(p => p.mu === S.mu && p.sd === S.sd)) S.pins.push({ mu: S.mu, sd: S.sd });
    update();
  });
  el("unpinBtn").addEventListener("click", () => { S.pins = []; update(); });
  el("chips").addEventListener("click", e => { const i = e.target.dataset?.unpin; if (i != null){ S.pins.splice(+i, 1); update(); } });
  el("qUse").addEventListener("click", () => {
    const p = parseNum(qp.value); if (!(p > 0 && p < 1)) return;
    S.mode = "left"; S.a = +(S.mu + S.sd * PhiInv(p)).toFixed(6); update(); fitIfLost();
  });

  const onTheme = () => plot.draw();
  document.addEventListener("themechange", onTheme);

  qp.value = loc(S.qp.replace(",", "."));
  if (S.range){ [plot.x0, plot.x1] = S.range; } else fit();
  update();
  return () => { S.range = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
};

"use strict";
/* ============================================================
   Page: Sample size — the reference for the page format.

     n₀ = z²σ²/ε²             mean (σ known; with a pilot sample use s and t)
     n₀ = z²p(1 − p)/ε²       proportion
     n₀ = z²/(4ε²)            proportion with no prior estimate, since p(1 − p) ≤ 1/4
     n  = n₀                  infinite (or very large) population
     n  = N·n₀/(N + n₀ − 1)   population of known size N
   Always rounded up.
   Sources: Barbetta 7.4 (Quadro 7.1) · Bussab & Morettin 10.11

   Page format (copy it for new pages):
     header → formula panel → graph + controls + result → sections
     (examples, symbols, R code, good to know, sources)
   ============================================================ */
PAGES["sample-size"] = function SampleSizePage(root){
  const S = SampleSizePage.state || (SampleSizePage.state = {
    target: "prop",              // "mean" | "prop"
    conf: 95, zTable: true,      // confidence level γ (%), round z or t to 3 decimals like a printed table
    epsMean: 0.5, sigma: 4,      // mean: margin of error, σ (or s)
    sigmaSrc: "known", pilotN: 10,   // "known" σ, or "pilot" sample of size pilotN (uses t)
    epsProp: 0.02, p: 0.5, worst: true,  // proportion: margin, estimate, use p(1−p) ≤ 1/4
    finite: true, N: 3000,       // population size known?
    view: "N", range: {},        // graph view and remembered x-range per view
    example: "cct"               // loaded example, cleared on any edit
  });

  /* ---------- maths (pure: works on any state, so examples can be previewed) ---------- */
  function compute(st){
    const mean = st.target === "mean", usesT = mean && st.sigmaSrc === "pilot";
    const df = usesT ? Math.max(1, Math.round(st.pilotN) - 1) : null;
    const pr = 1 - (1 - st.conf / 100) / 2;
    const exact = usesT ? Num.tInv(pr, df) : Num.PhiInv(pr);
    const crit = st.zTable ? +exact.toFixed(3) : exact;
    const eps = mean ? st.epsMean : st.epsProp;
    const pq = st.worst ? 0.25 : st.p * (1 - st.p);
    const n0Of = e => mean ? crit ** 2 * st.sigma ** 2 / e ** 2 : crit ** 2 * pq / e ** 2;
    const nOf = (N, m) => N * m / (N + m - 1);
    const n0 = n0Of(eps), n = st.finite ? nOf(st.N, n0) : n0;
    return { mean, usesT, df, crit, eps, pq, n0, n, n0Of, nOf, size: ceilN(n) };
  }

  /* ---------- worked examples ---------- */
  const EXAMPLES = [
    { id: "cct",      set: { target: "prop", conf: 95, epsProp: 0.02, worst: true, finite: true, N: 3000 },              source: t("ss.srcSlides") },
    { id: "mayor45",  set: { target: "prop", conf: 95, epsProp: 0.02, worst: false, p: 0.45, finite: false },            source: t("ss.srcSlides") },
    { id: "mayor",    set: { target: "prop", conf: 95, epsProp: 0.03, worst: true, finite: false },                       source: t("ss.srcSlides") },
    { id: "brand",    set: { target: "prop", conf: 95, epsProp: 0.03, worst: false, p: 0.6, finite: false },             source: "Bussab & Morettin · Ex. 10.14" },
    { id: "pilot",    set: { target: "mean", conf: 95, epsMean: 0.5, sigma: 4, sigmaSrc: "known", finite: false },        source: "Bussab & Morettin · Ex. 10.13" },
    { id: "tv",       set: { target: "mean", conf: 95, epsMean: 0.25, sigma: 1.87, sigmaSrc: "known", finite: false },    source: t("ss.srcSlides") },
    { id: "hardness", set: { target: "mean", conf: 99, epsMean: 0.3, sigma: 0.7352, sigmaSrc: "pilot", pilotN: 10, finite: false }, source: "Barbetta · Ex. 7.5" },
  ];
  const exState = e => ({ ...S, zTable: true, ...e.set });
  const exList = () => EXAMPLES.map(e => ({ id: e.id, title: t("ss.ex." + e.id), source: e.source, answer: `n = ${fmtInt(compute(exState(e)).size)}` }));
  function loadExample(id){
    const e = EXAMPLES.find(x => x.id === id); if (!e) return;
    Object.assign(S, { zTable: true }, e.set, { example: id });
    S.view = S.finite ? "N" : "eps"; S.range = {};
    update(); fit();
  }

  /* ---------- markup ---------- */
  const sym = s => `<span class="sym">${s}</span>`;
  root.innerHTML = `
  <div class="page">
    <header class="page-head">
      <div>
        <h1>${t("ss.title")}</h1>
        <p class="lede">${t("ss.lede", { eps: sym("ε"), gamma: sym("γ"), N: sym("N") })}</p>
      </div>
    </header>

    <section class="formulas" aria-label="${t("formulas")}">
      <div class="frow"><span class="flabel">${t("ss.initial")}</span><div class="fmath" id="fN0"></div></div>
      <div class="frow"><span class="flabel" id="fNLabel"></span><div class="fmath" id="fN"></div></div>
    </section>

    <section class="work">
      <div class="plot-col">
        <div class="plot-bar">
          <div class="seg" role="group" aria-label="${t("graphType")}">

            <button data-view="eps" aria-pressed="false">${t("ss.byEps")}</button>
          </div>
          <div class="bar-actions">
            <button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button>
          </div>
        </div>
        <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${t("ss.graph")}"></canvas></div>
        <div class="legend">
          <div class="chips" id="chips"></div>

          <span class="readout" id="readout" hidden></span>
        </div>
      </div>

      <aside class="controls" aria-label="${t("controls")}">
        <div class="group">
          <h2>${t("ss.estimating")}</h2>
          <div class="seg full" role="group" id="targetSeg">

          <h2>${t("ss.confidence")}</h2>

          </div>
          <div class="zline" id="critLine"></div>
          <label class="check"><input type="checkbox" id="zTable">${t("ss.zTable")}</label>
        </div>

        <div class="group">
          <h2>${t("parameters")}</h2>
          <div class="param">
            <label for="epsN">${sym("ε")}${t("ss.error")} <span class="unit" id="epsPct"></span></label>
            ${numInput("epsN", 0.01)}
            <input id="epsR" type="range" aria-label="${t("ss.error")}">
          </div>
          <div id="meanBox">
            <div class="seg full seg-gap" role="group" id="srcSeg" aria-label="${t("sd")}">
              <button data-src="known" aria-pressed="false">${t("ss.sigmaKnown")}</button>
              <button data-src="pilot" aria-pressed="false">${t("ss.pilot")}</button>
            </div>
            <div class="param">

              ${numInput("sigN", 0.1)}
              <input id="sigR" type="range" min="0.1" max="20" step="0.01" aria-label="${t("sd")}">
            </div>
            <div class="param" id="pilotRow">
              <label for="pilotN">${sym("n")}${t("ss.pilotSize")}</label>
              ${numInput("pilotN", 1)}
            </div>
          </div>
          <div id="propBox">
            <div class="param">
              <label for="pN">${sym("p")}${t("ss.pEst")}</label>
              ${numInput("pN", 0.01)}
              <input id="pR" type="range" min="0.01" max="0.99" step="0.01" aria-label="${t("ss.pEst")}">
            </div>
            <label class="check"><input type="checkbox" id="worst">${t("ss.worst")}</label>
          </div>
        </div>

        <div class="group">
          <h2>${t("ss.population")}</h2>
          <label class="check check-gap"><input type="checkbox" id="finite">${t("ss.finiteCheck")}</label>
          <div class="param" id="NRow">
            <label for="NN">${sym("N")}${t("ss.popSize")}</label>
            ${numInput("NN", 100)}
            <input id="NR" type="range" min="1" max="7" step="0.01" aria-label="${t("ss.popSize")}">
          </div>
        </div>

        <div class="group result" aria-live="polite">
          <div class="p-big" id="nBig"></div>
          <div class="p-sub" id="nSub"></div>
          <dl class="facts" id="facts"></dl>
        </div>
      </aside>
    </section>

    ${sectionsHtml({
      notes: [t("ss.note.round"), t("ss.note.sigma"), t("ss.note.p"), t("ss.note.two"), t("ss.note.N")],
      sources: [t("ss.src.barbetta"), t("ss.src.bussab"), t("ss.src.slides")],
    })}
  </div>`;

  const el = id => $("#" + id, root);
  const confN = el("confN"), epsN = el("epsN"), epsR = el("epsR"), sigN = el("sigN"), sigR = el("sigR"), pilotN = el("pilotN");
  const pN = el("pN"), pR = el("pR"), NN = el("NN"), NR = el("NR");
  const nf = v => trim(v, 2);   // n₀ and n shown with 2 decimals before rounding

  /* ---------- formulas ---------- */
  const critSym = R => M.sub(M.i(R.usesT ? "t" : "z"), M.i("γ"));
  function renderFormulas(R){
    const c2 = M.subsup(M.i(R.usesT ? "t" : "z"), M.i("γ"), M.n(2)), sq = v => M.sup(M.n(v), M.n(2)), dot = M.o("·");
    const n0_ = M.sub(M.i("n"), M.n(0)), N_ = M.i("N"), e = trim(R.eps, 6), cs = trim(R.crit, R.usesT || S.zTable ? 3 : 5);
    const sd = R.usesT ? "s" : "σ";
    let gen, sub;
    if (R.mean){
      gen = M.frac(M.row(c2, M.sup(M.i(sd), M.n(2))), M.sup(M.i("ε"), M.n(2)));
      sub = M.frac(M.row(sq(cs), dot, sq(trim(S.sigma, 4))), sq(e));
    } else if (S.worst){
      gen = M.frac(c2, M.row(M.n(4), M.sup(M.i("ε"), M.n(2))));
      sub = M.frac(sq(cs), M.row(M.n(4), dot, sq(e)));
    } else {
      const p = trim(S.p, 4);
      gen = M.frac(M.row(c2, M.i("p"), M.paren(M.row(M.n(1), M.o(MINUS), M.i("p")))), M.sup(M.i("ε"), M.n(2)));
      sub = M.frac(M.row(sq(cs), dot, M.n(p), dot, M.paren(M.row(M.n(1), M.o(MINUS), M.n(p)))), sq(e));
    }
    let html = M.math(M.row(n0_, M.o("="), gen, M.o("="), sub, M.o("="), M.n(nf(R.n0))));
    if (!R.mean && S.worst) html += M.math(M.row(M.i("p"), M.paren(M.row(M.n(1), M.o(MINUS), M.i("p"))), M.o("≤"), M.frac(M.n(1), M.n(4))), "res");
    if (R.usesT) html += M.math(M.row(critSym(R), M.t(t("ss.withDf")), M.text(t("dfAbbr")), M.o("="), M.i("n"), M.o(MINUS), M.n(1), M.o("="), M.n(String(R.df))), "res");
    el("fN0").innerHTML = html;

    el("fNLabel").textContent = S.finite ? t("ss.finite") : t("ss.infinite");
    const then = [M.o("⇒"), M.i("n"), M.o("="), M.n(String(R.size))];
    if (S.finite){
      const Ns = String(S.N), n0s = nf(R.n0);
      el("fN").innerHTML = M.math(M.row(
        M.i("n"), M.o("="), M.frac(M.row(N_, n0_), M.row(N_, M.o("+"), n0_, M.o(MINUS), M.n(1))),
        M.o("="), M.frac(M.row(M.n(Ns), dot, M.n(n0s)), M.row(M.n(Ns), M.o("+"), M.n(n0s), M.o(MINUS), M.n(1))),
        M.o("="), M.n(nf(R.n)), ...then));
    } else {
      el("fN").innerHTML = M.math(M.row(M.i("n"), M.o("="), n0_, M.o("="), M.n(nf(R.n0)), ...then));

  /* ---------- result ---------- */
  function renderResult(R){
    const pct = v => show(trim(v, 2)) + "%";
    el("nBig").textContent = fmtInt(R.size);
    el("nSub").textContent = S.finite ? t("ss.subFinite", { N: fmtInt(S.N), pct: pct(100 * R.size / S.N) }) : t("ss.subInfinite");
    const rows = [[t("ss.crit", { c: R.usesT ? "t" : "z", gamma: show(trim(S.conf, 2)) + "%" }), show(trim(R.crit, R.usesT || S.zTable ? 3 : 5))]];
    if (R.usesT) rows.push([t("ss.dfRow"), String(R.df)]);
    rows.push([t("ss.beforeRound"), show(nf(R.n))]);
    if (S.finite){
      const n0c = ceilN(R.n0), saved = n0c - R.size;
      rows.push([t("ss.n0"), fmtInt(n0c)], [t("ss.saved"), `${fmtInt(saved)} (${pct(n0c ? 100 * saved / n0c : 0)})`]);

    el("facts").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  }

  /* ---------- sections: symbols and R ---------- */
  function renderSymbols(R){
    const rows = [
      [M.sub(M.i("n"), M.n(0)), t("ss.sym.n0")],
      [M.i("n"), t("ss.sym.n")],
    ];
    if (S.finite) rows.push([M.i("N"), t("ss.sym.N")]);
    rows.push([M.i("γ"), t("ss.sym.gamma")]);
    rows.push(R.usesT ? [critSym(R), t("ss.sym.t")] : [critSym(R), t("ss.sym.z")]);
    rows.push([M.i("ε"), t("ss.sym.eps")]);
    if (R.mean) rows.push(R.usesT ? [M.i("s"), t("ss.sym.s")] : [M.i("σ"), t("ss.sym.sigma")]);
    else rows.push([M.i("p"), t("ss.sym.p")]);
    el("symbols").innerHTML = symbolsHtml(rows);
  }
  function renderR(R){
    const L = [], conf = trim(S.conf / 100, 4), q = `1 - (1 - conf) / 2`;
    const kind = R.mean ? (R.usesT ? t("ss.r.meanPilot") : t("ss.r.mean")) : (S.worst ? t("ss.r.propWorst") : t("ss.r.prop"));
    L.push(`# ${t("ss.title")}: ${kind}, ${S.finite ? t("ss.r.finite") : t("ss.r.infinite")}`);
    L.push(rLine(`conf <- ${conf}`, t("ss.r.conf")));
    const c = R.usesT ? "t" : "z", exactCall = R.usesT ? `qt(${q}, df = ${R.df})` : `qnorm(${q})`;
    L.push(S.zTable ? rLine(`${c} <- ${trim(R.crit, 3)}`, `${t("ss.r.table")}: ${exactCall}`) : `${c} <- ${exactCall}`);
    L.push(rLine(`e <- ${trim(R.eps, 6)}`, t("ss.r.eps")));
    if (R.mean){
      const v = R.usesT ? "s" : "sigma";
      L.push(rLine(`${v} <- ${trim(S.sigma, 6)}`, R.usesT ? t("ss.r.s") : t("ss.r.sigma")));
      L.push(rLine(`n0 <- ${c}^2 * ${v}^2 / e^2`, t("ss.r.n0")));
    } else if (S.worst){
      L.push(rLine(`n0 <- ${c}^2 / (4 * e^2)`, t("ss.r.n0")));
    } else {
      L.push(rLine(`p <- ${trim(S.p, 6)}`, t("ss.r.p")));
      L.push(rLine(`n0 <- ${c}^2 * p * (1 - p) / e^2`, t("ss.r.n0")));
    }
    if (S.finite){
      L.push(rLine(`N <- ${S.N}`, t("ss.r.N")));
      L.push(`n <- N * n0 / (N + n0 - 1)`);
      L.push(rLine(`ceiling(n)`, `${t("ss.r.up")}: ${R.size}`));
    } else {
      L.push(rLine(`ceiling(n0)`, `${t("ss.r.up")}: ${R.size}`));
    }
    el("rcode").innerHTML = codeHtml(L.join("\n"));
  }

  /* ---------- inputs ---------- */
  function syncInputs(skip, R){
    if (skip !== confN) confN.value = fmtIn(S.conf, 2);
    if (skip !== epsN) epsN.value = fmtIn(R.eps, 6);
    if (skip !== sigN) sigN.value = fmtIn(S.sigma);
    if (skip !== pilotN) pilotN.value = fmtIn(S.pilotN, 0);
    if (skip !== pN) pN.value = fmtIn(S.worst ? 0.5 : S.p);
    if (skip !== NN) NN.value = fmtIn(S.N, 0);
    if (R.mean){ epsR.min = 0.01; epsR.max = Math.max(5, S.sigma * 2); epsR.step = 0.01; }
    else { epsR.min = 0.005; epsR.max = 0.2; epsR.step = 0.001; }
    setSlider(epsR, R.eps); setSlider(sigR, S.sigma); setSlider(pR, S.worst ? 0.5 : S.p); setSlider(NR, Math.log10(S.N));
    pN.disabled = pR.disabled = S.worst;
    el("NRow").hidden = !S.finite;
    el("zTable").checked = S.zTable; el("worst").checked = S.worst; el("finite").checked = S.finite;
    el("meanBox").hidden = !R.mean; el("propBox").hidden = R.mean; el("pilotRow").hidden = !R.usesT;
    el("sigSym").textContent = R.usesT ? "s" : "σ";
    el("sigLbl").textContent = R.usesT ? t("ss.sPilot") : t("sd");
    el("epsPct").textContent = R.mean ? "" : `(${show(trim(R.eps * 100, 3))}%)`;
    el("critLine").innerHTML = M.math(M.row(critSym(R), M.o("="), M.n(trim(R.crit, R.usesT || S.zTable ? 3 : 5)),
      ...(R.usesT ? [M.t(`(${t("dfAbbr")} = ${R.df})`)] : [])));
    $$("#targetSeg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.target === S.target));
    $$("#srcSeg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.src === S.sigmaSrc));
    $$(".presets .btn", root).forEach(b => b.setAttribute("aria-pressed", +b.dataset.conf === S.conf));
    $$(".plot-bar .seg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
  }
  function renderChips(){
    const chip = (cls, txt) => `<span class="chip ${cls}"><span class="sw"></span>${txt}</span>`;
    el("chips").innerHTML = !S.finite && S.view === "eps"
      ? chip("", t("ss.lgN0solid"))
      : chip("", S.finite ? t("ss.lgN") : t("ss.lgNif")) + chip("pinned", t("ss.lgN0")) + chip("census", t("ss.lgCensus"));
  }
  function update(skip){
    const R = compute(S);
    syncInputs(skip, R); renderFormulas(R); renderResult(R); renderChips();
    renderSymbols(R); renderR(R); markExample(el("examples"), S.example);
    plot.draw();
  }

  /* ---------- graph ---------- */
  // "N" view plots against log10(N), so each order of magnitude gets the same width.
  const compact = new Intl.NumberFormat(t("htmlLang"), { notation: "compact", maximumFractionDigits: 1 });
  const fmtN = v => v >= 10000 ? compact.format(v) : fmtInt(v);
  function logTicks(a, b){
    const mant = b - a <= 3.5 ? [1, 2, 5] : [1], out = [];
    for (let d = Math.floor(a); d <= Math.ceil(b); d++) for (const m of mant){
      const v = Math.log10(m) + d; if (v >= a - 1e-9 && v <= b + 1e-9) out.push(v);
    }
    return out;
  }
  function fit(){
    const R = compute(S);
    if (S.view === "N"){
      const a = Math.log10(Math.max(R.n0, 1)), b = S.finite ? Math.log10(S.N) : a;
      plot.x0 = Math.max(0, Math.min(a, b) - 1.2); plot.x1 = Math.max(a, b) + 1.5;
    } else {
      plot.x0 = R.eps * 0.3; plot.x1 = R.mean ? R.eps * 2.5 : Math.min(R.eps * 2.5, 0.5);
    }
    plot.draw();
  }
  function fitIfLost(){
    const R = compute(S), x = S.view === "N" ? Math.log10(S.N) : R.eps;
    if (x < plot.x0 || x > plot.x1) fit();
  }
  function switchView(v){
    S.range[S.view] = [plot.x0, plot.x1]; S.view = v;
    if (S.range[v]) [plot.x0, plot.x1] = S.range[v]; else fit();
    update();
  }

  function drawPlot(p){
    const C = p.colors(), c = p.ctx, R = compute(S), byN = S.view === "N";
    if (!byN && p.x0 <= 0) p.x0 = Math.min(R.eps * 0.05, p.x1 / 10);
    const fFin = byN ? x => R.nOf(10 ** x, R.n0) : x => R.nOf(S.N, R.n0Of(x));
    const f0 = byN ? () => R.n0 : x => R.n0Of(x);
    const main = byN || S.finite ? fFin : f0;      // the curve the marker sits on
    p.y0 = 0;
    p.y1 = byN ? R.n0 * 1.15 : Math.max(main(p.x0), R.n * 1.2) * 1.08;
    p.grid(C, byN
      ? { xTicks: logTicks(p.x0, p.x1), xFmt: v => fmtN(Math.round(10 ** v)), yFmt: v => fmtInt(v) }
      : { yFmt: v => fmtInt(v) });

    if (byN || S.finite){
      p.curve(byN ? x => 10 ** x : () => S.N, { color: C.faint, width: 1.2, dash: [2, 3] });   // n can never exceed N
      p.curve(f0, { color: C.pin, width: 1.5, dash: [5, 4] });
    }
    p.curve(main, { color: C.accent, width: 2.2 });
    if (byN){
      c.font = `12px ${C.font}`; c.fillStyle = C.muted; c.textAlign = "left"; c.textBaseline = "bottom";
      c.fillText(`n₀ = ${fmtInt(ceilN(R.n0))}`, p.pad.l + 8, p.Y(R.n0) - 4);
    }

    const hx = byN ? Math.log10(S.N) : R.eps;
    if ((!byN || S.finite) && hx >= p.x0 && hx <= p.x1){
      const px = p.X(hx), py = p.Y(R.n);
      p.vline(hx, C.accent, [], R.n, 1.5);
      c.save(); c.setLineDash([3, 3]); c.strokeStyle = C.accent; c.lineWidth = 1;
      c.beginPath(); c.moveTo(p.pad.l, py); c.lineTo(px, py); c.stroke(); c.restore();
      c.fillStyle = C.surface; c.strokeStyle = C.accent; c.lineWidth = 2;
      c.beginPath(); c.arc(px, py, 5, 0, Math.PI * 2); c.fill(); c.stroke();
      p.pill(px, 6, byN ? `N = ${fmtInt(S.N)}` : `ε = ${show(trim(R.eps, 4))}`, C, true);
      p.pill(px, 30, `n = ${fmtInt(R.size)}`, C, false);
    }
    if (p.hover != null && !p.drag){
      p.vline(p.hover, C.faint, [2, 3]);
      c.fillStyle = C.ink; c.beginPath(); c.arc(p.X(p.hover), p.Y(main(p.hover)), 3, 0, Math.PI * 2); c.fill();
    }
  }

  const plot = new Plot(el("plot"), {
    draw: drawPlot,
    handles: () => S.view === "N" ? (S.finite ? [{ key: "N", x: Math.log10(S.N) }] : []) : [{ key: "eps", x: compute(S).eps }],
    onFit: fit,
    onHandle(key, x){
      S.example = null;
      if (key === "N") S.N = clamp(Math.round(10 ** x), 1, 1e9);
      else {
        const step = Num.niceStep(plot.x1 - plot.x0, 200);
        const v = clamp(+x.toFixed(Num.decimalsFor(step)), step, S.target === "mean" ? Infinity : 0.99);
        S.target === "mean" ? (S.epsMean = v) : (S.epsProp = v);
      }
      update();
    },
    onHover(x){
      const r = el("readout"); el("hint").hidden = x != null;
      if (x == null){ r.hidden = true; return; }
      const R = compute(S), byN = S.view === "N";
      const N = byN ? Math.round(10 ** x) : S.N, e = byN ? R.eps : x, n0 = R.n0Of(e);
      const n = byN || S.finite ? R.nOf(N, n0) : n0;
      r.hidden = false;
      r.innerHTML = `<span>${byN ? `N <b>${fmtInt(N)}</b>` : `ε <b>${show(trim(e, 4))}</b>`}</span>` +
        `<span>n <b>${fmtInt(ceilN(n))}</b></span><span>n₀ <b>${fmtInt(ceilN(n0))}</b></span>`;
    }
  });

  /* ---------- events ---------- */
  bindNudge(root);
  bindCopy($(".sections", root));
  const edit = fn => { S.example = null; fn(); };
  const field = (inp, ok, set, onChange) => {
    inp.addEventListener("input", () => {
      const v = parseNum(inp.value), good = v != null && ok(v);
      inp.setAttribute("aria-invalid", !good);
      if (good) edit(() => { set(v); update(inp); });
    });
    inp.addEventListener("change", () => { inp.removeAttribute("aria-invalid"); update(); onChange?.(); });
  };
  const isMean = () => S.target === "mean";
  field(confN, v => v >= 50 && v < 100, v => S.conf = v);
  field(epsN, v => v > 0 && (isMean() || v < 1), v => isMean() ? (S.epsMean = v) : (S.epsProp = v), fit);
  field(sigN, v => v > 0, v => S.sigma = v);
  field(pilotN, v => v >= 2, v => S.pilotN = Math.round(v));
  field(pN, v => v > 0 && v < 1, v => S.p = v);
  field(NN, v => v >= 1, v => S.N = Math.round(v), fit);

  epsR.addEventListener("input", () => edit(() => { isMean() ? (S.epsMean = +epsR.value) : (S.epsProp = +epsR.value); update(); fitIfLost(); }));
  sigR.addEventListener("input", () => edit(() => { S.sigma = +sigR.value; update(); }));
  pR.addEventListener("input", () => edit(() => { S.p = +pR.value; update(); }));
  NR.addEventListener("input", () => edit(() => { S.N = Math.max(1, Math.round(10 ** +NR.value)); update(); fitIfLost(); }));
  el("zTable").addEventListener("change", e => edit(() => { S.zTable = e.target.checked; update(); }));
  el("worst").addEventListener("change", e => edit(() => { S.worst = e.target.checked; update(); }));
  el("finite").addEventListener("change", e => edit(() => { S.finite = e.target.checked; update(); fit(); }));
  $$("#targetSeg button", root).forEach(b => b.addEventListener("click", () => edit(() => {
    S.target = b.dataset.target; S.range.eps = null; update(); fit();
  })));
  $$("#srcSeg button", root).forEach(b => b.addEventListener("click", () => edit(() => { S.sigmaSrc = b.dataset.src; update(); })));
  $$(".presets .btn", root).forEach(b => b.addEventListener("click", () => edit(() => { S.conf = +b.dataset.conf; update(); })));
  $$(".plot-bar .seg button", root).forEach(b => b.addEventListener("click", () => switchView(b.dataset.view)));
  el("fitBtn").addEventListener("click", fit);

  el("examples").innerHTML = examplesHtml(exList(), S.example);
  el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });

  const onTheme = () => plot.draw();
  document.addEventListener("themechange", onTheme);

  if (S.range[S.view]) [plot.x0, plot.x1] = S.range[S.view]; else fit();
  update();
  return () => { S.range[S.view] = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
};

/* ---- js/app.js ---- */
"use strict";
/* ============================================================
   App shell: sidebar, search, routing, language, theme.
   Loaded last; starts the app.
   ============================================================ */
const app = $("#app"), navEl = $("#nav"), mainEl = $("#main"), qEl = $("#q");
let cleanup = null;      // cleanup function returned by the current page
let keepScroll = false;  // true when re-rendering the same page (e.g. language change)

/* ---------- sidebar ---------- */
/* Search matches labels in every language, accent-insensitive ("media" finds "Média"). */
const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const allLangs = key => Object.keys(I18N).map(l => I18N[l][key] || "").join(" ");

/* Which folders are open is remembered between visits. */
const OPEN_KEY = "sw-nav-open";
const openFolders = new Set((() => { try { return JSON.parse(store.get(OPEN_KEY)) || []; } catch { return []; } })());
const saveOpen = () => store.set(OPEN_KEY, JSON.stringify([...openFolders]));
const searching = () => qEl.value.trim() !== "";

const svg = (cls, d, box = 16) => `<svg class="${cls}" viewBox="0 0 ${box} ${box}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const ICON_CHEV = svg("chev", "M4.5 2.5 8 6l-3.5 3.5", 12);
const ICON_FOLDER = svg("closed", "M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.5 1.5h4.9A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z");
const ICON_FOLDER_OPEN = svg("open", "M2 11.5v-7A1.5 1.5 0 0 1 3.5 3h2.6l1.5 1.5h4.4A1.5 1.5 0 0 1 13.5 6v.8M2 11.5l1.6-3.8A1.5 1.5 0 0 1 5 6.8h8.6a.8.8 0 0 1 .7 1.1l-1.5 4.1a1.5 1.5 0 0 1-1.4 1H3.5A1.5 1.5 0 0 1 2 11.5z");
const ICON_COLLAPSE = svg("", "M4.5 2.5 8 6l3.5-3.5M4.5 13.5 8 10l3.5 3.5");
const ICON_EXPAND = svg("", "M4.5 6 8 2.5 11.5 6M4.5 10 8 13.5l3.5-3.5");

function renderNav(){
  const f = fold(qEl.value.trim()), cur = currentId();
  const hit = key => fold(allLangs(key)).includes(f);

  const page = id => `<a href="#/${id}" class="page-link${PAGES[id] ? "" : " soon"}"${PAGES[id] ? "" : ` title="${t("notBuilt")}"`}${id === cur ? ' aria-current="page"' : ""}>${t("nav." + id)}</a>`;

  // showAll: an enclosing folder matched the search, so show everything inside it.
  function node(n, base, showAll){
    if (!isFolder(n)) return !f || showAll || hit("nav." + n) ? page(n) : "";
    const path = joinPath(base, n.folder), self = f && hit("folder." + n.folder);
    const inner = n.items.map(c => node(c, path, showAll || self)).join("");
    if (!inner) return "";
    const open = f ? true : openFolders.has(path);          // searching opens every folder with a match
    const count = navPages(n.items).length;
    return `<div class="folder" data-path="${path}" data-open="${open}">
      <button class="folder-row" type="button" aria-expanded="${open}">${ICON_CHEV}<span class="ficon">${ICON_FOLDER}${ICON_FOLDER_OPEN}</span><span class="fname">${t("folder." + n.folder)}</span><span class="fcount" title="${t("pageCount", { n: count })}">${count}</span></button>
      <div class="folder-body"${open ? "" : " inert"}><div class="folder-inner">${inner}</div></div>
    </div>`;
  }

  navEl.innerHTML = NAV.map(n => node(n, "", false)).join("") || `<p class="nav-empty">${t("noMatch", { q: esc(qEl.value) })}</p>`;
  paintFoldBtn();
}

function setFolderOpen(el, open){
  el.dataset.open = open;
  el.querySelector(":scope > .folder-row").setAttribute("aria-expanded", open);
  el.querySelector(":scope > .folder-body").inert = !open;
  if (!searching()){ open ? openFolders.add(el.dataset.path) : openFolders.delete(el.dataset.path); saveOpen(); }
  paintFoldBtn();
}

/* Collapse-all / expand-all button next to the search box. */
const anyOpen = () => !!navEl.querySelector('.folder[data-open="true"]');
function paintFoldBtn(){
  const b = $("#foldBtn"), label = anyOpen() ? t("collapseAll") : t("expandAll");
  b.innerHTML = anyOpen() ? ICON_COLLAPSE : ICON_EXPAND;
  b.title = label; b.setAttribute("aria-label", label);
}
function toggleAllFolders(){
  const open = !anyOpen();
  if (searching()){ qEl.value = ""; }
  openFolders.clear();
  if (open) navFolders().forEach(p => openFolders.add(p));
  saveOpen(); renderNav();
}

/* Make sure the folders around a page are open. */
function revealPage(id){
  for (const p of navTrail(id) || []) openFolders.add(p);
  saveOpen();
}

function openNav(){ app.classList.add("nav-open"); $("#menuBtn").setAttribute("aria-expanded", "true"); }
function closeNav(){ app.classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }

/* ---------- routing (#/page-id) ---------- */
function currentId(){ return (location.hash.replace(/^#\/?/, "").split("?")[0]) || DEFAULT_PAGE; }
function labelFor(id){ return navPages().includes(id) ? t("nav." + id) : null; }

function route(){
  const id = currentId(), label = labelFor(id);
  if (cleanup){ cleanup(); cleanup = null; }
  if (PAGES[id]) cleanup = PAGES[id](mainEl) || null;
  else if (label) PlaceholderPage(mainEl, label);
  else { location.replace("#/" + DEFAULT_PAGE); return; }
  document.title = `${label} · Stats Workbench`;
  revealPage(id);
  renderNav();
  closeNav();
  if (!keepScroll){ mainEl.scrollTop = 0; window.scrollTo(0, 0); }
  keepScroll = false;
}

/* ---------- language ---------- */
function applyShellText(){
  qEl.placeholder = t("search"); qEl.setAttribute("aria-label", t("search"));
  navEl.setAttribute("aria-label", t("navLabel"));
  $("#menuBtn").setAttribute("aria-label", t("openMenu"));
  $("#langSeg").setAttribute("aria-label", t("language"));
  $$("#langSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  paintThemeBtn();
}

/* ---------- theme ---------- */
const sysDark = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (sysDark.matches ? "dark" : "light")) === "dark";
const ICON_SUN = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg>`;
const ICON_MOON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.5 4.5 0 0 0 7 7z"/></svg>`;
function paintThemeBtn(){
  $("#themeBtn").innerHTML = isDark() ? ICON_SUN + t("lightTheme") : ICON_MOON + t("darkTheme");
}
const themeChanged = () => { paintThemeBtn(); document.dispatchEvent(new Event("themechange")); };

/* ---------- events ---------- */
qEl.addEventListener("input", () => renderNav());
navEl.addEventListener("click", e => {
  const row = e.target.closest(".folder-row");
  if (row){ const f = row.parentElement; setFolderOpen(f, f.dataset.open !== "true"); }
});
navEl.addEventListener("keydown", e => {            // Right opens a folder, Left closes it
  const row = e.target.closest(".folder-row");
  if (!row || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
  e.preventDefault(); setFolderOpen(row.parentElement, e.key === "ArrowRight");
});
$("#foldBtn").addEventListener("click", toggleAllFolders);
qEl.addEventListener("keydown", e => {
  if (e.key === "Escape"){ qEl.value = ""; renderNav(); qEl.blur(); }
  if (e.key === "Enter"){
    const a = navEl.querySelector("a:not(.soon)") || navEl.querySelector("a");
    if (a){ location.hash = a.getAttribute("href"); qEl.blur(); }
  }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openNav(); qEl.focus(); qEl.select(); }
});
$("#menuBtn").addEventListener("click", openNav);
$("#scrim").addEventListener("click", closeNav);
$$("#langSeg button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === LANG) return;
  setLang(b.dataset.lang); applyShellText(); keepScroll = true; route();
}));
$("#themeBtn").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("sw-theme", next);
  themeChanged();
});
sysDark.addEventListener("change", themeChanged);
window.addEventListener("hashchange", route);

/* ---------- start ---------- */
if (/Mac|iPhone|iPad/.test(navigator.platform)) $("#kbdHint").textContent = "⌘K";
const savedTheme = store.get("sw-theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
setLang(detectLang(), false);
applyShellText();
route();
</script>
