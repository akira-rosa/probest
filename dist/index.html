"use strict";
/* ============================================================
   Shared page for probability distributions, discrete or continuous.

   Each distribution is a config object turned into a page with
     PAGES["binomial"] = distPage(BINOMIAL);
   The page follows the standard format: graph + controls + result,
   formulas with the table of variables, about, examples, R, sources.

   Config (see pages/binomial.js and pages/normal.js):
     id, key (locale prefix), kind: "discrete" | "continuous"
     params: [{ key, sym, def, min, max, step, int, ok(v, P) }]
     check(P)          → locale key of an error, or null
     support(P)        → [lo, hi]   (hi may be Infinity)
     view(P)           → [lo, hi]   default x-range of the graph
     pf(x, P)          → P(X = x) or the density f(x)
     cdf(x, P)         → F(x) = P(X ≤ x)   (optional for discrete: summed)
     inv(p, P)         → x with F(x) = p   (continuous only)
     mean(P), variance(P)
     math.general()    → right side of p(x) / f(x) with symbols
     math.at(x, P)     → the same with the numbers (discrete: at x)
     math.cdfSteps(v, P, O) → [MathML…] steps from F(v) to its value (continuous)
     math.mean / math.variance: { general(), sub(P) }
     r: { d, p, q, args(P) }  R function names and their parameters
     options: [{ key, def }]  checkboxes (labels "<key>.opt.<key>")
     prob(mode, a, b, P, O)   optional override of the probability
     examples: [{ id, set, source }], notes: [keys], sources: [keys]
   ============================================================ */
function distPage(cfg){
  const K = k => t(`${cfg.key}.${k}`);
  const discrete = cfg.kind === "discrete";
  const MODES = discrete ? ["eq", "le", "ge", "between"] : ["le", "ge", "between", "outside"];

  return function DistributionPage(root){
    /* ---------- state ---------- */
    const defaults = () => {
      const P = {}; for (const p of cfg.params) P[p.key] = p.def;
      return P;
    };
    const S = cfg.state || (cfg.state = {
      P: defaults(), O: Object.fromEntries((cfg.options || []).map(o => [o.key, o.def])),
      ...cfg.initial, view: "pf", pins: [], range: null, qp: "0.95", example: cfg.initial?.example ?? null
    });
    const P = () => S.P;
    const SYMTXT = { mu: "μ", sigma: "σ", lambda: "λ", alpha: "α", beta: "β" };
    const symTxt = k => SYMTXT[k] || k;
    const twoSided = () => S.mode === "between" || S.mode === "outside";

    /* ---------- maths ---------- */
    const support = PP => cfg.support(PP);
    const clampX = x => { const [lo, hi] = support(P()); return clamp(discrete ? Math.round(x) : x, lo, hi); };
    function cdf(x, PP = P()){
      if (cfg.cdf) return cfg.cdf(x, PP);
      const [lo] = support(PP); let s = 0;
      for (let k = lo; k <= Math.floor(x); k++) s += cfg.pf(k, PP);
      return Math.min(1, s);
    }
    const sf = (x, PP = P()) => discrete ? 1 - cdf(x - 1, PP) : 1 - cdf(x, PP);   // P(X ≥ x)
    function prob(st = S){
      const PP = st.P, a = Math.min(st.a, st.b ?? st.a), b = Math.max(st.a, st.b ?? st.a);
      if (cfg.prob){ const r = cfg.prob(st.mode, st.a, st.b, PP, st.O); if (r != null) return r; }
      switch (st.mode){
        case "eq": return discrete ? cfg.pf(st.a, PP) : 0;
        case "le": return cdf(st.a, PP);
        case "ge": return sf(st.a, PP);
        case "between": return Math.max(0, discrete ? cdf(b, PP) - cdf(a - 1, PP) : cdf(b, PP) - cdf(a, PP));
        case "outside": return cdf(a, PP) + sf(b, PP);
      }
    }

    /* ---------- examples ---------- */
    const queryMath = st => {
      const X = M.i("X"), x = M.n(trim(st.a, 4)), y = M.n(trim(st.b ?? st.a, 4)), P_ = M.i("P");
      const in_ = { eq: M.row(X, M.o("="), x), le: M.row(X, M.o("≤"), x), ge: M.row(X, M.o("≥"), x),
        between: M.row(x, M.o("≤"), X, M.o("≤"), y), outside: M.row(X, M.o("≤"), x, M.t(t("or")), X, M.o("≥"), y) }[st.mode];
      return M.row(P_, M.paren(in_));
    };
    const exState = e => ({ ...S, P: { ...defaults(), ...e.set.P }, O: { ...S.O, ...(e.set.O || {}) }, mode: e.set.mode, a: e.set.a, b: e.set.b ?? e.set.a });
    const exList = () => cfg.examples.map(e => {
      const st = exState(e);
      return { id: e.id, title: K("ex." + e.id), source: e.source === "slides" ? t("srcSlides") : e.source, answer: `<math>${queryMath(st)}<mo>=</mo>${M.prob(prob(st))}</math>` };
    });
    function loadExample(id){
      const e = cfg.examples.find(x => x.id === id); if (!e) return;
      const st = exState(e);
      Object.assign(S, { P: st.P, O: st.O, mode: st.mode, a: st.a, b: st.b, example: id, range: null });
      update(); fit();
    }

    /* ---------- markup ---------- */
    const modeLabel = m => {
      const X = M.i("X"), x = M.i("x"), a = M.i("a"), b = M.i("b");
      const in_ = { eq: M.row(X, M.o("="), x), le: M.row(X, M.o("≤"), x), ge: M.row(X, M.o("≥"), x),
        between: M.row(a, M.o("≤"), X, M.o("≤"), b), outside: M.row(X, M.o("≤"), a, M.t(t("or")), X, M.o("≥"), b) }[m];
      return M.row(M.i("P"), M.paren(in_));
    };
    const modeBtn = m => `<button data-mode="${m}" aria-pressed="false"><math>${modeLabel(m)}</math></button>`;
    root.innerHTML = `
    <div class="page">
      <header class="page-head"><h1>${K("title")}</h1></header>

      <section class="work">
        <div class="plot-col">
          <div class="plot-bar">
            <div class="seg" role="group" aria-label="${t("graphType")}">
              <button data-view="pf" aria-pressed="true">${discrete ? t("d.viewPf") : t("density")}</button>
              <button data-view="cdf" aria-pressed="false">${t("cumulative")}</button>
            </div>
            <div class="bar-actions">
              <button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button>
              <button class="btn" id="pinBtn" title="${t("pinTitle")}">${t("pin")}</button>
              <button class="btn" id="unpinBtn" hidden>${t("clearPins")}</button>
            </div>
          </div>
          <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${K("title")}"></canvas></div>
          <div class="legend">
            <div class="chips" id="chips"></div>
            <span class="hint" id="hint">${t("d.hint")}</span>
            <span class="readout" id="readout" hidden></span>
          </div>
        </div>

        <aside class="controls" aria-label="${t("controls")}">
          <div class="group">
            <h2>${t("parameters")}</h2>
            ${cfg.params.map(p => `
            <div class="param">
              <label for="p-${p.key}"><span class="sym"><math>${p.sym}</math></span>${K("param." + p.key)}</label>
              ${numInput("p-" + p.key, p.step)}
              <input id="r-${p.key}" type="range" min="${p.min}" max="${p.max}" step="${p.step}" aria-label="${K("param." + p.key)}">
            </div>`).join("")}
            <p class="note err" id="paramErr" hidden></p>
          </div>

          <div class="group">
            <h2>${t("d.query")}</h2>
            <div class="qmodes" role="group" aria-label="${t("d.query")}">${MODES.map(modeBtn).join("")}</div>
            <div class="bounds" id="bounds">
              <label><span class="sym" id="aSym">x</span>${numInput("aN", discrete ? 1 : 0.1)}</label>
              <label id="bLbl"><span class="sym">b</span>${numInput("bN", discrete ? 1 : 0.1)}</label>
            </div>
            ${(cfg.options || []).map(o => `<label class="check check-top"><input type="checkbox" data-opt="${o.key}">${K("opt." + o.key)}</label>`).join("")}
          </div>

          <div class="group result" aria-live="polite">
            <div class="p-big" id="pBig"></div>
            <div class="p-sub" id="pSub"></div>
            <dl class="facts" id="facts"></dl>
          </div>

          ${discrete ? "" : `
          <div class="group">
            <h2>${t("findX")}</h2>
            <div class="qrow">
              <label class="lbl" for="qp"><math><mi>P</mi><mo>(</mo><mi>X</mi><mo>≤</mo><mi>x</mi><mo>)</mo><mo>=</mo></math></label>
              ${numInput("qp", 0.01)}
              <span class="lbl"><math><mi>x</mi><mo>=</mo></math></span>
              <output class="qout" id="qx"></output>
              <button class="btn" id="qUse">${t("markX")}</button>
            </div>
          </div>`}
        </aside>
      </section>

      <section class="formulas" aria-label="${t("formulas")}">
        <h2>${t("formulas")}</h2>
        <div class="frow"><span class="flabel">${discrete ? t("d.pf") : t("d.pdf")}</span><div class="fmath" id="fPf"></div></div>
        <div class="frow"><span class="flabel">${t("d.prob")}</span><div class="fmath" id="fProb"></div></div>
        <div class="frow"><span class="flabel">${t("d.moments")}</span><div class="fmath" id="fMom"></div></div>
        <div id="vars"></div>
      </section>

      ${sectionsHtml({
        about: K("about"),
        notes: [...cfg.notes.map(K), discrete ? t("d.note.discrete") : t("d.note.continuous")],
        sources: cfg.sources.map(K),
      })}
    </div>`;

    const el = id => $("#" + id, root);
    const aN = el("aN"), bN = el("bN"), qp = el("qp");

    /* ---------- formulas ---------- */
    const X_ = M.i("X"), P_ = M.i("P"), E_ = M.row(M.i("E"), M.paren(X_)), V_ = M.row(M.i("V"), M.paren(X_));
    const pv = v => M.prob(v);
    function termList(lo, hi){
      const out = []; for (let k = lo; k <= hi; k++) out.push(M.n(cfg.pf(k, P()).toFixed(4)));
      return out.join(M.o("+"));
    }
    function renderFormulas(){
      const PP = P(), x = M.i("x"), val = prob(), [lo, hi] = support(PP);
      const fx = discrete ? M.row(M.i("p"), M.paren(x)) : M.row(M.i("f"), M.paren(x));
      const pf = discrete
        ? M.row(fx, M.o("="), cfg.math.general(), M.o("="), M.row(M.i("p"), M.paren(M.n(String(S.a)))), M.o("="), cfg.math.at(S.a, PP),
            ...(cfg.math.atNum ? [M.o("="), cfg.math.atNum(S.a, PP)] : []), M.o("="), pv(cfg.pf(S.a, PP)))
        : M.row(fx, M.o("="), cfg.math.general(), M.o("="), cfg.math.at(null, PP));
      el("fPf").innerHTML = M.math(pf);

      const q = queryMath(S), a = Math.min(S.a, S.b), b = Math.max(S.a, S.b), F = v => M.row(M.i("F"), M.paren(M.n(trim(v, 4))));
      let chain;
      if (discrete){
        const many = n => n > 7;
        if (S.mode === "eq") chain = [q, cfg.math.at(S.a, PP), ...(cfg.math.atNum ? [cfg.math.atNum(S.a, PP)] : []), pv(val)];
        else if (S.mode === "le") chain = S.a < lo ? [q, M.n(0)] : many(S.a - lo + 1) ? [q, F(S.a), pv(val)] : [q, termList(lo, S.a), pv(val)];
        else if (S.mode === "ge"){
          const below = M.row(P_, M.paren(M.row(X_, M.o("≤"), M.n(String(S.a - 1)))));
          chain = S.a <= lo ? [q, M.n(1)] : many(S.a - lo)
            ? [q, M.row(M.n(1), M.o(MINUS), below), M.row(M.n(1), M.o(MINUS), F(S.a - 1)), pv(val)]
            : [q, M.row(M.n(1), M.o(MINUS), below), M.row(M.n(1), M.o(MINUS), M.paren(termList(lo, S.a - 1))), pv(val)];
        } else {
          chain = many(b - a + 1) ? [q, M.row(F(b), M.o(MINUS), F(a - 1)), pv(val)] : [q, termList(Math.max(a, lo), Math.min(b, hi)), pv(val)];
        }
      } else {
        const wrap = cfg.math.cdfCompound ? M.paren : (x => x);
        const steps = v => cfg.math.cdfSteps(v, PP, S.O), wsteps = v => steps(v).map(wrap);
        const comb = (fn) => { const sa = steps(a), sb = steps(b); return sa.map((_, i) => fn(sa[i], sb[i])); };
        const gen = { le: [F(S.a)], ge: cfg.math.sfSteps ? [] : [M.row(M.n(1), M.o(MINUS), F(S.a))], between: [M.row(F(b), M.o(MINUS), F(a))],
          outside: [M.row(F(a), M.o("+"), M.n(1), M.o(MINUS), F(b))] }[S.mode];
        const sub = {
          le: steps(S.a),
          ge: cfg.math.sfSteps ? cfg.math.sfSteps(S.a, PP, S.O) : wsteps(S.a).map(s => M.row(M.n(1), M.o(MINUS), s)),
          between: comb((sa, sb) => M.row(wrap(sb), M.o(MINUS), wrap(sa))),
          outside: comb((sa, sb) => M.row(sa, M.o("+"), M.n(1), M.o(MINUS), wrap(sb))),
        }[S.mode];
        chain = [q, ...gen, ...sub, pv(val)];
      }
      const box = el("fProb");
      box.innerHTML = M.math(M.row(chain.join(M.o("="))));
      if (box.scrollWidth > box.clientWidth + 2) box.innerHTML = M.chain(chain, 3);   // wrap only when it does not fit
      if (box.scrollWidth > box.clientWidth + 2) box.innerHTML = M.chain(chain, 2);

      el("fMom").innerHTML =
        M.math(M.row(E_, M.o("="), cfg.math.mean.general(), M.o("="), cfg.math.mean.sub(PP), M.o("="), M.n(trim(cfg.mean(PP), 4)))) +
        M.math(M.row(V_, M.o("="), cfg.math.variance.general(), M.o("="), cfg.math.variance.sub(PP), M.o("="), M.n(trim(cfg.variance(PP), 4))));
    }

    function renderVars(){
      const PP = P(), rows = cfg.params.map(p => [p.sym, K("sym." + p.key), show(trim(PP[p.key], 6))]);
      if (twoSided()) rows.push([M.i("a"), t("d.sym.a"), show(trim(Math.min(S.a, S.b), 4))], [M.i("b"), t("d.sym.b"), show(trim(Math.max(S.a, S.b), 4))]);
      else rows.push([M.i("x"), t("d.sym.x"), show(trim(S.a, 4))]);
      rows.push([E_, t("d.sym.E"), show(trim(cfg.mean(PP), 4))], [V_, t("d.sym.V"), show(trim(cfg.variance(PP), 4))]);
      for (const extra of cfg.extraVars?.(PP, S) || []) rows.push(extra);
      el("vars").innerHTML = varsTableHtml(rows);
    }

    function renderResult(){
      const PP = P(), v = prob();
      el("pBig").textContent = show(fmtProb(v));
      el("pSub").innerHTML = `<math>${queryMath(S)}</math>`;
      el("facts").innerHTML = [
        [t("d.ev"), show(trim(cfg.mean(PP), 4))],
        [t("d.var"), show(trim(cfg.variance(PP), 4))],
        [t("d.sd"), show(trim(Math.sqrt(cfg.variance(PP)), 4))],
      ].map(([k, x]) => `<dt>${k}</dt><dd>${x}</dd>`).join("");
    }

    function renderR(){
      const PP = P(), r = cfg.r, args = r.args(PP), a = Math.min(S.a, S.b), b = Math.max(S.a, S.b), L = [];
      const n = v => trim(v, 6);
      L.push(`# ${K("title")}: ${t("d.r.params")} ${cfg.params.map(p => `${symTxt(p.key)} = ${n(PP[p.key])}`).join(", ")}`);
      if (cfg.r.note) L.push(`# ${cfg.r.note(PP, S.O)}`);
      const line = {
        eq: () => `${r.d}(${n(S.a)}, ${args})`,
        le: () => `${r.p}(${n(S.a)}, ${args})`,
        ge: () => discrete ? `1 - ${r.p}(${n(S.a - 1)}, ${args})` : `1 - ${r.p}(${n(S.a)}, ${args})`,
        between: () => discrete ? `${r.p}(${n(b)}, ${args}) - ${r.p}(${n(a - 1)}, ${args})` : `${r.p}(${n(b)}, ${args}) - ${r.p}(${n(a)}, ${args})`,
        outside: () => `${r.p}(${n(a)}, ${args}) + 1 - ${r.p}(${n(b)}, ${args})`,
      }[S.mode]();
      L.push(rLine(line, `${t("d.r.prob")}: ${fmtProb(prob())}`, 44));
      L.push(rLine(cfg.r.mean(PP), `${t("d.ev")}: ${n(cfg.mean(PP))}`, 44));
      if (!discrete){
        const pq = parseNum(S.qp);
        if (pq > 0 && pq < 1) L.push(rLine(`${r.q}(${n(pq)}, ${args})`, `x ${t("d.r.with")} P(X ≤ x) = ${n(pq)}`, 44));
      }
      el("rcode").innerHTML = codeHtml(L.join("\n"));
    }

    function renderChips(){
      const label = PP => cfg.params.map(p => `${symTxt(p.key)} = ${show(trim(PP[p.key], 4))}`).join(t("listSep"));
      el("chips").innerHTML = `<span class="chip"><span class="sw"></span>${label(P())}</span>` +
        S.pins.map((pp, i) => `<span class="chip pinned"><span class="sw"></span>${label(pp)}<button data-unpin="${i}" aria-label="${t("unpin")}">×</button></span>`).join("");
      el("unpinBtn").hidden = S.pins.length < 2;
    }

    function renderQuantile(){
      if (discrete) return;
      const p = parseNum(qp.value), ok = p != null && p > 0 && p < 1;
      qp.setAttribute("aria-invalid", !ok);
      el("qx").textContent = ok ? show(trim(cfg.inv(p, P(), S.O), 4)) : t("pRange");
    }

    function syncInputs(skip){
      for (const p of cfg.params){
        const inp = el("p-" + p.key), r = el("r-" + p.key), v = P()[p.key];
        if (skip !== inp) inp.value = fmtIn(v, 6);
        setSlider(r, v);
      }
      if (skip !== aN) aN.value = fmtIn(S.a, 4);
      if (skip !== bN) bN.value = fmtIn(S.b, 4);
      $$(".qmodes button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
      $$(".plot-bar .seg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
      $$("[data-opt]", root).forEach(c => { c.checked = !!S.O[c.dataset.opt]; });
      el("bLbl").hidden = !twoSided(); el("bounds").classList.toggle("single", !twoSided());
      el("aSym").textContent = twoSided() ? "a" : "x";
    }

    function update(skip){
      const err = cfg.check?.(P());
      el("paramErr").hidden = !err; if (err) el("paramErr").textContent = K(err);
      if (err){ syncInputs(skip); return; }
      S.a = clampX(S.a); S.b = clampX(S.b);
      syncInputs(skip); renderFormulas(); renderVars(); renderResult(); renderR(); renderChips(); renderQuantile();
      markExample(el("examples"), S.example);
      plot.draw();
    }

    /* ---------- graph ---------- */
    function fit(){
      const [lo, hi] = cfg.view(P());
      if (discrete){ plot.x0 = Math.min(lo, S.a, S.b) - 0.7; plot.x1 = Math.max(hi, S.a, S.b) + 0.7; }
      else {
        // keep the markers in view, with a margin
        const xs = twoSided() ? [S.a, S.b] : [S.a], w = hi - lo;
        plot.x0 = Math.min(lo, ...xs.map(x => x - 0.08 * w)); plot.x1 = Math.max(hi, ...xs.map(x => x + 0.08 * w));
      }
      plot.draw();
    }
    function fitIfLost(){
      const [lo, hi] = cfg.view(P()), r = plot.x1 - plot.x0, w = hi - lo;
      if (S.a < plot.x0 || S.a > plot.x1 || w > r * 2.5 || w < r / 6) fit();
    }
    function inRegion(x){
      const a = Math.min(S.a, S.b), b = Math.max(S.a, S.b);
      return { eq: x === S.a, le: x <= S.a, ge: x >= S.a, between: x >= a && x <= b, outside: x <= a || x >= b }[S.mode];
    }
    function drawPlot(p){
      const C = p.colors(), c = p.ctx, PP = P(), pfView = S.view === "pf";
      if (cfg.check?.(PP)){ p.grid(C); return; }
      const [lo, hi] = support(PP);
      if (discrete){
        const from = Math.max(lo, Math.ceil(p.x0)), to = Math.min(hi, Math.floor(p.x1));
        const ks = []; for (let k = from; k <= to && ks.length < 4000; k++) ks.push(k);
        if (pfView){
          let top = 0; for (const k of ks) top = Math.max(top, cfg.pf(k, PP));
          for (const q of S.pins) for (const k of ks) top = Math.max(top, cfg.pf(k, q));
          p.y0 = 0; p.y1 = (top || 1) * 1.18;
        } else { p.y0 = 0; p.y1 = 1.08; }
        const step = Num.niceStep(p.x1 - p.x0, Math.max(3, p.pw / 70));
        p.grid(C, { xTicks: Num.ticks(p.x0, p.x1, Math.max(3, p.pw / 70)).values.filter(v => Number.isInteger(v)), xFmt: v => String(v) });
        if (pfView){
          for (const q of S.pins){
            c.save(); c.setLineDash([4, 3]); c.strokeStyle = C.pin; c.lineWidth = 1.5;
            for (const k of ks){ const y = cfg.pf(k, q); if (y <= 0) continue; const px = Math.round(p.X(k)) + .5; c.beginPath(); c.moveTo(px - 6, p.Y(y)); c.lineTo(px + 6, p.Y(y)); c.stroke(); }
            c.restore();
          }
          p.bars(ks.map(k => ({ x: k, y: cfg.pf(k, PP), on: inRegion(k) })), C, Math.min(0.62, Math.max(0.1, 1 - 2 / Math.max(1, p.X(1) - p.X(0)))));
        } else {
          c.save(); c.strokeStyle = C.accent; c.lineWidth = 2.2;
          let prev = cdf(from - 1, PP);
          for (let k = from; k <= to + 1; k++){
            const y = cdf(k, PP);
            c.beginPath(); c.moveTo(p.X(k - 1), p.Y(prev)); c.lineTo(p.X(k), p.Y(prev)); c.stroke();
            prev = y;
          }
          c.restore();
          for (const k of ks){ c.fillStyle = inRegion(k) ? C.accent : C.surface; c.strokeStyle = C.accent; c.lineWidth = 1.5;
            c.beginPath(); c.arc(p.X(k), p.Y(cdf(k, PP)), 3.2, 0, Math.PI * 2); c.fill(); c.stroke(); }
        }
      } else {
        const f = pfView ? x => (x < lo || x > hi ? 0 : cfg.pf(x, PP)) : x => cdf(x, PP);
        if (pfView){
          let top = 0; for (let i = 0; i <= 200; i++){ const x = p.x0 + (p.x1 - p.x0) * i / 200; top = Math.max(top, f(x)); for (const q of S.pins) top = Math.max(top, cfg.pf(x, q) || 0); }
          p.y0 = 0; p.y1 = (top || 1) * 1.15;
        } else { p.y0 = 0; p.y1 = 1.08; }
        p.grid(C);
        for (const q of S.pins) p.curve(pfView ? x => (x < cfg.support(q)[0] || x > cfg.support(q)[1] ? 0 : cfg.pf(x, q)) : x => cdf(x, q), { color: C.pin, width: 1.5, dash: [5, 4] });
        if (pfView){
          const a = Math.min(S.a, S.b), b = Math.max(S.a, S.b);
          const regs = { le: [[-Infinity, S.a]], ge: [[S.a, Infinity]], between: [[a, b]], outside: [[-Infinity, a], [b, Infinity]] }[S.mode];
          for (const [u, v] of regs) p.area(f, Math.max(u, lo), Math.min(v, hi), C.fill);
        }
        p.curve(f, { color: C.accent, width: 2.2 });
      }
      // expected value
      const mu = cfg.mean(PP);
      if (pfView && mu >= p.x0 && mu <= p.x1){
        p.vline(mu, C.muted, [3, 3]);
        c.font = `11.5px ${C.font}`; c.fillStyle = C.muted; c.textAlign = "left"; c.textBaseline = "top";
        c.fillText("E(X)", p.X(mu) + 4, p.pad.t + 56);
      }
      // markers
      const yAt = x => pfView ? (discrete ? cfg.pf(x, PP) : cfg.pf(x, PP)) : cdf(x, PP);
      if (twoSided()){
        const a = Math.min(S.a, S.b), b = Math.max(S.a, S.b);
        p.marker(a, yAt(a), `a = ${show(trim(a, 3))}`, C, 0);
        p.marker(b, yAt(b), `b = ${show(trim(b, 3))}`, C, p.X(b) - p.X(a) < 80 ? 1 : 0);
      } else p.marker(S.a, yAt(S.a), `x = ${show(trim(S.a, 3))}`, C, 0);
      if (p.hover != null && !p.drag){
        const hx = discrete ? Math.round(p.hover) : p.hover;
        if (hx >= lo && hx <= hi){
          p.vline(hx, C.faint, [2, 3]);
          c.fillStyle = C.ink; c.beginPath(); c.arc(p.X(hx), p.Y(yAt(hx)), 3, 0, Math.PI * 2); c.fill();
        }
      }
    }
    const plot = new Plot(el("plot"), {
      draw: drawPlot,
      handles: () => twoSided() ? [{ key: "a", x: S.a }, { key: "b", x: S.b }] : [{ key: "a", x: S.a }],
      onFit: fit,
      onHandle(key, x){
        S.example = null;
        const dec = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 200));
        const v = clampX(discrete ? Math.round(x) : +x.toFixed(dec));
        if (key === "a") S.a = v; else S.b = v;
        update();
      },
      onHover(x){
        const r = el("readout"); el("hint").hidden = x != null;
        if (x == null){ r.hidden = true; return; }
        const PP = P(), [lo, hi] = support(PP), hx = discrete ? Math.round(x) : x;
        if (hx < lo || hx > hi){ r.hidden = true; return; }
        const d = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 200));
        r.hidden = false;
        r.innerHTML = discrete
          ? `<span>x <b>${hx}</b></span><span>P(X = x) <b>${show(fmtProb(cfg.pf(hx, PP)))}</b></span><span>F(x) <b>${show(fmtProb(cdf(hx, PP)))}</b></span>`
          : `<span>x <b>${show(hx.toFixed(d))}</b></span><span>f(x) <b>${show(cfg.pf(hx, PP).toFixed(4))}</b></span><span>F(x) <b>${show(fmtProb(cdf(hx, PP)))}</b></span>`;
      }
    });

    /* ---------- events ---------- */
    bindNudge(root);
    bindCopy($(".sections", root));
    const edit = fn => { S.example = null; fn(); };
    for (const p of cfg.params){
      const inp = el("p-" + p.key), r = el("r-" + p.key);
      inp.addEventListener("input", () => {
        let v = parseNum(inp.value); const good = v != null && (!p.int || Number.isInteger(v)) && p.ok(v, P());
        inp.setAttribute("aria-invalid", !good);
        if (good) edit(() => { S.P[p.key] = v; update(inp); });
      });
      inp.addEventListener("change", () => { inp.removeAttribute("aria-invalid"); update(); fitIfLost(); });
      r.addEventListener("input", () => edit(() => { S.P[p.key] = p.int ? Math.round(+r.value) : +r.value; update(); fitIfLost(); }));
    }
    const bound = (inp, key) => {
      inp.addEventListener("input", () => { const v = parseNum(inp.value); if (v != null) edit(() => { S[key] = discrete ? Math.round(v) : v; update(inp); }); });
      inp.addEventListener("change", () => { update(); fitIfLost(); });
    };
    bound(aN, "a"); bound(bN, "b");
    $$(".qmodes button", root).forEach(b => b.addEventListener("click", () => edit(() => {
      const was = twoSided(); S.mode = b.dataset.mode;
      if (twoSided() && !was && S.b <= S.a){ const sd = Math.sqrt(cfg.variance(P())); S.b = clampX(S.a + (discrete ? Math.max(1, Math.round(sd)) : sd)); }
      update();
    })));
    $$(".plot-bar .seg button", root).forEach(b => b.addEventListener("click", () => { S.view = b.dataset.view; update(); }));
    $$("[data-opt]", root).forEach(c => c.addEventListener("change", () => edit(() => { S.O[c.dataset.opt] = c.checked; update(); })));
    el("fitBtn").addEventListener("click", fit);
    el("pinBtn").addEventListener("click", () => {
      const key = JSON.stringify(P());
      if (!S.pins.some(q => JSON.stringify(q) === key)) S.pins.push({ ...P() });
      update();
    });
    el("unpinBtn").addEventListener("click", () => { S.pins = []; update(); });
    el("chips").addEventListener("click", e => { const i = e.target.dataset?.unpin; if (i != null){ S.pins.splice(+i, 1); update(); } });
    if (!discrete){
      qp.addEventListener("input", () => { S.qp = qp.value; renderQuantile(); renderR(); });
      el("qUse").addEventListener("click", () => {
        const p = parseNum(qp.value); if (!(p > 0 && p < 1)) return;
        edit(() => { S.mode = "le"; S.a = +cfg.inv(p, P(), S.O).toFixed(6); update(); fitIfLost(); });
      });
      qp.value = loc(String(S.qp).replace(",", "."));
    }

    el("examples").innerHTML = examplesHtml(exList(), S.example);
    el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });

    const onTheme = () => plot.draw();
    document.addEventListener("themechange", onTheme);

    if (S.range) [plot.x0, plot.x1] = S.range; else fit();
    update();
    return () => { S.range = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
  };
}

/* ---- js/core/datapage.js ---- */
"use strict";
/* ============================================================
   Shared page for formulas computed from a list of data values
   (descriptive statistics): mean, standard deviation, quartiles.

     PAGES["mean"] = dataPage(MEAN);

   The data are typed in a text box and drawn as a dot plot; every dot
   can be dragged to change its value. The page follows the standard
   format: graph + controls + result, formulas with the table of
   variables, about, examples, R, sources.

   Config (see pages/desc/*.js):
     id, key (locale prefix), minN, data (initial values), example (initial id)
     options: [{ key, def }]          checkboxes, labels "<key>.opt.<key>"
     segs: [{ key, def, values }]     segmented choices, labels "<key>.seg.<key>.<value>"
     compute(xs, O)        → R object (pure)
     formulas(R, O)        → [{ label, chain: [MathML…] } | { label, html }]
     vars(R, O)            → rows for varsTableHtml
     result(R, O)          → { big, sub, facts: [[label, value]] }
     answer(R, O)          → example answer (HTML/MathML)
     r(R, O)               → R lines after the data vector
     topSpace, baseGap     → pixels kept free above the dots / below the dots
     dot(i, v, R, O, C)    → { fill, stroke } for a dot (optional)
     back(p, C, R, O, L) / front(p, C, R, O, L) → drawing below / above the dots
     examples: [{ id, data, O, source }], notes: [keys], sources: [keys]
   ============================================================ */

/* Read a list of numbers. Separators: spaces, new lines, semicolons, and commas;
   in Portuguese a comma between digits is the decimal mark ("7,5"). */
function parseData(text){
  const comma = usesComma();
  const s = String(text).replace(/[{}()\[\]]/g, " ").replace(/−/g, "-").trim();
  if (!s) return { values: [], bad: [] };
  const tokens = (comma ? s.split(/[\s;]+|,(?=\s|$)|(?<=\D),|,(?=\D)/) : s.split(/[\s;,]+/)).filter(Boolean);
  const values = [], bad = [];
  for (const tk of tokens){ const v = parseNum(tk); v == null ? bad.push(tk) : values.push(v); }
  return { values, bad };
}
const formatData = xs => xs.map(v => loc(trim(v, 6))).join(usesComma() ? "; " : ", ");

/* x₁ + x₂ + … + xₙ with every term, or the first three and the last one when there are many. */
function sumTerms(terms, max = 8){
  if (terms.length <= max) return M.row(terms.join(M.o("+")));
  return M.row([...terms.slice(0, 3), M.o("⋯"), terms[terms.length - 1]].join(M.o("+")));
}
/* A data value as MathML, in parentheses when negative (for "x − x̄" and sums). */
const nv = (v, d = 6) => v < 0 ? M.paren(M.n(trim(v, d))) : M.n(trim(v, d));

/* The R vector of the data, wrapped to lines of about 64 characters. */
function rVector(xs, name = "x"){
  const items = xs.map(v => trim(v, 6)), lines = [];
  let cur = `${name} <- c(`;
  items.forEach((it, i) => {
    const piece = it + (i < items.length - 1 ? ", " : ")");
    if (cur.length + piece.length > 64 && cur.trim().length > 7){ lines.push(cur.trimEnd()); cur = "       "; }
    cur += piece;
  });
  if (!items.length) cur += ")";
  lines.push(cur);
  return lines;
}

function dataPage(cfg){
  const K = k => t(`${cfg.key}.${k}`);

  return function DataPage(root){
    const S = cfg.state || (cfg.state = {
      data: [...cfg.data], O: Object.fromEntries([...(cfg.options || []), ...(cfg.segs || [])].map(o => [o.key, o.def])),
      example: cfg.example ?? null, range: null
    });

    /* ---------- examples ---------- */
    const exO = e => ({ ...Object.fromEntries([...(cfg.options || []), ...(cfg.segs || [])].map(o => [o.key, o.def])), ...(e.O || {}) });
    const exList = () => cfg.examples.map(e => ({
      id: e.id, title: K("ex." + e.id), source: e.source === "slides" ? t("srcSlides") : e.source,
      answer: cfg.answer(cfg.compute(e.data, exO(e)), exO(e))
    }));
    function loadExample(id){
      const e = cfg.examples.find(x => x.id === id); if (!e) return;
      Object.assign(S, { data: [...e.data], O: exO(e), example: id });
      writeText(); update(); fit();
    }

    /* ---------- markup ---------- */
    root.innerHTML = `
    <div class="page data-page">
      <header class="page-head"><h1>${K("title")}</h1></header>

      <section class="work">
        <div class="plot-col">
          <div class="plot-bar">
            <span class="plot-title">${t("dt.dotplot")}</span>
            <div class="bar-actions">
              <button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button>
            </div>
          </div>
          <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${t("dt.dotplot")}"></canvas></div>
          <div class="legend">
            <div class="chips" id="chips"></div>
            <span class="hint" id="hint">${t("dt.hint")}</span>
          </div>
        </div>

        <aside class="controls" aria-label="${t("controls")}">
          <div class="group">
            <div class="group-head"><h2><label for="dataIn">${t("dt.data")}</label></h2><span class="count" id="count"></span></div>
            <textarea class="data-in" id="dataIn" rows="4" spellcheck="false" autocomplete="off"></textarea>
            <p class="note" id="dataNote">${t("dt.sepHint")}</p>
            <div class="data-actions">
              <button class="btn" id="sortBtn">${t("dt.sort")}</button>
            </div>
          </div>
          ${(cfg.segs || []).map(g => `
          <div class="group">
            <h2>${K("seg." + g.key)}</h2>
            <div class="seg full" role="group" data-seg="${g.key}">
              ${g.values.map(v => `<button data-v="${v}" aria-pressed="false">${K(`seg.${g.key}.${v}`)}</button>`).join("")}
            </div>
          </div>`).join("")}
          ${(cfg.options || []).length ? `<div class="group">${cfg.options.map(o => `<label class="check"><input type="checkbox" data-opt="${o.key}">${K("opt." + o.key)}</label>`).join("")}</div>` : ""}
          <div class="group result" aria-live="polite">
            <div class="p-big" id="big"></div>
            <div class="p-sub" id="sub"></div>
            <dl class="facts" id="facts"></dl>
          </div>
        </aside>
      </section>

      <section class="formulas" aria-label="${t("formulas")}">
        <h2>${t("formulas")}</h2>
        <div id="frows"></div>
        <div id="vars"></div>
      </section>

      ${sectionsHtml({ about: K("about"), notes: cfg.notes.map(K), sources: cfg.sources.map(K) })}
    </div>`;

    const el = id => $("#" + id, root), dataIn = el("dataIn");
    let R = null;

    /* ---------- data box ---------- */
    function writeText(){ dataIn.value = formatData(S.data); dataIn.removeAttribute("aria-invalid"); }
    function readText(){
      const { values, bad } = parseData(dataIn.value), note = el("dataNote");
      const few = values.length < cfg.minN;
      note.classList.toggle("err", bad.length > 0 || few);
      note.textContent = bad.length ? t("dt.bad", { v: bad.slice(0, 3).join(" ") }) : few ? t("dt.few", { n: cfg.minN }) : t("dt.sepHint");
      dataIn.setAttribute("aria-invalid", bad.length > 0 || few);
      return bad.length ? null : values;
    }

    /* ---------- render ---------- */
    function renderFormulas(){
      const box = el("frows");
      const rows = cfg.formulas(R, S.O);
      box.innerHTML = rows.map((r, i) => `<div class="frow"><span class="flabel">${r.label}</span><div class="fmath" data-row="${i}">${
        r.chain ? M.math(M.row(r.chain.join(M.o("=")))) : r.html}</div></div>`).join("");
      rows.forEach((r, i) => {
        if (!r.chain) return;
        const f = $(`[data-row="${i}"]`, box);
        if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 3);
        if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 2);
      });
      el("vars").innerHTML = varsTableHtml(cfg.vars(R, S.O));
    }
    function renderResult(){
      const r = cfg.result(R, S.O);
      el("big").innerHTML = r.big; el("sub").innerHTML = r.sub;
      el("facts").innerHTML = r.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    }
    function renderR(){
      const L = [`# ${K("title")}`, ...rVector(S.data), ...cfg.r(R, S.O)];
      el("rcode").innerHTML = codeHtml(L.join("\n"));
    }
    function syncControls(){
      el("count").textContent = t("dt.count", { n: S.data.length });
      $$("[data-seg]", root).forEach(g => $$("button", g).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.O[g.dataset.seg])));
      $$("[data-opt]", root).forEach(c => { c.checked = !!S.O[c.dataset.opt]; });
    }
    function update(){
      syncControls();
      if (S.data.length < cfg.minN){ R = null; plot.draw(); return; }
      R = cfg.compute(S.data, S.O);
      renderFormulas(); renderResult(); renderR();
      markExample(el("examples"), S.example);
      plot.draw();
    }

    /* ---------- graph: dot plot ---------- */
    let layout = [];
    function fit(){
      if (!S.data.length){ plot.x0 = 0; plot.x1 = 10; plot.draw(); return; }
      const lo = Math.min(...S.data), hi = Math.max(...S.data), w = hi - lo || Math.max(1, Math.abs(lo) * 0.2);
      plot.x0 = lo - 0.1 * w; plot.x1 = hi + 0.1 * w;
      plot.draw();
    }
    function computeLayout(p){
      const axis = p.pad.t + p.ph, board = axis - (cfg.baseGap ?? 4), top = p.pad.t + (cfg.topSpace ?? 26);
      const order = S.data.map((v, i) => i).sort((a, b) => S.data[a] - S.data[b]);
      const stacks = r => {
        const cols = new Map(), out = [];
        for (const i of order){
          const px = p.X(S.data[i]), col = Math.round(px / (2 * r + 1)), k = cols.get(col) || 0;
          cols.set(col, k + 1); out.push({ i, v: S.data[i], px, k });
        }
        return out;
      };
      let r = 7, L = stacks(r);
      const tall = Math.max(1, ...L.map(d => d.k + 1));
      const fitR = Math.max(2.2, Math.min(7, (board - top) / (2 * tall + 0.5)));
      if (fitR < r){ r = fitR; L = stacks(r); }
      return L.map(d => ({ ...d, r, py: board - r - 1 - d.k * (2 * r + 0.6) }));
    }
    function drawPlot(p){
      const C = p.colors(), c = p.ctx;
      p.y0 = 0; p.y1 = 1;
      p.grid(C, { yTicks: [] });
      layout = computeLayout(p);
      if (!R){ return; }
      cfg.back?.(p, C, R, S.O, layout);
      p.clip(() => {
        for (const d of layout){
          const st = cfg.dot?.(d.i, d.v, R, S.O, C) || {};
          c.fillStyle = st.fill ?? C.muted; c.strokeStyle = st.stroke ?? C.surface; c.lineWidth = st.width ?? 1.2;
          c.beginPath(); c.arc(d.px, d.py, d.r, 0, Math.PI * 2); c.fill(); c.stroke();
        }
      });
      const drag = p.drag?.type === "handle" ? layout.find(d => d.i === p.drag.key) : null;
      if (drag) p.pill(drag.px, Math.max(p.pad.t, drag.py - drag.r - 26), show(trim(drag.v, 4)), C, false);
      cfg.front?.(p, C, R, S.O, layout);
    }
    const plot = new Plot(el("plot"), {
      draw: drawPlot,
      handles: () => layout.map(d => ({ key: d.i, x: d.v, py: d.py, r: d.r + 4 })),
      onFit: fit,
      onHandle(i, x){
        const dec = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 100));
        S.data[i] = +x.toFixed(dec);
        S.example = null; writeText(); update();
      },
    });
    plot.pad.l = 16;

    /* ---------- events ---------- */
    bindCopy($(".sections", root));
    dataIn.addEventListener("input", () => {
      const v = readText(); if (!v) return;
      S.data = v; S.example = null;
      const lost = v.some(x => x < plot.x0 || x > plot.x1);
      update(); if (lost) fit();
    });
    dataIn.addEventListener("change", () => { if (readText() && S.data.length >= cfg.minN) writeText(); });
    el("sortBtn").addEventListener("click", () => { S.data.sort((a, b) => a - b); writeText(); readText(); update(); });
    $$("[data-seg]", root).forEach(g => $$("button", g).forEach(b => b.addEventListener("click", () => {
      S.O[g.dataset.seg] = b.dataset.v; S.example = null; update();
    })));
    $$("[data-opt]", root).forEach(c => c.addEventListener("change", () => { S.O[c.dataset.opt] = c.checked; update(); }));
    el("fitBtn").addEventListener("click", fit);
    el("examples").innerHTML = examplesHtml(exList(), S.example);
    el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });

    const onTheme = () => plot.draw();
    document.addEventListener("themechange", onTheme);

    writeText(); readText();
    if (S.range) [plot.x0, plot.x1] = S.range; else fit();
    update();
    return () => { S.range = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
  };
}

/* ---------- small statistics helpers shared by the descriptive pages ---------- */
const Desc = {
  sum: xs => xs.reduce((s, x) => s + x, 0),
  mean: xs => Desc.sum(xs) / xs.length,
  sorted: xs => [...xs].sort((a, b) => a - b),
  /* Barbetta: value at position pos (1-based) of the ordered data, interpolating linearly. */
  at(sorted, pos){
    const n = sorted.length, k = Math.floor(pos + 1e-9), f = pos - k;
    if (k < 1) return { k: 1, f: 0, v: sorted[0] };
    if (k >= n) return { k: n, f: 0, v: sorted[n - 1] };
    return { k, f: f < 1e-9 ? 0 : f, v: sorted[k - 1] + (f < 1e-9 ? 0 : f) * (sorted[k] - sorted[k - 1]) };
  },
  median: xs => Desc.at(Desc.sorted(xs), (xs.length + 1) / 2).v,
};

/* ---- js/nav.js ---- */
"use strict";
/* ============================================================
   Navigation tree — edit this as formulas get added.

   A node is either a page id ("normal") or a folder:
     { folder: "<key>", items: [ ...nodes ] }
   Folders can be nested to any depth.
   Labels come from the locale files: "folder.<key>" and "nav.<id>".
   Pages with an entry in PAGES are live; the rest show a placeholder.
   ============================================================ */
const NAV = [
  { folder: "descriptive", items: ["mean", "standard-deviation", "quartiles"] },
  { folder: "probability", items: ["addition-rule", "conditional-probability", "bayes"] },
  { folder: "discrete",    items: ["expected-value", "binomial", "hypergeometric", "poisson"] },
  { folder: "continuous",  items: ["uniform", "exponential", "normal"] },
  { folder: "estimation",  items: ["ci-mean", "ci-proportion", "sample-size"] },
  { folder: "tests",       items: ["test-mean", "test-proportion", "chi-square"] },
  { folder: "regression",  items: ["correlation", "linear-regression"] },
];
/* Pages planned for later are listed in TODO.md, not here, so they stay out of the menu. */
const PAGES = {};          // id -> (root) => cleanup fn
const HOME = "home";       // landing page: shown for an empty address and when clicking the app name
const DEFAULT_PAGE = HOME;

/* ---------- tree helpers ---------- */
/* Folders are identified by their path, e.g. "distributions/continuous". */
const isFolder = n => typeof n === "object";
const joinPath = (base, key) => base ? `${base}/${key}` : key;

/* Every page id under these nodes, in menu order. */
function navPages(nodes = NAV, out = []){
  for (const n of nodes) isFolder(n) ? navPages(n.items, out) : out.push(n);
  return out;
}
/* Every folder path under these nodes. */
function navFolders(nodes = NAV, base = "", out = []){
  for (const n of nodes) if (isFolder(n)){ const p = joinPath(base, n.folder); out.push(p); navFolders(n.items, p, out); }
  return out;
}
/* Paths of the folders that contain a page, outermost first; null if the page isn't in the menu. */
function navTrail(id, nodes = NAV, base = "", trail = []){
  for (const n of nodes){
    if (!isFolder(n)){ if (n === id) return trail; continue; }
    const p = joinPath(base, n.folder), found = navTrail(id, n.items, p, [...trail, p]);
    if (found) return found;
  }
  return null;
}

/* ---- js/pages/desc/mean.js ---- */
"use strict";
/* ============================================================
   Page: Arithmetic mean   x̄ = Σxᵢ / n
   With repeated values:   x̄ = Σxⱼnⱼ / n
   Sources: Barbetta 3.4.1 (eq. 3.4, 3.9, Ex. 3.2 and 3.4) · Bussab & Morettin 3.1
   ============================================================ */
const MEAN_PAGE = {
  id: "mean", key: "mean", minN: 1,
  data: [4, 5, 5, 6, 6, 7, 7, 8], example: "turmaA",
  options: [{ key: "median", def: false }],
  baseGap: 16,

  compute(xs){
    const n = xs.length, sum = Desc.sum(xs), mean = sum / n, s = Desc.sorted(xs);
    const counts = new Map(); for (const v of s) counts.set(v, (counts.get(v) || 0) + 1);
    return { xs, n, sum, mean, median: Desc.median(xs), min: s[0], max: s[n - 1], freq: [...counts] };
  },

  formulas(R){
    const xb = M.bar("x"), xi = M.sub(M.i("x"), M.i("i")), n = M.i("n"), num = v => M.n(trim(v, 6));
    const rows = [{ label: t("mean.f.mean"), chain: [
      xb, M.frac(M.row(M.sum(), xi), n),
      M.frac(sumTerms(R.xs.map(v => nv(v))), num(R.n)),
      M.frac(num(R.sum), num(R.n)), num(trim(R.mean, 4))] }];
    if (R.freq.length < R.n){
      const xj = M.sub(M.i("x"), M.i("j")), nj = M.sub(M.i("n"), M.i("j"));
      const terms = R.freq.map(([v, c]) => M.row(nv(v), M.o("·"), M.n(String(c))));
      rows.push({ label: t("mean.f.freq"), chain: [
        xb, M.frac(M.row(M.sum(M.row(M.i("j"), M.o("="), M.n(1)), M.i("k")), xj, nj), n),
        M.frac(sumTerms(terms, 6), num(R.n)), num(trim(R.mean, 4))] });
    }
    return rows;
  },

  vars(R){
    const rows = [
      [M.bar("x"), t("mean.sym.xbar"), show(trim(R.mean, 4))],
      [M.sub(M.i("x"), M.i("i")), t("dt.sym.xi"), ""],
      [M.i("n"), t("dt.sym.n"), String(R.n)],
      [M.row(M.sum(), M.sub(M.i("x"), M.i("i"))), t("dt.sym.sum"), show(trim(R.sum, 6))],
    ];
    if (R.freq.length < R.n) rows.push(
      [M.sub(M.i("x"), M.i("j")), t("mean.sym.xj"), ""],
      [M.sub(M.i("n"), M.i("j")), t("mean.sym.nj"), ""],
      [M.i("k"), t("mean.sym.k"), String(R.freq.length)]);
    return rows;
  },

  result(R, O){
    const facts = [[t("dt.n"), String(R.n)], [t("dt.sumLbl"), show(trim(R.sum, 6))]];
    facts.push([t("dt.median"), show(trim(R.median, 4))], [t("dt.min"), show(trim(R.min, 6))], [t("dt.max"), show(trim(R.max, 6))]);
    return { big: show(trim(R.mean, 4)), sub: `<math>${M.bar("x")}</math> · ${t("mean.title").toLowerCase()}`, facts };
  },
  answer: R => `<math>${M.bar("x")}<mo>=</mo>${M.n(trim(R.mean, 2))}</math>`,
  r: (R, O) => [
    rLine("mean(x)", `${t("mean.r.mean")}: ${trim(R.mean, 4)}`),
    rLine("sum(x) / length(x)", t("mean.r.formula")),
    ...(O.median ? [rLine("median(x)", `${t("dt.median")}: ${trim(R.median, 4)}`)] : []),
  ],

  back(p, C, R, O){
    const c = p.ctx, axis = p.pad.t + p.ph, board = axis - 16;
    c.save(); c.strokeStyle = C.line; c.lineWidth = 2;
    c.beginPath(); c.moveTo(p.pad.l, board + 1); c.lineTo(p.pad.l + p.pw, board + 1); c.stroke(); c.restore();
    if (O.median) p.vline(R.median, C.muted, [5, 4], 1, 1.4);
  },
  front(p, C, R, O){
    const c = p.ctx, axis = p.pad.t + p.ph, board = axis - 16, x = p.X(R.mean);
    if (R.mean < p.x0 || R.mean > p.x1) return;
    // the balance point: the mean is where the board of dots would balance
    c.save(); c.fillStyle = C.accent;
    c.beginPath(); c.moveTo(x, board + 2); c.lineTo(x - 9, axis); c.lineTo(x + 9, axis); c.closePath(); c.fill();
    c.strokeStyle = C.accent; c.lineWidth = 1.5; c.setLineDash([]);
    c.beginPath(); c.moveTo(Math.round(x) + .5, p.pad.t); c.lineTo(Math.round(x) + .5, board); c.stroke(); c.restore();
    const [l, r] = p.pill(x, 6, `x̄ = ${show(trim(R.mean, 4))}`, C, true);
    if (O.median && R.median >= p.x0 && R.median <= p.x1){
      const mx = p.X(R.median), close = mx > l - 50 && mx < r + 50;
      p.pill(mx, close ? 30 : 6, `md = ${show(trim(R.median, 4))}`, C, false);
    }
  },

  examples: [
    { id: "turmaA", data: [4, 5, 5, 6, 6, 7, 7, 8], source: "Barbetta · Ex. 3.4" },
    { id: "turmaB", data: [1, 2, 4, 6, 6, 9, 10, 10], source: "Barbetta · Ex. 3.4" },
    { id: "turmaC", data: [0, 6, 7, 7, 7, 7.5, 7.5], O: { median: true }, source: "Barbetta · Ex. 3.4" },
    { id: "load", data: [5.2, 6.4, 5.7, 8.3, 7.0, 5.4, 4.8, 9.1, 5.5, 6.2, 4.9, 5.7, 6.3, 5.1, 8.4, 6.2, 8.9, 7.3, 5.4, 4.8, 5.6, 6.8, 5.0, 6.7, 8.2, 7.1, 4.9, 5.0, 8.2, 9.9, 5.4, 5.6, 5.7, 6.2, 4.9, 5.1, 6.0, 4.7, 14.1, 5.3, 4.9, 5.0, 5.7, 6.3, 6.0, 6.8, 7.3, 6.9, 6.5, 5.9], O: { median: true }, source: "Barbetta · Ex. 3.2" },
    { id: "bm", data: [15, 5, 3, 8, 10, 2, 7, 11, 12], O: { median: true }, source: "Bussab & Morettin · Ex. 3.5" },
    { id: "bm67", data: [15, 5, 3, 8, 10, 2, 7, 11, 12, 67], O: { median: true }, source: "Bussab & Morettin · Ex. 3.5" },
  ],
  notes: ["note.balance", "note.outlier", "note.freq", "note.units"],
  sources: ["src.barbetta", "src.bussab", "src.slides"],
};

/* ---- js/pages/desc/standard-deviation.js ---- */
"use strict";
/* ============================================================
   Page: Standard deviation (with the variance)
     s² = Σ(xᵢ − x̄)² / (n − 1)       s = √s²
     s  = √[(Σxᵢ² − n·x̄²) / (n − 1)]  shortcut, fewer rounding errors
   Bussab & Morettin define var(X) and dp(X) with n in the denominator;
   the page can switch between n − 1 and n.
   Sources: Barbetta 3.4.1 (eq. 3.6 to 3.8, Ex. 3.4) · Bussab & Morettin 3.2
   ============================================================ */
const SD_PAGE = {
  id: "standard-deviation", key: "sdp", minN: 2,
  data: [4, 5, 5, 6, 6, 7, 7, 8], example: "turmaA",
  segs: [{ key: "div", def: "n1", values: ["n1", "n"] }],

  compute(xs, O){
    const n = xs.length, sum = Desc.sum(xs), mean = sum / n;
    const ss = xs.reduce((s, x) => s + (x - mean) ** 2, 0), sx2 = xs.reduce((s, x) => s + x * x, 0);
    const d = O.div === "n" ? n : n - 1, v = ss / d;
    return { xs, n, sum, mean, ss, sx2, d, pop: O.div === "n", v, s: Math.sqrt(v) };
  },

  formulas(R){
    const xb = M.bar("x"), xi = M.sub(M.i("x"), M.i("i")), n = M.i("n"), num = v => M.n(trim(v, 6)), r4 = v => M.n(trim(v, 4));
    const V = sdSym.v(R), Sd = sdSym.s(R);
    const D = R.pop ? n : M.row(n, M.o(MINUS), M.n(1)), Dn = R.pop ? num(R.n) : M.row(num(R.n), M.o(MINUS), M.n(1));
    const dev = M.sup(M.paren(M.row(xi, M.o(MINUS), xb)), M.n(2));
    const devTerms = R.xs.map(x => M.sup(M.paren(M.row(M.n(trim(x, 6)), M.o(MINUS), nv(+trim(R.mean, 4)))), M.n(2)));
    return [
      { label: t("sdp.f.mean"), chain: [xb, M.frac(M.row(M.sum(), xi), n), M.frac(num(R.sum), num(R.n)), r4(R.mean)] },
      { label: t("sdp.f.var"), chain: [V, M.frac(M.row(M.sum(), dev), D), M.frac(sumTerms(devTerms, 6), Dn), M.frac(r4(R.ss), num(R.d)), r4(R.v)] },
      { label: t("sdp.f.sd"), chain: [Sd, M.sqrt(V), M.sqrt(r4(R.v)), r4(R.s)] },
      { label: t("sdp.f.short"), chain: [Sd,
        M.sqrt(M.frac(M.row(M.sum(), M.sup(xi, M.n(2)), M.o(MINUS), n, M.sup(xb, M.n(2))), D)),
        M.sqrt(M.frac(M.row(num(R.sx2), M.o(MINUS), num(R.n), M.o("·"), M.sup(nv(+trim(R.mean, 4)), M.n(2))), Dn)),
        r4(R.s)] },
    ];
  },

  vars(R){
    const xi = M.sub(M.i("x"), M.i("i")), xb = M.bar("x");
    return [
      [sdSym.s(R), R.pop ? t("sdp.sym.dp") : t("sdp.sym.s"), show(trim(R.s, 4))],
      [sdSym.v(R), R.pop ? t("sdp.sym.var") : t("sdp.sym.s2"), show(trim(R.v, 4))],
      [xi, t("dt.sym.xi"), ""],
      [xb, t("sdp.sym.xbar"), show(trim(R.mean, 4))],
      [M.i("n"), t("dt.sym.n"), String(R.n)],
      [M.row(M.sum(), M.sup(M.paren(M.row(xi, M.o(MINUS), xb)), M.n(2))), t("sdp.sym.ss"), show(trim(R.ss, 4))],
      [M.row(M.sum(), M.sup(xi, M.n(2))), t("sdp.sym.sx2"), show(trim(R.sx2, 6))],
    ];
  },

  result(R){
    return {
      big: show(trim(R.s, 4)),
      sub: `<math>${sdSym.s(R)}</math> · ${R.pop ? t("sdp.subPop") : t("sdp.subSample")}`,
      facts: [[t("sdp.fact.mean"), show(trim(R.mean, 4))], [R.pop ? t("sdp.fact.var") : t("sdp.fact.s2"), show(trim(R.v, 4))],
        [t("sdp.fact.ss"), show(trim(R.ss, 4))], [t("dt.n"), String(R.n)]],
    };
  },
  answer: R => `<math>${sdSym.s(R)}<mo>=</mo>${M.n(trim(R.s, 2))}</math>`,
  r: R => R.pop
    ? [rLine("n <- length(x)", t("dt.sym.n")),
       rLine("sum((x - mean(x))^2) / n", `${t("sdp.fact.var")}: ${trim(R.v, 4)}`, 34),
       rLine("sqrt(sum((x - mean(x))^2) / n)", `${t("sdp.r.dp")}: ${trim(R.s, 4)}`, 34),
       `# ${t("sdp.r.note")}`]
    : [rLine("var(x)", `${t("sdp.fact.s2")}: ${trim(R.v, 4)}`),
       rLine("sd(x)", `${t("sdp.r.s")}: ${trim(R.s, 4)}`),
       rLine("sqrt((sum(x^2) - length(x) * mean(x)^2) / (length(x) - 1))", t("sdp.r.short"))],

  back(p, C, R, O, L){
    const c = p.ctx, lo = R.mean - R.s, hi = R.mean + R.s, axis = p.pad.t + p.ph;
    p.clip(() => {
      c.fillStyle = C.fill; c.fillRect(p.X(lo), p.pad.t, p.X(hi) - p.X(lo), axis - p.pad.t);
      c.strokeStyle = C.faint; c.lineWidth = 1;
      for (const d of L){ c.beginPath(); c.moveTo(p.X(R.mean), d.py); c.lineTo(d.px, d.py); c.stroke(); }
    });
    p.vline(lo, C.accent, [4, 3]); p.vline(hi, C.accent, [4, 3]);
    p.vline(R.mean, C.accent, [], 1, 1.5);
  },
  front(p, C, R){
    const mean = `x̄ = ${show(trim(R.mean, 3))}`;
    const s = R.pop ? t("sdp.symDp") : "s";
    p.pill(p.X(R.mean), 6, mean, C, true);
    if (p.X(R.mean + R.s) - p.X(R.mean - R.s) > 150){
      p.pill(p.X(R.mean - R.s), 30, `x̄ − ${s} = ${show(trim(R.mean - R.s, 3))}`, C, false);
      p.pill(p.X(R.mean + R.s), 30, `x̄ + ${s} = ${show(trim(R.mean + R.s, 3))}`, C, false);
    }
  },

  examples: [
    { id: "turmaA", data: [4, 5, 5, 6, 6, 7, 7, 8], source: "Barbetta · Ex. 3.4" },
    { id: "turmaB", data: [1, 2, 4, 6, 6, 9, 10, 10], source: "Barbetta · Ex. 3.4" },
    { id: "turmaC", data: [0, 6, 7, 7, 7, 7.5, 7.5], source: "Barbetta · Ex. 3.4" },
    { id: "shift", data: [101, 102, 103], source: "Barbetta · Tabela 3.5" },
    { id: "bmA", data: [3, 4, 5, 6, 7], O: { div: "n" }, source: "Bussab & Morettin · 3.2" },
    { id: "bmD", data: [3, 5, 5, 7], O: { div: "n" }, source: "Bussab & Morettin · 3.2" },
  ],
  notes: ["note.n1", "note.units", "note.short", "note.outlier", "note.shift"],
  sources: ["src.barbetta", "src.bussab", "src.slides"],
};
/* s and s² (sample, n − 1), or dp(X) and var(X) as in Bussab & Morettin (n). */
const sdSym = {
  s: R => R.pop ? M.row(M.up(t("sdp.symDp")), M.paren(M.i("X"))) : M.i("s"),
  v: R => R.pop ? M.row(M.up("var"), M.paren(M.i("X"))) : M.sup(M.i("s"), M.n(2)),
};
PAGES["standard-deviation"] = dataPage(SD_PAGE);

/* ---- js/pages/desc/quartiles.js ---- */
"use strict";
/* ============================================================
   Page: Quartiles (with the median and the box plot)
   Positions in the ordered data (Barbetta):
     qi: (n + 1)/4     md: (n + 1)/2     qs: 3(n + 1)/4
   interpolating linearly when the position is fractional.
     dq = qs − qi; values beyond qi − 1.5dq or qs + 1.5dq are outliers
     (beyond 3dq, far outliers).
   Same as R's quantile(x, type = 6).
   Sources: Barbetta 3.4.2 · Bussab & Morettin 3.3 and 3.4
   ============================================================ */
const QUART_PAGE = {
  id: "quartiles", key: "qt", minN: 3,
  data: [15, 18, 5, 7, 9, 11, 3, 5, 6, 8, 12], example: "eleven",
  topSpace: 86,

  compute(xs){
    const s = Desc.sorted(xs), n = s.length;
    const pos = [(n + 1) / 4, (n + 1) / 2, 3 * (n + 1) / 4];
    const [qi, md, qs] = pos.map(p => Desc.at(s, p));
    const dq = qs.v - qi.v, lf = qi.v - 1.5 * dq, uf = qs.v + 1.5 * dq, lf3 = qi.v - 3 * dq, uf3 = qs.v + 3 * dq;
    const inside = s.filter(v => v >= lf - 1e-12 && v <= uf + 1e-12);
    return { xs, s, n, pos, qi, md, qs, dq, lf, uf, lf3, uf3,
      wlo: inside.length ? inside[0] : qi.v, whi: inside.length ? inside[inside.length - 1] : qs.v,
      out: s.filter(v => v < lf - 1e-12 || v > uf + 1e-12), min: s[0], max: s[n - 1] };
  },

  formulas(R){
    const n = M.i("n"), num = v => M.n(trim(v, 6)), r4 = v => M.n(trim(v, 4)), np1 = M.row(n, M.o("+"), M.n(1));
    const nn = M.row(num(R.n), M.o("+"), M.n(1)), pos = M.text(t("qt.pos"));
    const posFrac = [
      [M.frac(np1, M.n(4)), M.frac(nn, M.n(4))],
      [M.frac(np1, M.n(2)), M.frac(nn, M.n(2))],
      [M.frac(M.row(M.n(3), M.paren(np1)), M.n(4)), M.frac(M.row(M.n(3), M.paren(nn)), M.n(4))],
    ];
    const syms = [qSym.qi, qSym.md, qSym.qs], labels = ["qt.f.qi", "qt.f.md", "qt.f.qs"];
    const rows = [{ label: t("qt.f.sorted"), html: orderedHtml(R) }];
    [R.qi, R.md, R.qs].forEach((q, j) => {
      const line1 = M.math(M.row(pos, M.o("="), posFrac[j][0], M.o("="), posFrac[j][1], M.o("="), r4(R.pos[j])));
      let line2;
      if (!q.f) line2 = M.math(M.row(syms[j](), M.o("="), M.ord(q.k), M.o("="), num(q.v)));
      else {
        const a = R.s[q.k - 1], b = R.s[q.k], f = M.n(trim(q.f, 4));
        line2 = M.math(M.row(syms[j](), M.o("="), M.ord(q.k), M.o("+"), f, M.o("·"), M.paren(M.row(M.ord(q.k + 1), M.o(MINUS), M.ord(q.k))),
          M.o("="), num(a), M.o("+"), f, M.o("·"), M.paren(M.row(num(b), M.o(MINUS), nv(a))), M.o("="), r4(q.v)));
      }
      rows.push({ label: t(labels[j]), html: line1 + line2 });
    });
    const k15 = M.n("1.5"), dq = qSym.dq();
    rows.push({ label: t("qt.f.box"), html:
      M.math(M.row(dq, M.o("="), qSym.qs(), M.o(MINUS), qSym.qi(), M.o("="), num(R.qs.v), M.o(MINUS), nv(R.qi.v), M.o("="), r4(R.dq))) +
      M.math(M.row(qSym.qi(), M.o(MINUS), k15, dq, M.o("="), num(R.qi.v), M.o(MINUS), k15, M.o("·"), r4(R.dq), M.o("="), r4(R.lf))) +
      M.math(M.row(qSym.qs(), M.o("+"), k15, dq, M.o("="), num(R.qs.v), M.o("+"), k15, M.o("·"), r4(R.dq), M.o("="), r4(R.uf))) });
    return rows;
  },

  vars(R){
    return [
      [M.i("n"), t("dt.sym.n"), String(R.n)],
      [M.ord(M.i("k")), t("qt.sym.xk"), ""],
      [qSym.qi(), t("qt.sym.qi"), show(trim(R.qi.v, 4))],
      [qSym.md(), t("qt.sym.md"), show(trim(R.md.v, 4))],
      [qSym.qs(), t("qt.sym.qs"), show(trim(R.qs.v, 4))],
      [qSym.dq(), t("qt.sym.dq"), show(trim(R.dq, 4))],
      [M.row(qSym.qi(), M.o(MINUS), M.n("1.5"), qSym.dq()), t("qt.sym.lf"), show(trim(R.lf, 4))],
      [M.row(qSym.qs(), M.o("+"), M.n("1.5"), qSym.dq()), t("qt.sym.uf"), show(trim(R.uf, 4))],
    ];
  },

  result(R){
    const v = x => show(trim(x, 4));
    return {
      big: `<span class="qtrio">${[[R.qi.v, qSym.qi()], [R.md.v, qSym.md()], [R.qs.v, qSym.qs()]]
        .map(([x, m]) => `<span><b>${v(x)}</b><math>${m}</math></span>`).join("")}</span>`,
      sub: "",
      facts: [[t("qt.fact.dq"), v(R.dq)], [t("dt.min"), v(R.min)], [t("dt.max"), v(R.max)],
        [t("qt.fact.out"), R.out.length ? R.out.map(v).join(t("listSep")) : t("qt.none")]],
    };
  },
  answer: R => `<math>${qSym.qi()}<mo>=</mo>${M.n(trim(R.qi.v, 3))}<mo separator="true">;</mo><mspace width="0.4em"></mspace>${qSym.md()}<mo>=</mo>${M.n(trim(R.md.v, 3))}<mo separator="true">;</mo><mspace width="0.4em"></mspace>${qSym.qs()}<mo>=</mo>${M.n(trim(R.qs.v, 3))}</math>`,
  r: R => [
    rLine("quantile(x, c(0.25, 0.5, 0.75), type = 6)", `${t("qt.r.q")}: ${[R.qi.v, R.md.v, R.qs.v].map(v => trim(v, 4)).join(" ")}`, 44),
    rLine("IQR(x, type = 6)", `dq: ${trim(R.dq, 4)}`, 44),
    rLine("boxplot(x, horizontal = TRUE)", t("qt.r.box"), 44),
  ],

  dot(i, v, R, O, C){ return R.out.includes(v) ? { fill: cssVar("--danger") } : null; },
  back(p, C, R){
    const c = p.ctx, axis = p.pad.t + p.ph, boxBot = p.pad.t + 58;
    for (const x of [R.lf, R.uf]) if (x >= p.x0 && x <= p.x1){
      p.vline(x, C.faint, [2, 4]);
    }
    p.clip(() => {
      c.save(); c.setLineDash([3, 3]); c.strokeStyle = C.accent; c.globalAlpha = .55; c.lineWidth = 1;
      for (const q of [R.qi.v, R.md.v, R.qs.v]){ const x = Math.round(p.X(q)) + .5; c.beginPath(); c.moveTo(x, boxBot); c.lineTo(x, axis); c.stroke(); }
      c.restore();
    });
  },
  front(p, C, R){
    const c = p.ctx, top = p.pad.t + 22, bot = p.pad.t + 58, mid = (top + bot) / 2, danger = cssVar("--danger");
    p.clip(() => {
      const X = v => p.X(v);
      c.strokeStyle = C.accent; c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(X(R.wlo), mid); c.lineTo(X(R.qi.v), mid); c.moveTo(X(R.qs.v), mid); c.lineTo(X(R.whi), mid);
      c.moveTo(X(R.wlo), mid - 7); c.lineTo(X(R.wlo), mid + 7); c.moveTo(X(R.whi), mid - 7); c.lineTo(X(R.whi), mid + 7);
      c.stroke();
      c.fillStyle = C.fill; c.fillRect(X(R.qi.v), top, X(R.qs.v) - X(R.qi.v), bot - top);
      c.strokeRect(Math.round(X(R.qi.v)) + .5, top + .5, X(R.qs.v) - X(R.qi.v), bot - top);
      c.lineWidth = 2.5; c.beginPath(); c.moveTo(X(R.md.v), top); c.lineTo(X(R.md.v), bot); c.stroke();
      for (const v of R.out){
        const x = X(v), far = v < R.lf3 - 1e-12 || v > R.uf3 + 1e-12;
        c.strokeStyle = danger; c.lineWidth = 1.6;
        if (far){ c.beginPath(); c.moveTo(x - 4.5, mid - 4.5); c.lineTo(x + 4.5, mid + 4.5); c.moveTo(x + 4.5, mid - 4.5); c.lineTo(x - 4.5, mid + 4.5); c.stroke(); }
        else { c.beginPath(); c.arc(x, mid, 4.5, 0, Math.PI * 2); c.stroke(); }
      }
    });
    // labels: md on the first row; qi and qs share it when there is room, else go to the second row
    c.font = `600 12px ${C.font}`;
    const lab = [[R.qi.v, "qi"], [R.md.v, "md"], [R.qs.v, "qs"]].map(([v, s]) => ({ x: p.X(v), text: `${s} = ${show(trim(v, 3))}` }));
    const w = l => c.measureText(l.text).width + 14;
    const md = lab[1], gapL = md.x - w(md) / 2 - (lab[0].x + w(lab[0]) / 2), gapR = lab[2].x - w(lab[2]) / 2 - (md.x + w(md) / 2);
    const row = gapL > 4 && gapR > 4 ? 6 : 30;
    p.pill(md.x, 6, md.text, C, true);
    if (row === 30 && lab[2].x - lab[0].x < (w(lab[0]) + w(lab[2])) / 2 + 4){
      p.pill(lab[0].x - w(lab[0]) / 2, 30, lab[0].text, C, false); p.pill(lab[2].x + w(lab[2]) / 2, 30, lab[2].text, C, false);
    } else { p.pill(lab[0].x, row, lab[0].text, C, false); p.pill(lab[2].x, row, lab[2].text, C, false); }
    c.font = `11px ${C.font}`; c.fillStyle = C.faint; c.textBaseline = "top";
    if (R.lf >= p.x0 && R.lf <= p.x1){ c.textAlign = "left"; c.fillText(`qi − 1,5dq`.replace(",", t("decimal")), p.X(R.lf) + 4, p.pad.t + 64); }
    if (R.uf >= p.x0 && R.uf <= p.x1){ c.textAlign = "right"; c.fillText(`qs + 1,5dq`.replace(",", t("decimal")), p.X(R.uf) - 4, p.pad.t + 64); }
  },

  examples: [
    { id: "eleven", data: [15, 18, 5, 7, 9, 11, 3, 5, 6, 8, 12], source: "Barbetta · 3.4.2" },
    { id: "load", data: [5.2, 6.4, 5.7, 8.3, 7.0, 5.4, 4.8, 9.1, 5.5, 6.2, 4.9, 5.7, 6.3, 5.1, 8.4, 6.2, 8.9, 7.3, 5.4, 4.8, 5.6, 6.8, 5.0, 6.7, 8.2, 7.1, 4.9, 5.0, 8.2, 9.9, 5.4, 5.6, 5.7, 6.2, 4.9, 5.1, 6.0, 4.7, 14.1, 5.3, 4.9, 5.0, 5.7, 6.3, 6.0, 6.8, 7.3, 6.9, 6.5, 5.9], source: "Barbetta · Ex. 3.2" },

PAGES["binomial"] = distPage({
  id: "binomial", key: "bin", kind: "discrete",
  params: [
    { key: "n", sym: M.i("n"), def: 18, min: 1, max: 60, step: 1, int: true, ok: v => v >= 1 && v <= 5000 },
    { key: "p", sym: M.i("p"), def: 0.1, min: 0.01, max: 0.99, step: 0.01, ok: v => v >= 0 && v <= 1 },
  ],

  support: P => [0, P.n],
  view: P => {
    if (P.n <= 40) return [0, P.n];
    const m = P.n * P.p, sd = Math.sqrt(P.n * P.p * (1 - P.p));
    return [Math.max(0, Math.floor(m - 5 * sd - 2)), Math.min(P.n, Math.ceil(m + 5 * sd + 2))];

    return Math.exp(Num.lchoose(P.n, x) + x * Math.log(P.p) + (P.n - x) * Math.log(1 - P.p));
  },
  mean: P => P.n * P.p,
  variance: P => P.n * P.p * (1 - P.p),
  math: {
    general: () => M.row(M.binom(M.i("n"), M.i("x")), M.sup(M.i("p"), M.i("x")),

  id: "hypergeometric", key: "hyp", kind: "discrete",
  params: [
    { key: "N", sym: M.i("N"), def: 30, min: 1, max: 200, step: 1, int: true, ok: v => v >= 1 && v <= 100000 },
    { key: "r", sym: M.i("r"), def: 3, min: 0, max: 60, step: 1, int: true, ok: v => v >= 0 && v <= 100000 },
    { key: "n", sym: M.i("n"), def: 5, min: 1, max: 60, step: 1, int: true, ok: v => v >= 1 && v <= 100000 },
  ],
  initial: { mode: "ge", a: 1, b: 2, example: "cards" },
  check: P => P.r > P.N ? "err.r" : P.n > P.N ? "err.n" : null,
  support: P => [Math.max(0, P.n - (P.N - P.r)), Math.min(P.r, P.n)],
  view: P => [Math.max(0, P.n - (P.N - P.r)), Math.min(P.r, P.n)],
  pf: (x, P) => {
    const lo = Math.max(0, P.n - (P.N - P.r)), hi = Math.min(P.r, P.n);
    if (!Number.isInteger(x) || x < lo || x > hi) return 0;
    return Math.exp(Num.lchoose(P.r, x) + Num.lchoose(P.N - P.r, P.n - x) - Num.lchoose(P.N, P.n));
  },
  mean: P => P.n * P.r / P.N,
  variance: P => { const p = P.r / P.N; return P.N > 1 ? P.n * p * (1 - p) * (P.N - P.n) / (P.N - 1) : 0; },

      M.binom(M.i("N"), M.i("n"))),
    at: (x, P) => M.frac(M.row(M.binom(M.n(P.r), M.n(x)), M.binom(M.n(P.N - P.r), M.n(P.n - x))), M.binom(M.n(P.N), M.n(P.n))),
    atNum: (x, P) => {
      const big = v => v > 1e15 ? M.sig(v) : M.n(String(v));
      return M.frac(M.row(big(Num.choose(P.r, x)), M.o("·"), big(Num.choose(P.N - P.r, P.n - x))), big(Num.choose(P.N, P.n)));
    },
    mean: { general: () => M.row(M.i("n"), M.frac(M.i("r"), M.i("N"))), sub: P => M.row(M.n(P.n), M.o("·"), M.frac(M.n(P.r), M.n(P.N))) },
    variance: {
      general: () => M.row(M.i("n"), M.i("p"), M.paren(M.row(M.n(1), M.o(MINUS), M.i("p"))), M.frac(M.row(M.i("N"), M.o(MINUS), M.i("n")), M.row(M.i("N"), M.o(MINUS), M.n(1)))),
      sub: P => { const p = trim(P.r / P.N, 4); return M.row(M.n(P.n), M.o("·"), M.n(p), M.o("·"), M.n(trim(1 - P.r / P.N, 4)), M.o("·"),
        M.frac(M.row(M.n(P.N), M.o(MINUS), M.n(P.n)), M.row(M.n(P.N), M.o(MINUS), M.n(1)))); },
    },
  },
  extraVars: P => [[M.row(M.i("p"), M.o("="), M.frac(M.i("r"), M.i("N"))), t("hyp.sym.pRatio"), show(trim(P.r / P.N, 4))]],
  r: { d: "dhyper", p: "phyper", args: P => `m = ${P.r}, n = ${P.N - P.r}, k = ${P.n}`, mean: P => `${P.n} * ${P.r} / ${P.N}`,

});

/* ---- js/pages/dist/normal.js ---- */
"use strict";
/* Normal distribution: Barbetta 6.2.3 (eq. 6.19–6.24, Tabela 3) · Bussab & Morettin 7.4 */
(() => {
  const zOf = (v, P, O) => { const z = (v - P.mu) / P.sigma; return O?.zTable ? Math.round(z * 100) / 100 : z; };
  PAGES["normal"] = distPage({
    id: "normal", key: "nor", kind: "continuous",
    params: [
      { key: "mu",    sym: M.i("μ"), def: 10, min: -50, max: 100, step: 0.1, ok: v => isFinite(v) },
      { key: "sigma", sym: M.i("σ"), def: 2, min: 0.1, max: 30, step: 0.05, ok: v => v > 0 },
    ],
    options: [{ key: "zTable", def: true }],
    initial: { mode: "ge", a: 13, b: 14, example: "current" },
    support: () => [-Infinity, Infinity],
    view: P => [P.mu - 4 * P.sigma, P.mu + 4 * P.sigma],
    pf: (x, P) => Num.normPdf(x, P.mu, P.sigma),
    cdf: (x, P) => Num.Phi((x - P.mu) / P.sigma),
    inv: (p, P, O) => { const z = Num.PhiInv(p); return P.mu + P.sigma * (O?.zTable ? Math.round(z * 100) / 100 : z); },
    prob(mode, a, b, P, O){
      if (!O?.zTable) return null;
      // As with Barbetta's Table 3: z with 2 decimals, upper-tail area P(Z > |z|) with 4 decimals.
      const tail = z => Math.round((1 - Num.Phi(Math.abs(z))) * 1e4) / 1e4;
      const F = v => { const z = zOf(v, P, O); return z >= 0 ? 1 - tail(z) : tail(z); };
      const lo = Math.min(a, b ?? a), hi = Math.max(a, b ?? a);
      return { le: F(a), ge: 1 - F(a), between: Math.max(0, F(hi) - F(lo)), outside: F(lo) + 1 - F(hi) }[mode];
    },
    mean: P => P.mu,
    variance: P => P.sigma ** 2,
    math: {
      general: () => M.row(M.frac(M.n(1), M.row(M.i("σ"), M.sqrt(M.row(M.n(2), M.up("π"))))),
        M.sup(M.up("e"), M.row(M.o(MINUS), M.frac(M.sup(M.paren(M.row(M.i("x"), M.o(MINUS), M.i("μ"))), M.n(2)), M.row(M.n(2), M.sup(M.i("σ"), M.n(2))))))),
      at: (_, P) => M.row(M.frac(M.n(1), M.row(M.n(trim(P.sigma, 4)), M.sqrt(M.row(M.n(2), M.up("π"))))),
        M.sup(M.up("e"), M.row(M.o(MINUS), M.frac(M.sup(M.paren(M.row(M.i("x"), M.minus(trim(P.mu, 4)))), M.n(2)), M.row(M.n(2), M.o("·"), M.sup(M.n(trim(P.sigma, 4)), M.n(2))))))),
      cdfSteps: (v, P, O) => [
        M.row(M.up("Φ"), M.paren(M.frac(M.row(M.n(trim(v, 4)), M.minus(trim(P.mu, 4))), M.n(trim(P.sigma, 4))))),
        M.row(M.up("Φ"), M.paren(M.n(O?.zTable ? zOf(v, P, O).toFixed(2) : trim(zOf(v, P, O), 4)))),
      ],
      mean: { general: () => M.i("μ"), sub: P => M.n(trim(P.mu, 4)) },
      variance: { general: () => M.sup(M.i("σ"), M.n(2)), sub: P => M.sup(M.n(trim(P.sigma, 4)), M.n(2)) },
    },
    extraVars: (P, S) => {
      const z = M.i("z"), out = [];
      const zs = v => show(S.O.zTable ? zOf(v, P, S.O).toFixed(2) : trim(zOf(v, P, S.O), 4));
      if (S.mode === "between" || S.mode === "outside"){
        out.push([M.sub(z, M.i("a")), t("nor.sym.z"), zs(Math.min(S.a, S.b))], [M.sub(z, M.i("b")), t("nor.sym.z"), zs(Math.max(S.a, S.b))]);
      } else out.push([z, t("nor.sym.z"), zs(S.a)]);
      out.push([M.up("Φ"), t("nor.sym.Phi"), ""]);
      return out;
    },
    r: { d: "dnorm", p: "pnorm", q: "qnorm", args: P => `mean = ${trim(P.mu, 6)}, sd = ${trim(P.sigma, 6)}`, mean: P => `${trim(P.mu, 6)}`,
         note: (_, O) => O.zTable ? t("nor.r.note") : null },
    examples: [
      { id: "current",   set: { P: { mu: 10, sigma: 2 }, mode: "ge", a: 13 },              source: "slides" },
      { id: "current911", set: { P: { mu: 10, sigma: 2 }, mode: "between", a: 9, b: 11 },  source: "slides" },
      { id: "tiles",     set: { P: { mu: 2.5, sigma: 0.6 }, mode: "between", a: 2, b: 3.5 }, source: "Barbetta · Ex. 6.6" },
      { id: "z042",      set: { P: { mu: 0, sigma: 1 }, mode: "le", a: 0.42 },             source: "Barbetta · Ex. 6.4" },
      { id: "z042b",     set: { P: { mu: 0, sigma: 1 }, mode: "between", a: -0.42, b: 0.42 }, source: "Barbetta · Ex. 6.4" },
      { id: "tax",       set: { P: { mu: 60000, sigma: 10000 }, mode: "ge", a: 75000 },    source: "slides" },
      { id: "tax5070",   set: { P: { mu: 60000, sigma: 10000 }, mode: "between", a: 50000, b: 70000 }, source: "slides" },
    ],
    notes: ["note.z", "note.table", "note.rule"],
    sources: ["src.barbetta", "src.bussab", "src.slides"],
  });
})();

"use strict";
/* ============================================================
   Page: Sample size — the reference for the page format.

     n₀ = z²σ²/ε²             mean (σ known; with a pilot sample use s and t)
     n₀ = z²p(1 − p)/ε²       proportion
     n₀ = z²/(4ε²)            proportion with no prior estimate, since p(1 − p) ≤ 1/4
     n  = n₀                  infinite (or very large) population
     n  = N·n₀/(N + n₀ − 1)   population of known size N
   Always rounded up.
   Sources: Barbetta 7.4 (Quadro 7.1) · Bussab & Morettin 10.11

   Page format (copy it for new pages):
     title → graph + controls + result → formulas with a table of the variables
     → about (short explanation, good to know) → examples → R code → sources
   ============================================================ */
PAGES["sample-size"] = function SampleSizePage(root){
  const S = SampleSizePage.state || (SampleSizePage.state = {
    target: "prop",              // "mean" | "prop"
    conf: 95, zTable: true,      // confidence level γ (%), round z or t to 3 decimals like a printed table
    epsMean: 0.5, sigma: 4,      // mean: margin of error, σ (or s)
    sigmaSrc: "known", pilotN: 10,   // "known" σ, or "pilot" sample of size pilotN (uses t)
    epsProp: 0.02, p: 0.5, worst: true,  // proportion: margin, estimate, use p(1−p) ≤ 1/4
    finite: true, N: 3000,       // population size known?
    view: "N", range: {},        // graph view and remembered x-range per view
    example: "cct"               // loaded example, cleared on any edit
  });

  /* ---------- maths (pure: works on any state, so examples can be previewed) ---------- */
  function compute(st){
    const mean = st.target === "mean", usesT = mean && st.sigmaSrc === "pilot";
    const df = usesT ? Math.max(1, Math.round(st.pilotN) - 1) : null;
    const pr = 1 - (1 - st.conf / 100) / 2;
    const exact = usesT ? Num.tInv(pr, df) : Num.PhiInv(pr);
    const crit = st.zTable ? +exact.toFixed(3) : exact;
    const eps = mean ? st.epsMean : st.epsProp;
    const pq = st.worst ? 0.25 : st.p * (1 - st.p);
    const n0Of = e => mean ? crit ** 2 * st.sigma ** 2 / e ** 2 : crit ** 2 * pq / e ** 2;
    const nOf = (N, m) => N * m / (N + m - 1);
    const n0 = n0Of(eps), n = st.finite ? nOf(st.N, n0) : n0;
    return { mean, usesT, df, crit, eps, pq, n0, n, n0Of, nOf, size: ceilN(n) };
  }

  /* ---------- worked examples ---------- */
  const EXAMPLES = [
    { id: "cct",      set: { target: "prop", conf: 95, epsProp: 0.02, worst: true, finite: true, N: 3000 },              source: t("ss.srcSlides") },
    { id: "mayor45",  set: { target: "prop", conf: 95, epsProp: 0.02, worst: false, p: 0.45, finite: false },            source: t("ss.srcSlides") },
    { id: "mayor",    set: { target: "prop", conf: 95, epsProp: 0.03, worst: true, finite: false },                       source: t("ss.srcSlides") },
    { id: "brand",    set: { target: "prop", conf: 95, epsProp: 0.03, worst: false, p: 0.6, finite: false },             source: "Bussab & Morettin · Ex. 10.14" },
    { id: "pilot",    set: { target: "mean", conf: 95, epsMean: 0.5, sigma: 4, sigmaSrc: "known", finite: false },        source: "Bussab & Morettin · Ex. 10.13" },
    { id: "tv",       set: { target: "mean", conf: 95, epsMean: 0.25, sigma: 1.87, sigmaSrc: "known", finite: false },    source: t("ss.srcSlides") },
    { id: "hardness", set: { target: "mean", conf: 99, epsMean: 0.3, sigma: 0.7352, sigmaSrc: "pilot", pilotN: 10, finite: false }, source: "Barbetta · Ex. 7.5" },
  ];
  const exState = e => ({ ...S, zTable: true, ...e.set });
  const exList = () => EXAMPLES.map(e => ({ id: e.id, title: t("ss.ex." + e.id), source: e.source, answer: `n = ${fmtInt(compute(exState(e)).size)}` }));
  function loadExample(id){
    const e = EXAMPLES.find(x => x.id === id); if (!e) return;
    Object.assign(S, { zTable: true }, e.set, { example: id });
    S.view = S.finite ? "N" : "eps"; S.range = {};
    update(); fit();
  }

  /* ---------- markup ---------- */
  const sym = s => `<span class="sym">${s}</span>`;
  root.innerHTML = `
  <div class="page">
    <header class="page-head"><h1>${t("ss.title")}</h1></header>

    <section class="work">
      <div class="plot-col">
        <div class="plot-bar">
          <div class="seg" role="group" aria-label="${t("graphType")}">
            <button data-view="N" aria-pressed="false">${t("ss.byN")}</button>
            <button data-view="eps" aria-pressed="false">${t("ss.byEps")}</button>
          </div>

            <button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button>

        </div>

      <aside class="controls" aria-label="${t("controls")}">

          <h2>${t("ss.confidence")}</h2>
          <div class="param">
            <label for="confN">${sym("γ")}${t("ss.level")} <span class="unit">(%)</span></label>
            ${numInput("confN", 1)}
          </div>
          <div class="presets" role="group" aria-label="${t("ss.level")}">
            ${[90, 95, 99].map(v => `<button class="btn" data-conf="${v}" aria-pressed="false">${v}%</button>`).join("")}
          </div>
          <div class="zline" id="critLine"></div>
          <label class="check"><input type="checkbox" id="zTable">${t("ss.zTable")}</label>
        </div>

        <div class="group">
          <h2>${t("parameters")}</h2>
          <div class="param">
            <label for="epsN">${sym("ε")}${t("ss.error")} <span class="unit" id="epsPct"></span></label>
            ${numInput("epsN", 0.01)}
            <input id="epsR" type="range" aria-label="${t("ss.error")}">
          </div>
          <div id="meanBox">
            <div class="seg full seg-gap" role="group" id="srcSeg" aria-label="${t("sd")}">
              <button data-src="known" aria-pressed="false">${t("ss.sigmaKnown")}</button>
              <button data-src="pilot" aria-pressed="false">${t("ss.pilot")}</button>
            </div>
            <div class="param">
              <label for="sigN"><span class="sym" id="sigSym">σ</span><span id="sigLbl"></span></label>
              ${numInput("sigN", 0.1)}
              <input id="sigR" type="range" min="0.1" max="20" step="0.01" aria-label="${t("sd")}">
