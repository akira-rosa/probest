    this.c.width = Math.round(r.width * this.dpr); this.c.height = Math.round(r.height * this.dpr);
    this.draw();
  }
  draw(){
    if (!this.w || !this.h) return;
    const c = this.ctx; c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0); c.clearRect(0, 0, this.w, this.h);
    this.o.draw(this);
  }
  colors(){
    return { ink: cssVar("--ink"), muted: cssVar("--muted"), faint: cssVar("--faint"), line: cssVar("--line"),
             grid: cssVar("--grid"), accent: cssVar("--accent"), fill: cssVar("--fill"), soft: cssVar("--accent-soft"),
             pin: cssVar("--pin"), bar: cssVar("--bar"), surface: cssVar("--surface"), bg: cssVar("--bg"),
             accentInk: cssVar("--accent-ink"), font: cssVar("--ui") };
  }
  /* text helper: c.text("…", x, y, { align, base, size, weight, color }) */
  text(s, x, y, { align = "center", base = "middle", size = 12.5, weight = 500, color } = {}){
    const c = this.ctx; c.font = `${weight} ${size}px ${cssVar("--ui")}`;
    c.textAlign = align; c.textBaseline = base; c.fillStyle = color || cssVar("--ink"); c.fillText(s, x, y);
    return c.measureText(s).width;
  }
}

/* ---------- probabilities typed as decimals or fractions ("0.3", "0,3", "1/6") ---------- */
function parseProb(str){
  const s = String(str ?? "").trim();
  const m = s.match(/^([^/]+)\/([^/]+)$/);
  if (m){ const a = parseNum(m[1]), b = parseNum(m[2]); return a != null && b ? a / b : null; }
  return parseNum(s);
}
/* A probability going into a formula, as MathML (blue): a fraction stays a fraction, a decimal has up to 4 decimals. */
function probMath(raw, v = parseProb(raw)){
  const m = String(raw ?? "").trim().match(/^([^/]+)\/([^/]+)$/);
  if (m) return M.frac(M.v(trim(parseNum(m[1]), 6)), M.v(trim(parseNum(m[2]), 6)));
  return M.v(trim(v, 4));
}
/* Text for an input: fractions as typed, decimals in the language's format. */
const probIn = raw => /\//.test(String(raw)) ? String(raw) : loc(String(raw));
/* Number shown for a probability in results: 4 decimals, trailing zeros removed. */
const pShow = v => show(trim(v, 4));

/* ---- js/core/vennpage.js ---- */
"use strict";
/* ============================================================
   Shared page for two events A and B drawn as a Venn diagram:
   the addition rule and conditional probability.

     PAGES["addition-rule"] = vennPage(ADDITION);

   The circle areas are proportional to P(A), P(B) and P(A ∩ B)
   (scaled down only when they would not fit), and the bar under the
   diagram divides the sample space exactly. Dragging a circle changes
   how much the events overlap, that is P(A ∩ B).

   Config: id, key, mode ("union" | "cond"), state {A, B, AB, example},
     formulas(V), vars(V), result(V), answer(V), r(V), examples, notes, sources
   V = { A, B, AB, raw: {A, B, AB}, U, onlyA, onlyB, none, AgB, BgA, indep }
   ============================================================ */

/* Area of the overlap of two circles with radii r1, r2 whose centers are d apart. */
function lensArea(r1, r2, d){
  if (d >= r1 + r2) return 0;
  if (d <= Math.abs(r1 - r2)) return Math.PI * Math.min(r1, r2) ** 2;
  const a = r1 * r1 * Math.acos(clamp((d * d + r1 * r1 - r2 * r2) / (2 * d * r1), -1, 1));
  const b = r2 * r2 * Math.acos(clamp((d * d + r2 * r2 - r1 * r1) / (2 * d * r2), -1, 1));
  return a + b - 0.5 * Math.sqrt(Math.max(0, (-d + r1 + r2) * (d + r1 - r2) * (d - r1 + r2) * (d + r1 + r2)));
}
/* Distance between the centers that gives an overlap of the given area. */
function lensDistance(r1, r2, area){
  let lo = Math.abs(r1 - r2), hi = r1 + r2;
  for (let i = 0; i < 60; i++){ const m = (lo + hi) / 2; lensArea(r1, r2, m) > area ? lo = m : hi = m; }
  return (lo + hi) / 2;
}

/* MathML for probabilities of events: P(A), P(A ∩ B), P(A | B)… */
const Ev = {
  A: () => M.i("A"), B: () => M.i("B"),
  P: inner => M.row(M.i("P"), M.paren(inner)),
  and: (a = Ev.A(), b = Ev.B()) => M.row(a, M.o("∩"), b),
  or: (a = Ev.A(), b = Ev.B()) => M.row(a, M.o("∪"), b),
  given: (a, b) => M.row(a, `<mo stretchy="false" lspace="0.25em" rspace="0.25em">|</mo>`, b),
};

function vennPage(cfg){
  const K = k => t(`${cfg.key}.${k}`), cond = cfg.mode === "cond";
  return function VennPage(root){
    const S = cfg.state;

    /* ---------- values ---------- */
    function values(st = S){
      const A = parseProb(st.A), B = parseProb(st.B), AB = parseProb(st.AB);
      let err = null;
      if (A == null || A < 0 || A > 1 || B == null || B < 0 || B > 1 || AB == null || AB < 0) err = "venn.err.range";
      else if (AB > Math.min(A, B) + 1e-12) err = "venn.err.big";
      else if (AB < A + B - 1 - 1e-12) err = "venn.err.small";
      else if (cond && B <= 0) err = "venn.err.zeroB";
      if (err) return { err };
      const U = A + B - AB;
      return { A, B, AB, raw: { A: st.A, B: st.B, AB: st.AB }, U, onlyA: A - AB, onlyB: B - AB, none: 1 - U,
        AgB: B > 0 ? AB / B : NaN, BgA: A > 0 ? AB / A : NaN, indep: Math.abs(AB - A * B) < 1e-9 };
    }

    /* ---------- examples ---------- */
    const src = e => typeof e.source === "function" ? e.source() : e.source;
    const exList = () => cfg.examples.map(e => ({ id: e.id, title: K("ex." + e.id), source: src(e), answer: cfg.answer(values(e.set)) }));
    function loadExample(id){
      const e = cfg.examples.find(x => x.id === id); if (!e) return;
      Object.assign(S, e.set, { example: id });
      update();
    }

    /* ---------- markup ---------- */
    const pLbl = inner => `<math>${Ev.P(inner)}</math>`;
    const field = (k, lbl) => `
      <div class="param">
        <label for="in${k}">${lbl}</label>
        ${numInput("in" + k, 0.01)}
        <input id="r${k}" type="range" min="0" max="1" step="0.01" aria-label="${k}">
      </div>`;
    root.innerHTML = `
    <div class="page venn-page">
      <header class="page-head"><h1>${K("title")}</h1></header>
      <section class="work">
        <div class="plot-col">
          <div class="plot-bar">
            <span class="plot-title">${t("venn.diagram")}</span>
            <div class="bar-actions">
              <button class="btn" id="exclBtn" title="${t("venn.exclTitle")}">${t("venn.excl")}</button>
              <button class="btn" id="indBtn" title="${t("venn.indTitle")}">${t("venn.ind")}</button>
            </div>
          </div>
          <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${t("venn.diagram")}"></canvas></div>
          <div class="legend"><span class="hint">${t("venn.hint")}</span><span class="hint" id="scaleNote"></span></div>
        </div>
        <aside class="controls" aria-label="${t("controls")}">
          <div class="group">
            <h2>${t("venn.probs")}</h2>
            ${field("A", pLbl(Ev.A()))}${field("B", pLbl(Ev.B()))}${field("AB", pLbl(Ev.and()))}
            <p class="note">${t("venn.fracHint")}</p>
            <p class="note err" id="err" hidden></p>
          </div>
          <div class="group result" aria-live="polite">
            <div class="p-big" id="big"></div>
            <div class="p-sub" id="sub"></div>
            <dl class="facts" id="facts"></dl>
          </div>
        </aside>
      </section>
      <section class="formulas" aria-label="${t("formulas")}">
        ${formulasHead()}
        <div id="frows"></div>
        <div id="vars"></div>
      </section>
      ${sectionsHtml({ about: K("about"), notes: cfg.notes.map(K), sources: cfg.sources.map(K) })}
    </div>`;
    const el = id => $("#" + id, root);
    let V = values();

    /* ---------- render ---------- */
    function renderAll(skip){
      for (const k of ["A", "B", "AB"]){
        const inp = el("in" + k);
        if (inp !== skip){ inp.value = probIn(S[k]); inp.removeAttribute("aria-invalid"); }
      }
      el("err").hidden = !V.err; if (V.err) el("err").textContent = t(V.err);
      if (V.err){ board.draw(); return; }
      setSlider(el("rA"), V.A); setSlider(el("rB"), V.B);
      const rAB = el("rAB"); rAB.min = Math.max(0, V.A + V.B - 1); rAB.max = Math.min(V.A, V.B); rAB.step = 0.001; setSlider(rAB, V.AB);
      el("exclBtn").disabled = V.A + V.B > 1 + 1e-12;
      const rows = cfg.formulas(V), box = el("frows");
      box.innerHTML = rows.map((r, i) => `<div class="frow"><span class="flabel">${r.label}</span><div class="fmath" data-row="${i}">${r.chain ? M.math(M.row(r.chain.join(M.o("=")))) : r.html}</div></div>`).join("");
      rows.forEach((r, i) => { if (!r.chain) return; const f = $(`[data-row="${i}"]`, box); if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 2); });
      el("vars").innerHTML = varsTableHtml(cfg.vars(V));
      const res = cfg.result(V);
      el("big").textContent = res.big; el("sub").innerHTML = res.sub;
      el("facts").innerHTML = res.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
      el("rcode").innerHTML = codeHtml([`# ${K("title")}`, ...cfg.r(V)].join("\n"));
      markExample(el("examples"), S.example);
      board.draw();
    }
    function update(skip){ V = values(); renderAll(skip); }

    /* ---------- diagram ---------- */
    let G = null, frozen = null;
    function geometry(b){
      const m = 14, barH = 46, rect = { x: m, y: m, w: b.w - 2 * m, h: b.h - 2 * m - barH };
      const rA = Math.sqrt(V.A / Math.PI), rB = Math.sqrt(V.B / Math.PI);
      const d = frozen?.d ?? lensDistance(rA, rB, V.AB);
      const left = Math.min(-rA, d - rB), right = Math.max(rA, d + rB), tall = 2 * Math.max(rA, rB) || 1;
      const exact = Math.sqrt(rect.w * rect.h);                         // Ω has area 1: true scale
      const fitS = Math.min((rect.w - 60) / ((right - left) || 1), (rect.h - 44) / tall);
      const s = frozen?.s ?? Math.min(exact, fitS);
      const cy = rect.y + rect.h / 2;
      let cxA = rect.x + rect.w / 2 - (left + right) / 2 * s;
      if (frozen?.cxA != null) cxA = frozen.cxA;
      if (frozen?.cxB != null) cxA = frozen.cxB - d * s;
      return { rect, rA, rB, d, s, scaled: s < exact - 1e-6, cy, cxA, cxB: cxA + d * s, RA: rA * s, RB: rB * s, barY: b.h - 24 };
    }
    function draw(b){
      const C = b.colors(), c = b.ctx;
      if (V.err){ b.text(t(V.err), b.w / 2, b.h / 2, { color: C.faint }); return; }
      const g = G = geometry(b), { rect } = g;
      // sample space
      c.fillStyle = cond ? C.grid : C.surface; c.strokeStyle = C.line; c.lineWidth = 1;
      c.beginPath(); c.roundRect(rect.x + .5, rect.y + .5, rect.w, rect.h, 6); c.fill(); c.stroke();
      b.text("Ω", rect.x + 12, rect.y + 14, { align: "left", color: C.muted, size: 14 });
      const circ = (x, r) => { c.beginPath(); c.arc(x, g.cy, Math.max(r, 0.01), 0, Math.PI * 2); };
      if (!cond){
        c.fillStyle = C.fill; circ(g.cxA, g.RA); c.fill(); circ(g.cxB, g.RB); c.fill();   // the overlap gets both fills: counted twice
      } else {
        c.fillStyle = C.surface; circ(g.cxB, g.RB); c.fill();                             // B is the new sample space
        c.save(); circ(g.cxB, g.RB); c.clip(); c.fillStyle = C.accent; c.globalAlpha = .35; circ(g.cxA, g.RA); c.fill(); c.restore();
      }
      c.lineWidth = 2; c.strokeStyle = C.accent;
      c.setLineDash(cond ? [5, 4] : []); circ(g.cxA, g.RA); c.stroke(); c.setLineDash([]);
      c.lineWidth = cond ? 2.5 : 2; circ(g.cxB, g.RB); c.stroke();
      // event names and region values
      const lab = (s, x, y, o) => b.text(s, x, y, { weight: 600, size: 15, color: C.accent, ...o });
      lab("A", g.cxA - g.RA * 0.72, g.cy - g.RA * 0.72 - 6, { align: "right" });
      lab("B", g.cxB + g.RB * 0.72, g.cy - g.RB * 0.72 - 6, { align: "left" });
      const val = (v, x, y, show_ = true) => show_ && b.text(pShow(v), x, y, { size: 12.5, color: C.ink });
      const lensX = g.d > 1e-9 ? g.cxA + (g.d * g.d + g.rA * g.rA - g.rB * g.rB) / (2 * g.d) * g.s : (g.cxA + g.cxB) / 2;
      const contained = g.d <= Math.abs(g.rA - g.rB) + 1e-9;
      if (!contained){
        val(V.onlyA, (g.cxA - g.RA + Math.min(lensX, g.cxB - g.RB)) / 2, g.cy, !cond && V.onlyA > 0 && g.RA > 18);
        val(V.onlyB, (g.cxB + g.RB + Math.max(lensX, g.cxA + g.RA)) / 2, g.cy, V.onlyB > 0 && g.RB > 18);
        val(V.AB, (Math.max(g.cxA - g.RA, g.cxB - g.RB) + Math.min(g.cxA + g.RA, g.cxB + g.RB)) / 2, g.cy, V.AB > 0 && (Math.min(g.cxA + g.RA, g.cxB + g.RB) - Math.max(g.cxA - g.RA, g.cxB - g.RB)) > 46);
      } else if (V.AB > 0){
        const small = g.rA <= g.rB ? g.cxA : g.cxB;
        val(V.AB, small, g.cy, Math.min(g.RA, g.RB) > 16);
      }
      if (!cond) b.text(`${t("venn.neither")} ${pShow(V.none)}`, rect.x + rect.w - 12, rect.y + rect.h - 12, { align: "right", base: "bottom", size: 12, color: C.muted });
      // exact partition bar
      const bx = rect.x, bw = rect.w, by = g.barY, bh = 20;
      const segs = cond
        ? [[V.AgB, C.accent, .35, `A ∩ B`], [1 - V.AgB, C.surface, 1, `B − A`]]
        : [[V.onlyA, C.accent, .16, t("venn.onlyA")], [V.AB, C.accent, .32, "A ∩ B"], [V.onlyB, C.accent, .16, t("venn.onlyB")], [V.none, C.grid, 1, t("venn.none")]];
      b.text(cond ? t("venn.barCond") : t("venn.barUnion"), bx, by - 9, { align: "left", size: 11.5, color: C.muted });
      let x = bx;
      for (const [v, col, a, name] of segs){
        const w = v * bw; if (w <= 0) continue;
        c.save(); c.globalAlpha = a; c.fillStyle = col; c.fillRect(x, by, w, bh); c.restore();
        if (w > 64) b.text(`${name}  ${pShow(v)}`, x + w / 2, by + bh / 2 + .5, { size: 11.5, color: C.ink });
        x += w;
      }
      c.strokeStyle = C.line; c.lineWidth = 1; c.strokeRect(bx + .5, by + .5, bw, bh);
      el("scaleNote").textContent = g.scaled ? t("venn.scaled") : t("venn.toScale");
    }
    const board = new Board(el("plot"), {
      draw,
      hit(x, y){
        if (V.err || !G) return null;
        const inB = Math.hypot(x - G.cxB, y - G.cy) <= G.RB, inA = Math.hypot(x - G.cxA, y - G.cy) <= G.RA;
        if (inB && (!inA || G.RB <= G.RA)) return { k: "B" };
        if (inA) return { k: "A" };
        return inB ? { k: "B" } : null;
      },
      drag(tg, x, y, dx){
        if (tg.d0 == null){ tg.d0 = G.d; frozen = { s: G.s, ...(tg.k === "B" ? { cxA: G.cxA } : { cxB: G.cxB }) }; }
        const lo = Math.abs(G.rA - G.rB), hi = G.rA + G.rB;
        let d = clamp(tg.d0 + (tg.k === "B" ? dx : -dx) / frozen.s, lo, hi);
        let ab = lensArea(G.rA, G.rB, d);
        const abLo = Math.max(0, V.A + V.B - 1);
        if (ab < abLo){ ab = abLo; d = lensDistance(G.rA, G.rB, ab); }
        frozen.d = d;
        S.AB = trim(ab, 4); S.example = null; update();
      },
      end(){ frozen = null; },
    });

    /* ---------- events ---------- */
    bindCopy($(".sections", root));
    for (const k of ["A", "B", "AB"]){
      const inp = el("in" + k), r = el("r" + k);
      inp.addEventListener("input", () => {
        const v = parseProb(inp.value), ok = v != null && v >= 0 && v <= 1;
        inp.setAttribute("aria-invalid", !ok);
        if (ok){ S[k] = inp.value.replace(",", ".").trim(); S.example = null; update(inp); }
      });
      inp.addEventListener("change", () => update());
      r.addEventListener("input", () => {
        S[k] = trim(+r.value, 4); S.example = null;
        // keep P(A ∩ B) possible when P(A) or P(B) moves
        const A = parseProb(S.A), B = parseProb(S.B), AB = parseProb(S.AB);
        if (k !== "AB" && A != null && B != null && AB != null) S.AB = trim(clamp(AB, Math.max(0, A + B - 1), Math.min(A, B)), 4);
        update();
      });
    }
    el("exclBtn").addEventListener("click", () => { S.AB = "0"; S.example = null; update(); });
    el("indBtn").addEventListener("click", () => {
      const A = parseProb(S.A), B = parseProb(S.B); if (A == null || B == null) return;
      S.AB = trim(A * B, 6); S.example = null; update();
    });
    el("examples").innerHTML = examplesHtml(exList(), S.example);
    el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });
    const onTheme = () => board.draw();
    document.addEventListener("themechange", onTheme);
    update();
    return () => { board.destroy(); document.removeEventListener("themechange", onTheme); };
  };
}

/* R code helper: a probability as typed (fractions stay fractions, which R evaluates). */
const rProb = raw => String(raw).replace(",", ".").replace(/\s+/g, "");

/* ---- js/core/cipage.js ---- */
"use strict";
/* ============================================================
   Shared page for confidence intervals: for the mean (z or t) and
   for a proportion (z).

     IC(μ, γ) = x̄ ± z_γ·σ/√n      or   x̄ ± t_γ·s/√n   (gl = n − 1)
     IC(p, γ) = p̂ ± z_γ·√(p̂(1 − p̂)/n)

   The graph shows the sampling distribution centred on the estimate,
   with the central area γ shaded between the limits. Drag the centre to
   move the estimate, or a limit to change the confidence level.
   Sources: Barbetta 7.3.2 and 7.3.3 · Bussab & Morettin 11
   ============================================================ */
function ciPage(cfg){
  const mean = cfg.mode === "mean", K = k => t(`${cfg.key}.${k}`);
  return function CIPage(root){
    const S = cfg.state;

    /* ---------- maths ---------- */
    function compute(st = S){
      const n = st.n, usesT = mean && st.method === "t", df = usesT ? n - 1 : null;
      if (!(n >= 2) || !Number.isInteger(n)) return { err: "ci.err.n" };
      let c, se, pHat;
      if (mean){
        if (!(st.sd > 0)) return { err: "ci.err.sd" };
        c = st.xbar; se = st.sd / Math.sqrt(n);
      } else {
        if (!(st.y >= 0 && st.y <= n && Number.isInteger(st.y))) return { err: "ci.err.y" };
        pHat = st.y / n; c = pHat; se = Math.sqrt(pHat * (1 - pHat) / n);
      }
      const pr = 1 - (1 - st.conf / 100) / 2;
      const exact = usesT ? Num.tInv(pr, df) : Num.PhiInv(pr);
      const crit = st.zTable ? +exact.toFixed(3) : exact, eps = crit * se;
      const ref = st.ref === "" || st.ref == null ? null : parseNum(st.ref);
      return { n, usesT, df, c, se, pHat, crit, eps, lo: c - eps, hi: c + eps, ref,
        refIn: ref == null ? null : ref >= c - eps && ref <= c + eps,
        small: !mean && (n * pHat < 15 || n * (1 - pHat) < 15) };
    }
    const dec = R => clamp(2 - Math.floor(Math.log10(R.eps || 1)), 1, 6);
    const fmtV = (v, R) => show(trim(v, dec(R)));
    const interval = R => `(${fmtV(R.lo, R)}${t("listSep")}${fmtV(R.hi, R)})`;

    /* ---------- symbols ---------- */
    const est = () => mean ? M.bar("x") : M.i("p̂");
    const param = () => mean ? M.i("μ") : M.i("p");
    const critSym = R => M.sub(M.i(R.usesT ? "t" : "z"), M.i("γ"));
    const seSym = R => mean ? M.sub(M.i(R.usesT ? "s" : "σ"), M.bar("x")) : M.sub(M.i("s"), M.i("p̂"));
    const IC = () => M.row(M.text(t("ci.IC")), M.paren(M.row(param(), M.o(","), M.i("γ"))));

    /* ---------- examples ---------- */
    const exState = e => ({ ...S, zTable: true, ref: "", ...e.set });
    const exList = () => cfg.examples.map(e => {
      const R = compute(exState(e));
      return { id: e.id, title: K("ex." + e.id), source: typeof e.source === "function" ? e.source() : e.source,
        answer: `<math>${IC()}<mo>=</mo>${M.paren(M.row(M.n(trim(R.lo, dec(R))), M.o(usesComma() ? ";" : ","), M.n(trim(R.hi, dec(R)))))}</math>` };
    });
    function loadExample(id){
      const e = cfg.examples.find(x => x.id === id); if (!e) return;
      Object.assign(S, exState(e), { example: id });
      update(); fit();
    }

    /* ---------- markup ---------- */
    const sym = s => `<span class="sym">${s}</span>`;
    const fields = mean
      ? [["xbar", `<math>${M.bar("x")}</math>`, K("xbar"), 0.1], ["sd", `<span id="sdSym"></span>`, `<span id="sdLbl"></span>`, 0.1], ["n", "<math><mi>n</mi></math>", t("ci.n"), 1]]
      : [["n", "<math><mi>n</mi></math>", t("ci.n"), 1], ["y", "<math><mi>y</mi></math>", K("y"), 1]];
    root.innerHTML = `
    <div class="page ci-page">
      <header class="page-head"><h1>${K("title")}</h1></header>
      <section class="work">
        <div class="plot-col">
          <div class="plot-bar">
            <span class="plot-title">${mean ? K("graph") : K("graph")}</span>
            <div class="bar-actions"><button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button></div>
          </div>
          <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${K("graph")}"></canvas></div>
          <div class="legend"><span class="hint">${t("ci.hint")}</span></div>
        </div>
        <aside class="controls" aria-label="${t("controls")}">
          ${mean ? `<div class="group">
            <h2>${K("method")}</h2>
            <div class="seg full" role="group" id="methodSeg">
              <button data-m="z" aria-pressed="false">${K("method.z")}</button>
              <button data-m="t" aria-pressed="false">${K("method.t")}</button>
            </div>
            <p class="note seg-note" id="methodNote"></p>
          </div>` : ""}
          <div class="group">
            <h2>${t("ci.sample")}</h2>
            ${fields.map(([k, s, l, st]) => `<div class="param"><label for="f-${k}">${sym(s)}${l}</label>${numInput("f-" + k, st)}</div>`).join("")}
            <p class="note err" id="err" hidden></p>
            <p class="note warn" id="warn" hidden>${t("ci.small")}</p>
          </div>
          <div class="group">
            <h2>${t("ss.confidence")}</h2>
            <div class="param"><label for="f-conf">${sym("γ")}${t("ss.level")} <span class="unit">(%)</span></label>${numInput("f-conf", 1)}</div>
            <div class="presets" role="group">${[90, 95, 99].map(v => `<button class="btn" data-conf="${v}" aria-pressed="false">${v}%</button>`).join("")}</div>
            <div class="zline" id="critLine"></div>
            <label class="check"><input type="checkbox" id="zTable">${t("ci.table")}</label>
          </div>
          <div class="group">
            <h2>${t("ci.compare")}</h2>
            <div class="param"><label for="f-ref">${sym(mean ? "μ₀" : "p₀")}${t("ci.ref")}</label>${numInput("f-ref", mean ? 0.1 : 0.01, `placeholder="—"`)}</div>
          </div>
          <div class="group result" aria-live="polite">
            <div class="p-big ci-big" id="big"></div>
            <div class="p-sub" id="sub"></div>
            <dl class="facts" id="facts"></dl>
          </div>
        </aside>
      </section>
      <section class="formulas" aria-label="${t("formulas")}">
        ${formulasHead()}
        <div id="frows"></div>
        <div id="vars"></div>
      </section>
      ${sectionsHtml({ about: K("about"), notes: cfg.notes.map(K), sources: cfg.sources.map(K) })}
    </div>`;
    const el = id => $("#" + id, root);
    let R = compute();

    /* ---------- render ---------- */
    function renderFormulas(){
      const n4 = v => M.v(trim(v, 4)), num = v => M.v(trim(v, 6)), r4 = v => M.r(trim(v, 4)), cs = M.v(trim(R.crit, S.zTable ? 3 : 5));   // values blue, results bold
      const sq = M.sqrt(M.i("n")), rows = [];
      if (!mean) rows.push({ label: K("f.phat"), chain: [M.i("p̂"), M.frac(M.i("y"), M.i("n")), M.frac(num(S.y), num(S.n)), r4(R.pHat)] });
      rows.push({ label: t("ci.f.se"), chain: mean
        ? [seSym(R), M.frac(M.i(R.usesT ? "s" : "σ"), sq), M.frac(num(S.sd), M.sqrt(num(S.n))), r4(R.se)]
        : [seSym(R), M.sqrt(M.frac(M.row(M.i("p̂"), M.paren(M.row(M.n(1), M.o(MINUS), M.i("p̂")))), M.i("n"))),
           M.sqrt(M.frac(M.row(n4(R.pHat), M.o("·"), n4(1 - R.pHat)), num(S.n))), r4(R.se)] });
      const pm = M.o("±");
      rows.push({ label: t("ci.f.ci"), chain: [IC(), M.row(est(), pm, critSym(R), M.o("·"), seSym(R)),
        M.row(n4(R.c), pm, cs, M.o("·"), n4(R.se)), M.row(n4(R.c), pm, r4(R.eps))] });
      rows.push({ label: t("ci.f.limits"), html: M.math(M.row(
        M.paren(M.row(est(), M.o(MINUS), M.i("ε"), M.o(usesComma() ? ";" : ","), est(), M.o("+"), M.i("ε"))), M.o("="),
        M.paren(M.row(M.r(trim(R.lo, dec(R))), M.o(usesComma() ? ";" : ","), M.r(trim(R.hi, dec(R)))))))
        + (R.usesT ? M.math(M.row(critSym(R), M.t(t("ss.withDf")), M.text(t("dfAbbr")), M.o("="), M.i("n"), M.o(MINUS), M.n(1), M.o("="), M.n(String(R.df))), "res") : "") });
      const box = el("frows");
      box.innerHTML = rows.map((r, i) => `<div class="frow"><span class="flabel">${r.label}</span><div class="fmath" data-row="${i}">${r.chain ? M.math(M.row(r.chain.join(M.o("=")))) : r.html}</div></div>`).join("");
      rows.forEach((r, i) => { if (!r.chain) return; const f = $(`[data-row="${i}"]`, box); if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 2); });
      const vars = [[IC(), K("sym.ic"), interval(R)], [est(), K("sym.est"), show(trim(R.c, 6))]];
      if (mean) vars.push(R.usesT ? [M.i("s"), K("sym.s"), show(trim(S.sd, 6))] : [M.i("σ"), K("sym.sigma"), show(trim(S.sd, 6))]);
      else vars.push([M.i("y"), K("sym.y"), String(S.y)]);
      vars.push([M.i("n"), t("ci.sym.n"), String(S.n)], [seSym(R), t("ci.sym.se"), show(trim(R.se, 6))],
        [M.i("γ"), t("ss.sym.gamma"), show(trim(S.conf, 2)) + "%"],
        [critSym(R), R.usesT ? t("ss.sym.t") : t("ss.sym.z"), show(trim(R.crit, S.zTable ? 3 : 5))]);
      if (R.usesT) vars.push([M.text(t("dfAbbr")), t("ss.sym.df"), String(R.df)]);
      vars.push([M.i("ε"), t("ci.sym.eps"), show(trim(R.eps, 6))]);
      el("vars").innerHTML = varsTableHtml(vars);
    }
    function renderResult(){
      el("big").textContent = interval(R);
      el("sub").innerHTML = `<math>${IC()}</math> · ${show(trim(S.conf, 2))}%`;
      const facts = [[t("ci.fact.est"), show(trim(R.c, 6))], [t("ci.fact.eps"), "± " + show(trim(R.eps, dec(R) + 1))],
        [t("ci.fact.se"), show(trim(R.se, 6))], [t("ci.fact.crit", { c: R.usesT ? "t" : "z" }), show(trim(R.crit, S.zTable ? 3 : 5)) + (R.usesT ? ` (${t("dfAbbr")} = ${R.df})` : "")]];
      if (R.ref != null) facts.push([t("ci.fact.ref", { r: show(trim(R.ref, 6)) }), R.refIn ? t("ci.inside") : t("ci.outside")]);
      el("facts").innerHTML = facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    }
    function renderR(){
      const conf = trim(S.conf / 100, 4), q = `1 - (1 - ${conf}) / 2`, L = [`# ${K("title")}`];
      if (mean){
        L.push(rLine(`xbar <- ${trim(S.xbar, 6)}`, K("xbar")), rLine(`${R.usesT ? "s" : "sigma"} <- ${trim(S.sd, 6)}`, R.usesT ? K("sym.s") : K("sym.sigma")), rLine(`n <- ${S.n}`, t("ci.sym.n")));
        const c = R.usesT ? `qt(${q}, df = n - 1)` : `qnorm(${q})`;
        L.push(rLine(`${R.usesT ? "t" : "z"} <- ${c}`, S.zTable ? `${t("ss.r.table")}: ${trim(R.crit, 3)}` : ""));
        L.push(rLine(`e <- ${R.usesT ? "t * s" : "z * sigma"} / sqrt(n)`, `${t("ci.fact.eps")}: ${trim(R.eps, 4)}`));
        L.push(rLine("c(xbar - e, xbar + e)", interval(R).replace(/[()]/g, "")));
        if (R.usesT) L.push(`# ${t("ci.r.ttest")}`);
      } else {
        L.push(rLine(`y <- ${S.y}; n <- ${S.n}`, `${K("y")}, ${t("ci.sym.n")}`), rLine("p <- y / n", `p̂: ${trim(R.pHat, 4)}`),
          rLine(`z <- qnorm(${q})`, S.zTable ? `${t("ss.r.table")}: ${trim(R.crit, 3)}` : ""),
          rLine("e <- z * sqrt(p * (1 - p) / n)", `${t("ci.fact.eps")}: ${trim(R.eps, 4)}`),
          rLine("c(p - e, p + e)", interval(R).replace(/[()]/g, "")));
      }
      el("rcode").innerHTML = codeHtml(L.join("\n"));
    }
    function syncInputs(skip){
      const set = (id, v, d = 6) => { const i = el(id); if (i && i !== skip) i.value = v === "" ? "" : fmtIn(v, d); };
      if (mean){ set("f-xbar", S.xbar); set("f-sd", S.sd); }
      set("f-n", S.n, 0); if (!mean) set("f-y", S.y, 0);
      set("f-conf", S.conf, 2); if (el("f-ref") !== skip) el("f-ref").value = S.ref === "" ? "" : loc(S.ref);
      el("zTable").checked = S.zTable;
      $$(".presets .btn", root).forEach(b => b.setAttribute("aria-pressed", +b.dataset.conf === S.conf));
      if (mean){
        $$("#methodSeg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.m === S.method));
        el("sdSym").textContent = S.method === "t" ? "s" : "σ";
        el("sdLbl").textContent = S.method === "t" ? K("sdS") : K("sdSigma");
        el("methodNote").textContent = K("note." + S.method);
      }
    }
    function update(skip){
      R = compute();
      syncInputs(skip);
      el("err").hidden = !R.err; if (R.err){ el("err").textContent = t(R.err); plot.draw(); return; }
      el("warn").hidden = !R.small;
      el("critLine").innerHTML = M.math(M.row(critSym(R), M.o("="), M.n(trim(R.crit, S.zTable ? 3 : 5)), ...(R.usesT ? [M.t(`(${t("dfAbbr")} = ${R.df})`)] : [])));
      renderFormulas(); renderResult(); renderR();
      markExample(el("examples"), S.example);
      plot.draw();
    }

    /* ---------- graph ---------- */
    const dens = x => { const u = (x - R.c) / R.se; return (R.usesT ? Num.tPdf(u, R.df) : Num.normPdf(u)) / R.se; };
    function fit(){
      if (R.err) return;
      const w = Math.max(4.2 * R.se, R.eps * 1.6), xs = [R.c - w, R.c + w];
      if (R.ref != null) xs.push(R.ref - 0.6 * R.se, R.ref + 0.6 * R.se);
      plot.x0 = Math.min(...xs); plot.x1 = Math.max(...xs);
      if (!mean){ plot.x0 = Math.max(plot.x0, -0.02); plot.x1 = Math.min(plot.x1, 1.02); }
      plot.draw();
    }
    function drawPlot(p){
      const C = p.colors(), c = p.ctx;
      if (R.err){ p.grid(C); return; }
      p.y0 = 0; p.y1 = dens(R.c) * 1.32;
      p.grid(C, { yFmt: () => "" });
      p.area(dens, R.lo, R.hi, C.fill);
      p.curve(dens, { color: C.accent, width: 2.2 });
      // the interval as a bracket near the axis
      const yb = p.Y(0) - 14, xl = p.X(R.lo), xr = p.X(R.hi);
      c.save(); c.strokeStyle = C.accent; c.lineWidth = 2.5; c.beginPath();
      c.moveTo(xl, yb - 7); c.lineTo(xl, yb + 7); c.moveTo(xl, yb); c.lineTo(xr, yb); c.moveTo(xr, yb - 7); c.lineTo(xr, yb + 7); c.stroke(); c.restore();
      c.font = `600 12px ${C.font}`; c.textAlign = "center"; c.textBaseline = "bottom"; c.lineJoin = "round";
      const gx = (xl + xr) / 2, gy = p.Y(dens(R.c) * 0.42), gt = `γ = ${show(trim(S.conf, 2))}%`;
      c.strokeStyle = C.surface; c.lineWidth = 4; c.strokeText(gt, gx, gy); c.fillStyle = C.accent; c.fillText(gt, gx, gy);
      for (const x of [R.lo, R.hi]) p.vline(x, C.accent, [4, 3], dens(x), 1.2);
      p.vline(R.c, C.accent, [], dens(R.c), 1.5);
      if (R.ref != null && R.ref >= p.x0 && R.ref <= p.x1){
        p.vline(R.ref, R.refIn ? C.muted : cssVar("--danger"), [6, 4], p.y1, 1.6);
        c.font = `600 12px ${C.font}`; c.fillStyle = R.refIn ? C.muted : cssVar("--danger"); c.textAlign = "left"; c.textBaseline = "top";
        c.fillText(`${mean ? "μ₀" : "p₀"} = ${show(trim(R.ref, 4))}`, p.X(R.ref) + 5, p.pad.t + 30);
      }
      const center = `${mean ? "x̄" : "p̂"} = ${show(trim(R.c, 4))}`;
      p.pill(p.X(R.c), 6, center, C, true);
      const close = xr - xl < 150, shift = close ? (150 - (xr - xl)) / 2 : 0;
      p.pill(xl - shift, 30, show(trim(R.lo, dec(R))), C, false);
      p.pill(xr + shift, 30, show(trim(R.hi, dec(R))), C, false);
    }
    const plot = new Plot(el("plot"), {
      draw: drawPlot,
      handles: () => R.err ? [] : [{ key: "c", x: R.c }, { key: "lo", x: R.lo }, { key: "hi", x: R.hi }],
      onFit: fit,
      onHandle(key, x){
        S.example = null;
        if (key === "c"){
          if (mean){ const d = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 200)); S.xbar = +x.toFixed(d); }
          else S.y = clamp(Math.round(x * S.n), 0, S.n);
        } else {
          const k = Math.abs(x - R.c) / R.se, cdf = R.usesT ? Num.tCdf(k, R.df) : Num.Phi(k);
          S.conf = clamp(Math.round((2 * cdf - 1) * 1000) / 10, 50, 99.9);
        }
        update();
      },
    });

    /* ---------- events ---------- */
    bindNudge(root); bindCopy($(".sections", root));
    const field = (id, key, ok, int = false, after) => {
      const inp = el(id);
      inp.addEventListener("input", () => {
        const v = parseNum(inp.value), good = v != null && (!int || Number.isInteger(v)) && ok(v);
        inp.setAttribute("aria-invalid", !good);
        if (good){ S[key] = v; S.example = null; update(inp); }
      });
      inp.addEventListener("change", () => { inp.removeAttribute("aria-invalid"); update(); after?.(); });
    };
    if (mean){ field("f-xbar", "xbar", () => true, false, fit); field("f-sd", "sd", v => v > 0, false, fit); }
    field("f-n", "n", v => v >= 2, true, fit);
    if (!mean) field("f-y", "y", v => v >= 0, true, fit);
    field("f-conf", "conf", v => v >= 50 && v < 100);
    el("f-ref").addEventListener("input", () => {
      const raw = el("f-ref").value.trim(), v = parseNum(raw);
      el("f-ref").setAttribute("aria-invalid", raw !== "" && v == null);
      if (raw === "" || v != null){ S.ref = raw === "" ? "" : String(v); S.example = null; update(el("f-ref")); }
    });
    el("f-ref").addEventListener("change", fit);
    $$(".presets .btn", root).forEach(b => b.addEventListener("click", () => { S.conf = +b.dataset.conf; S.example = null; update(); }));
    el("zTable").addEventListener("change", e => { S.zTable = e.target.checked; S.example = null; update(); });
    if (mean) $$("#methodSeg button", root).forEach(b => b.addEventListener("click", () => { S.method = b.dataset.m; S.example = null; update(); }));
    el("fitBtn").addEventListener("click", fit);
    el("examples").innerHTML = examplesHtml(exList(), S.example);
    el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });
    const onTheme = () => plot.draw();
    document.addEventListener("themechange", onTheme);
    if (S.range) [plot.x0, plot.x1] = S.range;
    update(); if (!S.range) fit();
    return () => { S.range = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
  };
}

/* ---- js/core/testpage.js ---- */
"use strict";
/* ============================================================
   Shared page for hypothesis tests on one mean (z or t) and on one
   proportion (z, with the continuity correction).

     z = (x̄ − μ₀)·√n / σ      t = (x̄ − μ₀)·√n / s   (gl = n − 1)
     z = (y′ − n·p₀) / √(n·p₀(1 − p₀)),  y′ = y ∓ 0.5

   The graph is the distribution of the statistic when H₀ is true: the
   rejection region (area α) and the p-value area beyond the observed
   statistic. Drag the statistic to see the decision change.
   Sources: Barbetta 8.4 to 8.8 · Bussab & Morettin 12
   ============================================================ */
function testPage(cfg){
  const mean = cfg.mode === "mean", K = k => t(`${cfg.key}.${k}`);
  return function TestPage(root){
    const S = cfg.state;

    /* ---------- maths ---------- */
    function compute(st = S){
      const n = st.n, usesT = mean && st.method === "t", df = usesT ? n - 1 : null, a = st.alpha / 100;
      if (!(n >= 2) || !Number.isInteger(n)) return { err: "ci.err.n" };
      if (!(a > 0 && a < 0.5)) return { err: "test.err.alpha" };
      let stat, yAdj, pHat, conds;
      if (mean){
        if (!(st.sd > 0)) return { err: "ci.err.sd" };
        stat = (st.xbar - st.mu0) * Math.sqrt(n) / st.sd;
      } else {
        if (!(st.y >= 0 && st.y <= n && Number.isInteger(st.y))) return { err: "ci.err.y" };
        if (!(st.p0 > 0 && st.p0 < 1)) return { err: "test.err.p0" };
        const np = n * st.p0;
        yAdj = !st.cc || st.y === np ? st.y : st.y > np ? st.y - 0.5 : st.y + 0.5;
        stat = (yAdj - np) / Math.sqrt(np * (1 - st.p0));
        pHat = st.y / n; conds = [np, n * (1 - st.p0)];
      }
      const table = st.zTable && !usesT;
      const s = table ? Math.round(stat * 100) / 100 : stat;
      const upper = v => usesT ? 1 - Num.tCdf(v, df) : 1 - Num.Phi(v);
      let tail = upper(Math.abs(s)); if (table) tail = Math.round(tail * 1e4) / 1e4;
      const p = st.h1 === "ne" ? Math.min(1, 2 * tail) : (st.h1 === "gt" ? s >= 0 : s <= 0) ? tail : 1 - tail;
      const q = st.h1 === "ne" ? 1 - a / 2 : 1 - a;
      let crit = usesT ? Num.tInv(q, df) : Num.PhiInv(q); if (st.zTable) crit = +crit.toFixed(3);
      const reject = p < a;
      return { n, usesT, df, a, stat, s, table, tail, p, crit, reject, yAdj, pHat, conds, small: conds && (conds[0] <= 5 || conds[1] <= 5) };
    }

    /* ---------- symbols ---------- */
    const P_ = mean ? M.i("μ") : M.i("p"), p0 = mean ? M.sub(M.i("μ"), M.n(0)) : M.sub(M.i("p"), M.n(0));
    const sSym = R => M.i(R.usesT ? "t" : "z"), cSym = R => M.sub(M.i(R.usesT ? "t" : "z"), M.i("c"));
    const relSym = { ne: "≠", gt: ">", lt: "<" };
    const H = (k, rel) => M.row(M.sub(M.i("H"), M.n(k)), M.o(":"), P_, M.o(rel), M.v(trim(mean ? S.mu0 : S.p0, 6)));
    const decision = R => R.reject ? t("test.reject") : t("test.accept");

    /* ---------- examples ---------- */
    const exState = e => ({ ...S, zTable: true, cc: true, ...e.set });
    const exList = () => cfg.examples.map(e => {
      const st = exState(e), R = compute(st);
      return { id: e.id, title: K("ex." + e.id), source: typeof e.source === "function" ? e.source() : e.source,
        answer: `<math>${sSym(R)}<mo>=</mo>${M.n(trim(R.s, R.table ? 2 : 3))}<mo separator="true">;</mo><mspace width="0.4em"></mspace><mi>p</mi><mo>=</mo>${M.prob(R.p)}</math> · ${decision(R)}` };
    });
    function loadExample(id){
      const e = cfg.examples.find(x => x.id === id); if (!e) return;
      Object.assign(S, exState(e), { example: id }); update(); fit();
    }

    /* ---------- markup ---------- */
    const sym = s => `<span class="sym">${s}</span>`;
    const fields = mean
      ? [["mu0", `<math>${p0}</math>`, K("mu0"), 0.1], ["xbar", `<math>${M.bar("x")}</math>`, t("ci-mean.xbar"), 0.1], ["sd", `<span id="sdSym"></span>`, `<span id="sdLbl"></span>`, 0.1], ["n", "<math><mi>n</mi></math>", t("ci.n"), 1]]
      : [["p0", `<math>${p0}</math>`, K("p0"), 0.01], ["n", "<math><mi>n</mi></math>", t("ci.n"), 1], ["y", "<math><mi>y</mi></math>", t("ci-prop.y"), 1]];
    root.innerHTML = `
    <div class="page test-page">
      <header class="page-head"><h1>${K("title")}</h1></header>
      <section class="work">
        <div class="plot-col">
          <div class="plot-bar"><span class="plot-title" id="graphTitle"></span>
            <div class="bar-actions"><button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button></div></div>
          <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${K("title")}"></canvas></div>
          <div class="legend"><div class="chips"><span class="chip rej"><span class="sw"></span>${t("test.lgReject")}</span><span class="chip pval"><span class="sw"></span>${t("test.lgP")}</span></div><span class="hint">${t("test.hint")}</span></div>
        </div>
        <aside class="controls" aria-label="${t("controls")}">
          <div class="group">
            <h2>${t("test.h1")}</h2>
            <div class="seg full" role="group" id="h1Seg">${["lt", "ne", "gt"].map(h => `<button data-h="${h}" aria-pressed="false"><math>${P_}<mo>${relSym[h]}</mo>${p0}</math></button>`).join("")}</div>
            <p class="note seg-note" id="h1Note"></p>
          </div>
          ${mean ? `<div class="group">
            <h2>${t("ci-mean.method")}</h2>
            <div class="seg full" role="group" id="methodSeg">
              <button data-m="z" aria-pressed="false">${t("test.method.z")}</button>
              <button data-m="t" aria-pressed="false">${t("test.method.t")}</button>
            </div>
          </div>` : ""}
          <div class="group">
            <h2>${t("test.data")}</h2>
            ${fields.map(([k, s, l, st]) => `<div class="param"><label for="f-${k}">${sym(s)}${l}</label>${numInput("f-" + k, st)}</div>`).join("")}
            ${mean ? "" : `<label class="check"><input type="checkbox" id="cc">${K("cc")}</label>`}
            <p class="note err" id="err" hidden></p>
            <p class="note warn" id="warn" hidden></p>
          </div>
          <div class="group">
            <h2>${t("test.alpha")}</h2>
            <div class="param"><label for="f-alpha">${sym("α")}${t("test.alphaLbl")} <span class="unit">(%)</span></label>${numInput("f-alpha", 1)}</div>
            <div class="presets" role="group">${[1, 5, 10].map(v => `<button class="btn" data-alpha="${v}" aria-pressed="false">${v}%</button>`).join("")}</div>
            <label class="check"><input type="checkbox" id="zTable"><span id="tableLbl"></span></label>
          </div>
          <div class="group result" aria-live="polite">
            <div class="p-big test-big" id="big"></div>
            <div class="p-sub" id="sub"></div>
            <dl class="facts" id="facts"></dl>
          </div>
        </aside>
      </section>
      <section class="formulas" aria-label="${t("formulas")}">
        ${formulasHead()}
        <div id="frows"></div>
        <div id="vars"></div>
      </section>
      ${sectionsHtml({ about: K("about"), notes: [...cfg.notes.map(K), t("test.note.accept")], sources: cfg.sources.map(K) })}
    </div>`;
    const el = id => $("#" + id, root);
    let R = compute();

    /* ---------- render ---------- */
    function renderFormulas(){
      // values from the controls in blue, results in bold
      const n4 = v => M.n(trim(v, 4)), num = v => M.v(trim(v, 6)), r4 = v => M.r(trim(v, 4)), sq = v => M.sqrt(v), rows = [];
      rows.push({ label: t("test.f.hyp"), html: M.math(M.row(H(0, "="), M.t(""), H(1, relSym[S.h1]))) });
      if (mean){
        const sd = M.i(R.usesT ? "s" : "σ");
        rows.push({ label: t("test.f.stat"), chain: [sSym(R),
          M.frac(M.row(M.paren(M.row(M.bar("x"), M.o(MINUS), p0)), M.o("·"), sq(M.i("n"))), sd),
          M.frac(M.row(M.paren(M.row(num(S.xbar), M.o(MINUS), nv(S.mu0))), M.o("·"), sq(num(S.n))), num(S.sd)),
          R.table ? n4(R.stat) : r4(R.stat), ...(R.table ? [`<mo>≈</mo>${M.r(trim(R.s, 2))}`] : [])] });
      } else {
        const np = S.n * S.p0;
        rows.push({ label: K("f.sample"), html: M.math(M.row(M.i("p̂"), M.o("="), M.frac(M.i("y"), M.i("n")), M.o("="), M.frac(num(S.y), num(S.n)), M.o("="), r4(R.pHat))) +
          M.math(M.row(M.i("n"), M.sub(M.i("p"), M.n(0)), M.o("="), n4(np), M.o(","), M.t(""), M.i("n"), M.paren(M.row(M.n(1), M.o(MINUS), M.sub(M.i("p"), M.n(0)))), M.o("="), n4(S.n - np)), "res") });
        if (S.cc && R.yAdj !== S.y) rows.push({ label: K("f.cc"), chain: [M.i("y′"), M.row(M.i("y"), M.o(R.yAdj < S.y ? MINUS : "+"), M.n("0.5")), M.row(num(S.y), M.o(R.yAdj < S.y ? MINUS : "+"), M.n("0.5")), M.r(trim(R.yAdj, 6))] });
        const yy = S.cc ? M.i("y′") : M.i("y");
        rows.push({ label: t("test.f.stat"), chain: [M.i("z"),
          M.frac(M.row(yy, M.o(MINUS), M.i("n"), M.sub(M.i("p"), M.n(0))), sq(M.row(M.i("n"), M.sub(M.i("p"), M.n(0)), M.paren(M.row(M.n(1), M.o(MINUS), M.sub(M.i("p"), M.n(0))))))),
          M.frac(M.row(num(R.yAdj), M.o(MINUS), num(S.n), M.o("·"), num(S.p0)), sq(M.row(num(S.n), M.o("·"), num(S.p0), M.o("·"), M.v(trim(1 - S.p0, 4))))),
          R.table ? n4(R.stat) : r4(R.stat), ...(R.table ? [`<mo>≈</mo>${M.r(trim(R.s, 2))}`] : [])] });
      }
      // p-value
      const Z = R.usesT ? M.i("T") : M.i("Z"), absS = M.v(trim(Math.abs(R.s), R.table ? 2 : 4));
      const tailP = M.row(M.i("P"), M.paren(M.row(Z, M.o(">"), absS)));
      const pChain = S.h1 === "ne" ? [M.i("p"), M.row(M.n(2), M.o("·"), tailP), M.row(M.n(2), M.o("·"), n4(R.tail)), M.rprob(R.p)]
        : [M.i("p"), M.row(M.i("P"), M.paren(M.row(Z, M.o(S.h1 === "gt" ? ">" : "<"), M.v(trim(R.s, R.table ? 2 : 4))))), M.rprob(R.p)];
      rows.push({ label: t("test.f.p"), html: M.math(M.row(pChain.join(M.o("=")))) +
        M.math(M.row(M.i("p"), M.o(R.reject ? "<" : "≥"), M.i("α"), M.o("="), M.v(trim(R.a, 4)), M.o("⇒"), M.text(decision(R))), "res") });
      const critM = S.h1 === "ne" ? M.row(M.o("±"), M.r(trim(R.crit, 3))) : M.r(trim(S.h1 === "lt" ? -R.crit : R.crit, 3));
      rows.push({ label: t("test.f.crit"), html: M.math(M.row(cSym(R), M.o("="), critM, ...(R.usesT ? [M.t(`(${t("dfAbbr")} = ${R.df})`)] : []))) +
        `<p class="fnote">${R.reject ? t("test.inReject") : t("test.inAccept")}</p>` });
      const box = el("frows");
      box.innerHTML = rows.map((r, i) => `<div class="frow"><span class="flabel">${r.label}</span><div class="fmath" data-row="${i}">${r.chain ? M.math(M.row(r.chain.join(M.o("=")).replace(/<mo>=<\/mo><mo>≈<\/mo>/g, "<mo>≈</mo>"))) : r.html}</div></div>`).join("");
      rows.forEach((r, i) => { if (!r.chain) return; const f = $(`[data-row="${i}"]`, box); if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 2).replace(/<mo>=<\/mo><mo>≈<\/mo>/g, "<mo>≈</mo>"); });
      const vars = [[sSym(R), R.usesT ? t("test.sym.t") : t("test.sym.z"), show(trim(R.s, R.table ? 2 : 4))], [p0, K("sym.h0"), show(trim(mean ? S.mu0 : S.p0, 6))]];
      if (mean) vars.push([M.bar("x"), t("ci-mean.sym.est"), show(trim(S.xbar, 6))], R.usesT ? [M.i("s"), t("ci-mean.sym.s"), show(trim(S.sd, 6))] : [M.i("σ"), t("ci-mean.sym.sigma"), show(trim(S.sd, 6))]);
      else vars.push([M.i("y"), t("ci-prop.sym.y"), String(S.y)], [M.i("p̂"), t("ci-prop.sym.est"), show(trim(R.pHat, 4))]);
      vars.push([M.i("n"), t("ci.sym.n"), String(S.n)], [M.i("α"), t("test.sym.alpha"), show(trim(R.a, 4))], [M.i("p"), t("test.sym.p"), show(trim(R.p, 4))],
        [cSym(R), t("test.sym.crit"), show(trim(R.crit, 3))]);
      if (R.usesT) vars.push([M.text(t("dfAbbr")), t("ss.sym.df"), String(R.df)]);
      el("vars").innerHTML = varsTableHtml(vars);
    }
    function renderResult(){
      el("big").textContent = decision(R);
      el("big").classList.toggle("rej", R.reject);
      el("sub").innerHTML = R.reject ? t("test.subReject", { a: show(trim(S.alpha, 2)) }) : t("test.subAccept", { a: show(trim(S.alpha, 2)) });
      el("facts").innerHTML = [[t("test.fact.stat", { s: R.usesT ? "t" : "z" }), show(trim(R.s, R.table ? 2 : 4))], [t("test.fact.p"), show(fmtProb(R.p))],
        [t("test.fact.crit"), (S.h1 === "ne" ? "± " : "") + show(trim(S.h1 === "lt" ? -R.crit : R.crit, 3))], ...(R.usesT ? [[t("ss.dfRow"), String(R.df)]] : [])]
        .map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    }
    function renderR(){
      const L = [`# ${K("title")}`], alt = { ne: "two.sided", gt: "greater", lt: "less" }[S.h1];
      if (mean){
        L.push(rLine(`xbar <- ${trim(S.xbar, 6)}; mu0 <- ${trim(S.mu0, 6)}`, ""), rLine(`${R.usesT ? "s" : "sigma"} <- ${trim(S.sd, 6)}; n <- ${S.n}`, ""));
        L.push(rLine(`${R.usesT ? "t" : "z"} <- (xbar - mu0) * sqrt(n) / ${R.usesT ? "s" : "sigma"}`, `${t("test.f.stat")}: ${trim(R.stat, 4)}`, 40));
        const tailF = v => R.usesT ? `pt(${v}, df = n - 1${S.h1 === "gt" || (S.h1 === "ne") ? ", lower.tail = FALSE" : ""})` : `pnorm(${v}${S.h1 === "gt" || S.h1 === "ne" ? ", lower.tail = FALSE" : ""})`;
        const v = R.usesT ? "t" : "z";
        L.push(rLine(S.h1 === "ne" ? `2 * ${tailF(`abs(${v})`)}` : tailF(v), `p: ${fmtProb(R.p)}`, 40));
        if (R.usesT) L.push(`# ${t("test.r.ttest", { alt })}`);
      } else {
        L.push(rLine(`y <- ${S.y}; n <- ${S.n}; p0 <- ${trim(S.p0, 6)}`, ""));
        L.push(rLine(`prop.test(y, n, p = p0, alternative = "${alt}", correct = ${S.cc ? "TRUE" : "FALSE"})`, `p: ${fmtProb(R.p)}`, 40));
        L.push(`# ${t("test.r.prop")}`);
      }
      el("rcode").innerHTML = codeHtml(L.join("\n"));
    }
    function syncInputs(skip){
      const set = (id, v, d = 6) => { const i = el(id); if (i && i !== skip) i.value = fmtIn(v, d); };
      if (mean){ set("f-mu0", S.mu0); set("f-xbar", S.xbar); set("f-sd", S.sd); }
      else { set("f-p0", S.p0); set("f-y", S.y, 0); el("cc").checked = S.cc; }
      set("f-n", S.n, 0); set("f-alpha", S.alpha, 2);
      el("zTable").checked = S.zTable;
      el("tableLbl").textContent = mean && S.method === "t" ? t("test.tableT") : t("test.tableZ");
      $$(".presets .btn", root).forEach(b => b.setAttribute("aria-pressed", +b.dataset.alpha === S.alpha));
      $$("#h1Seg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.h === S.h1));
      el("h1Note").textContent = t("test.h1." + S.h1);
      if (mean){
        $$("#methodSeg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.m === S.method));
        el("sdSym").textContent = S.method === "t" ? "s" : "σ";
        el("sdLbl").textContent = S.method === "t" ? t("ci-mean.sdS") : t("ci-mean.sdSigma");
      }
      el("graphTitle").textContent = mean && S.method === "t" ? t("test.graphT") : t("test.graphZ");
    }
    function update(skip){
      R = compute(); syncInputs(skip);
      el("err").hidden = !R.err; if (R.err){ el("err").textContent = t(R.err); plot.draw(); return; }
      const w = el("warn"); w.hidden = !R.small;
      if (R.small) w.textContent = t("test.small");
      renderFormulas(); renderResult(); renderR();
      markExample(el("examples"), S.example);
      plot.draw();
    }

    /* ---------- graph ---------- */
    const dens = x => R.usesT ? Num.tPdf(x, R.df) : Num.normPdf(x);
    function fit(){
      if (R.err) return;
      const m = Math.max(4, Math.abs(R.s) + 0.8, R.crit + 0.8);
      plot.x0 = -m; plot.x1 = m; plot.draw();
    }
    function drawPlot(p){
      const C = p.colors(), c = p.ctx, danger = cssVar("--danger");
      if (R.err){ p.grid(C); return; }
      p.y0 = 0; p.y1 = dens(0) * 1.32;
      p.grid(C, { yFmt: () => "" });
      // rejection region(s)
      const regs = S.h1 === "ne" ? [[-Infinity, -R.crit], [R.crit, Infinity]] : S.h1 === "gt" ? [[R.crit, Infinity]] : [[-Infinity, -R.crit]];
      c.save(); c.globalAlpha = .28;
      for (const [u, v] of regs) p.area(dens, Math.max(u, p.x0), Math.min(v, p.x1), danger);
      c.restore();
      // p-value area beyond the observed statistic
      const s = R.s, a = Math.abs(s);
      const pregs = S.h1 === "ne" ? [[-Infinity, -a], [a, Infinity]] : S.h1 === "gt" ? [[s, Infinity]] : [[-Infinity, s]];
      for (const [u, v] of pregs) p.area(dens, Math.max(u, p.x0), Math.min(v, p.x1), C.fill);
      p.curve(dens, { color: C.ink, width: 1.8 });
      for (const [u, v] of regs){ const x = isFinite(u) ? u : v; p.vline(x, danger, [4, 3], dens(x) * 1.6, 1.3); }
      // region names, as in the book's figures
      c.font = `11.5px ${C.font}`; c.textBaseline = "top";
      const yT = p.pad.t + 6, acc = S.h1 === "ne" ? 0 : S.h1 === "gt" ? (p.x0 + R.crit) / 2 : (p.x1 - R.crit) / 2;
      c.fillStyle = C.muted; c.textAlign = "center"; c.fillText(t("test.accRegion"), p.X(acc), yT);
      c.fillStyle = danger;
      c.textAlign = "center";
      for (const [u, v] of regs) c.fillText(t("test.rejRegion"), p.X(isFinite(u) ? u + 0.9 : v - 0.9), yT + 16);
      // critical values
      for (const [u, v] of regs){
        const x = isFinite(u) ? u : v; c.fillStyle = danger; c.textAlign = isFinite(u) ? "left" : "right"; c.textBaseline = "bottom"; c.font = `11px ${C.font}`;
        c.fillText(`${R.usesT ? "t" : "z"}c = ${show(trim(x, 3))}`, p.X(x) + (isFinite(u) ? 4 : -4), p.Y(dens(x) * 1.6) - 2);
      }
      // observed statistic
      p.marker(s, dens(s), `${R.usesT ? "t" : "z"} = ${show(trim(s, R.table ? 2 : 3))}`, C, 0);
    }
    const plot = new Plot(el("plot"), {
      draw: drawPlot,
      handles: () => R.err ? [] : [{ key: "s", x: R.s }],
      onFit: fit,
      onHandle(key, x){
        S.example = null;
        if (mean){
          const step = Num.niceStep(Math.abs(S.sd / Math.sqrt(S.n)) * 8, 200), d = Num.decimalsFor(step);
          S.xbar = +(S.mu0 + x * S.sd / Math.sqrt(S.n)).toFixed(Math.max(d, 0));
        } else {
          const np = S.n * S.p0, sd = Math.sqrt(np * (1 - S.p0));
          let y = np + x * sd; if (S.cc) y += x > 0 ? 0.5 : -0.5;
          S.y = clamp(Math.round(y), 0, S.n);
        }
        update();
      },
    });

    /* ---------- events ---------- */
    bindNudge(root); bindCopy($(".sections", root));
    const field = (id, key, ok, int = false) => {
      const inp = el(id); if (!inp) return;
      inp.addEventListener("input", () => {
        const v = parseNum(inp.value), good = v != null && (!int || Number.isInteger(v)) && ok(v);
        inp.setAttribute("aria-invalid", !good);
        if (good){ S[key] = v; S.example = null; update(inp); }
      });
      inp.addEventListener("change", () => { inp.removeAttribute("aria-invalid"); update(); fit(); });
    };
    if (mean){ field("f-mu0", "mu0", () => true); field("f-xbar", "xbar", () => true); field("f-sd", "sd", v => v > 0); }
    else { field("f-p0", "p0", v => v > 0 && v < 1); field("f-y", "y", v => v >= 0, true); el("cc").addEventListener("change", e => { S.cc = e.target.checked; S.example = null; update(); }); }
    field("f-n", "n", v => v >= 2, true); field("f-alpha", "alpha", v => v > 0 && v < 50);
    $$(".presets .btn", root).forEach(b => b.addEventListener("click", () => { S.alpha = +b.dataset.alpha; S.example = null; update(); }));
    $$("#h1Seg button", root).forEach(b => b.addEventListener("click", () => { S.h1 = b.dataset.h; S.example = null; update(); }));
    if (mean) $$("#methodSeg button", root).forEach(b => b.addEventListener("click", () => { S.method = b.dataset.m; S.example = null; update(); fit(); }));
    el("zTable").addEventListener("change", e => { S.zTable = e.target.checked; S.example = null; update(); });
    el("fitBtn").addEventListener("click", fit);
    el("examples").innerHTML = examplesHtml(exList(), S.example);
    el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });
    const onTheme = () => plot.draw();
    document.addEventListener("themechange", onTheme);
    update(); fit();
    return () => { plot.destroy(); document.removeEventListener("themechange", onTheme); };
  };
}

/* ---- js/core/pairpage.js ---- */
"use strict";
/* ============================================================
   Shared page for paired data (x, y): Pearson's correlation and
   simple linear regression.

     PAGES["correlation"] = pairPage(CORRELATION);

   The pairs are typed one per line ("x y") and drawn as a scatter
   plot; every point can be dragged in both directions.

   Config: id, key, minN, data [[x, y]…], example, options [{ key, def }],
     controls(S) → extra HTML for the controls column, bind(root, S, update),
     compute(P, S), formulas(R, S), vars(R, S), result(R, S), answer(R),
     r(R, S), back / front (p, C, R, S), handles(R, S, plot) and onHandle(key, x, y, S) for extra markers,
     examples [{ id, data, set, source }], notes, sources
   ============================================================ */

/* Pairs from text: one pair per line, the two numbers separated by spaces, tabs or semicolons
   (in English also a comma; in Portuguese the comma is the decimal mark). */
function parsePairs(text){
  const comma = usesComma(), pairs = [], bad = [];
  for (const raw of String(text).split(/\n+/)){
    const line = raw.replace(/[()\[\]{}]/g, " ").replace(/−/g, "-").trim(); if (!line) continue;
    const parts = (comma ? line.split(/[\s;]+/) : line.split(/[\s;,]+/)).filter(Boolean);
    const v = parts.map(parseNum);
    if (v.length !== 2 || v.some(x => x == null)) bad.push(raw.trim()); else pairs.push(v);
  }
  return { pairs, bad };
}
const formatPairs = P => P.map(([x, y]) => `${loc(trim(x, 6))}${usesComma() ? "; " : ", "}${loc(trim(y, 6))}`).join("\n");

/* Sums used by both pages. */
function pairSums(P){
  const n = P.length; let sx = 0, sy = 0, sxy = 0, sxx = 0, syy = 0;
  for (const [x, y] of P){ sx += x; sy += y; sxy += x * y; sxx += x * x; syy += y * y; }
  const Sxx = n * sxx - sx * sx, Syy = n * syy - sy * sy, Sxy = n * sxy - sx * sy;
  return { n, sx, sy, sxy, sxx, syy, Sxx, Syy, Sxy, mx: sx / n, my: sy / n };
}

function pairPage(cfg){
  const K = k => t(`${cfg.key}.${k}`);
  return function PairPage(root){
    const S = cfg.state || (cfg.state = {
      P: cfg.data.map(p => [...p]), O: Object.fromEntries((cfg.options || []).map(o => [o.key, o.def])),
      ...(cfg.initial || {}), example: cfg.example ?? null, range: null, names: cfg.names || ["x", "y"]
    });

    /* ---------- examples ---------- */
    const exList = () => cfg.examples.map(e => ({ id: e.id, title: K("ex." + e.id),
      source: typeof e.source === "function" ? e.source() : e.source,
      answer: cfg.answer(cfg.compute(e.data, { ...S, ...(e.set || {}) })) }));
    function loadExample(id){
      const e = cfg.examples.find(x => x.id === id); if (!e) return;
      Object.assign(S, { P: e.data.map(p => [...p]), example: id, xName: null, yName: null }, e.set || {});
      writeText(); readText(); update(); fit();
    }

    /* ---------- markup ---------- */
    root.innerHTML = `
    <div class="page data-page pair-page">
      <header class="page-head"><h1>${K("title")}</h1></header>
      <section class="work">
        <div class="plot-col">
          <div class="plot-bar"><span class="plot-title">${K("graph")}</span>
            <div class="bar-actions"><button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button></div></div>
          <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${K("graph")}"></canvas></div>
          <div class="legend"><div class="chips" id="chips"></div><span class="hint">${t("pair.hint")}</span></div>
        </div>
        <aside class="controls" aria-label="${t("controls")}">
          <div class="group">
            <div class="group-head"><h2><label for="dataIn">${t("pair.data")}</label></h2><span class="count" id="count"></span></div>
            <textarea class="data-in" id="dataIn" rows="6" spellcheck="false" autocomplete="off"></textarea>
            <p class="note" id="dataNote">${t("pair.sepHint")}</p>
          </div>
          ${cfg.controls ? cfg.controls(S) : ""}
          ${(cfg.options || []).length ? `<div class="group">${cfg.options.map(o => `<label class="check check-top"><input type="checkbox" data-opt="${o.key}">${K("opt." + o.key)}</label>`).join("")}</div>` : ""}
          <div class="group result" aria-live="polite">
            <div class="p-big" id="big"></div>
            <div class="p-sub" id="sub"></div>
            <dl class="facts" id="facts"></dl>
          </div>
        </aside>
      </section>
      <section class="formulas" aria-label="${t("formulas")}">
        ${formulasHead()}
        <div id="frows"></div>
        <div id="vars"></div>
      </section>
      ${sectionsHtml({ about: K("about"), notes: cfg.notes.map(K), sources: cfg.sources.map(K) })}
    </div>`;
    const el = id => $("#" + id, root), dataIn = el("dataIn");
    let R = null;

    function writeText(){ dataIn.value = formatPairs(S.P); dataIn.removeAttribute("aria-invalid"); }
    function readText(){
      const { pairs, bad } = parsePairs(dataIn.value), note = el("dataNote"), few = pairs.length < cfg.minN;
      note.classList.toggle("err", bad.length > 0 || few);
      note.textContent = bad.length ? t("pair.bad", { v: bad[0] }) : few ? t("dt.few", { n: cfg.minN }) : t("pair.sepHint");
      dataIn.setAttribute("aria-invalid", bad.length > 0 || few);
      return bad.length ? null : pairs;
    }

    /* ---------- render ---------- */
    function update(){
      el("count").textContent = t("dt.count", { n: S.P.length });
      $$("[data-opt]", root).forEach(c => { c.checked = !!S.O[c.dataset.opt]; });
      R = S.P.length >= cfg.minN ? cfg.compute(S.P, S) : { err: "pair.err.few" };
      if (R.err){ el("big").textContent = "—"; el("sub").textContent = t(R.err); el("facts").innerHTML = ""; plot.draw(); return; }
      const rows = cfg.formulas(R, S), box = el("frows");
      box.innerHTML = rows.map((r, i) => `<div class="frow"><span class="flabel">${r.label}</span><div class="fmath" data-row="${i}">${r.chain ? M.math(M.row(r.chain.join(M.o("=")))) : r.html}</div></div>`).join("");
      rows.forEach((r, i) => { if (!r.chain) return; const f = $(`[data-row="${i}"]`, box); if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 2); });
      el("vars").innerHTML = varsTableHtml(cfg.vars(R, S));
      const res = cfg.result(R, S);
      el("big").innerHTML = res.big; el("sub").innerHTML = res.sub;
      el("facts").innerHTML = res.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
      el("chips").innerHTML = res.chips || "";
      const L = [`# ${K("title")}`, ...rVector(S.P.map(p => p[0]), "x"), ...rVector(S.P.map(p => p[1]), "y"), ...cfg.r(R, S)];
      el("rcode").innerHTML = codeHtml(L.join("\n"));
      markExample(el("examples"), S.example);
      plot.draw();
    }

    /* ---------- graph ---------- */
    let yr = [0, 1];
    const pad = (lo, hi) => { const w = hi - lo || Math.max(1, Math.abs(lo) * 0.2); return [lo - 0.12 * w, hi + 0.12 * w]; };
    function fit(){
      if (!S.P.length) return;
      [plot.x0, plot.x1] = pad(Math.min(...S.P.map(p => p[0])), Math.max(...S.P.map(p => p[0])));
      plot.draw();
    }
    function drawPlot(p){
      const C = p.colors(), c = p.ctx;
      if (p.drag?.type !== "handle" && S.P.length){
        const ys = S.P.map(q => q[1]); if (cfg.yExtra && R && !R.err) ys.push(...cfg.yExtra(R, S));
        yr = pad(Math.min(...ys), Math.max(...ys));
      }
      [p.y0, p.y1] = yr; p.pad.l = 56;
      p.grid(C);
      if (!R || R.err){ for (const [x, y] of S.P) dot(p, c, C, x, y, C.muted); return; }
      cfg.back?.(p, C, R, S);
      S.P.forEach(([x, y], i) => dot(p, c, C, x, y, cfg.dotColor?.(i, R, S, C) || C.accent));
      cfg.front?.(p, C, R, S);
      const d = p.drag?.type === "handle" && typeof p.drag.key === "number" ? S.P[p.drag.key] : null;
      if (d) p.pill(p.X(d[0]), Math.max(p.pad.t, p.Y(d[1]) - 32), `(${show(trim(d[0], 3))}${t("listSep")}${show(trim(d[1], 3))})`, C, false);
      c.font = `11.5px ${C.font}`; c.fillStyle = C.muted; c.textAlign = "right"; c.textBaseline = "bottom";
      c.fillText(S.xName ? t(S.xName) : "x", p.pad.l + p.pw, p.pad.t + p.ph - 4);
      c.textAlign = "left"; c.textBaseline = "top"; c.fillText(S.yName ? t(S.yName) : "y", p.pad.l + 6, p.pad.t + 4);
    }
    function dot(p, c, C, x, y, col){
      if (x < p.x0 || x > p.x1) return;
      c.fillStyle = col; c.strokeStyle = C.surface; c.lineWidth = 1.5;
      c.beginPath(); c.arc(p.X(x), p.Y(y), 5.5, 0, Math.PI * 2); c.fill(); c.stroke();
    }
    const plot = new Plot(el("plot"), {
      draw: drawPlot,
      handles: () => [...S.P.map(([x, y], i) => ({ key: i, x, py: plot.Y(y), r: 10 })), ...(R && !R.err && cfg.handles ? cfg.handles(R, S, plot) : [])],
      onFit: fit,
      onHandle(key, x, y){
        if (typeof key === "number"){
          const dx = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 100)), dy = Num.decimalsFor(Num.niceStep(plot.y1 - plot.y0, 100));
          S.P[key] = [+x.toFixed(dx), +y.toFixed(dy)]; S.example = null; writeText(); readText();
        } else cfg.onHandle?.(key, x, y, S, plot);
        update();
      },
    });
    plot.pad.l = 56;

    /* ---------- events ---------- */
    bindCopy($(".sections", root));
    dataIn.addEventListener("input", () => { const v = readText(); if (!v) return; S.P = v; S.example = null; S.xName = S.yName = null; update(); });
    dataIn.addEventListener("change", () => { if (readText() && S.P.length >= cfg.minN){ writeText(); fit(); } });
    $$("[data-opt]", root).forEach(c => c.addEventListener("change", () => { S.O[c.dataset.opt] = c.checked; update(); }));
    cfg.bind?.(root, S, update);
    el("fitBtn").addEventListener("click", fit);
    el("examples").innerHTML = examplesHtml(exList(), S.example);
    el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });
    const onTheme = () => plot.draw();
    document.addEventListener("themechange", onTheme);
    writeText(); readText();
    if (S.range) [plot.x0, plot.x1] = S.range; else fit();
    update();
    return () => { S.range = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
  };
}

/* ---- js/nav.js ---- */
"use strict";
/* ============================================================
   Navigation tree — edit this as formulas get added.

   A node is either a page id ("normal") or a folder:
     { folder: "<key>", items: [ ...nodes ] }
   Folders can be nested to any depth.
   Labels come from the locale files: "folder.<key>" and "nav.<id>".
   Pages with an entry in PAGES are live; the rest show a placeholder.
   ============================================================ */
const NAV = [
  { folder: "descriptive", items: ["mean", "standard-deviation", "quartiles"] },
  { folder: "probability", items: ["addition-rule", "conditional-probability", "bayes"] },
  { folder: "discrete",    items: ["expected-value", "binomial", "hypergeometric", "poisson"] },
  { folder: "continuous",  items: ["uniform", "exponential", "normal"] },
  { folder: "estimation",  items: ["ci-mean", "ci-proportion", "sample-size"] },
  { folder: "tests",       items: ["test-mean", "test-proportion", "chi-square"] },
  { folder: "regression",  items: ["correlation", "linear-regression"] },
];
/* Pages planned for later are listed in TODO.md, not here, so they stay out of the menu. */
const PAGES = {};          // id -> (root) => cleanup fn
const HOME = "home";       // landing page: shown for an empty address and when clicking the app name
const DEFAULT_PAGE = HOME;

/* ---------- tree helpers ---------- */
/* Folders are identified by their path, e.g. "distributions/continuous". */
const isFolder = n => typeof n === "object";
const joinPath = (base, key) => base ? `${base}/${key}` : key;

/* Every page id under these nodes, in menu order. */
function navPages(nodes = NAV, out = []){
  for (const n of nodes) isFolder(n) ? navPages(n.items, out) : out.push(n);
  return out;
}
/* Every folder path under these nodes. */
function navFolders(nodes = NAV, base = "", out = []){
  for (const n of nodes) if (isFolder(n)){ const p = joinPath(base, n.folder); out.push(p); navFolders(n.items, p, out); }
  return out;
}
/* Paths of the folders that contain a page, outermost first; null if the page isn't in the menu. */
function navTrail(id, nodes = NAV, base = "", trail = []){
  for (const n of nodes){
    if (!isFolder(n)){ if (n === id) return trail; continue; }
    const p = joinPath(base, n.folder), found = navTrail(id, n.items, p, [...trail, p]);
    if (found) return found;
  }
  return null;
}

"use strict";
/* ============================================================

   through the kinds of graph used in the app, plus a few classics
   (a Galton board, the central limit theorem).

   Every scene is built from the same parts, so any scene can turn into
   any other by interpolation:

     areas   two shaded intervals under the first curve
     band    one shaded vertical band (x1 to x2)
     bars    K bars (x, height, width, opacity of a background column)
     dots    P dots (x, y, opacity, red)
     segs    S line segments (x1, y1, x2, y2, opacity, red, dashed)
     tri     a balance-point triangle under the baseline (x, opacity)

    // baseline
    c.strokeStyle = C.line; c.lineWidth = 1; c.beginPath(); c.moveTo(px, Math.round(Y(0)) + .5); c.lineTo(px + W, Math.round(Y(0)) + .5); c.stroke();
    const curve0 = A.curves[0].y.map((y, k) => mix(y, B.curves[0].y[k], u));
    const ca0 = mix(A.curves[0].a * lateA, B.curves[0].a * lateB, u);
    const lineOnly = u < 0.5 ? A.lineOnly : B.lineOnly;
    // shaded band
    const bx1 = mix(A.band.x1, B.band.x1, u), bx2 = mix(A.band.x2, B.band.x2, u), ba = mix(A.band.a, B.band.a, u);
    if (ba > 0.01 && bx2 > bx1){ c.save(); c.globalAlpha = ba; c.fillStyle = C.fill; c.fillRect(X(bx1), Y(0.95), (bx2 - bx1) * W, 0.95 * H); c.restore(); }
    // shaded areas under the first curve
    for (let j = 0; j < 2; j++){
      const a = mix(A.areas[j][0], B.areas[j][0], u), b = mix(A.areas[j][1], B.areas[j][1], u);
      if (b - a < 1e-3 || ca0 < 0.02 || lineOnly) continue;
      c.save(); c.globalAlpha = ca0; c.fillStyle = C.fill; c.beginPath(); c.moveTo(X(a), Y(0));
      for (let k = 0; k < M; k++){ const x = xs[k]; if (x >= a && x <= b) c.lineTo(X(x), Y(curve0[k])); }
      c.lineTo(X(b), Y(0)); c.closePath(); c.fill(); c.restore();
    }
    // bars (with their background columns, for the mosaic)
    for (let k = 0; k < K; k++){
      const a = barsA[k], b = barsB[k], bh = mix(a.h, b.h, u), bw = mix(a.w, b.w, u), bx = mix(a.x, b.x, u), bg = mix(a.bg || 0, b.bg || 0, u);
      if (bw <= 0) continue;
      if (bg > 0.01){ c.globalAlpha = bg; c.fillStyle = C.grid; c.fillRect(X(bx - bw / 2), Y(0.92), bw * W, 0.92 * H); }
      if (bh * H < 0.5) continue;
      c.globalAlpha = 0.9; c.fillStyle = C.accent; c.beginPath(); c.roundRect(X(bx - bw / 2), Y(bh), bw * W, bh * H, bg > 0.5 ? 0 : [3, 3, 0, 0]); c.fill();
    }
    c.globalAlpha = 1;
    // Galton board: pegs and falling balls
    const gw = A.galton ? 1 - u : B.galton ? u : 0;
    if (gw > 0.01 && galton) drawGalton(c, C, X, Y, gw, A.galton && u === 0 ? into : null);
    // curves
    for (let j = 0; j < C_; j++){
      const y = j ? A.curves[j].y.map((v, k) => mix(v, B.curves[j].y[k], u)) : curve0;
      const al = j ? mix(A.curves[j].a, B.curves[j].a, u) : ca0;
      if (al < 0.01) continue;
      c.save(); c.globalAlpha = al * (j ? 0.85 : 1); c.strokeStyle = C.accent; c.lineWidth = j ? 2 : 2.4; c.lineJoin = "round"; c.lineCap = "round";
      c.beginPath(); y.forEach((v, k) => k ? c.lineTo(X(xs[k]), Y(v)) : c.moveTo(X(xs[k]), Y(v))); c.stroke(); c.restore();
    }
    // segments
    c.lineCap = "round";
    for (let k = 0; k < S; k++){
      const a = A.segs[k], b = B.segs[k], al = mix(a.a, b.a, u);
      if (al < 0.02) continue;
      const r = mix(a.red, b.red, u), dash = (u < 0.5 ? a.a ? a.dash : b.dash : b.a ? b.dash : a.dash);
      c.save(); c.setLineDash(dash ? [5, 5] : []); c.lineWidth = dash ? 1.4 : 2.2;
      c.beginPath(); c.moveTo(X(mix(a.x1, b.x1, u)), Y(mix(a.y1, b.y1, u))); c.lineTo(X(mix(a.x2, b.x2, u)), Y(mix(a.y2, b.y2, u)));
      if (r < 0.99){ c.globalAlpha = al * (1 - r) * (dash ? 0.6 : 1); c.strokeStyle = dash ? C.faint : C.accent; c.stroke(); }
      if (r > 0.01){ c.globalAlpha = al * r; c.strokeStyle = red; c.stroke(); }
      c.restore();
    }
    // dots
    for (let k = 0; k < P; k++){
      const a = A.dots[k], b = B.dots[k], al = mix(a.a, b.a, u);
      if (al < 0.02) continue;
      const r = mix(a.red || 0, b.red || 0, u), x = X(mix(a.x, b.x, u)), y = Y(mix(a.y, b.y, u));
      c.strokeStyle = C.surface; c.lineWidth = 1.5;
      c.globalAlpha = al; c.fillStyle = C.accent; c.beginPath(); c.arc(x, y, 4, 0, Math.PI * 2); c.fill(); c.stroke();
      if (r > 0.01){ c.globalAlpha = al * r; c.fillStyle = red; c.beginPath(); c.arc(x, y, 4, 0, Math.PI * 2); c.fill(); }
    }
    // balance point
    const ta = mix(A.tri.a, B.tri.a, u);
    if (ta > 0.01){
      const tx = X(mix(A.tri.x, B.tri.x, u)), ty = Y(0);
      c.globalAlpha = ta; c.fillStyle = C.accent; c.beginPath(); c.moveTo(tx, ty + 1); c.lineTo(tx - 8, ty + 13); c.lineTo(tx + 8, ty + 13); c.closePath(); c.fill();
    }
    c.globalAlpha = 1;
  }
  /* Galton board: pegs in a triangle; balls fall through them, one step left or right per row. */
  function drawGalton(c, C, X, Y, weight, into){
    const g = galton, rowH = (g.top - g.bottom) / (g.R - 1);
    c.fillStyle = C.faint;
    for (let j = 0; j < g.R; j++) for (let i = 0; i <= j; i++){
      c.globalAlpha = weight * 0.8; c.beginPath(); c.arc(X(0.5 + (i - j / 2) * g.dx), Y(g.top - j * rowH), 2.2, 0, Math.PI * 2); c.fill();
    }
    if (into == null || reduce) { c.globalAlpha = 1; return; }
    // balls: one released every 55 ms; each takes 900 ms to fall; paths fixed by the ball's number
    const every = 55, fall = 900, n = Math.floor(into / every);
    c.fillStyle = C.accent;
    for (let b = Math.max(0, n - Math.ceil(fall / every)); b <= n; b++){
      const age = (into - b * every) / fall; if (age < 0 || age > 1) continue;
      const r = rng(1000 + b * 7919); let x = 0.5;
      const steps = age * (g.R + 1), whole = Math.floor(steps);
      for (let j = 0; j < Math.min(whole, g.R); j++) x += (r() < 0.5 ? -0.5 : 0.5) * g.dx;
      let y;
      if (whole < g.R){ const nx = x + (r() < 0.5 ? -0.5 : 0.5) * g.dx, f = steps - whole; x = mix(x, nx, f); y = g.top + rowH * 0.6 - steps * rowH; }
      else y = Math.max(0.02, g.bottom - (steps - g.R) * (g.bottom - 0.02));
      c.globalAlpha = 0.9 * weight; c.beginPath(); c.arc(X(x), Y(y), 3.4, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
  }
  const ro = new ResizeObserver(() => {
    const r = canvas.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    w = r.width; h = r.height; canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    build();
  });
  ro.observe(canvas);
  raf = requestAnimationFrame(frame);
  return () => { cancelAnimationFrame(raf); ro.disconnect(); };
}

"use strict";
/* ============================================================
   Home (landing) page: every formula by topic, and below them an
   animated graph that morphs through the kinds of graph in the app

function HomePage(root){
  const topics = NAV.map(f => `
    <section class="topic">
      <h2>${t("folder." + f.folder)}</h2>
      <ul>${navPages(f.items).map(id => PAGES[id]

  root.innerHTML = `
  <div class="page home">
    <h1 class="visually-hidden">${esc(APP.name)}</h1>
    <div class="topics">${topics}</div>
    <div class="home-anim" id="homeAnim"></div>

  return homeAnimation($("#homeAnim", root));
}
