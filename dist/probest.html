"use strict";
/* ============================================================
   Page: Arithmetic mean   x̄ = Σxᵢ / n
   With repeated values:   x̄ = Σxⱼnⱼ / n
   Sources: Barbetta 3.4.1 (eq. 3.4, 3.9, Ex. 3.2 and 3.4) · Bussab & Morettin 3.1
   ============================================================ */
const MEAN_PAGE = {
  id: "mean", key: "mean", minN: 1,
  data: [4, 5, 5, 6, 6, 7, 7, 8], example: "turmaA",
  options: [{ key: "median", def: false }],
  baseGap: 16,

  compute(xs){
    const n = xs.length, sum = Desc.sum(xs), mean = sum / n, s = Desc.sorted(xs);
    const counts = new Map(); for (const v of s) counts.set(v, (counts.get(v) || 0) + 1);
    return { xs, n, sum, mean, median: Desc.median(xs), min: s[0], max: s[n - 1], freq: [...counts] };
  },

  formulas(R){
    const xb = M.bar("x"), xi = M.sub(M.i("x"), M.i("i")), n = M.i("n"), num = v => M.n(trim(v, 6));
    const rows = [{ label: t("mean.f.mean"), chain: [
      xb, M.frac(M.row(M.sum(), xi), n),
      M.frac(sumTerms(R.xs.map(v => nv(v))), M.v(R.n)),
      M.frac(num(R.sum), M.v(R.n)), M.r(trim(R.mean, 4))] }];
    if (R.freq.length < R.n){
      const xj = M.sub(M.i("x"), M.i("j")), nj = M.sub(M.i("n"), M.i("j"));
      const terms = R.freq.map(([v, c]) => M.row(nv(v), M.o("·"), M.v(String(c))));
      rows.push({ label: t("mean.f.freq"), chain: [
        xb, M.frac(M.row(M.sum(M.row(M.i("j"), M.o("="), M.n(1)), M.i("k")), xj, nj), n),
        M.frac(sumTerms(terms, 6), M.v(R.n)), M.r(trim(R.mean, 4))] });
    }
    return rows;
  },

  vars(R){
    const rows = [
      [M.bar("x"), t("mean.sym.xbar"), show(trim(R.mean, 4))],
      [M.sub(M.i("x"), M.i("i")), t("dt.sym.xi"), ""],
      [M.i("n"), t("dt.sym.n"), String(R.n)],
      [M.row(M.sum(), M.sub(M.i("x"), M.i("i"))), t("dt.sym.sum"), show(trim(R.sum, 6))],
    ];
    if (R.freq.length < R.n) rows.push(
      [M.sub(M.i("x"), M.i("j")), t("mean.sym.xj"), ""],
      [M.sub(M.i("n"), M.i("j")), t("mean.sym.nj"), ""],
      [M.i("k"), t("mean.sym.k"), String(R.freq.length)]);
    return rows;
  },

  result(R, O){
    const facts = [[t("dt.n"), String(R.n)], [t("dt.sumLbl"), show(trim(R.sum, 6))]];
    facts.push([t("dt.median"), show(trim(R.median, 4))], [t("dt.min"), show(trim(R.min, 6))], [t("dt.max"), show(trim(R.max, 6))]);
    return { big: show(trim(R.mean, 4)), sub: `<math>${M.bar("x")}</math> · ${t("mean.title").toLowerCase()}`, facts };
  },
  answer: R => `<math>${M.bar("x")}<mo>=</mo>${M.n(trim(R.mean, 2))}</math>`,
  r: (R, O) => [
    rLine("mean(x)", `${t("mean.r.mean")}: ${trim(R.mean, 4)}`),
    rLine("sum(x) / length(x)", t("mean.r.formula")),
    ...(O.median ? [rLine("median(x)", `${t("dt.median")}: ${trim(R.median, 4)}`)] : []),
  ],

  back(p, C, R, O){
    const c = p.ctx, axis = p.pad.t + p.ph, board = axis - 16;
    c.save(); c.strokeStyle = C.line; c.lineWidth = 2;
    c.beginPath(); c.moveTo(p.pad.l, board + 1); c.lineTo(p.pad.l + p.pw, board + 1); c.stroke(); c.restore();
    if (O.median) p.vline(R.median, C.muted, [5, 4], 1, 1.4);
  },
  front(p, C, R, O){
    const c = p.ctx, axis = p.pad.t + p.ph, board = axis - 16, x = p.X(R.mean);
    if (R.mean < p.x0 || R.mean > p.x1) return;
    // the balance point: the mean is where the board of dots would balance
    c.save(); c.fillStyle = C.accent;
    c.beginPath(); c.moveTo(x, board + 2); c.lineTo(x - 9, axis); c.lineTo(x + 9, axis); c.closePath(); c.fill();
    c.strokeStyle = C.accent; c.lineWidth = 1.5; c.setLineDash([]);
    c.beginPath(); c.moveTo(Math.round(x) + .5, p.pad.t); c.lineTo(Math.round(x) + .5, board); c.stroke(); c.restore();
    const [l, r] = p.pill(x, 6, `x̄ = ${show(trim(R.mean, 4))}`, C, true);
    if (O.median && R.median >= p.x0 && R.median <= p.x1){
      const mx = p.X(R.median), close = mx > l - 50 && mx < r + 50;
      p.pill(mx, close ? 30 : 6, `md = ${show(trim(R.median, 4))}`, C, false);
    }
  },

  examples: [
    { id: "turmaA", data: [4, 5, 5, 6, 6, 7, 7, 8], source: "Barbetta · Ex. 3.4" },
    { id: "turmaB", data: [1, 2, 4, 6, 6, 9, 10, 10], source: "Barbetta · Ex. 3.4" },
    { id: "turmaC", data: [0, 6, 7, 7, 7, 7.5, 7.5], O: { median: true }, source: "Barbetta · Ex. 3.4" },
    { id: "load", data: [5.2, 6.4, 5.7, 8.3, 7.0, 5.4, 4.8, 9.1, 5.5, 6.2, 4.9, 5.7, 6.3, 5.1, 8.4, 6.2, 8.9, 7.3, 5.4, 4.8, 5.6, 6.8, 5.0, 6.7, 8.2, 7.1, 4.9, 5.0, 8.2, 9.9, 5.4, 5.6, 5.7, 6.2, 4.9, 5.1, 6.0, 4.7, 14.1, 5.3, 4.9, 5.0, 5.7, 6.3, 6.0, 6.8, 7.3, 6.9, 6.5, 5.9], O: { median: true }, source: "Barbetta · Ex. 3.2" },
    { id: "bm", data: [15, 5, 3, 8, 10, 2, 7, 11, 12], O: { median: true }, source: "Bussab & Morettin · Ex. 3.5" },
    { id: "bm67", data: [15, 5, 3, 8, 10, 2, 7, 11, 12, 67], O: { median: true }, source: "Bussab & Morettin · Ex. 3.5" },
  ],
  notes: ["note.balance", "note.outlier", "note.freq", "note.units"],
  sources: ["src.barbetta", "src.bussab"],
};
PAGES["mean"] = dataPage(MEAN_PAGE);

/* ---- js/pages/desc/standard-deviation.js ---- */
"use strict";
/* ============================================================
   Page: Standard deviation (with the variance)
     s² = Σ(xᵢ − x̄)² / (n − 1)       s = √s²
     s  = √[(Σxᵢ² − n·x̄²) / (n − 1)]  shortcut, fewer rounding errors
   Bussab & Morettin define var(X) and dp(X) with n in the denominator;
   the page can switch between n − 1 and n.
   Sources: Barbetta 3.4.1 (eq. 3.6 to 3.8, Ex. 3.4) · Bussab & Morettin 3.2
   ============================================================ */
const SD_PAGE = {
  id: "standard-deviation", key: "sdp", minN: 2,
  data: [4, 5, 5, 6, 6, 7, 7, 8], example: "turmaA",
  segs: [{ key: "div", def: "n1", values: ["n1", "n"] }],

  compute(xs, O){
    const n = xs.length, sum = Desc.sum(xs), mean = sum / n;
    const ss = xs.reduce((s, x) => s + (x - mean) ** 2, 0), sx2 = xs.reduce((s, x) => s + x * x, 0);
    const d = O.div === "n" ? n : n - 1, v = ss / d;
    return { xs, n, sum, mean, ss, sx2, d, pop: O.div === "n", v, s: Math.sqrt(v) };
  },

  formulas(R){
    const xb = M.bar("x"), xi = M.sub(M.i("x"), M.i("i")), n = M.i("n"), num = v => M.n(trim(v, 6)), r4 = v => M.n(trim(v, 4));
    const V = sdSym.v(R), Sd = sdSym.s(R);
    const D = R.pop ? n : M.row(n, M.o(MINUS), M.n(1)), Dn = R.pop ? M.v(R.n) : M.row(M.v(R.n), M.o(MINUS), M.n(1));
    const dev = M.sup(M.paren(M.row(xi, M.o(MINUS), xb)), M.n(2));
    const devTerms = R.xs.map(x => M.sup(M.paren(M.row(M.v(trim(x, 6)), M.o(MINUS), nv(+trim(R.mean, 4)))), M.n(2)));
    return [
      { label: t("sdp.f.mean"), chain: [xb, M.frac(M.row(M.sum(), xi), n), M.frac(num(R.sum), M.v(R.n)), M.r(trim(R.mean, 4))] },
      { label: t("sdp.f.var"), chain: [V, M.frac(M.row(M.sum(), dev), D), M.frac(sumTerms(devTerms, 6), Dn), M.frac(r4(R.ss), num(R.d)), M.r(trim(R.v, 4))] },
      { label: t("sdp.f.sd"), chain: [Sd, M.sqrt(V), M.sqrt(M.v(trim(R.v, 4))), M.r(trim(R.s, 4))] },
      { label: t("sdp.f.short"), chain: [Sd,
        M.sqrt(M.frac(M.row(M.sum(), M.sup(xi, M.n(2)), M.o(MINUS), n, M.sup(xb, M.n(2))), D)),
        M.sqrt(M.frac(M.row(num(R.sx2), M.o(MINUS), M.v(R.n), M.o("·"), M.sup(nv(+trim(R.mean, 4)), M.n(2))), Dn)),
        M.r(trim(R.s, 4))] },
    ];
  },

  vars(R){
    const xi = M.sub(M.i("x"), M.i("i")), xb = M.bar("x");
    return [
      [sdSym.s(R), R.pop ? t("sdp.sym.dp") : t("sdp.sym.s"), show(trim(R.s, 4))],
      [sdSym.v(R), R.pop ? t("sdp.sym.var") : t("sdp.sym.s2"), show(trim(R.v, 4))],
      [xi, t("dt.sym.xi"), ""],
      [xb, t("sdp.sym.xbar"), show(trim(R.mean, 4))],
      [M.i("n"), t("dt.sym.n"), String(R.n)],
      [M.row(M.sum(), M.sup(M.paren(M.row(xi, M.o(MINUS), xb)), M.n(2))), t("sdp.sym.ss"), show(trim(R.ss, 4))],
      [M.row(M.sum(), M.sup(xi, M.n(2))), t("sdp.sym.sx2"), show(trim(R.sx2, 6))],
    ];
  },

  result(R){
    return {
      big: show(trim(R.s, 4)),
      sub: `<math>${sdSym.s(R)}</math> · ${R.pop ? t("sdp.subPop") : t("sdp.subSample")}`,
      facts: [[t("sdp.fact.mean"), show(trim(R.mean, 4))], [R.pop ? t("sdp.fact.var") : t("sdp.fact.s2"), show(trim(R.v, 4))],
        [t("sdp.fact.ss"), show(trim(R.ss, 4))], [t("dt.n"), String(R.n)]],
    };
  },
  answer: R => `<math>${sdSym.s(R)}<mo>=</mo>${M.n(trim(R.s, 2))}</math>`,
  r: R => R.pop
    ? [rLine("n <- length(x)", t("dt.sym.n")),
       rLine("sum((x - mean(x))^2) / n", `${t("sdp.fact.var")}: ${trim(R.v, 4)}`, 34),
       rLine("sqrt(sum((x - mean(x))^2) / n)", `${t("sdp.r.dp")}: ${trim(R.s, 4)}`, 34),
       `# ${t("sdp.r.note")}`]
    : [rLine("var(x)", `${t("sdp.fact.s2")}: ${trim(R.v, 4)}`),
       rLine("sd(x)", `${t("sdp.r.s")}: ${trim(R.s, 4)}`),
       rLine("sqrt((sum(x^2) - length(x) * mean(x)^2) / (length(x) - 1))", t("sdp.r.short"))],

  back(p, C, R, O, L){
    const c = p.ctx, lo = R.mean - R.s, hi = R.mean + R.s, axis = p.pad.t + p.ph;
    p.clip(() => {
      c.fillStyle = C.fill; c.fillRect(p.X(lo), p.pad.t, p.X(hi) - p.X(lo), axis - p.pad.t);
      c.strokeStyle = C.faint; c.lineWidth = 1;
      for (const d of L){ c.beginPath(); c.moveTo(p.X(R.mean), d.py); c.lineTo(d.px, d.py); c.stroke(); }
    });
    p.vline(lo, C.accent, [4, 3]); p.vline(hi, C.accent, [4, 3]);
    p.vline(R.mean, C.accent, [], 1, 1.5);
  },
  front(p, C, R){
    const mean = `x̄ = ${show(trim(R.mean, 3))}`;
    const s = R.pop ? t("sdp.symDp") : "s";
    p.pill(p.X(R.mean), 6, mean, C, true);
    if (p.X(R.mean + R.s) - p.X(R.mean - R.s) > 150){
      p.pill(p.X(R.mean - R.s), 30, `x̄ − ${s} = ${show(trim(R.mean - R.s, 3))}`, C, false);
      p.pill(p.X(R.mean + R.s), 30, `x̄ + ${s} = ${show(trim(R.mean + R.s, 3))}`, C, false);
    }
  },

  examples: [
    { id: "turmaA", data: [4, 5, 5, 6, 6, 7, 7, 8], source: "Barbetta · Ex. 3.4" },
    { id: "turmaB", data: [1, 2, 4, 6, 6, 9, 10, 10], source: "Barbetta · Ex. 3.4" },
    { id: "turmaC", data: [0, 6, 7, 7, 7, 7.5, 7.5], source: "Barbetta · Ex. 3.4" },
    { id: "shift", data: [101, 102, 103], source: "Barbetta · Tabela 3.5" },
    { id: "bmA", data: [3, 4, 5, 6, 7], O: { div: "n" }, source: "Bussab & Morettin · 3.2" },
    { id: "bmD", data: [3, 5, 5, 7], O: { div: "n" }, source: "Bussab & Morettin · 3.2" },
  ],
  notes: ["note.n1", "note.units", "note.short", "note.outlier", "note.shift"],
  sources: ["src.barbetta", "src.bussab"],
};
/* s and s² (sample, n − 1), or dp(X) and var(X) as in Bussab & Morettin (n). */
const sdSym = {

/* ---- js/pages/desc/quartiles.js ---- */
"use strict";
/* ============================================================
   Page: Quartiles (with the median and the box plot)
   Positions in the ordered data (Barbetta):
     qi: (n + 1)/4     md: (n + 1)/2     qs: 3(n + 1)/4
   interpolating linearly when the position is fractional.
     dq = qs − qi; values beyond qi − 1.5dq or qs + 1.5dq are outliers
     (beyond 3dq, far outliers).
   Same as R's quantile(x, type = 6).
   Sources: Barbetta 3.4.2 · Bussab & Morettin 3.3 and 3.4
   ============================================================ */
const QUART_PAGE = {
  id: "quartiles", key: "qt", minN: 3,
  data: [15, 18, 5, 7, 9, 11, 3, 5, 6, 8, 12], example: "eleven",
  topSpace: 86,

  compute(xs){
    const s = Desc.sorted(xs), n = s.length;
    const pos = [(n + 1) / 4, (n + 1) / 2, 3 * (n + 1) / 4];
    const [qi, md, qs] = pos.map(p => Desc.at(s, p));
    const dq = qs.v - qi.v, lf = qi.v - 1.5 * dq, uf = qs.v + 1.5 * dq, lf3 = qi.v - 3 * dq, uf3 = qs.v + 3 * dq;
    const inside = s.filter(v => v >= lf - 1e-12 && v <= uf + 1e-12);
    return { xs, s, n, pos, qi, md, qs, dq, lf, uf, lf3, uf3,
      wlo: inside.length ? inside[0] : qi.v, whi: inside.length ? inside[inside.length - 1] : qs.v,
      out: s.filter(v => v < lf - 1e-12 || v > uf + 1e-12), min: s[0], max: s[n - 1] };
  },

  formulas(R){
    const n = M.i("n"), num = v => M.n(trim(v, 6)), r4 = v => M.n(trim(v, 4)), np1 = M.row(n, M.o("+"), M.n(1));
    const nn = M.row(M.v(R.n), M.o("+"), M.n(1)), pos = M.text(t("qt.pos")), vv = v => M.v(trim(v, 6));
    const posFrac = [
      [M.frac(np1, M.n(4)), M.frac(nn, M.n(4))],
      [M.frac(np1, M.n(2)), M.frac(nn, M.n(2))],
      [M.frac(M.row(M.n(3), M.paren(np1)), M.n(4)), M.frac(M.row(M.n(3), M.paren(nn)), M.n(4))],
    ];
    const syms = [qSym.qi, qSym.md, qSym.qs], labels = ["qt.f.qi", "qt.f.md", "qt.f.qs"];
    const rows = [{ label: t("qt.f.sorted"), html: orderedHtml(R) }];
    [R.qi, R.md, R.qs].forEach((q, j) => {
      const line1 = M.math(M.row(pos, M.o("="), posFrac[j][0], M.o("="), posFrac[j][1], M.o("="), M.r(trim(R.pos[j], 4))));
      let line2;
      if (!q.f) line2 = M.math(M.row(syms[j](), M.o("="), M.ord(q.k), M.o("="), M.r(trim(q.v, 6))));
      else {
        const a = R.s[q.k - 1], b = R.s[q.k], f = M.v(trim(q.f, 4));
        line2 = M.math(M.row(syms[j](), M.o("="), M.ord(q.k), M.o("+"), f, M.o("·"), M.paren(M.row(M.ord(q.k + 1), M.o(MINUS), M.ord(q.k))),
          M.o("="), vv(a), M.o("+"), f, M.o("·"), M.paren(M.row(vv(b), M.o(MINUS), nv(a))), M.o("="), M.r(trim(q.v, 4))));
      }
      rows.push({ label: t(labels[j]), html: line1 + line2 });
    });
    const k15 = M.n("1.5"), dq = qSym.dq();
    rows.push({ label: t("qt.f.box"), html:
      M.math(M.row(dq, M.o("="), qSym.qs(), M.o(MINUS), qSym.qi(), M.o("="), vv(R.qs.v), M.o(MINUS), nv(R.qi.v), M.o("="), M.r(trim(R.dq, 4)))) +
      M.math(M.row(qSym.qi(), M.o(MINUS), k15, dq, M.o("="), vv(R.qi.v), M.o(MINUS), k15, M.o("·"), M.v(trim(R.dq, 4)), M.o("="), M.r(trim(R.lf, 4)))) +
      M.math(M.row(qSym.qs(), M.o("+"), k15, dq, M.o("="), vv(R.qs.v), M.o("+"), k15, M.o("·"), M.v(trim(R.dq, 4)), M.o("="), M.r(trim(R.uf, 4)))) });
    return rows;
  },

  vars(R){
    return [
      [M.i("n"), t("dt.sym.n"), String(R.n)],
      [M.ord(M.i("k")), t("qt.sym.xk"), ""],
      [qSym.qi(), t("qt.sym.qi"), show(trim(R.qi.v, 4))],
      [qSym.md(), t("qt.sym.md"), show(trim(R.md.v, 4))],
      [qSym.qs(), t("qt.sym.qs"), show(trim(R.qs.v, 4))],
      [qSym.dq(), t("qt.sym.dq"), show(trim(R.dq, 4))],
      [M.row(qSym.qi(), M.o(MINUS), M.n("1.5"), qSym.dq()), t("qt.sym.lf"), show(trim(R.lf, 4))],
      [M.row(qSym.qs(), M.o("+"), M.n("1.5"), qSym.dq()), t("qt.sym.uf"), show(trim(R.uf, 4))],
    ];
  },

  result(R){
    const v = x => show(trim(x, 4));
    return {
      big: `<span class="qtrio">${[[R.qi.v, qSym.qi()], [R.md.v, qSym.md()], [R.qs.v, qSym.qs()]]
        .map(([x, m]) => `<span><b>${v(x)}</b><math>${m}</math></span>`).join("")}</span>`,
      sub: "",
      facts: [[t("qt.fact.dq"), v(R.dq)], [t("dt.min"), v(R.min)], [t("dt.max"), v(R.max)],
        [t("qt.fact.out"), R.out.length ? R.out.map(v).join(t("listSep")) : t("qt.none")]],
    };
  },
  answer: R => `<math>${qSym.qi()}<mo>=</mo>${M.n(trim(R.qi.v, 3))}<mo separator="true">;</mo><mspace width="0.4em"></mspace>${qSym.md()}<mo>=</mo>${M.n(trim(R.md.v, 3))}<mo separator="true">;</mo><mspace width="0.4em"></mspace>${qSym.qs()}<mo>=</mo>${M.n(trim(R.qs.v, 3))}</math>`,
  r: R => [
    rLine("quantile(x, c(0.25, 0.5, 0.75), type = 6)", `${t("qt.r.q")}: ${[R.qi.v, R.md.v, R.qs.v].map(v => trim(v, 4)).join(" ")}`, 44),
    rLine("IQR(x, type = 6)", `dq: ${trim(R.dq, 4)}`, 44),
    rLine("boxplot(x, horizontal = TRUE)", t("qt.r.box"), 44),
  ],

  dot(i, v, R, O, C){ return R.out.includes(v) ? { fill: cssVar("--danger") } : null; },
  back(p, C, R){
    const c = p.ctx, axis = p.pad.t + p.ph, boxBot = p.pad.t + 58;
    for (const x of [R.lf, R.uf]) if (x >= p.x0 && x <= p.x1){
      p.vline(x, C.faint, [2, 4]);
    }
    p.clip(() => {
      c.save(); c.setLineDash([3, 3]); c.strokeStyle = C.accent; c.globalAlpha = .55; c.lineWidth = 1;
      for (const q of [R.qi.v, R.md.v, R.qs.v]){ const x = Math.round(p.X(q)) + .5; c.beginPath(); c.moveTo(x, boxBot); c.lineTo(x, axis); c.stroke(); }
      c.restore();
    });
  },
  front(p, C, R){
    const c = p.ctx, top = p.pad.t + 22, bot = p.pad.t + 58, mid = (top + bot) / 2, danger = cssVar("--danger");
    p.clip(() => {
      const X = v => p.X(v);
      c.strokeStyle = C.accent; c.lineWidth = 1.5;
      c.beginPath();
      c.moveTo(X(R.wlo), mid); c.lineTo(X(R.qi.v), mid); c.moveTo(X(R.qs.v), mid); c.lineTo(X(R.whi), mid);
      c.moveTo(X(R.wlo), mid - 7); c.lineTo(X(R.wlo), mid + 7); c.moveTo(X(R.whi), mid - 7); c.lineTo(X(R.whi), mid + 7);
      c.stroke();
      c.fillStyle = C.fill; c.fillRect(X(R.qi.v), top, X(R.qs.v) - X(R.qi.v), bot - top);
      c.strokeRect(Math.round(X(R.qi.v)) + .5, top + .5, X(R.qs.v) - X(R.qi.v), bot - top);
      c.lineWidth = 2.5; c.beginPath(); c.moveTo(X(R.md.v), top); c.lineTo(X(R.md.v), bot); c.stroke();
      for (const v of R.out){
        const x = X(v), far = v < R.lf3 - 1e-12 || v > R.uf3 + 1e-12;
        c.strokeStyle = danger; c.lineWidth = 1.6;
        if (far){ c.beginPath(); c.moveTo(x - 4.5, mid - 4.5); c.lineTo(x + 4.5, mid + 4.5); c.moveTo(x + 4.5, mid - 4.5); c.lineTo(x - 4.5, mid + 4.5); c.stroke(); }
        else { c.beginPath(); c.arc(x, mid, 4.5, 0, Math.PI * 2); c.stroke(); }
      }
    });
    // labels: md on the first row; qi and qs share it when there is room, else go to the second row
    c.font = `600 12px ${C.font}`;
    const lab = [[R.qi.v, "qi"], [R.md.v, "md"], [R.qs.v, "qs"]].map(([v, s]) => ({ x: p.X(v), text: `${s} = ${show(trim(v, 3))}` }));
    const w = l => c.measureText(l.text).width + 14;
    const md = lab[1], gapL = md.x - w(md) / 2 - (lab[0].x + w(lab[0]) / 2), gapR = lab[2].x - w(lab[2]) / 2 - (md.x + w(md) / 2);
    const row = gapL > 4 && gapR > 4 ? 6 : 30;
    p.pill(md.x, 6, md.text, C, true);
    if (row === 30 && lab[2].x - lab[0].x < (w(lab[0]) + w(lab[2])) / 2 + 4){
      p.pill(lab[0].x - w(lab[0]) / 2, 30, lab[0].text, C, false); p.pill(lab[2].x + w(lab[2]) / 2, 30, lab[2].text, C, false);
    } else { p.pill(lab[0].x, row, lab[0].text, C, false); p.pill(lab[2].x, row, lab[2].text, C, false); }
    c.font = `11px ${C.font}`; c.fillStyle = C.faint; c.textBaseline = "top";
    if (R.lf >= p.x0 && R.lf <= p.x1){ c.textAlign = "left"; c.fillText(`qi − 1,5dq`.replace(",", t("decimal")), p.X(R.lf) + 4, p.pad.t + 64); }
    if (R.uf >= p.x0 && R.uf <= p.x1){ c.textAlign = "right"; c.fillText(`qs + 1,5dq`.replace(",", t("decimal")), p.X(R.uf) - 4, p.pad.t + 64); }
  },

  examples: [
    { id: "eleven", data: [15, 18, 5, 7, 9, 11, 3, 5, 6, 8, 12], source: "Barbetta · 3.4.2" },
    { id: "load", data: [5.2, 6.4, 5.7, 8.3, 7.0, 5.4, 4.8, 9.1, 5.5, 6.2, 4.9, 5.7, 6.3, 5.1, 8.4, 6.2, 8.9, 7.3, 5.4, 4.8, 5.6, 6.8, 5.0, 6.7, 8.2, 7.1, 4.9, 5.0, 8.2, 9.9, 5.4, 5.6, 5.7, 6.2, 4.9, 5.1, 6.0, 4.7, 14.1, 5.3, 4.9, 5.0, 5.7, 6.3, 6.0, 6.8, 7.3, 6.9, 6.5, 5.9], source: "Barbetta · Ex. 3.2" },
    { id: "turmaC", data: [0, 6, 7, 7, 7, 7.5, 7.5], source: "Barbetta · Ex. 3.4" },

/* ---- js/pages/prob/bayes.js ---- */
"use strict";
/* ============================================================
   Page: Bayes' theorem
     P(F) = Σ P(Eᵢ)·P(F | Eᵢ)                 total probability
     P(Eⱼ | F) = P(Eⱼ)·P(F | Eⱼ) / P(F)        Bayes' theorem
   E₁ … Eₖ split the sample space (mutually exclusive and exhaustive).
   The mosaic draws each Eᵢ as a column as wide as P(Eᵢ), filled up to
   P(F | Eᵢ): the filled area is P(F), and the share of the chosen column
   in it is P(Eⱼ | F).
   Sources: Barbetta 4.4 and 4.5 (eq. 4.16, 4.17, Ex. 4.12) · Bussab & Morettin 5.4
   ============================================================ */
PAGES["bayes"] = function BayesPage(root){
  const S = BayesPage.state || (BayesPage.state = {
    rows: [["0.25", "0.1"], ["0.25", "0.1"], ["0.25", "0.2"], ["0.25", "0.4"]], target: 3, example: "suppliers"
  });
  const MAXK = 8;

  /* ---------- maths ---------- */
  function values(st = S){
    const p = st.rows.map(r => parseProb(r[0])), l = st.rows.map(r => parseProb(r[1]));
    if (p.some(v => v == null || v < 0 || v > 1) || l.some(v => v == null || v < 0 || v > 1)) return { err: "bayes.err.range" };
    const sum = p.reduce((a, b) => a + b, 0);
    if (Math.abs(sum - 1) > 1e-6) return { err: "bayes.err.sum", sum };
    const joint = p.map((v, i) => v * l[i]), PF = joint.reduce((a, b) => a + b, 0);
    if (PF <= 0) return { err: "bayes.err.zero" };
    const j = Math.min(st.target, p.length - 1);

  }

  /* ---------- examples ---------- */
  const EXAMPLES = [

  const Ej = j => M.sub(M.i("E"), M.n(String(j + 1))), Ei = M.sub(M.i("E"), M.i("i")), F = M.i("F");

  const exList = () => EXAMPLES.map(e => {

  function loadExample(id){

  /* ---------- markup ---------- */
  root.innerHTML = `
  <div class="page bayes-page">

  function update(fromInput){

    const n4 = v => M.n(trim(v, 4)), v4 = v => M.v(trim(v, 4)), r4 = v => M.r(trim(v, 4)), j = V.j;
    const terms = V.p.map((_, i) => M.row(probMath(V.raw[i][0], V.p[i]), M.o("·"), probMath(V.raw[i][1], V.l[i])));
    const total = [P(F), M.row(M.sum(M.row(M.i("i"), M.o("="), M.n(1)), M.i("k")), P(Ei), M.o("·"), P(given(F, Ei))), sumTerms(terms, 5), r4(V.PF)];

  /* ---------- mosaic ---------- */
  let G = null;
  function geometry(b){
    const m = 14, barW = 64, gap = 46, top = 34, bottom = b.h - 46;
    const W = b.w - 2 * m - barW - gap, H = bottom - top;

      if (w > 3){ c.strokeStyle = on ? C.accent : C.muted; c.lineWidth = on ? 2.5 : 1.5; c.beginPath(); c.moveTo(x + 1, fy); c.lineTo(x + w - 1, fy); c.stroke(); }

    // posterior bar: F alone, split by where it came from
    b.text(t("bayes.onlyF"), g.barX + g.barW / 2, g.top - 14, { size: 11.5, color: C.muted });
    let y = g.top;
    V.post.forEach((q, i) => {
      const h = q * g.H, on = i === V.j;
      c.save(); c.fillStyle = C.accent; c.globalAlpha = on ? .6 : .22; c.fillRect(g.barX, y, g.barW, h); c.restore();
      if (h > 16) b.text(on ? pShow(q) : `E${i + 1}`, g.barX + g.barW / 2, y + h / 2, { size: on ? 12.5 : 11, weight: on ? 600 : 500, color: C.ink });
      y += h;
      if (i < V.k - 1){ c.strokeStyle = C.surface; c.lineWidth = 2; c.beginPath(); c.moveTo(g.barX, y); c.lineTo(g.barX + g.barW, y); c.stroke(); }
    });
    c.strokeStyle = C.line; c.lineWidth = 1; c.strokeRect(g.barX + .5, g.top + .5, g.barW, g.H);
    b.text(`P(F) = ${pShow(V.PF)}`, g.barX + g.barW / 2, g.bottom + 13, { size: 11.5, color: C.muted });
    // arrow from the mosaic to the bar
    const ax = g.m + g.W + 8, ay = (g.top + g.bottom) / 2;
    c.strokeStyle = C.faint; c.lineWidth = 1.5; c.beginPath(); c.moveTo(ax, ay); c.lineTo(g.barX - 8, ay);
    c.moveTo(g.barX - 13, ay - 5); c.lineTo(g.barX - 8, ay); c.lineTo(g.barX - 13, ay + 5); c.stroke();
  }
  const board = new Board(el("plot"), {
    draw,
    hit(x, y){
      if (!G || y < G.top - 4 || y > G.bottom + 4) return null;
      for (let i = 1; i < V.k; i++) if (Math.abs(x - G.xs[i]) < 6) return { type: "split", i };
      for (let i = 0; i < V.k; i++){
        const x0 = G.xs[i], w = V.p[i] * G.W, fy = G.bottom - V.l[i] * G.H;

      }
      return null;
    },

      if (tg.type === "lik"){

        if (tg.i !== S.target) S.target = tg.i;
      } else {
        const i = tg.i, a = parseProb(S.rows[i - 1][0]), bb = parseProb(S.rows[i][0]), pair = a + bb;
        const pa = clamp(Math.round((x - G.xs[i - 1]) / G.W * 100) / 100, 0, pair);
        S.rows[i - 1][0] = trim(pa, 4); S.rows[i][0] = trim(pair - pa, 4);

      S.example = null; update();
    },
    click(x, y){
      if (!G || y < G.top || y > G.bottom + 36) return;

    },
  });

  /* ---------- events ---------- */
  bindCopy($(".sections", root));
  el("evTable").addEventListener("click", e => {
    const tg = e.target.closest("[data-target]"), del = e.target.closest("[data-del]");
    if (tg){ S.target = +tg.dataset.target; update(); }
    if (del && S.rows.length > 2){
      const i = +del.dataset.del; S.rows.splice(i, 1);
      if (S.target >= S.rows.length) S.target = S.rows.length - 1; else if (S.target > i) S.target--;
      S.example = null; buildRows(); update();
    }
  });
  el("addBtn").addEventListener("click", () => {
    if (S.rows.length >= MAXK) return;
    S.rows.push(["0", "0.1"]); S.example = null; buildRows(); update();
  });
  el("eqBtn").addEventListener("click", () => {
    const k = S.rows.length; S.rows.forEach(r => { r[0] = `1/${k}`; }); S.example = null; update();
  });
  el("examples").innerHTML = examplesHtml(exList(), S.example);
  el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });
  const onTheme = () => board.draw();
  document.addEventListener("themechange", onTheme);
  buildRows(); update();
  return () => { board.destroy(); document.removeEventListener("themechange", onTheme); };
};

"use strict";
/* ============================================================
   Page: Expected value (with variance) of a discrete random variable
     E(X) = Σ x·p(x)
     V(X) = Σ x²·p(x) − [E(X)]²      σ = √V(X)
     E(aX + b) = a·E(X) + b          V(aX + b) = a²·V(X)
   Sources: Barbetta 5.1.3 (eq. 5.2 to 5.5) · Bussab & Morettin 6.3
   ============================================================ */
PAGES["expected-value"] = function ExpectedValuePage(root){
  const S = ExpectedValuePage.state || (ExpectedValuePage.state = {
    rows: [["0", "1/4"], ["1", "1/2"], ["2", "1/4"]], a: "1", b: "0", example: "coins", range: null
  });
  const MAXK = 12;

  /* ---------- maths ---------- */
  function values(st = S){
    const x = st.rows.map(r => parseNum(r[0])), p = st.rows.map(r => parseProb(r[1]));
    const a = parseNum(st.a), b = parseNum(st.b);
    if (x.some(v => v == null)) return { err: "ev.err.x" };
    if (new Set(x).size < x.length) return { err: "ev.err.dup" };
    if (p.some(v => v == null || v < 0 || v > 1)) return { err: "ev.err.p" };
    const sum = p.reduce((s, v) => s + v, 0);
    if (Math.abs(sum - 1) > 1e-3) return { err: "ev.err.sum", sum, x, p };
    if (a == null || b == null) return { err: "ev.err.ab" };
    const E = x.reduce((s, v, i) => s + v * p[i], 0), E2 = x.reduce((s, v, i) => s + v * v * p[i], 0);
    const Var = Math.max(0, E2 - E * E);
    return { x, p, sum, E, E2, V: Var, sd: Math.sqrt(Var), a, b, tr: a !== 1 || b !== 0, EY: a * E + b, VY: a * a * Var, raw: st.rows };
  }

    { id: "coins", rows: [["0", "1/4"], ["1", "1/2"], ["2", "1/4"]], source: "" },

    { id: "pm2", rows: [["-2", "0.2"], ["0", "0.5"], ["2", "0.3"]], source: "" },
    { id: "defects", rows: [["0", "0.36"], ["1", "0.48"], ["2", "0.16"]], source: () => `Barbetta · ${t("exercise")} 5.4` },
    { id: "profit", rows: [["6", "0.7"], ["0", "0.2"], ["-2", "0.1"]], source: () => `Barbetta · ${t("exercise")} 5.5` },
    { id: "profit1", rows: [["6", "0.7"], ["0", "0.2"], ["-2", "0.1"]], a: "1", b: "1", source: () => `Barbetta · ${t("exercise")} 5.5` },
    { id: "profit2", rows: [["6", "0.7"], ["0", "0.2"], ["-2", "0.1"]], a: "2", b: "0", source: () => `Barbetta · ${t("exercise")} 5.5` },
  ];
  const X = M.i("X"), EX = M.row(M.i("E"), M.paren(X)), VX = M.row(M.i("V"), M.paren(X)), Y = M.i("Y");

  const exList = () => EXAMPLES.map(e => ({ id: e.id, title: t("ev.ex." + e.id),
    source: typeof e.source === "function" ? e.source() : e.source,
    answer: answer(values({ rows: e.rows, a: e.a ?? "1", b: e.b ?? "0" })) }));
  function loadExample(id){
    const e = EXAMPLES.find(x => x.id === id); if (!e) return;
    S.rows = e.rows.map(r => [...r]); S.a = e.a ?? "1"; S.b = e.b ?? "0"; S.example = id;

  /* ---------- markup ---------- */
  root.innerHTML = `

    ${sectionsHtml({ about: t("ev.about"), notes: ["note.weights", "note.center", "note.shortcut", "note.linear"].map(k => t("ev." + k)), sources: ["src.barbetta", "src.bussab"].map(k => t("ev." + k)) })}

  const el = id => $("#" + id, root);
  let V = values();

  function buildRows(){
    el("xpTable").innerHTML = `
      <span class="ev-h"><math><mi>x</mi></math></span><span class="ev-h"><math>${M.row(M.i("p"), M.paren(M.i("x")))}</math></span><span></span>
      ${S.rows.map((r, i) => `
        ${numInput("x" + i, 1, `data-i="${i}" data-c="0"`)}${numInput("p" + i, 0.01, `data-i="${i}" data-c="1"`)}

    $$("#xpTable .num", root).forEach(inp => {

  }
  function syncInputs(){
    $$("#xpTable .num", root).forEach(inp => {
      if (inp === document.activeElement) return;
      const r = S.rows[+inp.dataset.i]; inp.value = +inp.dataset.c ? probIn(r[1]) : loc(r[0]);
    });
    for (const [id, k] of [["aN", "a"], ["bN", "b"]]) if (el(id) !== document.activeElement) el(id).value = loc(S[k]);
  }

  /* ---------- render ---------- */
  function update(fromInput){
    V = values();
    if (!fromInput) syncInputs();
    el("err").hidden = !V.err; el("normBtn").hidden = V.err !== "ev.err.sum";
    if (V.err){ el("err").textContent = t(V.err, { s: show(trim(V.sum ?? 0, 4)) }); plot.draw(); return; }
    const n4 = v => M.n(trim(v, 4)), v4 = v => M.v(trim(v, 4)), r4 = v => M.r(trim(v, 4)), xm = v => v < 0 ? M.paren(M.v(trim(v, 6))) : M.v(trim(v, 6));
    const px = M.row(M.i("p"), M.paren(M.i("x")));
    const terms = V.x.map((x, i) => M.row(xm(x), M.o("·"), probMath(V.raw[i][1], V.p[i])));
    const terms2 = V.x.map((x, i) => M.row(M.sup(xm(x), M.n(2)), M.o("·"), probMath(V.raw[i][1], V.p[i])));
    const rows = [
      { label: t("ev.f.E"), chain: [EX, M.row(`<mo>∑</mo>`, M.i("x"), M.o("·"), px), sumTerms(terms, 6), r4(V.E)] },
      { label: t("ev.f.V"), chain: [VX, M.row(`<mo>∑</mo>`, M.sup(M.i("x"), M.n(2)), M.o("·"), px, M.o(MINUS), M.sup(M.brack(EX), M.n(2))),
        M.row(sumTerms(terms2, 6), M.o(MINUS), M.sup(xm(+trim(V.E, 4)), M.n(2))), M.row(n4(V.E2), M.o(MINUS), n4(V.E * V.E)), r4(V.V)] },
      { label: t("ev.f.sd"), chain: [M.i("σ"), M.sqrt(VX), M.sqrt(v4(V.V)), r4(V.sd)] },
    ];
    if (V.tr){
      const a = M.v(trim(V.a, 6)), b = V.b < 0 ? M.row(M.o(MINUS), M.v(trim(-V.b, 6))) : M.row(M.o("+"), M.v(trim(V.b, 6)));
      rows.push({ label: t("ev.f.Y"), html:
        M.math(M.row(EY_, M.o("="), M.i("a"), EX, M.o("+"), M.i("b"), M.o("="), a, M.o("·"), v4(V.E), b, M.o("="), r4(V.EY))) +
        M.math(M.row(VY_, M.o("="), M.sup(M.i("a"), M.n(2)), VX, M.o("="), M.sup(V.a < 0 ? M.paren(a) : a, M.n(2)), M.o("·"), v4(V.V), M.o("="), r4(V.VY))) });
    }
    const box = el("frows");
    box.innerHTML = rows.map((r, i) => `<div class="frow"><span class="flabel">${r.label}</span><div class="fmath" data-row="${i}">${r.chain ? M.math(M.row(r.chain.join(M.o("=")))) : r.html}</div></div>`).join("");
    rows.forEach((r, i) => { if (!r.chain) return; const f = $(`[data-row="${i}"]`, box); if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 2); });
    const vars = [
      [EX, t("ev.sym.E"), show(trim(V.E, 4))], [VX, t("ev.sym.V"), show(trim(V.V, 4))], [M.i("σ"), t("ev.sym.sd"), show(trim(V.sd, 4))],
      [M.i("x"), t("ev.sym.x"), ""], [px, t("ev.sym.p"), ""],
      [M.row(`<mo>∑</mo>`, M.sup(M.i("x"), M.n(2)), M.o("·"), px), t("ev.sym.E2"), show(trim(V.E2, 4))],
    ];
    if (V.tr) vars.push([M.i("a"), t("ev.sym.a"), show(trim(V.a, 6))], [M.i("b"), t("ev.sym.b"), show(trim(V.b, 6))],
      [EY_, t("ev.sym.EY"), show(trim(V.EY, 4))], [VY_, t("ev.sym.VY"), show(trim(V.VY, 4))]);
    el("vars").innerHTML = varsTableHtml(vars);
    el("big").textContent = show(trim(V.E, 4));
    el("sub").innerHTML = `<math>${EX}</math>`;
    const facts = [[`<math>${VX}</math>`, show(trim(V.V, 4))], [t("ev.fact.sd"), show(trim(V.sd, 4))], [`<math>${M.row(`<mo>∑</mo>`, M.i("p"), M.paren(M.i("x")))}</math>`, show(trim(V.sum, 4))]];
    if (V.tr) facts.push([`<math>${EY_}</math>`, show(trim(V.EY, 4))], [`<math>${VY_}</math>`, show(trim(V.VY, 4))]);
    el("facts").innerHTML = facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    el("chips").innerHTML = `<span class="chip"><span class="sw"></span>X</span>` + (V.tr ? `<span class="chip pinned"><span class="sw"></span>Y = aX + b</span>` : "");
    const L = [`# ${t("ev.title")}`,
      `x <- c(${V.x.map(v => trim(v, 6)).join(", ")})`,
      `p <- c(${V.raw.map(r => rProb(r[1])).join(", ")})`,
      rLine("sum(p)", t("ev.r.sum"), 34),
      rLine("EX <- sum(x * p)", `E(X): ${trim(V.E, 4)}`, 34),
      rLine("VX <- sum(x^2 * p) - EX^2", `V(X): ${trim(V.V, 4)}`, 34),
      rLine("sqrt(VX)", `σ: ${trim(V.sd, 4)}`, 34)];
    if (V.tr) L.push(rLine(`a <- ${trim(V.a, 6)}; b <- ${trim(V.b, 6)}`, "", 34), rLine("a * EX + b", `E(Y): ${trim(V.EY, 4)}`, 34), rLine("a^2 * VX", `V(Y): ${trim(V.VY, 4)}`, 34));
    el("rcode").innerHTML = codeHtml(L.join("\n"));
    markExample(el("examples"), S.example);
    plot.draw();
  }

  /* ---------- graph ---------- */
  const allX = () => {
    const xs = S.rows.map(r => parseNum(r[0])).filter(v => v != null);
    const a = parseNum(S.a), b = parseNum(S.b);
    return a != null && b != null && (a !== 1 || b !== 0) ? [...xs, ...xs.map(x => a * x + b)] : xs;
  };
  function fit(){
    const xs = allX(); if (!xs.length) return;
    const lo = Math.min(...xs), hi = Math.max(...xs), w = Math.max(hi - lo, 2);
    plot.x0 = lo - 0.15 * w - 0.5; plot.x1 = hi + 0.15 * w + 0.5; plot.draw();
  }
  function fitIfLost(){ const xs = allX(); if (xs.some(x => x < plot.x0 || x > plot.x1)) fit(); }
  let yTop = 1;
  function drawPlot(p){
    const C = p.colors(), c = p.ctx, ok = !V.err || V.err === "ev.err.sum";
    const xs = ok ? (V.x || []) : [], ps = ok ? (V.p || []) : [];
    if (!(p.drag?.type === "handle")) yTop = Math.max(0.1, ...ps) * 1.3;
    p.y0 = 0; p.y1 = yTop;
    p.grid(C);
    if (!xs.length) return;
    const sorted = [...xs].sort((a, b) => a - b); let gap = Infinity;
    for (let i = 1; i < sorted.length; i++) gap = Math.min(gap, sorted[i] - sorted[i - 1]);
    let w = Math.min(0.5, isFinite(gap) ? gap * 0.5 : 0.5);
    if (V.tr && !V.err){ const ys = xs.map(x => V.a * x + V.b).sort((a, b) => a - b); for (let i = 1; i < ys.length; i++) w = Math.min(w, (ys[i] - ys[i - 1]) * 0.5); }
    w = Math.max(w, (p.x1 - p.x0) / p.pw * 3);
    p.bars(xs.map((x, i) => ({ x, y: ps[i], on: true })), C, w);
    // Y = aX + b: same probabilities at the new values
    if (V.tr && !V.err){
      c.save(); c.setLineDash([4, 3]); c.strokeStyle = C.pin; c.lineWidth = 1.5;
      xs.forEach((x, i) => { const y = V.a * x + V.b; c.strokeRect(p.X(y - w / 2), p.Y(ps[i]), p.X(y + w / 2) - p.X(y - w / 2), p.Y(0) - p.Y(ps[i])); });
      c.restore();
      p.vline(V.EY, C.pin, [5, 4], p.y1, 1.5);
    }
    xs.forEach((x, i) => {   // grab knob on each bar top
      if (x < p.x0 || x > p.x1) return;
      c.fillStyle = C.surface; c.strokeStyle = C.accent; c.lineWidth = 2;
      c.beginPath(); c.arc(p.X(x), p.Y(ps[i]), 4.5, 0, Math.PI * 2); c.fill(); c.stroke();
      if (p.X(x + w / 2) - p.X(x - w / 2) > 30 || xs.length <= 8){
        c.font = `11px ${C.font}`; c.textAlign = "center"; c.textBaseline = "bottom"; c.lineJoin = "round";
        c.strokeStyle = C.surface; c.lineWidth = 4; c.strokeText(show(trim(ps[i], 4)), p.X(x), p.Y(ps[i]) - 8);
        c.fillStyle = C.muted; c.fillText(show(trim(ps[i], 4)), p.X(x), p.Y(ps[i]) - 8);
      }
    });
    if (V.err) return;
    // E(X) as the balance point, and E(X) ± σ
    const axis = p.Y(0), ex = p.X(V.E);
    for (const s of [-1, 1]) p.vline(V.E + s * V.sd, C.muted, [3, 4], p.y1, 1);
    p.vline(V.E, C.accent, [], p.y1, 1.5);
    if (V.E >= p.x0 && V.E <= p.x1){
      c.fillStyle = C.accent; c.beginPath(); c.moveTo(ex, axis - 9); c.lineTo(ex - 8, axis + 1); c.lineTo(ex + 8, axis + 1); c.closePath(); c.fill();
    }
    const [l, r] = p.pill(ex, 6, `E(X) = ${show(trim(V.E, 3))}`, C, true);
    if (V.tr){ const ey = p.X(V.EY); p.pill(ey, ey > l - 60 && ey < r + 60 ? 30 : 6, `E(Y) = ${show(trim(V.EY, 3))}`, C, false); }
    c.font = `11px ${C.font}`; c.fillStyle = C.muted; c.textBaseline = "top";
    if (V.sd > 0){ c.textAlign = "right"; c.fillText("E(X) − σ", p.X(V.E - V.sd) - 4, p.pad.t + 4); c.textAlign = "left"; c.fillText("E(X) + σ", p.X(V.E + V.sd) + 4, p.pad.t + 4); }
  }
  const plot = new Plot(el("plot"), {
    draw: drawPlot,
    handles: () => (V.err && V.err !== "ev.err.sum") ? [] : (V.x || []).map((x, i) => ({ key: i, x, py: plot.Y(V.p[i]), r: 12 })),
    onFit: fit,
    onHandle(i, x, y){
      const v = clamp(Math.round(y * 100) / 100, 0, 1), ps = S.rows.map(r => parseProb(r[1]) ?? 0);
      const rest = ps.reduce((s, q, j) => j === i ? s : s + q, 0), k = S.rows.length;
      S.rows[i][1] = trim(v, 2);
      if (k > 1){
        const others = S.rows.map((_, j) => j).filter(j => j !== i);
        others.forEach(j => { S.rows[j][1] = trim(rest > 0 ? ps[j] * (1 - v) / rest : (1 - v) / (k - 1), 4); });
        const big = others.reduce((m, j) => (parseProb(S.rows[j][1]) > parseProb(S.rows[m][1]) ? j : m), others[0]);
        const sumOthers = others.reduce((s, j) => j === big ? s : s + parseProb(S.rows[j][1]), 0);
        S.rows[big][1] = trim(Math.max(0, 1 - v - sumOthers), 4);
      }
      S.example = null; update();
    },
  });

  /* ---------- events ---------- */
  bindCopy($(".sections", root)); bindNudge($(".ab-row", root));
  el("xpTable").addEventListener("click", e => {
    const del = e.target.closest("[data-del]"); if (!del || S.rows.length <= 1) return;
    S.rows.splice(+del.dataset.del, 1); S.example = null; buildRows(); update();
  });
  el("addBtn").addEventListener("click", () => {
    if (S.rows.length >= MAXK) return;
    const xs = S.rows.map(r => parseNum(r[0])).filter(v => v != null);
    S.rows.push([String(xs.length ? Math.max(...xs) + 1 : 0), "0"]); S.example = null; buildRows(); update(); fitIfLost();
  });
  el("normBtn").addEventListener("click", () => {
    const ps = S.rows.map(r => parseProb(r[1]) ?? 0), s = ps.reduce((a, b) => a + b, 0); if (!(s > 0)) return;
    S.rows.forEach((r, i) => { r[1] = trim(ps[i] / s, 4); }); S.example = null; update();
  });
  for (const [id, k] of [["aN", "a"], ["bN", "b"]]){
    el(id).addEventListener("input", () => { const v = parseNum(el(id).value); el(id).setAttribute("aria-invalid", v == null); if (v != null){ S[k] = String(v); S.example = null; update(true); fitIfLost(); } });
    el(id).addEventListener("change", () => { fitIfLost(); update(); });
  }
  el("fitBtn").addEventListener("click", fit);
  el("examples").innerHTML = examplesHtml(exList(), S.example);
  el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });
  const onTheme = () => plot.draw();
  document.addEventListener("themechange", onTheme);
  buildRows();
  if (S.range) [plot.x0, plot.x1] = S.range; else fit();
  update();
  return () => { S.range = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
};

"use strict";
/* Binomial distribution: Barbetta 5.2.2 (eq. 5.13–5.15) · Bussab & Morettin 6.6 */
PAGES["binomial"] = distPage({
  id: "binomial", key: "bin", kind: "discrete",
  params: [
    { key: "n", sym: M.i("n"), def: 18, min: 1, max: 60, step: 1, int: true, ok: v => v >= 1 && v <= 5000 },
    { key: "p", sym: M.i("p"), def: 0.1, min: 0.01, max: 0.99, step: 0.01, ok: v => v >= 0 && v <= 1 },
  ],
  initial: { mode: "eq", a: 2, b: 4, example: "water" },
  support: P => [0, P.n],
  view: P => {
    if (P.n <= 40) return [0, P.n];
    const m = P.n * P.p, sd = Math.sqrt(P.n * P.p * (1 - P.p));
    return [Math.max(0, Math.floor(m - 5 * sd - 2)), Math.min(P.n, Math.ceil(m + 5 * sd + 2))];
  },
  pf: (x, P) => {
    if (!Number.isInteger(x) || x < 0 || x > P.n) return 0;
    if (P.p === 0) return x === 0 ? 1 : 0;
    if (P.p === 1) return x === P.n ? 1 : 0;
    return Math.exp(Num.lchoose(P.n, x) + x * Math.log(P.p) + (P.n - x) * Math.log(1 - P.p));
  },
  mean: P => P.n * P.p,
  variance: P => P.n * P.p * (1 - P.p),
  math: {
    general: () => M.row(M.binom(M.i("n"), M.i("x")), M.sup(M.i("p"), M.i("x")),
      M.sup(M.paren(M.row(M.n(1), M.o(MINUS), M.i("p"))), M.row(M.i("n"), M.o(MINUS), M.i("x")))),
    at: (x, P) => M.row(M.binom(M.v(P.n), M.v(x)), M.o("·"), M.sup(M.v(trim(P.p, 4)), M.v(x)), M.o("·"),
      M.sup(M.v(trim(1 - P.p, 4)), M.v(P.n - x))),
    atNum: (x, P) => M.row(M.n(String(Num.choose(P.n, x))), M.o("·"), M.sig(P.p ** x), M.o("·"), M.sig((1 - P.p) ** (P.n - x))),
    mean: { general: () => M.row(M.i("n"), M.i("p")), sub: P => M.row(M.v(P.n), M.o("·"), M.v(trim(P.p, 4))) },
    variance: {
      general: () => M.row(M.i("n"), M.i("p"), M.paren(M.row(M.n(1), M.o(MINUS), M.i("p")))),
      sub: P => M.row(M.v(P.n), M.o("·"), M.v(trim(P.p, 4)), M.o("·"), M.v(trim(1 - P.p, 4))),
    },
  },
  extraVars: (P, S) => S.mode === "eq" ? [[M.binom(M.i("n"), M.i("x")), t("bin.sym.C"), fmtInt(Num.choose(P.n, S.a))]] : [],
  r: { d: "dbinom", p: "pbinom", args: P => `size = ${P.n}, prob = ${trim(P.p, 6)}`, mean: P => `${P.n} * ${trim(P.p, 6)}` },
  examples: [
    { id: "water",   set: { P: { n: 18, p: 0.1 }, mode: "eq", a: 2 },           source: "" },
    { id: "water4",  set: { P: { n: 18, p: 0.1 }, mode: "ge", a: 4 },           source: "" },
    { id: "water37", set: { P: { n: 18, p: 0.1 }, mode: "between", a: 3, b: 7 }, source: "" },
    { id: "orange",  set: { P: { n: 4, p: 0.3 }, mode: "eq", a: 2 },            source: "Barbetta · Ex. 5.2" },
    { id: "web",     set: { P: { n: 10, p: 0.7 }, mode: "ge", a: 6 },           source: "Barbetta · Ex. 5.2" },
    { id: "bits",    set: { P: { n: 4, p: 0.1 }, mode: "eq", a: 2 },            source: "" },
  ],
  notes: ["note.cond", "note.shape", "note.table"],
  sources: ["src.barbetta", "src.bussab"],
});

"use strict";
/* Hypergeometric distribution: Barbetta 5.2.3 (eq. 5.16–5.18) · Bussab & Morettin 6.6 */
PAGES["hypergeometric"] = distPage({
  id: "hypergeometric", key: "hyp", kind: "discrete",
  params: [
    { key: "N", sym: M.i("N"), def: 30, min: 1, max: 200, step: 1, int: true, ok: v => v >= 1 && v <= 100000 },
    { key: "r", sym: M.i("r"), def: 3, min: 0, max: 60, step: 1, int: true, ok: v => v >= 0 && v <= 100000 },
    { key: "n", sym: M.i("n"), def: 5, min: 1, max: 60, step: 1, int: true, ok: v => v >= 1 && v <= 100000 },
  ],
  initial: { mode: "ge", a: 1, b: 2, example: "cards" },
  check: P => P.r > P.N ? "err.r" : P.n > P.N ? "err.n" : null,
  support: P => [Math.max(0, P.n - (P.N - P.r)), Math.min(P.r, P.n)],
  view: P => [Math.max(0, P.n - (P.N - P.r)), Math.min(P.r, P.n)],
  pf: (x, P) => {
    const lo = Math.max(0, P.n - (P.N - P.r)), hi = Math.min(P.r, P.n);
    if (!Number.isInteger(x) || x < lo || x > hi) return 0;
    return Math.exp(Num.lchoose(P.r, x) + Num.lchoose(P.N - P.r, P.n - x) - Num.lchoose(P.N, P.n));
  },
  mean: P => P.n * P.r / P.N,
  variance: P => { const p = P.r / P.N; return P.N > 1 ? P.n * p * (1 - p) * (P.N - P.n) / (P.N - 1) : 0; },
  math: {
    general: () => M.frac(M.row(M.binom(M.i("r"), M.i("x")), M.binom(M.row(M.i("N"), M.o(MINUS), M.i("r")), M.row(M.i("n"), M.o(MINUS), M.i("x")))),
      M.binom(M.i("N"), M.i("n"))),
    at: (x, P) => M.frac(M.row(M.binom(M.v(P.r), M.v(x)), M.binom(M.v(P.N - P.r), M.v(P.n - x))), M.binom(M.v(P.N), M.v(P.n))),
    atNum: (x, P) => {
      const big = v => v > 1e15 ? M.sig(v) : M.n(String(v));
      return M.frac(M.row(big(Num.choose(P.r, x)), M.o("·"), big(Num.choose(P.N - P.r, P.n - x))), big(Num.choose(P.N, P.n)));
    },
    mean: { general: () => M.row(M.i("n"), M.frac(M.i("r"), M.i("N"))), sub: P => M.row(M.v(P.n), M.o("·"), M.frac(M.v(P.r), M.v(P.N))) },
    variance: {
      general: () => M.row(M.i("n"), M.i("p"), M.paren(M.row(M.n(1), M.o(MINUS), M.i("p"))), M.frac(M.row(M.i("N"), M.o(MINUS), M.i("n")), M.row(M.i("N"), M.o(MINUS), M.n(1)))),
      sub: P => { const p = trim(P.r / P.N, 4); return M.row(M.v(P.n), M.o("·"), M.v(p), M.o("·"), M.v(trim(1 - P.r / P.N, 4)), M.o("·"),
        M.frac(M.row(M.v(P.N), M.o(MINUS), M.v(P.n)), M.row(M.v(P.N), M.o(MINUS), M.n(1)))); },
    },
  },
  extraVars: P => [[M.row(M.i("p"), M.o("="), M.frac(M.i("r"), M.i("N"))), t("hyp.sym.pRatio"), show(trim(P.r / P.N, 4))]],
  r: { d: "dhyper", p: "phyper", args: P => `m = ${P.r}, n = ${P.N - P.r}, k = ${P.n}`, mean: P => `${P.n} * ${P.r} / ${P.N}`,
       note: () => t("hyp.r.note") },
  examples: [
    { id: "cards", set: { P: { N: 30, r: 3, n: 5 }, mode: "ge", a: 1 },   source: "Barbetta · Ex. 5.3" },
    { id: "lot20", set: { P: { N: 20, r: 5, n: 4 }, mode: "eq", a: 2 },   source: "Bussab & Morettin · Ex. 5.8" },
    { id: "lot100", set: { P: { N: 100, r: 10, n: 10 }, mode: "eq", a: 0 }, source: "" },
  ],
  notes: ["note.when", "note.approx"],
  sources: ["src.barbetta", "src.bussab"],
});

"use strict";
/* Poisson distribution: Barbetta 5.2.4 (eq. 5.21–5.24) · Bussab & Morettin 6.6–6.7 */
PAGES["poisson"] = distPage({
  id: "poisson", key: "poi", kind: "discrete",
  params: [
    { key: "lambda", sym: M.i("λ"), def: 3, min: 0.1, max: 30, step: 0.1, ok: v => v > 0 && v <= 100000 },
  ],
  initial: { mode: "le", a: 2, b: 4, example: "queries" },

/* ---- js/pages/dist/normal.js ---- */
"use strict";
/* Normal distribution: Barbetta 6.2.3 (eq. 6.19–6.24, Tabela 3) · Bussab & Morettin 7.4 */
(() => {
  const zOf = (v, P, O) => { const z = (v - P.mu) / P.sigma; return O?.zTable ? Math.round(z * 100) / 100 : z; };
  PAGES["normal"] = distPage({
    id: "normal", key: "nor", kind: "continuous",
    params: [
      { key: "mu",    sym: M.i("μ"), def: 10, min: -50, max: 100, step: 0.1, ok: v => isFinite(v) },
      { key: "sigma", sym: M.i("σ"), def: 2, min: 0.1, max: 30, step: 0.05, ok: v => v > 0 },
    ],
    options: [{ key: "zTable", def: true }],
    initial: { mode: "ge", a: 13, b: 14, example: "current" },
    support: () => [-Infinity, Infinity],
    view: P => [P.mu - 4 * P.sigma, P.mu + 4 * P.sigma],
    pf: (x, P) => Num.normPdf(x, P.mu, P.sigma),
    cdf: (x, P) => Num.Phi((x - P.mu) / P.sigma),
    inv: (p, P, O) => { const z = Num.PhiInv(p); return P.mu + P.sigma * (O?.zTable ? Math.round(z * 100) / 100 : z); },
    prob(mode, a, b, P, O){
      if (!O?.zTable) return null;
      // As with Barbetta's Table 3: z with 2 decimals, upper-tail area P(Z > |z|) with 4 decimals.
      const tail = z => Math.round((1 - Num.Phi(Math.abs(z))) * 1e4) / 1e4;
      const F = v => { const z = zOf(v, P, O); return z >= 0 ? 1 - tail(z) : tail(z); };
      const lo = Math.min(a, b ?? a), hi = Math.max(a, b ?? a);
      return { le: F(a), ge: 1 - F(a), between: Math.max(0, F(hi) - F(lo)), outside: F(lo) + 1 - F(hi) }[mode];
    },
    mean: P => P.mu,
    variance: P => P.sigma ** 2,
    math: {
      general: () => M.row(M.frac(M.n(1), M.row(M.i("σ"), M.sqrt(M.row(M.n(2), M.up("π"))))),
        M.sup(M.up("e"), M.row(M.o(MINUS), M.frac(M.sup(M.paren(M.row(M.i("x"), M.o(MINUS), M.i("μ"))), M.n(2)), M.row(M.n(2), M.sup(M.i("σ"), M.n(2))))))),
      at: (_, P) => M.row(M.frac(M.n(1), M.row(M.v(trim(P.sigma, 4)), M.sqrt(M.row(M.n(2), M.up("π"))))),
        M.sup(M.up("e"), M.row(M.o(MINUS), M.frac(M.sup(M.paren(M.row(M.i("x"), M.vminus(trim(P.mu, 4)))), M.n(2)), M.row(M.n(2), M.o("·"), M.sup(M.v(trim(P.sigma, 4)), M.n(2))))))),
      cdfSteps: (v, P, O) => [
        M.row(M.up("Φ"), M.paren(M.frac(M.row(M.v(trim(v, 4)), M.vminus(trim(P.mu, 4))), M.v(trim(P.sigma, 4))))),
        M.row(M.up("Φ"), M.paren(M.n(O?.zTable ? zOf(v, P, O).toFixed(2) : trim(zOf(v, P, O), 4)))),
      ],
      mean: { general: () => M.i("μ"), sub: P => M.v(trim(P.mu, 4)) },
      variance: { general: () => M.sup(M.i("σ"), M.n(2)), sub: P => M.sup(M.v(trim(P.sigma, 4)), M.n(2)) },
    },
    extraVars: (P, S) => {
      const z = M.i("z"), out = [];
      const zs = v => show(S.O.zTable ? zOf(v, P, S.O).toFixed(2) : trim(zOf(v, P, S.O), 4));
      if (S.mode === "between" || S.mode === "outside"){
        out.push([M.sub(z, M.i("a")), t("nor.sym.z"), zs(Math.min(S.a, S.b))], [M.sub(z, M.i("b")), t("nor.sym.z"), zs(Math.max(S.a, S.b))]);
      } else out.push([z, t("nor.sym.z"), zs(S.a)]);
      out.push([M.up("Φ"), t("nor.sym.Phi"), ""]);
      return out;
    },
    r: { d: "dnorm", p: "pnorm", q: "qnorm", args: P => `mean = ${trim(P.mu, 6)}, sd = ${trim(P.sigma, 6)}`, mean: P => `${trim(P.mu, 6)}`,
         note: (_, O) => O.zTable ? t("nor.r.note") : null },
    examples: [
      { id: "current",   set: { P: { mu: 10, sigma: 2 }, mode: "ge", a: 13 },              source: "" },
      { id: "current911", set: { P: { mu: 10, sigma: 2 }, mode: "between", a: 9, b: 11 },  source: "" },
      { id: "tiles",     set: { P: { mu: 2.5, sigma: 0.6 }, mode: "between", a: 2, b: 3.5 }, source: "Barbetta · Ex. 6.6" },
      { id: "z042",      set: { P: { mu: 0, sigma: 1 }, mode: "le", a: 0.42 },             source: "Barbetta · Ex. 6.4" },
      { id: "z042b",     set: { P: { mu: 0, sigma: 1 }, mode: "between", a: -0.42, b: 0.42 }, source: "Barbetta · Ex. 6.4" },
      { id: "tax",       set: { P: { mu: 60000, sigma: 10000 }, mode: "ge", a: 75000 },    source: "" },
      { id: "tax5070",   set: { P: { mu: 60000, sigma: 10000 }, mode: "between", a: 50000, b: 70000 }, source: "" },
    ],
    notes: ["note.z", "note.table", "note.rule"],
    sources: ["src.barbetta", "src.bussab"],
  });
})();

/* ---- js/pages/sample-size.js ---- */
"use strict";
/* ============================================================
   Page: Sample size — the reference for the page format.

     n₀ = z²σ²/ε²             mean (σ known; with a pilot sample use s and t)
     n₀ = z²p(1 − p)/ε²       proportion
     n₀ = z²/(4ε²)            proportion with no prior estimate, since p(1 − p) ≤ 1/4
     n  = n₀                  infinite (or very large) population
     n  = N·n₀/(N + n₀ − 1)   population of known size N
   Always rounded up.
   Sources: Barbetta 7.4 (Quadro 7.1) · Bussab & Morettin 10.11

   Page format (copy it for new pages):
     title → graph + controls + result → formulas with a table of the variables
     → about (short explanation, good to know) → examples → R code → sources
   ============================================================ */
PAGES["sample-size"] = function SampleSizePage(root){
  const S = SampleSizePage.state || (SampleSizePage.state = {
    target: "prop",              // "mean" | "prop"
    conf: 95, zTable: true,      // confidence level γ (%), round z or t to 3 decimals like a printed table
    epsMean: 0.5, sigma: 4,      // mean: margin of error, σ (or s)
    sigmaSrc: "known", pilotN: 10,   // "known" σ, or "pilot" sample of size pilotN (uses t)
    epsProp: 0.02, p: 0.5, worst: true,  // proportion: margin, estimate, use p(1−p) ≤ 1/4
    finite: true, N: 3000,       // population size known?
    view: "N", range: {},        // graph view and remembered x-range per view
    example: "cct"               // loaded example, cleared on any edit
  });

  /* ---------- maths (pure: works on any state, so examples can be previewed) ---------- */
  function compute(st){
    const mean = st.target === "mean", usesT = mean && st.sigmaSrc === "pilot";
    const df = usesT ? Math.max(1, Math.round(st.pilotN) - 1) : null;
    const pr = 1 - (1 - st.conf / 100) / 2;
    const exact = usesT ? Num.tInv(pr, df) : Num.PhiInv(pr);
    const crit = st.zTable ? +exact.toFixed(3) : exact;
    const eps = mean ? st.epsMean : st.epsProp;
    const pq = st.worst ? 0.25 : st.p * (1 - st.p);
    const n0Of = e => mean ? crit ** 2 * st.sigma ** 2 / e ** 2 : crit ** 2 * pq / e ** 2;
    const nOf = (N, m) => N * m / (N + m - 1);
    const n0 = n0Of(eps), n = st.finite ? nOf(st.N, n0) : n0;
    return { mean, usesT, df, crit, eps, pq, n0, n, n0Of, nOf, size: ceilN(n) };
  }

  /* ---------- worked examples ---------- */

    { id: "cct",      set: { target: "prop", conf: 95, epsProp: 0.02, worst: true, finite: true, N: 3000 },              source: "" },

    { id: "brand",    set: { target: "prop", conf: 95, epsProp: 0.03, worst: false, p: 0.6, finite: false },             source: "Bussab & Morettin · Ex. 10.14" },
    { id: "pilot",    set: { target: "mean", conf: 95, epsMean: 0.5, sigma: 4, sigmaSrc: "known", finite: false },        source: "Bussab & Morettin · Ex. 10.13" },
    { id: "tv",       set: { target: "mean", conf: 95, epsMean: 0.25, sigma: 1.87, sigmaSrc: "known", finite: false },    source: "" },
    { id: "hardness", set: { target: "mean", conf: 99, epsMean: 0.3, sigma: 0.7352, sigmaSrc: "pilot", pilotN: 10, finite: false }, source: "Barbetta · Ex. 7.5" },
  ];
  const exState = e => ({ ...S, zTable: true, ...e.set });
  const exList = () => EXAMPLES.map(e => ({ id: e.id, title: t("ss.ex." + e.id), source: e.source, answer: `n = ${fmtInt(compute(exState(e)).size)}` }));
  function loadExample(id){
    const e = EXAMPLES.find(x => x.id === id); if (!e) return;
    Object.assign(S, { zTable: true }, e.set, { example: id });
    S.view = S.finite ? "N" : "eps"; S.range = {};
    update(); fit();
  }

  /* ---------- markup ---------- */
  const sym = s => `<span class="sym">${s}</span>`;
  root.innerHTML = `
  <div class="page">
    <header class="page-head"><h1>${t("ss.title")}</h1></header>

    <section class="work">
      <div class="plot-col">
        <div class="plot-bar">
          <div class="seg" role="group" aria-label="${t("graphType")}">
            <button data-view="N" aria-pressed="false">${t("ss.byN")}</button>
            <button data-view="eps" aria-pressed="false">${t("ss.byEps")}</button>
          </div>
          <div class="bar-actions">
            <button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button>
          </div>
        </div>
        <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${t("ss.graph")}"></canvas></div>
        <div class="legend">
          <div class="chips" id="chips"></div>
          <span class="hint" id="hint">${t("ss.hint")}</span>
          <span class="readout" id="readout" hidden></span>
        </div>
      </div>

      <aside class="controls" aria-label="${t("controls")}">
        <div class="group">
          <h2>${t("ss.estimating")}</h2>
          <div class="seg full" role="group" id="targetSeg">
            <button data-target="mean" aria-pressed="false">${t("mean")}</button>
            <button data-target="prop" aria-pressed="false">${t("ss.proportion")}</button>
          </div>
        </div>

        <div class="group">
          <h2>${t("ss.confidence")}</h2>
          <div class="param">
            <label for="confN">${sym("γ")}${t("ss.level")} <span class="unit">(%)</span></label>
            ${numInput("confN", 1)}
          </div>
          <div class="presets" role="group" aria-label="${t("ss.level")}">
            ${[90, 95, 99].map(v => `<button class="btn" data-conf="${v}" aria-pressed="false">${v}%</button>`).join("")}
          </div>
          <div class="zline" id="critLine"></div>
          <label class="check"><input type="checkbox" id="zTable">${t("ss.zTable")}</label>
        </div>

        <div class="group">
          <h2>${t("parameters")}</h2>
          <div class="param">
            <label for="epsN">${sym("ε")}${t("ss.error")} <span class="unit" id="epsPct"></span></label>
            ${numInput("epsN", 0.01)}
            <input id="epsR" type="range" aria-label="${t("ss.error")}">
          </div>
          <div id="meanBox">
            <div class="seg full seg-gap" role="group" id="srcSeg" aria-label="${t("sd")}">
              <button data-src="known" aria-pressed="false">${t("ss.sigmaKnown")}</button>
              <button data-src="pilot" aria-pressed="false">${t("ss.pilot")}</button>
            </div>
            <div class="param">
              <label for="sigN"><span class="sym" id="sigSym">σ</span><span id="sigLbl"></span></label>
              ${numInput("sigN", 0.1)}
              <input id="sigR" type="range" min="0.1" max="20" step="0.01" aria-label="${t("sd")}">
            </div>
            <div class="param" id="pilotRow">
              <label for="pilotN">${sym("n")}${t("ss.pilotSize")}</label>
              ${numInput("pilotN", 1)}
            </div>
          </div>
          <div id="propBox">
            <div class="param">
              <label for="pN">${sym("p")}${t("ss.pEst")}</label>
              ${numInput("pN", 0.01)}
              <input id="pR" type="range" min="0.01" max="0.99" step="0.01" aria-label="${t("ss.pEst")}">
            </div>
            <label class="check"><input type="checkbox" id="worst">${t("ss.worst")}</label>
          </div>
        </div>

        <div class="group">
          <h2>${t("ss.population")}</h2>
          <label class="check check-gap"><input type="checkbox" id="finite">${t("ss.finiteCheck")}</label>
          <div class="param" id="NRow">
            <label for="NN">${sym("N")}${t("ss.popSize")}</label>
            ${numInput("NN", 100)}
            <input id="NR" type="range" min="1" max="7" step="0.01" aria-label="${t("ss.popSize")}">
          </div>
        </div>

        <div class="group result" aria-live="polite">
          <div class="p-big" id="nBig"></div>
          <div class="p-sub" id="nSub"></div>
          <dl class="facts" id="facts"></dl>
        </div>
      </aside>
    </section>

    <section class="formulas" aria-label="${t("formulas")}">
      ${formulasHead()}
      <div class="frow"><span class="flabel">${t("ss.initial")}</span><div class="fmath" id="fN0"></div></div>
      <div class="frow"><span class="flabel" id="fNLabel"></span><div class="fmath" id="fN"></div></div>
      <div id="vars"></div>
    </section>

    ${sectionsHtml({
      about: t("ss.lede", { eps: sym("ε"), gamma: sym("γ"), N: sym("N") }),
      notes: [t("ss.note.round"), t("ss.note.sigma"), t("ss.note.p"), t("ss.note.two"), t("ss.note.N")],
      sources: [t("ss.src.barbetta"), t("ss.src.bussab")],
    })}
  </div>`;

  const el = id => $("#" + id, root);
  const confN = el("confN"), epsN = el("epsN"), epsR = el("epsR"), sigN = el("sigN"), sigR = el("sigR"), pilotN = el("pilotN");
  const pN = el("pN"), pR = el("pR"), NN = el("NN"), NR = el("NR");
  const nf = v => trim(v, 2);   // n₀ and n shown with 2 decimals before rounding

  /* ---------- formulas ---------- */
  const critSym = R => M.sub(M.i(R.usesT ? "t" : "z"), M.i("γ"));
  function renderFormulas(R){
    // in the application, values from the controls are blue (M.v) and results bold (M.r)
    const c2 = M.subsup(M.i(R.usesT ? "t" : "z"), M.i("γ"), M.n(2)), sq = v => M.sup(M.v(v), M.n(2)), dot = M.o("·");
    const n0_ = M.sub(M.i("n"), M.n(0)), N_ = M.i("N"), e = trim(R.eps, 6), cs = trim(R.crit, R.usesT || S.zTable ? 3 : 5);
    const sd = R.usesT ? "s" : "σ";
    let gen, sub;
    if (R.mean){
      gen = M.frac(M.row(c2, M.sup(M.i(sd), M.n(2))), M.sup(M.i("ε"), M.n(2)));
      sub = M.frac(M.row(sq(cs), dot, sq(trim(S.sigma, 4))), sq(e));
    } else if (S.worst){
      gen = M.frac(c2, M.row(M.n(4), M.sup(M.i("ε"), M.n(2))));
      sub = M.frac(sq(cs), M.row(M.n(4), dot, sq(e)));
    } else {
      const p = trim(S.p, 4);
      gen = M.frac(M.row(c2, M.i("p"), M.paren(M.row(M.n(1), M.o(MINUS), M.i("p")))), M.sup(M.i("ε"), M.n(2)));
      sub = M.frac(M.row(sq(cs), dot, M.v(p), dot, M.paren(M.row(M.n(1), M.o(MINUS), M.v(p)))), sq(e));
    }
    let html = M.math(M.row(n0_, M.o("="), gen, M.o("="), sub, M.o("="), M.r(nf(R.n0))));
    if (!R.mean && S.worst) html += M.math(M.row(M.i("p"), M.paren(M.row(M.n(1), M.o(MINUS), M.i("p"))), M.o("≤"), M.frac(M.n(1), M.n(4))), "res");
    if (R.usesT) html += M.math(M.row(critSym(R), M.t(t("ss.withDf")), M.text(t("dfAbbr")), M.o("="), M.i("n"), M.o(MINUS), M.n(1), M.o("="), M.v(String(S.pilotN)), M.o(MINUS), M.n(1), M.o("="), M.r(String(R.df))), "res");
    el("fN0").innerHTML = html;

    el("fNLabel").textContent = S.finite ? t("ss.finite") : t("ss.infinite");
    const then = [M.o("⇒"), M.i("n"), M.o("="), M.r(String(R.size))];
    if (S.finite){
      const Ns = String(S.N), n0s = nf(R.n0);
      el("fN").innerHTML = M.math(M.row(
        M.i("n"), M.o("="), M.frac(M.row(N_, n0_), M.row(N_, M.o("+"), n0_, M.o(MINUS), M.n(1))),
        M.o("="), M.frac(M.row(M.v(Ns), dot, M.v(n0s)), M.row(M.v(Ns), M.o("+"), M.v(n0s), M.o(MINUS), M.n(1))),
        M.o("="), M.n(nf(R.n)), ...then));
    } else {
      el("fN").innerHTML = M.math(M.row(M.i("n"), M.o("="), n0_, M.o("="), M.v(nf(R.n0)), ...then));
    }
  }

  /* ---------- result ---------- */
  function renderResult(R){
    const pct = v => show(trim(v, 2)) + "%";
    el("nBig").textContent = fmtInt(R.size);
    el("nSub").textContent = S.finite ? t("ss.subFinite", { N: fmtInt(S.N), pct: pct(100 * R.size / S.N) }) : t("ss.subInfinite");
    const rows = [[t("ss.crit", { c: R.usesT ? "t" : "z", gamma: show(trim(S.conf, 2)) + "%" }), show(trim(R.crit, R.usesT || S.zTable ? 3 : 5))]];
    if (R.usesT) rows.push([t("ss.dfRow"), String(R.df)]);
    rows.push([t("ss.beforeRound"), show(nf(R.n))]);
    if (S.finite){
      const n0c = ceilN(R.n0), saved = n0c - R.size;
      rows.push([t("ss.n0"), fmtInt(n0c)], [t("ss.saved"), `${fmtInt(saved)} (${pct(n0c ? 100 * saved / n0c : 0)})`]);
    }
    el("facts").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  }

  /* ---------- table of variables (under the formulas) ---------- */
  function renderVars(R){
    const num = v => show(v), dec = R.usesT || S.zTable ? 3 : 5;
    const rows = [
      [M.sub(M.i("n"), M.n(0)), t("ss.sym.n0"), num(nf(R.n0))],
      [M.i("n"), t("ss.sym.n"), fmtInt(R.size)],
    ];
    if (S.finite) rows.push([M.i("N"), t("ss.sym.N"), fmtInt(S.N)]);
    rows.push([M.i("γ"), t("ss.sym.gamma"), num(trim(S.conf, 2)) + "%"]);
    rows.push([critSym(R), R.usesT ? t("ss.sym.t") : t("ss.sym.z"), num(trim(R.crit, dec))]);
    if (R.usesT) rows.push([M.text(t("dfAbbr")), t("ss.sym.df"), String(R.df)]);
    rows.push([M.i("ε"), t("ss.sym.eps"), num(trim(R.eps, 6)) + (R.mean ? "" : ` (${num(trim(R.eps * 100, 3))}%)`)]);
    if (R.mean) rows.push(R.usesT ? [M.i("s"), t("ss.sym.s"), num(trim(S.sigma, 4))] : [M.i("σ"), t("ss.sym.sigma"), num(trim(S.sigma, 4))]);
    else if (S.worst) rows.push([M.row(M.i("p"), M.paren(M.row(M.n(1), M.o(MINUS), M.i("p")))), t("ss.sym.pq"), "≤ " + num("0.25")]);
    else rows.push([M.i("p"), t("ss.sym.p"), num(trim(S.p, 4))]);
    el("vars").innerHTML = varsTableHtml(rows);
  }
  function renderR(R){
    const L = [], conf = trim(S.conf / 100, 4), q = `1 - (1 - conf) / 2`;
    const kind = R.mean ? (R.usesT ? t("ss.r.meanPilot") : t("ss.r.mean")) : (S.worst ? t("ss.r.propWorst") : t("ss.r.prop"));
    L.push(`# ${t("ss.title")}: ${kind}, ${S.finite ? t("ss.r.finite") : t("ss.r.infinite")}`);
    L.push(rLine(`conf <- ${conf}`, t("ss.r.conf")));
    const c = R.usesT ? "t" : "z", exactCall = R.usesT ? `qt(${q}, df = ${R.df})` : `qnorm(${q})`;
    L.push(S.zTable ? rLine(`${c} <- ${trim(R.crit, 3)}`, `${t("ss.r.table")}: ${exactCall}`) : `${c} <- ${exactCall}`);
    L.push(rLine(`e <- ${trim(R.eps, 6)}`, t("ss.r.eps")));
    if (R.mean){
      const v = R.usesT ? "s" : "sigma";
      L.push(rLine(`${v} <- ${trim(S.sigma, 6)}`, R.usesT ? t("ss.r.s") : t("ss.r.sigma")));
      L.push(rLine(`n0 <- ${c}^2 * ${v}^2 / e^2`, t("ss.r.n0")));
    } else if (S.worst){
      L.push(rLine(`n0 <- ${c}^2 / (4 * e^2)`, t("ss.r.n0")));
    } else {
      L.push(rLine(`p <- ${trim(S.p, 6)}`, t("ss.r.p")));
      L.push(rLine(`n0 <- ${c}^2 * p * (1 - p) / e^2`, t("ss.r.n0")));
    }
    if (S.finite){
      L.push(rLine(`N <- ${S.N}`, t("ss.r.N")));
      L.push(`n <- N * n0 / (N + n0 - 1)`);
      L.push(rLine(`ceiling(n)`, `${t("ss.r.up")}: ${R.size}`));
    } else {
      L.push(rLine(`ceiling(n0)`, `${t("ss.r.up")}: ${R.size}`));
    }
    el("rcode").innerHTML = codeHtml(L.join("\n"));
  }

  /* ---------- inputs ---------- */
  function syncInputs(skip, R){
    if (skip !== confN) confN.value = fmtIn(S.conf, 2);
    if (skip !== epsN) epsN.value = fmtIn(R.eps, 6);
    if (skip !== sigN) sigN.value = fmtIn(S.sigma);
    if (skip !== pilotN) pilotN.value = fmtIn(S.pilotN, 0);
    if (skip !== pN) pN.value = fmtIn(S.worst ? 0.5 : S.p);
    if (skip !== NN) NN.value = fmtIn(S.N, 0);
    if (R.mean){ epsR.min = 0.01; epsR.max = Math.max(5, S.sigma * 2); epsR.step = 0.01; }
    else { epsR.min = 0.005; epsR.max = 0.2; epsR.step = 0.001; }
    setSlider(epsR, R.eps); setSlider(sigR, S.sigma); setSlider(pR, S.worst ? 0.5 : S.p); setSlider(NR, Math.log10(S.N));
    pN.disabled = pR.disabled = S.worst;
    el("NRow").hidden = !S.finite;
    el("zTable").checked = S.zTable; el("worst").checked = S.worst; el("finite").checked = S.finite;
    el("meanBox").hidden = !R.mean; el("propBox").hidden = R.mean; el("pilotRow").hidden = !R.usesT;
    el("sigSym").textContent = R.usesT ? "s" : "σ";
    el("sigLbl").textContent = R.usesT ? t("ss.sPilot") : t("sd");
    el("epsPct").textContent = R.mean ? "" : `(${show(trim(R.eps * 100, 3))}%)`;
    el("critLine").innerHTML = M.math(M.row(critSym(R), M.o("="), M.n(trim(R.crit, R.usesT || S.zTable ? 3 : 5)),
      ...(R.usesT ? [M.t(`(${t("dfAbbr")} = ${R.df})`)] : [])));
    $$("#targetSeg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.target === S.target));
    $$("#srcSeg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.src === S.sigmaSrc));
    $$(".presets .btn", root).forEach(b => b.setAttribute("aria-pressed", +b.dataset.conf === S.conf));
    $$(".plot-bar .seg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
  }
  function renderChips(){
    const chip = (cls, txt) => `<span class="chip ${cls}"><span class="sw"></span>${txt}</span>`;
    el("chips").innerHTML = !S.finite && S.view === "eps"
      ? chip("", t("ss.lgN0solid"))
      : chip("", S.finite ? t("ss.lgN") : t("ss.lgNif")) + chip("pinned", t("ss.lgN0")) + chip("census", t("ss.lgCensus"));
  }
  function update(skip){
    const R = compute(S);
    syncInputs(skip, R); renderFormulas(R); renderResult(R); renderChips();
    renderVars(R); renderR(R); markExample(el("examples"), S.example);
    plot.draw();
  }

  /* ---------- graph ---------- */
  // "N" view plots against log10(N), so each order of magnitude gets the same width.
  const compact = new Intl.NumberFormat(t("htmlLang"), { notation: "compact", maximumFractionDigits: 1 });
  const fmtN = v => v >= 10000 ? compact.format(v) : fmtInt(v);
  function logTicks(a, b){
    const mant = b - a <= 3.5 ? [1, 2, 5] : [1], out = [];
    for (let d = Math.floor(a); d <= Math.ceil(b); d++) for (const m of mant){
      const v = Math.log10(m) + d; if (v >= a - 1e-9 && v <= b + 1e-9) out.push(v);
    }
    return out;
  }
  function fit(){
    const R = compute(S);
    if (S.view === "N"){
      const a = Math.log10(Math.max(R.n0, 1)), b = S.finite ? Math.log10(S.N) : a;
      plot.x0 = Math.max(0, Math.min(a, b) - 1.2); plot.x1 = Math.max(a, b) + 1.5;
    } else {
      plot.x0 = R.eps * 0.3; plot.x1 = R.mean ? R.eps * 2.5 : Math.min(R.eps * 2.5, 0.5);
    }
    plot.draw();
  }
  function fitIfLost(){
    const R = compute(S), x = S.view === "N" ? Math.log10(S.N) : R.eps;
    if (x < plot.x0 || x > plot.x1) fit();
  }
  function switchView(v){
    S.range[S.view] = [plot.x0, plot.x1]; S.view = v;
    if (S.range[v]) [plot.x0, plot.x1] = S.range[v]; else fit();
    update();
  }

  function drawPlot(p){
    const C = p.colors(), c = p.ctx, R = compute(S), byN = S.view === "N";
    if (!byN && p.x0 <= 0) p.x0 = Math.min(R.eps * 0.05, p.x1 / 10);
    const fFin = byN ? x => R.nOf(10 ** x, R.n0) : x => R.nOf(S.N, R.n0Of(x));
    const f0 = byN ? () => R.n0 : x => R.n0Of(x);
    const main = byN || S.finite ? fFin : f0;      // the curve the marker sits on
    p.y0 = 0;
    p.y1 = byN ? R.n0 * 1.15 : Math.max(main(p.x0), R.n * 1.2) * 1.08;
    p.grid(C, byN
      ? { xTicks: logTicks(p.x0, p.x1), xFmt: v => fmtN(Math.round(10 ** v)), yFmt: v => fmtInt(v) }
      : { yFmt: v => fmtInt(v) });

    if (byN || S.finite){
      p.curve(byN ? x => 10 ** x : () => S.N, { color: C.faint, width: 1.2, dash: [2, 3] });   // n can never exceed N
      p.curve(f0, { color: C.pin, width: 1.5, dash: [5, 4] });
    }
    p.curve(main, { color: C.accent, width: 2.2 });
    if (byN){
      c.font = `12px ${C.font}`; c.fillStyle = C.muted; c.textAlign = "left"; c.textBaseline = "bottom";
      c.fillText(`n₀ = ${fmtInt(ceilN(R.n0))}`, p.pad.l + 8, p.Y(R.n0) - 4);
    }

    const hx = byN ? Math.log10(S.N) : R.eps;
    if ((!byN || S.finite) && hx >= p.x0 && hx <= p.x1){
      const px = p.X(hx), py = p.Y(R.n);
      p.vline(hx, C.accent, [], R.n, 1.5);
      c.save(); c.setLineDash([3, 3]); c.strokeStyle = C.accent; c.lineWidth = 1;
      c.beginPath(); c.moveTo(p.pad.l, py); c.lineTo(px, py); c.stroke(); c.restore();
      c.fillStyle = C.surface; c.strokeStyle = C.accent; c.lineWidth = 2;
      c.beginPath(); c.arc(px, py, 5, 0, Math.PI * 2); c.fill(); c.stroke();
      p.pill(px, 6, byN ? `N = ${fmtInt(S.N)}` : `ε = ${show(trim(R.eps, 4))}`, C, true);
      p.pill(px, 30, `n = ${fmtInt(R.size)}`, C, false);
    }
    if (p.hover != null && !p.drag){
      p.vline(p.hover, C.faint, [2, 3]);
      c.fillStyle = C.ink; c.beginPath(); c.arc(p.X(p.hover), p.Y(main(p.hover)), 3, 0, Math.PI * 2); c.fill();
    }
  }

  const plot = new Plot(el("plot"), {
    draw: drawPlot,
    handles: () => S.view === "N" ? (S.finite ? [{ key: "N", x: Math.log10(S.N) }] : []) : [{ key: "eps", x: compute(S).eps }],
    onFit: fit,
    onHandle(key, x){
      S.example = null;
      if (key === "N") S.N = clamp(Math.round(10 ** x), 1, 1e9);
      else {
        const step = Num.niceStep(plot.x1 - plot.x0, 200);
        const v = clamp(+x.toFixed(Num.decimalsFor(step)), step, S.target === "mean" ? Infinity : 0.99);
        S.target === "mean" ? (S.epsMean = v) : (S.epsProp = v);
      }
      update();
    },
    onHover(x){
      const r = el("readout"); el("hint").hidden = x != null;
      if (x == null){ r.hidden = true; return; }
      const R = compute(S), byN = S.view === "N";
      const N = byN ? Math.round(10 ** x) : S.N, e = byN ? R.eps : x, n0 = R.n0Of(e);
      const n = byN || S.finite ? R.nOf(N, n0) : n0;
      r.hidden = false;
      r.innerHTML = `<span>${byN ? `N <b>${fmtInt(N)}</b>` : `ε <b>${show(trim(e, 4))}</b>`}</span>` +
        `<span>n <b>${fmtInt(ceilN(n))}</b></span><span>n₀ <b>${fmtInt(ceilN(n0))}</b></span>`;
    }
  });

  /* ---------- events ---------- */
  bindNudge(root);
  bindCopy($(".sections", root));
  const edit = fn => { S.example = null; fn(); };
  const field = (inp, ok, set, onChange) => {
    inp.addEventListener("input", () => {
      const v = parseNum(inp.value), good = v != null && ok(v);
      inp.setAttribute("aria-invalid", !good);
      if (good) edit(() => { set(v); update(inp); });
    });
    inp.addEventListener("change", () => { inp.removeAttribute("aria-invalid"); update(); onChange?.(); });
  };
  const isMean = () => S.target === "mean";
  field(confN, v => v >= 50 && v < 100, v => S.conf = v);
  field(epsN, v => v > 0 && (isMean() || v < 1), v => isMean() ? (S.epsMean = v) : (S.epsProp = v), fit);
  field(sigN, v => v > 0, v => S.sigma = v);
  field(pilotN, v => v >= 2, v => S.pilotN = Math.round(v));
  field(pN, v => v > 0 && v < 1, v => S.p = v);
  field(NN, v => v >= 1, v => S.N = Math.round(v), fit);

  epsR.addEventListener("input", () => edit(() => { isMean() ? (S.epsMean = +epsR.value) : (S.epsProp = +epsR.value); update(); fitIfLost(); }));
  sigR.addEventListener("input", () => edit(() => { S.sigma = +sigR.value; update(); }));
  pR.addEventListener("input", () => edit(() => { S.p = +pR.value; update(); }));
  NR.addEventListener("input", () => edit(() => { S.N = Math.max(1, Math.round(10 ** +NR.value)); update(); fitIfLost(); }));
  el("zTable").addEventListener("change", e => edit(() => { S.zTable = e.target.checked; update(); }));
  el("worst").addEventListener("change", e => edit(() => { S.worst = e.target.checked; update(); }));
  el("finite").addEventListener("change", e => edit(() => { S.finite = e.target.checked; update(); fit(); }));
  $$("#targetSeg button", root).forEach(b => b.addEventListener("click", () => edit(() => {
    S.target = b.dataset.target; S.range.eps = null; update(); fit();
  })));
  $$("#srcSeg button", root).forEach(b => b.addEventListener("click", () => edit(() => { S.sigmaSrc = b.dataset.src; update(); })));
  $$(".presets .btn", root).forEach(b => b.addEventListener("click", () => edit(() => { S.conf = +b.dataset.conf; update(); })));
  $$(".plot-bar .seg button", root).forEach(b => b.addEventListener("click", () => switchView(b.dataset.view)));
  el("fitBtn").addEventListener("click", fit);

  el("examples").innerHTML = examplesHtml(exList(), S.example);
  el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });

  const onTheme = () => plot.draw();
  document.addEventListener("themechange", onTheme);

  if (S.range[S.view]) [plot.x0, plot.x1] = S.range[S.view]; else fit();
  update();
  return () => { S.range[S.view] = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
};

/* ---- js/pages/tests/test-mean.js ---- */
"use strict";
/* ============================================================
   Page: Test for a mean
     z = (x̄ − μ₀)·√n / σ   (σ known)      t = (x̄ − μ₀)·√n / s   (gl = n − 1)
   Sources: Barbetta 8.8 (eq. 8.8 and 8.9, Ex. 8.7 and 8.8) · Bussab & Morettin 12
   ============================================================ */
PAGES["test-mean"] = testPage({
  id: "test-mean", key: "tm", mode: "mean",

    { id: "tyres", set: { h1: "gt", method: "t", alpha: 1, mu0: 50000, xbar: 55000, sd: 4000, n: 20 }, source: () => `Barbetta · ${t("exercise")} 8.19` },

/* ---- js/pages/tests/test-proportion.js ---- */
"use strict";
/* ============================================================
   Page: Test for a proportion
     z = (y′ − n·p₀) / √(n·p₀·(1 − p₀)),  y′ = y − 0.5 if y > n·p₀, y + 0.5 if y < n·p₀
   Valid when n·p₀ > 5 and n·(1 − p₀) > 5.
   Sources: Barbetta 8.7 (eq. 8.1 to 8.7, Ex. 8.6) · Bussab & Morettin 12
   ============================================================ */
PAGES["test-proportion"] = testPage({
