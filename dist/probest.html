/* ---- js/pages/tests/chi-square.js ---- */
"use strict";
/* ============================================================
   Page: Chi-square test of independence
     Eᵢⱼ = (total of row i)·(total of column j) / n
     Q² = Σᵢ Σⱼ (Oᵢⱼ − Eᵢⱼ)² / Eᵢⱼ        gl = (L − 1)(C − 1)
   2 × 2 tables may use Yates' correction (|Oᵢⱼ − Eᵢⱼ| − 0.5)².
   Sources: Barbetta 10.2 (eq. 10.4 to 10.7, Ex. 10.5) · Bussab & Morettin 14
   ============================================================ */
PAGES["chi-square"] = function ChiSquarePage(root){
  const S = ChiSquarePage.state || (ChiSquarePage.state = {
    O: [[500, 4500, 1500], [30, 270, 50]], rows: ["@chi.n.in", "@chi.n.out"], cols: ["B", "C", "UHT"],
    alpha: 5, yates: false, sel: [1, 2], example: "milk"
  });
  const MAXR = 6, MAXC = 6;
  const nm = s => String(s).startsWith("@") ? t(s.slice(1)) : s;

  /* ---------- maths ---------- */
  function compute(st = S){
    const O = st.O, L = O.length, Cn = O[0].length;
    if (O.some(r => r.some(v => !(v >= 0) || !Number.isInteger(v)))) return { err: "chi.err.counts" };
    const rt = O.map(r => r.reduce((a, b) => a + b, 0)), ct = O[0].map((_, j) => O.reduce((a, r) => a + r[j], 0));
    const n = rt.reduce((a, b) => a + b, 0);
    if (rt.some(v => v === 0) || ct.some(v => v === 0)) return { err: "chi.err.zero" };
    const yates = st.yates && L === 2 && Cn === 2;
    const E = O.map((r, i) => r.map((_, j) => rt[i] * ct[j] / n));
    const terms = O.map((r, i) => r.map((o, j) => { const d = yates ? Math.max(0, Math.abs(o - E[i][j]) - 0.5) : o - E[i][j]; return d * d / E[i][j]; }));
    const q = terms.flat().reduce((a, b) => a + b, 0), df = (L - 1) * (Cn - 1), a = st.alpha / 100;
    const crit = Num.chiInv(1 - a, df), p = 1 - Num.chiCdf(q, df);
    return { L, Cn, rt, ct, n, E, terms, q, df, a, crit, p, reject: q > crit, yates, minE: Math.min(...E.flat()) };
  }

  /* ---------- examples ---------- */
  const EXAMPLES = [
    { id: "milk", O: [[500, 4500, 1500], [30, 270, 50]], rows: ["@chi.n.in", "@chi.n.out"], cols: ["B", "C", "UHT"], alpha: 5, source: "Barbetta · Ex. 10.5" },
    { id: "courses", O: [[44, 26, 35], [11, 26, 15]], rows: ["@chi.n.pass", "@chi.n.fail"], cols: ["@chi.n.civil", "@chi.n.chem", "@chi.n.mech"], alpha: 5, source: () => `Barbetta · ${t("exercise")} 10.6` },
    { id: "shifts", O: [[432, 456, 424], [185, 190, 180], [45, 48, 39]], rows: ["@chi.n.ok", "@chi.n.rework", "@chi.n.reject"], cols: ["@chi.n.morning", "@chi.n.afternoon", "@chi.n.night"], alpha: 1, source: () => `Barbetta · ${t("exercise")} 10.7` },
    { id: "clients", O: [[485, 10, 5], [768, 24, 8], [624, 20, 6], [522, 40, 18], [650, 3, 17]], rows: ["1", "2", "3", "4", "5"], cols: ["@chi.n.complete", "@chi.n.usable", "@chi.n.unusable"], alpha: 2.5, source: () => `Barbetta · ${t("exercise")} 10.8` },
  ];
  const Q2 = M.sup(M.i("Q"), M.n(2));
  const exList = () => EXAMPLES.map(e => {
    const R = compute({ O: e.O, alpha: e.alpha, yates: false });
    return { id: e.id, title: t("chi.ex." + e.id), source: typeof e.source === "function" ? e.source() : e.source,
      answer: `<math>${M.sup(M.i("q"), M.n(2))}<mo>=</mo>${M.n(trim(R.q, 2))}<mo separator="true">;</mo><mspace width="0.4em"></mspace><mi>p</mi><mo>=</mo>${M.prob(R.p)}</math> · ${R.reject ? t("test.reject") : t("test.accept")}` };
  });
  function loadExample(id){
    const e = EXAMPLES.find(x => x.id === id); if (!e) return;
    Object.assign(S, { O: e.O.map(r => [...r]), rows: [...e.rows], cols: [...e.cols], alpha: e.alpha, yates: false, sel: [0, 0], example: id });
    buildTable(); update(); fit();
  }

  /* ---------- markup ---------- */
  root.innerHTML = `
  <div class="page chi-page">
    <header class="page-head"><h1>${t("chi.title")}</h1></header>
    <section class="work">
      <div class="plot-col">
        <div class="plot-bar"><span class="plot-title" id="graphTitle"></span>
          <div class="bar-actions"><button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button></div></div>
        <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${t("chi.title")}"></canvas></div>
        <div class="legend"><div class="chips"><span class="chip rej"><span class="sw"></span>${t("test.lgReject")}</span><span class="chip pval"><span class="sw"></span>${t("test.lgP")}</span></div></div>
      </div>
      <aside class="controls" aria-label="${t("controls")}">
        <div class="group">
          <h2>${t("chi.size")}</h2>
          <div class="size-row">
            <span>${t("chi.rows")}</span><button class="btn sq" data-dim="r-">−</button><b id="nRows"></b><button class="btn sq" data-dim="r+">+</button>
            <span>${t("chi.cols")}</span><button class="btn sq" data-dim="c-">−</button><b id="nCols"></b><button class="btn sq" data-dim="c+">+</button>
          </div>
          <label class="check check-top" id="yatesRow"><input type="checkbox" id="yates">${t("chi.yates")}</label>
          <p class="note err" id="err" hidden></p>
          <p class="note warn" id="warn" hidden></p>
        </div>
        <div class="group">
          <h2>${t("test.alpha")}</h2>
          <div class="param"><label for="f-alpha"><span class="sym">α</span>${t("test.alphaLbl")} <span class="unit">(%)</span></label>${numInput("f-alpha", 1)}</div>
          <div class="presets" role="group">${[1, 5, 10].map(v => `<button class="btn" data-alpha="${v}" aria-pressed="false">${v}%</button>`).join("")}</div>
        </div>
        <div class="group result" aria-live="polite">
          <div class="p-big test-big" id="big"></div>
          <div class="p-sub" id="sub"></div>
          <dl class="facts" id="facts"></dl>
        </div>
      </aside>
    </section>
    <section class="formulas ctable-card" aria-label="${t("chi.table")}">
      <div class="card-head"><h2>${t("chi.table")}</h2><span class="hint">${t("chi.tableHint")}</span></div>
      <div class="ctable-wrap"><table class="ctable" id="ctable"></table></div>
    </section>
    <section class="formulas" aria-label="${t("formulas")}">
      ${formulasHead()}
      <div id="frows"></div>
      <div id="vars"></div>
    </section>
    ${sectionsHtml({ about: t("chi.about"), notes: ["note.expected", "note.min", "note.yates", "note.large"].map(k => t("chi." + k)), sources: ["src.barbetta", "src.bussab"].map(k => t("chi." + k)) })}
  </div>`;
  const el = id => $("#" + id, root);
  let R = compute();

  /* ---------- contingency table ---------- */
  function buildTable(){
    const L = S.O.length, Cn = S.O[0].length;
    el("ctable").innerHTML = `
      <thead><tr><th></th>${S.cols.map((c, j) => `<th><input class="nm" data-col="${j}" value="${esc(nm(c))}" aria-label="${t("chi.colName")}"></th>`).join("")}<th class="tot">${t("chi.total")}</th></tr></thead>
      <tbody>${S.O.map((r, i) => `<tr><th><input class="nm" data-row="${i}" value="${esc(nm(S.rows[i]))}" aria-label="${t("chi.rowName")}"></th>
        ${r.map((v, j) => `<td class="cell" data-i="${i}" data-j="${j}"><input class="num cnt" inputmode="numeric" data-i="${i}" data-j="${j}" value="${v}" aria-label="O${i + 1}${j + 1}"><span class="exp"></span><span class="ctr"></span></td>`).join("")}
        <td class="tot" data-rt="${i}"></td></tr>`).join("")}</tbody>
      <tfoot><tr><th>${t("chi.total")}</th>${S.O[0].map((_, j) => `<td class="tot" data-ct="${j}"></td>`).join("")}<td class="tot" id="grand"></td></tr></tfoot>`;
    $$("#ctable .cnt", root).forEach(inp => {
      inp.addEventListener("input", () => {
        const v = parseNum(inp.value), ok = v != null && v >= 0 && Number.isInteger(v);
        inp.setAttribute("aria-invalid", !ok);
        if (ok){ S.O[+inp.dataset.i][+inp.dataset.j] = v; S.example = null; update(); }
      });
      inp.addEventListener("focus", () => { S.sel = [+inp.dataset.i, +inp.dataset.j]; update(); });
    });
    $$("#ctable .nm", root).forEach(inp => inp.addEventListener("input", () => {
      if (inp.dataset.col != null) S.cols[+inp.dataset.col] = inp.value; else S.rows[+inp.dataset.row] = inp.value;
      S.example = null; renderR();
    }));
    el("nRows").textContent = L; el("nCols").textContent = Cn;
  }
  function fillTable(){
    const L = S.O.length;
    $$("#ctable td.cell", root).forEach(td => {
      const i = +td.dataset.i, j = +td.dataset.j, on = S.sel[0] === i && S.sel[1] === j;
      td.classList.toggle("sel", on);
      if (R.err){ $(".exp", td).textContent = ""; $(".ctr", td).textContent = ""; td.style.removeProperty("--heat"); return; }
      $(".exp", td).textContent = `E = ${show(trim(R.E[i][j], 3))}`;
      $(".ctr", td).textContent = show(trim(R.terms[i][j], 3));
      td.style.setProperty("--heat", Math.min(1, R.terms[i][j] / Math.max(...R.terms.flat(), 1e-9)).toFixed(3));
      td.classList.toggle("low", R.E[i][j] < 5);
    });
    if (!R.err){
      $$("#ctable [data-rt]", root).forEach(td => { td.textContent = fmtInt(R.rt[+td.dataset.rt]); });
      $$("#ctable [data-ct]", root).forEach(td => { td.textContent = fmtInt(R.ct[+td.dataset.ct]); });
      el("grand").textContent = fmtInt(R.n);
    }
  }

  /* ---------- render ---------- */
  function renderFormulas(){
    const [i, j] = S.sel, n3 = v => M.v(trim(v, 3)), r3 = v => M.r(trim(v, 3)), vs = v => M.v(String(v)),   // values blue, results bold
      sub = (s, a, b) => M.sub(M.i(s), M.row(M.n(String(a)), M.n(String(b))));
    const rows = [];
    rows.push({ label: t("test.f.hyp"), html: `<p class="fhyp"><b>H<sub>0</sub>:</b> ${t("chi.h0")}<br><b>H<sub>1</sub>:</b> ${t("chi.h1")}</p>` });
    rows.push({ label: t("chi.f.E", { c: `${nm(S.rows[i])} · ${nm(S.cols[j])}` }), chain: [sub("E", i + 1, j + 1),
      M.frac(M.row(M.text(t("chi.rowTot")), M.o("×"), M.text(t("chi.colTot"))), M.i("n")),
      M.frac(M.row(vs(R.rt[i]), M.o("·"), vs(R.ct[j])), vs(R.n)), r3(R.E[i][j])] });
    const term = (o, e) => R.yates
      ? M.frac(M.sup(M.paren(M.row(`<mo>|</mo>`, vs(o), M.o(MINUS), n3(e), `<mo>|</mo>`, M.o(MINUS), M.n("0.5"))), M.n(2)), n3(e))
      : M.frac(M.sup(M.paren(M.row(vs(o), M.o(MINUS), n3(e))), M.n(2)), n3(e));
    const gen = R.yates
      ? M.frac(M.sup(M.paren(M.row(`<mo>|</mo>`, sub("O", "i", "j"), M.o(MINUS), sub("E", "i", "j"), `<mo>|</mo>`, M.o(MINUS), M.n("0.5"))), M.n(2)), sub("E", "i", "j"))
      : M.frac(M.sup(M.paren(M.row(sub("O", "i", "j"), M.o(MINUS), sub("E", "i", "j"))), M.n(2)), sub("E", "i", "j"));
    const allTerms = R.terms.flat().map(v => n3(v));
    rows.push({ label: t("chi.f.cell"), chain: [M.row(M.text(t("chi.term")), M.paren(M.row(M.n(String(i + 1)), M.o(","), M.n(String(j + 1))))), term(S.O[i][j], R.E[i][j]), r3(R.terms[i][j])] });
    rows.push({ label: t("chi.f.Q"), chain: [M.sup(M.i("q"), M.n(2)), M.row(M.sum(M.row(M.i("i"), M.o("="), M.n(1)), M.i("L")), M.sum(M.row(M.i("j"), M.o("="), M.n(1)), M.i("C")), gen),
      sumTerms(allTerms, 6), r3(R.q)] });
    rows.push({ label: t("chi.f.df"), chain: [M.text(t("dfAbbr")), M.row(M.paren(M.row(M.i("L"), M.o(MINUS), M.n(1))), M.paren(M.row(M.i("C"), M.o(MINUS), M.n(1)))),
      M.row(M.paren(M.row(vs(R.L), M.o(MINUS), M.n(1))), M.paren(M.row(vs(R.Cn), M.o(MINUS), M.n(1)))), M.r(String(R.df))] });
    rows.push({ label: t("test.f.p"), html: M.math(M.row(M.i("p"), M.o("="), M.i("P"), M.paren(M.row(M.sup(M.i("χ"), M.n(2)), M.o(">"), n3(R.q))), M.o("="), M.rprob(R.p))) +
      M.math(M.row(M.sub(M.sup(M.i("χ"), M.n(2)), M.i("c")), M.o("="), r3(R.crit), M.t(";"), M.sup(M.i("q"), M.n(2)), M.o(R.reject ? ">" : "≤"), M.sub(M.sup(M.i("χ"), M.n(2)), M.i("c")), M.o("⇒"), M.text(R.reject ? t("test.reject") : t("test.accept"))), "res") });
    const box = el("frows");
    box.innerHTML = rows.map((r, k) => `<div class="frow"><span class="flabel">${r.label}</span><div class="fmath" data-row="${k}">${r.chain ? M.math(M.row(r.chain.join(M.o("=")))) : r.html}</div></div>`).join("");
    rows.forEach((r, k) => { if (!r.chain) return; const f = $(`[data-row="${k}"]`, box); if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 2); });
    el("vars").innerHTML = varsTableHtml([
      [M.sup(M.i("q"), M.n(2)), t("chi.sym.q"), show(trim(R.q, 3))],
      [sub("O", "i", "j"), t("chi.sym.O"), ""], [sub("E", "i", "j"), t("chi.sym.E"), ""],
      [M.i("n"), t("chi.sym.n"), fmtInt(R.n)], [M.i("L"), t("chi.sym.L"), String(R.L)], [M.i("C"), t("chi.sym.C"), String(R.Cn)],
      [M.text(t("dfAbbr")), t("chi.sym.df"), String(R.df)], [M.i("α"), t("test.sym.alpha"), show(trim(R.a, 4))],
      [M.sub(M.sup(M.i("χ"), M.n(2)), M.i("c")), t("chi.sym.crit"), show(trim(R.crit, 3))], [M.i("p"), t("test.sym.p"), show(fmtProb(R.p))],
    ]);
  }
  function renderR(){
    if (R.err) return;
    const v = S.O[0].map((_, j) => S.O.map(r => r[j])).flat();
    const dn = `list(c(${S.rows.map(s => JSON.stringify(nm(s))).join(", ")}), c(${S.cols.map(s => JSON.stringify(nm(s))).join(", ")}))`;
    const L = [`# ${t("chi.title")}`,
      `tab <- matrix(c(${v.join(", ")}), nrow = ${R.L},`, `              dimnames = ${dn})`,
      rLine(`chisq.test(tab, correct = ${R.yates ? "TRUE" : "FALSE"})`, `q² = ${trim(R.q, 3)}, ${t("dfAbbr")} = ${R.df}, p = ${fmtProb(R.p)}`, 40),
      rLine("chisq.test(tab)$expected", t("chi.r.expected"), 40),
      rLine(`qchisq(${trim(1 - R.a, 4)}, df = ${R.df})`, `${t("chi.r.crit")}: ${trim(R.crit, 3)}`, 40)];
    el("rcode").innerHTML = codeHtml(L.join("\n"));
  }
  function update(){
    R = compute();
    const fa = el("f-alpha"); if (fa !== document.activeElement) fa.value = fmtIn(S.alpha, 2);
    $$(".presets .btn", root).forEach(b => b.setAttribute("aria-pressed", +b.dataset.alpha === S.alpha));
    el("yates").checked = S.yates; el("yatesRow").hidden = !(S.O.length === 2 && S.O[0].length === 2);
    el("err").hidden = !R.err; fillTable();
    if (R.err){ el("err").textContent = t(R.err); plot.draw(); return; }
    el("warn").hidden = R.minE >= 5; el("warn").textContent = t("chi.lowE", { e: show(trim(R.minE, 2)) });
    el("graphTitle").textContent = t("chi.graph", { df: R.df });
    el("big").textContent = R.reject ? t("test.reject") : t("test.accept");
    el("big").classList.toggle("rej", R.reject);
    el("sub").innerHTML = R.reject ? t("chi.subReject", { a: show(trim(S.alpha, 2)) }) : t("chi.subAccept", { a: show(trim(S.alpha, 2)) });
    el("facts").innerHTML = [[`<math>${M.sup(M.i("q"), M.n(2))}</math>`, show(trim(R.q, 3))], [t("ss.dfRow"), String(R.df)],
      [`<math>${M.sub(M.sup(M.i("χ"), M.n(2)), M.i("c"))}</math>`, show(trim(R.crit, 3))], [t("test.fact.p"), show(fmtProb(R.p))],
      [t("chi.fact.minE"), show(trim(R.minE, 2))]].map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    renderFormulas(); renderR();
    markExample(el("examples"), S.example);
    plot.draw();
  }

  /* ---------- graph ---------- */
  const dens = x => Num.chiPdf(x, R.df);
  function fit(){
    if (R.err) return;
    const m = Math.max(R.crit * 1.5, R.df + 4 * Math.sqrt(2 * R.df), Math.min(R.q * 1.12, R.crit * 6));
    plot.x0 = 0; plot.x1 = m; plot.draw();
  }
  function drawPlot(p){
    const C = p.colors(), c = p.ctx, danger = cssVar("--danger");
    if (R.err){ p.grid(C); return; }
    let top = 0; for (let k = 1; k <= 200; k++){ const x = p.x0 + (p.x1 - p.x0) * k / 200; if (x > 0.05) top = Math.max(top, dens(x)); }
    p.y0 = 0; p.y1 = Math.min(top, R.df <= 2 ? 0.55 : top) * 1.3;
    p.grid(C, { yFmt: () => "" });
    c.save(); c.globalAlpha = .28; p.area(dens, R.crit, p.x1, danger); c.restore();
    if (R.q < p.x1) p.area(dens, Math.max(R.q, 1e-9), p.x1, C.fill);
    p.curve(x => x <= 0 ? NaN : dens(x), { color: C.ink, width: 1.8 });
    p.vline(R.crit, danger, [4, 3], p.y1 * 0.7, 1.3);
    c.font = `11px ${C.font}`; c.fillStyle = danger; c.textAlign = "center"; c.textBaseline = "top";
    c.textAlign = "left"; c.textBaseline = "bottom";
    if (R.crit <= p.x1) c.fillText(`χ²c = ${show(trim(R.crit, 3))}`, p.X(R.crit) + 4, p.Y(p.y1 * 0.7) - 2);
    c.textAlign = "center"; c.textBaseline = "top";
    c.font = `11.5px ${C.font}`; c.fillStyle = C.muted; c.fillText(t("test.accRegion"), p.X(R.crit / 2), p.pad.t + 6);
    c.fillStyle = danger; c.textAlign = "left"; if (R.crit < p.x1) c.fillText(t("test.rejRegion"), p.X(R.crit) + 6, p.pad.t + 22);
    if (R.q <= p.x1) p.marker(R.q, Math.min(dens(R.q), p.y1), `q² = ${show(trim(R.q, 2))}`, C, 0);
    else p.pill(p.pad.l + p.pw - 60, 6, `q² = ${show(trim(R.q, 2))} →`, C, true);
  }
  const plot = new Plot(el("plot"), { draw: drawPlot, handles: () => [], onFit: fit });

  /* ---------- events ---------- */
  bindCopy($(".sections", root)); bindNudge($(".controls", root));
  $$("[data-dim]", root).forEach(b => b.addEventListener("click", () => {
    const d = b.dataset.dim, L = S.O.length, Cn = S.O[0].length;
    if (d === "r+" && L < MAXR){ S.O.push(Array(Cn).fill(10)); S.rows.push(`${t("chi.rowAbbr")}${L + 1}`); }
    if (d === "r-" && L > 2){ S.O.pop(); S.rows.pop(); }
    if (d === "c+" && Cn < MAXC){ S.O.forEach(r => r.push(10)); S.cols.push(`${t("chi.colAbbr")}${Cn + 1}`); }
    if (d === "c-" && Cn > 2){ S.O.forEach(r => r.pop()); S.cols.pop(); }
    S.sel = [Math.min(S.sel[0], S.O.length - 1), Math.min(S.sel[1], S.O[0].length - 1)];
    S.example = null; buildTable(); update(); fit();
  }));
  el("yates").addEventListener("change", e => { S.yates = e.target.checked; S.example = null; update(); });
  const fa = el("f-alpha");
  fa.addEventListener("input", () => { const v = parseNum(fa.value), ok = v != null && v > 0 && v < 50; fa.setAttribute("aria-invalid", !ok); if (ok){ S.alpha = v; S.example = null; update(); } });
  $$(".presets .btn", root).forEach(b => b.addEventListener("click", () => { S.alpha = +b.dataset.alpha; S.example = null; update(); }));
  el("fitBtn").addEventListener("click", fit);
  el("examples").innerHTML = examplesHtml(exList(), S.example);
  el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });
  const onTheme = () => plot.draw();
  document.addEventListener("themechange", onTheme);
  buildTable(); update(); fit();
  return () => { plot.destroy(); document.removeEventListener("themechange", onTheme); };
};

"use strict";
/* ============================================================
   Page: Pearson's correlation coefficient
     r = [nΣxy − (Σx)(Σy)] / √{[nΣx² − (Σx)²]·[nΣy² − (Σy)²]}
   Test of H₀: ρ = 0:  t = r·√(n − 2) / √(1 − r²),  gl = n − 2
   Sources: Barbetta 11.1 and 11.2 (eq. 11.2, 11.3, 11.5, Ex. 11.1) · Bussab & Morettin 4.5 and 14.5
   ============================================================ */
const rSym = () => M.i("r");
PAGES["correlation"] = pairPage({
  id: "correlation", key: "corr", minN: 3,
  data: ceramicPairs(0, 1), example: "shrinkStrength",
  initial: { xName: "corr.n.shrink", yName: "corr.n.strength" },
  options: [{ key: "quad", def: true }],

  compute(P){
    const s = pairSums(P);
    if (!(s.Sxx > 0) || !(s.Syy > 0)) return { err: "corr.err.const" };
    const r = s.Sxy / Math.sqrt(s.Sxx * s.Syy), df = s.n - 2;
    const tt = Math.abs(r) >= 1 ? Infinity * Math.sign(r) : r * Math.sqrt(df) / Math.sqrt(1 - r * r);
    const p = isFinite(tt) ? 2 * (1 - Num.tCdf(Math.abs(tt), df)) : 0;
    const tc = Num.tInv(0.975, df), rc = tc / Math.sqrt(df + tc * tc);
    return { ...s, r, df, tt, p, rc };
  },

  formulas(R){
    const n = M.i("n"), sum = s => M.row(`<mo>∑</mo>`, s), x = M.i("x"), y = M.i("y"), num = v => M.n(trim(v, 4)), vv = v => M.v(trim(v, 4)), rr = v => M.r(trim(v, 4)), sq = v => M.sup(v, M.n(2));   // values blue, results bold
    const xy = M.row(x, y), dot = M.o("·");
    const gen = M.frac(M.row(n, sum(xy), M.o(MINUS), M.paren(sum(x)), M.paren(sum(y))),
      M.row(M.sqrt(M.row(n, sum(sq(x)), M.o(MINUS), sq(M.paren(sum(x))))), dot, M.sqrt(M.row(n, sum(sq(y)), M.o(MINUS), sq(M.paren(sum(y)))))));
    const nn = M.v(String(R.n));
    const subst = M.frac(M.row(nn, dot, vv(R.sxy), M.o(MINUS), nv(+trim(R.sx, 4)), dot, nv(+trim(R.sy, 4))),
      M.row(M.sqrt(M.row(nn, dot, vv(R.sxx), M.o(MINUS), sq(nv(+trim(R.sx, 4))))), dot, M.sqrt(M.row(nn, dot, vv(R.syy), M.o(MINUS), sq(nv(+trim(R.sy, 4)))))));
    const sums = [[sum(x), R.sx], [sum(y), R.sy], [sum(sq(x)), R.sxx], [sum(sq(y)), R.syy], [sum(xy), R.sxy]]
      .map(([s, v]) => M.row(s, M.o("="), rr(v))).join(M.t(""));
    const ttM = isFinite(R.tt) ? rr(R.tt) : M.o("∞");
    return [
      { label: t("corr.f.sums"), html: M.math(M.row(n, M.o("="), nn, M.t(""), sums)) },
      { label: t("corr.f.r"), chain: [rSym(), gen, subst, M.frac(num(R.Sxy), M.row(M.sqrt(num(R.Sxx)), dot, M.sqrt(num(R.Syy)))), rr(R.r)] },
      { label: t("corr.f.test"), html: M.math(M.row(M.i("t"), M.o("="), M.frac(M.row(rSym(), M.sqrt(M.row(n, M.o(MINUS), M.n(2)))), M.sqrt(M.row(M.n(1), M.o(MINUS), M.sup(rSym(), M.n(2))))),
          M.o("="), M.frac(M.row(vv(R.r), dot, M.sqrt(M.v(String(R.df)))), M.sqrt(M.row(M.n(1), M.o(MINUS), sq(nv(+trim(R.r, 4)))))), M.o("="), ttM,
          M.t(`(${t("dfAbbr")} = ${R.df})`))) +
        M.math(M.row(M.i("p"), M.o("="), M.rprob(R.p), M.t(";"), M.row(M.o("|"), rSym(), M.o("|")), M.o(Math.abs(R.r) > R.rc ? ">" : "≤"), M.n(trim(R.rc, 3)),
          M.o("⇒"), M.text(Math.abs(R.r) > R.rc ? t("corr.signif") : t("corr.notSignif"))), "res") },
    ];
  },
  vars: R => [
    [rSym(), t("corr.sym.r"), show(trim(R.r, 4))],
    [M.i("n"), t("corr.sym.n"), String(R.n)],
    [M.row(M.sub(M.i("x"), M.i("i")), M.o(","), M.sub(M.i("y"), M.i("i"))), t("corr.sym.xy"), ""],
    [M.i("ρ"), t("corr.sym.rho"), ""],
    [M.i("t"), t("corr.sym.t"), isFinite(R.tt) ? show(trim(R.tt, 4)) : "∞"],
    [M.text(t("dfAbbr")), t("corr.sym.df"), String(R.df)],
  ],
  result(R){
    const dir = Math.abs(R.r) < 1e-12 ? t("corr.none") : R.r > 0 ? t("corr.pos") : t("corr.neg");
    return {
      big: show(trim(R.r, 4)), sub: `<math>${rSym()}</math> · ${dir}`,
      facts: [[t("pair.n"), String(R.n)], [`<math>${M.sup(rSym(), M.n(2))}</math>`, show(trim(R.r * R.r, 4))],
        [t("corr.fact.t"), isFinite(R.tt) ? show(trim(R.tt, 3)) : "∞"], [t("test.fact.p"), show(fmtProb(R.p))],
        [t("corr.fact.rc"), show(trim(R.rc, 3))], [t("corr.fact.sig"), Math.abs(R.r) > R.rc ? t("corr.yes") : t("corr.no")]],
      chips: `<span class="chip"><span class="dotsw pos"></span>${t("corr.lgPos")}</span><span class="chip"><span class="dotsw neg"></span>${t("corr.lgNeg")}</span>`,
    };
  },
  answer: R => R.err ? "—" : `<math>${rSym()}<mo>=</mo>${M.n(trim(R.r, 4))}</math>`,
  r: R => [rLine("cor(x, y)", `r: ${trim(R.r, 4)}`), rLine("cor.test(x, y)", `t = ${isFinite(R.tt) ? trim(R.tt, 3) : "Inf"}, ${t("dfAbbr")} = ${R.df}, p = ${fmtProb(R.p)}`)],

  dotColor(i, R, S, C){
    if (!S.O.quad) return C.accent;
    const [x, y] = S.P[i], pr = (x - R.mx) * (y - R.my);
    return pr > 0 ? C.accent : pr < 0 ? cssVar("--danger") : C.muted;
  },
  back(p, C, R, S){
    if (!S.O.quad) return;
    const c = p.ctx;
    c.save(); c.setLineDash([5, 4]); c.strokeStyle = C.faint; c.lineWidth = 1.2;
    const X = Math.round(p.X(R.mx)) + .5, Y = Math.round(p.Y(R.my)) + .5;
    c.beginPath(); c.moveTo(X, p.pad.t); c.lineTo(X, p.pad.t + p.ph); c.moveTo(p.pad.l, Y); c.lineTo(p.pad.l + p.pw, Y); c.stroke(); c.restore();
    c.font = `600 13px ${C.font}`; c.fillStyle = C.faint; c.textBaseline = "middle"; c.textAlign = "center";
    const qx = [(X + p.pad.l + p.pw) / 2, (p.pad.l + X) / 2], qy = [(p.pad.t + Y) / 2, (Y + p.pad.t + p.ph) / 2];
    c.fillText("I", qx[0], qy[0]); c.fillText("II", qx[1], qy[0]); c.fillText("III", qx[1], qy[1]); c.fillText("IV", qx[0], qy[1]);
    c.font = `11.5px ${C.font}`; c.textAlign = "left"; c.textBaseline = "bottom";
    c.fillText(`x̄ = ${show(trim(R.mx, 3))}`, X + 4, p.pad.t + p.ph - 18); c.textBaseline = "top"; c.fillText(`ȳ = ${show(trim(R.my, 3))}`, p.pad.l + 6, Y + 3);
  },

  examples: [
    { id: "three", data: [[3, 6], [4, 4], [5, 2]], source: "Barbetta · 11.2" },
    { id: "shrinkStrength", data: ceramicPairs(0, 1), set: { xName: "corr.n.shrink", yName: "corr.n.strength" }, source: "Barbetta · Ex. 11.1" },
    { id: "shrinkAbsorb", data: ceramicPairs(0, 2), set: { xName: "corr.n.shrink", yName: "corr.n.absorb" }, source: "Barbetta · Ex. 11.1" },
    { id: "strengthAbsorb", data: ceramicPairs(1, 2), set: { xName: "corr.n.strength", yName: "corr.n.absorb" }, source: "Barbetta · Ex. 11.1" },
    { id: "first5", data: ceramicPairs(0, 1, 5), set: { xName: "corr.n.shrink", yName: "corr.n.strength" }, source: () => `Barbetta · ${t("exercise")} 11.1` },
    { id: "entrance", data: ENTRANCE, set: { xName: "corr.n.exam", yName: "corr.n.calc" }, source: () => `Barbetta · ${t("exercise")} 11.3` },
    { id: "entranceOut", data: ENTRANCE.filter(p => !(p[0] === 70 && p[1] === 50)), set: { xName: "corr.n.exam", yName: "corr.n.calc" }, source: () => `Barbetta · ${t("exercise")} 11.3` },
  ],
  notes: ["note.range", "note.quad", "note.units", "note.cause", "note.linear"],
  sources: ["src.barbetta", "src.bussab"],
});

/* ---- js/pages/reg/linear-regression.js ---- */
"use strict";
/* ============================================================
   Page: Simple linear regression (least squares)
     b = [nΣxy − (Σx)(Σy)] / [nΣx² − (Σx)²]      a = (Σy − bΣx) / n
     ŷ = a + bx      residual eᵢ = yᵢ − ŷᵢ
   Sources: Barbetta 11.3.1 (eq. 11.11 to 11.15, Ex. 11.2) · Bussab & Morettin 16
   ============================================================ */
PAGES["linear-regression"] = pairPage({
  id: "linear-regression", key: "reg", minN: 2,
  data: OCTANE, example: "octane",
  initial: { x0: 5.5, xName: "reg.n.additive", yName: "reg.n.octane" },
  options: [{ key: "res", def: true }, { key: "squares", def: false }],

  controls: () => `
    <div class="group">
      <h2>${t("reg.predict")}</h2>
      <div class="param"><label for="f-x0"><span class="sym"><math><msub><mi>x</mi><mn>0</mn></msub></math></span>${t("reg.x0")}</label>${numInput("f-x0", 0.1)}</div>
      <p class="note warn" id="extrap" hidden>${t("reg.extrap")}</p>
    </div>`,
  bind(root, S, update){
    const inp = $("#f-x0", root);
    inp.value = fmtIn(S.x0, 6);
    inp.addEventListener("input", () => { const v = parseNum(inp.value); inp.setAttribute("aria-invalid", v == null); if (v != null){ S.x0 = v; update(); } });
    inp.addEventListener("change", () => { inp.value = fmtIn(S.x0, 6); });
    bindNudge(inp.parentElement);
    const sync = () => { if (inp !== document.activeElement) inp.value = fmtIn(S.x0, 6); };
    root.addEventListener("pointerup", sync); root.addEventListener("click", sync);
  },

  compute(P, S){
    const s = pairSums(P);
    if (!(s.Sxx > 0)) return { err: "reg.err.x" };
    const b = s.Sxy / s.Sxx, a = (s.sy - b * s.sx) / s.n;
    const res = P.map(([x, y]) => y - (a + b * x)), sse = res.reduce((q, e) => q + e * e, 0);
    const r = s.Syy > 0 ? s.Sxy / Math.sqrt(s.Sxx * s.Syy) : NaN;
    const x0 = S.x0 ?? 0, y0 = a + b * x0, xs = P.map(p => p[0]);
    return { ...s, b, a, res, sse, r, x0, y0, extrap: x0 < Math.min(...xs) || x0 > Math.max(...xs) };
  },
  yExtra: R => [R.y0],

  formulas(R){
    const n = M.i("n"), sum = s => M.row(`<mo>∑</mo>`, s), x = M.i("x"), y = M.i("y"), num = v => M.n(trim(v, 4)), vv = v => M.v(trim(v, 4)), rr = v => M.r(trim(v, 4)), sq = v => M.sup(v, M.n(2)), dot = M.o("·");   // values blue, results bold
    const nn = M.v(String(R.n)), yh = M.i("ŷ");
    const line = (bv, xv) => M.row(vv(R.a), bv < 0 ? M.o(MINUS) : M.o("+"), vv(Math.abs(bv)), xv);
    document.querySelector("#extrap")?.toggleAttribute("hidden", !R.extrap);
    return [
      { label: t("reg.f.b"), chain: [M.i("b"),
        M.frac(M.row(n, sum(M.row(x, y)), M.o(MINUS), M.paren(sum(x)), M.paren(sum(y))), M.row(n, sum(sq(x)), M.o(MINUS), sq(M.paren(sum(x))))),
        M.frac(M.row(nn, dot, vv(R.sxy), M.o(MINUS), nv(+trim(R.sx, 4)), dot, nv(+trim(R.sy, 4))), M.row(nn, dot, vv(R.sxx), M.o(MINUS), sq(nv(+trim(R.sx, 4))))),
        M.frac(num(R.Sxy), num(R.Sxx)), rr(R.b)] },
      { label: t("reg.f.a"), chain: [M.i("a"), M.frac(M.row(sum(y), M.o(MINUS), M.i("b"), sum(x)), n),
        M.frac(M.row(vv(R.sy), M.o(MINUS), nv(+trim(R.b, 4)), dot, nv(+trim(R.sx, 4))), nn), rr(R.a)] },
      { label: t("reg.f.line"), html: M.math(M.row(yh, M.o("="), M.i("a"), M.o("+"), M.i("b"), x, M.o("="), line(R.b, x))) },
      { label: t("reg.f.pred", { x: show(trim(R.x0, 4)) }), chain: [M.row(yh), line(R.b, M.row(dot, nv(R.x0))), rr(R.y0)] },
      { label: t("reg.f.res"), html: M.math(M.row(M.sub(M.i("e"), M.i("i")), M.o("="), M.sub(y, M.i("i")), M.o(MINUS), M.sub(yh, M.i("i")), M.t(";"),
          sum(sq(M.sub(M.i("e"), M.i("i")))), M.o("="), rr(R.sse))) },
    ];
  },
  vars: R => [
    [M.i("ŷ"), t("reg.sym.yhat"), ""],
    [M.i("x"), t("reg.sym.x"), ""], [M.i("y"), t("reg.sym.y"), ""],
    [M.i("b"), t("reg.sym.b"), show(trim(R.b, 4))], [M.i("a"), t("reg.sym.a"), show(trim(R.a, 4))],
    [M.i("n"), t("corr.sym.n"), String(R.n)],
    [M.sub(M.i("e"), M.i("i")), t("reg.sym.e"), ""],
  ],
  result(R){
    const eq = `ŷ = ${show(trim(R.a, 4))} ${R.b < 0 ? "−" : "+"} ${show(trim(Math.abs(R.b), 4))}x`;
    return {
      big: eq, sub: t("reg.sub"),
      facts: [[t("reg.fact.b"), show(trim(R.b, 4))], [t("reg.fact.a"), show(trim(R.a, 4))],
        [t("reg.fact.pred", { x: show(trim(R.x0, 4)) }), show(trim(R.y0, 4))],
        [`<math><mi>r</mi></math>`, isFinite(R.r) ? show(trim(R.r, 4)) : "—"], [`<math><msup><mi>r</mi><mn>2</mn></msup></math>`, isFinite(R.r) ? show(trim(R.r * R.r, 4)) : "—"],
        [t("reg.fact.sse"), show(trim(R.sse, 4))]],
      chips: `<span class="chip"><span class="sw"></span>${t("reg.lgLine")}</span>`,
    };
  },
  answer: R => R.err ? "—" : `<math><mi>ŷ</mi><mo>=</mo>${M.n(trim(R.a, 3))}<mo>${R.b < 0 ? MINUS : "+"}</mo>${M.n(trim(Math.abs(R.b), 4))}<mi>x</mi></math>`,
  r: R => [rLine("fit <- lm(y ~ x)", t("reg.r.fit"), 40), rLine("coef(fit)", `a = ${trim(R.a, 4)}, b = ${trim(R.b, 4)}`, 40),
    rLine(`predict(fit, data.frame(x = ${trim(R.x0, 6)}))`, `ŷ: ${trim(R.y0, 4)}`, 40), rLine("residuals(fit)", t("reg.r.res"), 40),
    rLine("plot(x, y); abline(fit)", t("reg.r.plot"), 40)],

  back(p, C, R, S){
    const c = p.ctx, f = x => R.a + R.b * x;
    p.clip(() => {
      S.P.forEach(([x, y], i) => {
        const px = p.X(x), py = p.Y(y), pl = p.Y(f(x)), side = pl - py;
        if (S.O.squares){
          const s = Math.abs(side), dir = px + s < p.pad.l + p.pw ? 1 : -1;
          c.fillStyle = cssVar("--danger"); c.globalAlpha = .1; c.fillRect(dir > 0 ? px : px - s, Math.min(py, pl), s, s); c.globalAlpha = 1;
          c.strokeStyle = cssVar("--danger"); c.lineWidth = 1; c.globalAlpha = .45; c.strokeRect(dir > 0 ? px : px - s, Math.min(py, pl), s, s); c.globalAlpha = 1;
        }
        if (S.O.res){ c.save(); c.setLineDash([3, 3]); c.strokeStyle = cssVar("--danger"); c.lineWidth = 1.3; c.beginPath(); c.moveTo(px, py); c.lineTo(px, pl); c.stroke(); c.restore(); }
      });
    });
    p.curve(f, { color: C.accent, width: 2.2 });
  },
  front(p, C, R){
    const c = p.ctx;
    if (R.x0 >= p.x0 && R.x0 <= p.x1){
      const X = p.X(R.x0), Y = p.Y(R.y0);
      c.save(); c.setLineDash([4, 3]); c.strokeStyle = C.muted; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(X, p.pad.t + p.ph); c.lineTo(X, Y); c.lineTo(p.pad.l, Y); c.stroke(); c.restore();
      c.fillStyle = C.surface; c.strokeStyle = C.accent; c.lineWidth = 2; c.beginPath(); c.arc(X, Y, 6, 0, Math.PI * 2); c.fill(); c.stroke();
      p.pill(X, 6, `x₀ = ${show(trim(R.x0, 3))} → ŷ = ${show(trim(R.y0, 3))}`, C, true);
    }
  },
  handles: (R, S, plot) => [{ key: "x0", x: R.x0, py: plot.Y(R.y0), r: 11 }],
  onHandle(key, x, y, S, plot){ S.x0 = +x.toFixed(Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 100))); },

  examples: [
    { id: "octane", data: OCTANE, set: { x0: 5.5, xName: "reg.n.additive", yName: "reg.n.octane" }, source: "Barbetta · Ex. 11.2" },
    { id: "ceramic", data: ceramicPairs(0, 1), set: { x0: 10, xName: "corr.n.shrink", yName: "corr.n.strength" }, source: "Barbetta · Ex. 11.1" },
    { id: "entrance", data: ENTRANCE.filter(p => !(p[0] === 70 && p[1] === 50)), set: { x0: 50, xName: "corr.n.exam", yName: "corr.n.calc" }, source: () => `Barbetta · ${t("exercise")} 11.3` },
  ],
  notes: ["note.ls", "note.b", "note.range", "note.res", "note.cause"],
  sources: ["src.barbetta", "src.bussab"],
});

/* ---- js/app.js ---- */
"use strict";
/* ============================================================
   App shell: sidebar, search, routing, language, theme.
   Loaded last; starts the app.
   ============================================================ */
const app = $("#app"), navEl = $("#nav"), mainEl = $("#view"), qEl = $("#q");
let cleanup = null;      // cleanup function returned by the current page
let keepScroll = false;  // true when re-rendering the same page (e.g. language change)

/* ---------- sidebar ---------- */
/* Search matches labels in every language, accent-insensitive ("media" finds "Média"). */
const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const allLangs = key => Object.keys(I18N).map(l => I18N[l][key] || "").join(" ");

/* Which folders are open is remembered between visits. */
const OPEN_KEY = "sw-nav-open";
const openFolders = new Set((() => { try { return JSON.parse(store.get(OPEN_KEY)) || []; } catch { return []; } })());
const saveOpen = () => store.set(OPEN_KEY, JSON.stringify([...openFolders]));
const searching = () => qEl.value.trim() !== "";

const svg = (cls, d, box = 16) => `<svg class="${cls}" viewBox="0 0 ${box} ${box}" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const ICON_CHEV = svg("chev", "M4.5 2.5 8 6l-3.5 3.5", 12);
const ICON_FOLDER = svg("closed", "M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.5 1.5h4.9A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z");
const ICON_FOLDER_OPEN = svg("open", "M2 11.5v-7A1.5 1.5 0 0 1 3.5 3h2.6l1.5 1.5h4.4A1.5 1.5 0 0 1 13.5 6v.8M2 11.5l1.6-3.8A1.5 1.5 0 0 1 5 6.8h8.6a.8.8 0 0 1 .7 1.1l-1.5 4.1a1.5 1.5 0 0 1-1.4 1H3.5A1.5 1.5 0 0 1 2 11.5z");
const ICON_COLLAPSE = svg("", "M4.5 2.5 8 6l3.5-3.5M4.5 13.5 8 10l3.5 3.5");
const ICON_EXPAND = svg("", "M4.5 6 8 2.5 11.5 6M4.5 10 8 13.5l3.5-3.5");

function renderNav(){
  const f = fold(qEl.value.trim()), cur = currentId();
  const hit = key => fold(allLangs(key)).includes(f);

  const page = id => `<a href="#/${id}" class="page-link${PAGES[id] ? "" : " soon"}"${PAGES[id] ? "" : ` title="${t("notBuilt")}"`}${id === cur ? ' aria-current="page"' : ""}>${t("nav." + id)}</a>`;

  // showAll: an enclosing folder matched the search, so show everything inside it.
  function node(n, base, showAll){
    if (!isFolder(n)) return !f || showAll || hit("nav." + n) ? page(n) : "";
    const path = joinPath(base, n.folder), self = f && hit("folder." + n.folder);
    const inner = n.items.map(c => node(c, path, showAll || self)).join("");
    if (!inner) return "";
    const open = f ? true : openFolders.has(path);          // searching opens every folder with a match
    const count = navPages(n.items).length;
    return `<div class="folder" data-path="${path}" data-open="${open}">
      <button class="folder-row" type="button" aria-expanded="${open}">${ICON_CHEV}<span class="ficon">${ICON_FOLDER}${ICON_FOLDER_OPEN}</span><span class="fname">${t("folder." + n.folder)}</span><span class="fcount" title="${t("pageCount", { n: count })}">${count}</span></button>
      <div class="folder-body"${open ? "" : " inert"}><div class="folder-inner">${inner}</div></div>
    </div>`;
  }

  navEl.innerHTML = NAV.map(n => node(n, "", false)).join("") || `<p class="nav-empty">${t("noMatch", { q: esc(qEl.value) })}</p>`;
  paintFoldBtn();
}

function setFolderOpen(el, open){
  el.dataset.open = open;
  el.querySelector(":scope > .folder-row").setAttribute("aria-expanded", open);
  el.querySelector(":scope > .folder-body").inert = !open;
  if (!searching()){ open ? openFolders.add(el.dataset.path) : openFolders.delete(el.dataset.path); saveOpen(); }
  paintFoldBtn();
}

/* Collapse-all / expand-all button next to the search box. */
const anyOpen = () => !!navEl.querySelector('.folder[data-open="true"]');
function paintFoldBtn(){
  const b = $("#foldBtn"), label = anyOpen() ? t("collapseAll") : t("expandAll");
  b.innerHTML = anyOpen() ? ICON_COLLAPSE : ICON_EXPAND;
  b.title = label; b.setAttribute("aria-label", label);
}
function toggleAllFolders(){
  const open = !anyOpen();
  if (searching()){ qEl.value = ""; }
  openFolders.clear();
  if (open) navFolders().forEach(p => openFolders.add(p));
  saveOpen(); renderNav();
}

/* Make sure the folders around a page are open. */
function revealPage(id){
  for (const p of navTrail(id) || []) openFolders.add(p);
  saveOpen();
}

function openNav(){ app.classList.add("nav-open"); $("#menuBtn").setAttribute("aria-expanded", "true"); }
function closeNav(){ app.classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded", "false"); }

/* ---------- routing (#/page-id) ---------- */
function currentId(){ return (location.hash.replace(/^#\/?/, "").split("?")[0]) || DEFAULT_PAGE; }
function labelFor(id){ return navPages().includes(id) ? t("nav." + id) : null; }

function route(){
  const id = currentId(), label = labelFor(id);
  if (cleanup){ cleanup(); cleanup = null; }
  if (id === HOME) cleanup = HomePage(mainEl) || null;
  else if (PAGES[id]) cleanup = PAGES[id](mainEl) || null;
  else if (label) PlaceholderPage(mainEl, label);
  else { location.replace("#/"); return; }
  document.title = id === HOME ? APP.name : `${label} · ${APP.name}`;
  revealPage(id);
  renderNav();
  closeNav();
  if (!keepScroll) window.scrollTo(0, 0);
  keepScroll = false;
}

/* ---------- language ---------- */
function applyShellText(){
  qEl.placeholder = t("search"); qEl.setAttribute("aria-label", t("search"));
  navEl.setAttribute("aria-label", t("navLabel"));
  $("#menuBtn").setAttribute("aria-label", t("openMenu"));
  $("#langSeg").setAttribute("aria-label", t("language"));
  $$("#langSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG));
  paintThemeBtn();
  renderFooter();
}

/* ---------- footer (every page) ---------- */
const ICON_GITHUB = `<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>`;
function renderFooter(){
  $("#foot").innerHTML = `
    <div class="foot-row">
      <span class="foot-name"><b>${esc(APP.name)}</b> <span class="foot-ver">v${esc(APP.version)}</span></span>
      <span class="foot-links">
        <a href="${APP.repo}" target="_blank" rel="noopener">${ICON_GITHUB}GitHub</a>
        <a href="${APP.repo}/blob/main/LICENSE" target="_blank" rel="noopener">${t("license", { l: APP.license })}</a>
      </span>
    </div>
    <div class="foot-row foot-bottom">
      <p class="foot-text">${t("footSources")}</p>
      <p class="foot-author">${esc(APP.author)}</p>
    </div>`;
}

/* ---------- theme ---------- */
const sysDark = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (sysDark.matches ? "dark" : "light")) === "dark";
const ICON_SUN = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3"/></svg>`;
const ICON_MOON = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.5 4.5 0 0 0 7 7z"/></svg>`;
function paintThemeBtn(){
  $("#themeBtn").innerHTML = isDark() ? ICON_SUN + t("lightTheme") : ICON_MOON + t("darkTheme");
}
const themeChanged = () => { paintThemeBtn(); document.dispatchEvent(new Event("themechange")); };

/* ---------- events ---------- */
qEl.addEventListener("input", () => renderNav());
navEl.addEventListener("click", e => {
  const row = e.target.closest(".folder-row");
  if (row){ const f = row.parentElement; setFolderOpen(f, f.dataset.open !== "true"); }
});
navEl.addEventListener("keydown", e => {            // Right opens a folder, Left closes it
  const row = e.target.closest(".folder-row");
  if (!row || (e.key !== "ArrowRight" && e.key !== "ArrowLeft")) return;
  e.preventDefault(); setFolderOpen(row.parentElement, e.key === "ArrowRight");
});
$("#foldBtn").addEventListener("click", toggleAllFolders);
qEl.addEventListener("keydown", e => {
  if (e.key === "Escape"){ qEl.value = ""; renderNav(); qEl.blur(); }
  if (e.key === "Enter"){
    const a = navEl.querySelector("a:not(.soon)") || navEl.querySelector("a");
    if (a){ location.hash = a.getAttribute("href"); qEl.blur(); }
  }
});
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); openNav(); qEl.focus(); qEl.select(); }
});
$("#menuBtn").addEventListener("click", openNav);
$("#scrim").addEventListener("click", closeNav);
$$("#langSeg button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === LANG) return;
  setLang(b.dataset.lang); applyShellText(); keepScroll = true; route();
}));
$("#themeBtn").addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next; store.set("sw-theme", next);
  themeChanged();
});
sysDark.addEventListener("change", themeChanged);
window.addEventListener("hashchange", route);

/* ---------- start ---------- */
$$(".app-name").forEach(e => { e.textContent = APP.name; });
if (/Mac|iPhone|iPad/.test(navigator.platform)) $("#kbdHint").textContent = "⌘K";
const savedTheme = store.get("sw-theme"); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
setLang(detectLang(), false);
applyShellText();
route();
</script>

</body>
</html>
