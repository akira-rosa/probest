/* ---- styles/tokens.css ---- */
/* Theme tokens: colours, fonts, radius. Light by default, dark via system or toggle. */
:root{
  --bg:#F5F6F3;
  --side:#ECEEEA;
  --surface:#FFFFFF;
  --ink:#1B2029;
  --muted:#5F6672;
  --faint:#9AA0A8;
  --line:#DCDFD9;
  --grid:#ECEEE9;
  --hover:#E3E6E0;
  --accent:#2448D8;
  --accent-ink:#FFFFFF;
  --accent-soft:rgba(36,72,216,.10);
  --fill:rgba(36,72,216,.16);
  --pin:#8E949C;
  --bar:#C7CCD4;
  --danger:#B42318;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --brand: "Inria Serif", Georgia, "Times New Roman", serif;
  --math: "STIX Two Math", "Cambria Math", "Latin Modern Math", "STIXGeneral", math, serif;
  --radius:8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171A1F; --side:#121418; --surface:#1D2127; --ink:#E7E9EC; --muted:#A1A7B0; --faint:#6E757F;
    --line:#2C3139; --grid:#242830; --hover:#262B33; --accent:#7D97FF; --accent-ink:#0E1220;
    --accent-soft:rgba(125,151,255,.12); --fill:rgba(125,151,255,.20); --pin:#7A818B; --bar:#3B424C; --danger:#F97066;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171A1F; --side:#121418; --surface:#1D2127; --ink:#E7E9EC; --muted:#A1A7B0; --faint:#6E757F;
  --line:#2C3139; --grid:#242830; --hover:#262B33; --accent:#7D97FF; --accent-ink:#0E1220;
  --accent-soft:rgba(125,151,255,.12); --fill:rgba(125,151,255,.20); --pin:#7A818B; --bar:#3B424C; --danger:#F97066;
  color-scheme: dark;
}

/* ---- styles/base.css ---- */
/* Reset and element defaults. */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 var(--ui); font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
math{font-family:var(--math)}

/* Typography shared by every page */
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;font-weight:650;margin:0 0 6px}
.lede{margin:0;color:var(--muted);max-width:62ch}
.sym{font-family:var(--math);font-style:italic;color:var(--ink);font-size:17px;margin-right:4px}
.lede .sym{margin:0 1px;font-size:16px}

@media (max-width:620px){
  h1{font-size:24px}
}

/* ---- styles/components.css ---- */
/* Reusable controls: buttons, segmented toggles, number fields, sliders. */
.btn{
  height:30px;padding:0 11px;border-radius:6px;border:1px solid var(--line);background:var(--surface);
  cursor:pointer;font-size:13px;white-space:nowrap;
}
.btn:hover{background:var(--hover)}
.btn[hidden]{display:none}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:none;height:26px;padding:0 11px;border-radius:5px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* number field */
.num{
  width:100%;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);
  text-align:right;font-variant-numeric:tabular-nums;
}
.num:focus{background:var(--surface)}
.num[aria-invalid="true"]{border-color:var(--danger);color:var(--danger)}

/* range slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) 0/var(--p,50%) 100% no-repeat, var(--line)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}

/* checkbox with label */
.check{display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.35;color:var(--muted);cursor:pointer}
.check input{margin:2px 0 0;accent-color:var(--accent);flex:none}
.check[hidden]{display:none}
.num:disabled, input[type=range]:disabled{opacity:.5;cursor:not-allowed}

/* ---- styles/shell.css ---- */
/* App shell: layout grid, sidebar, mobile top bar, main area. */
/* ---------------- Layout ---------------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}

/* ---------------- Sidebar ---------------- */
.side{
  position:sticky; top:0; height:100vh; overflow:auto;
  background:var(--side); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:18px 12px 12px;
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;font-weight:600;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
.topbar-name{color:var(--ink);text-decoration:none}
/* the app name, wherever it appears (sidebar, top bar, home, footer) */
.app-name, .foot-name b{font-family:var(--brand);font-weight:700;letter-spacing:0}
.app-name{font-size:17px}
/* logo: a box plot on a dark rounded square (also the favicon, in src/index.html) */
.mark{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--ink);color:var(--bg);flex:none}
.mark svg{width:28px;height:28px;display:block}
.side-tools{display:flex;gap:6px;margin:0 4px 12px}
.search{position:relative;display:block;flex:1;min-width:0}
.search input{
  width:100%; height:34px; padding:0 50px 0 10px; border-radius:7px; font-size:14px;
  border:1px solid var(--line); background:var(--surface);
}
.search input::placeholder{color:var(--faint)}
.search kbd{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  font:11px var(--ui); color:var(--faint); border:1px solid var(--line); border-radius:4px; padding:1px 5px;
}
.icon-btn{
  flex:none; width:34px; height:34px; display:grid; place-items:center; cursor:pointer;
  border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--muted);
}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn svg{width:15px;height:15px}

/* ---- folder tree ---- */
nav{flex:1}
.folder-row{
  display:flex; align-items:center; gap:6px; width:100%;
  padding:5px 8px 5px 4px; border:0; border-radius:6px; background:none; cursor:pointer;
  color:var(--ink); font-size:14px; font-weight:550; text-align:left;
}
.folder-row:hover{background:var(--hover)}
.chev{width:12px;height:12px;flex:none;color:var(--faint);transition:transform .15s ease}
.folder[data-open="true"] > .folder-row .chev{transform:rotate(90deg)}
.ficon{display:grid;flex:none;color:var(--muted)}
.ficon svg{width:16px;height:16px;grid-area:1 / 1}
.ficon .open, .folder[data-open="true"] > .folder-row .ficon .closed{visibility:hidden}
.folder[data-open="true"] > .folder-row .ficon .open{visibility:visible}
.fname{flex:1;min-width:0}
.fcount{font-size:11.5px;font-weight:400;color:var(--faint)}
/* open/close animates the row height; closed bodies are inert so they can't be tabbed into */
.folder-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .18s ease}
.folder[data-open="true"] > .folder-body{grid-template-rows:1fr}
.folder-inner{overflow:hidden;min-height:0;margin-left:9px;padding-left:7px;border-left:1px solid var(--line)}
.folder[data-open="true"] > .folder-body > .folder-inner{padding-block:1px 4px}
nav > .folder + .folder{margin-top:2px}

.page-link{
  display:block; padding:6px 10px; margin:1px 0; border-radius:8px;
  color:var(--ink); text-decoration:none; font-size:14px;
}
.page-link:hover{background:var(--hover)}
.page-link.soon{color:var(--faint)}
.page-link[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:500}
.folder-row:focus-visible, .page-link:focus-visible{outline-offset:-2px}
.nav-empty{padding:6px 10px;color:var(--faint);font-size:14px}
.side-foot{border-top:1px solid var(--line);padding-top:10px;margin-top:6px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-foot .seg button{padding:0 9px;font-size:12px}
.ghost{
  display:flex;align-items:center;gap:8px;flex:1;min-width:0;
  border:0;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:14px;text-align:left;
}
.ghost:hover{background:var(--hover);color:var(--ink)}
.ghost svg{width:16px;height:16px}

/* mobile top bar */
.topbar{display:none}
.scrim{display:none}

/* ---------------- Main ---------------- */
main{min-width:0;padding:34px 40px 28px;display:flex;flex-direction:column;min-height:100vh}
#view{flex:1;display:flex;flex-direction:column}
.page{max-width:1240px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}

/* ---------------- Footer ---------------- */
.foot{
  max-width:1240px;width:100%;margin:44px auto 0;padding-top:16px;
  border-top:1px solid var(--line);font-size:13px;color:var(--muted);
}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;margin-bottom:6px}
.foot-name b{color:var(--ink);font-size:14.5px}
.foot-ver{color:var(--faint);margin-left:4px}
.foot-bottom{align-items:flex-end;flex-wrap:nowrap;margin-bottom:0}
.foot-author{margin:0;color:var(--muted);white-space:nowrap}
.foot-links{display:flex;gap:18px;flex-wrap:wrap}
.foot-links a{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none}
.foot-links a:hover{color:var(--ink);text-decoration:underline}
.foot-links svg{width:14px;height:14px}
.foot-text{margin:4px 0 0;max-width:110ch;line-height:1.5;color:var(--faint)}
.foot-text em{font-style:italic;color:var(--muted)}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:20;transform:translateX(-100%);transition:transform .2s ease}
  .app.nav-open .side{transform:none}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15}
  .topbar{
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;
    padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:600;
  }
  .topbar button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer}
  main{padding:22px 16px 24px;min-height:0}
  .foot{margin-top:32px}
}
@media (prefers-reduced-motion:reduce){ .side, .chev, .folder-body{transition:none} }

/* ---- styles/page.css ---- */
/* Shared page layout: formula panel, graph card, controls column, result box.
   Every calculator page uses these classes; page-specific styles go in pages/<id>.css. */
/* formula card: formulas with the current values, then the table of variables */
.formulas{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 22px 18px; margin-top:18px;
}
.formulas > h2{font-size:15px;font-weight:600;margin:0 0 2px}
.frow{display:grid;grid-template-columns:112px minmax(0,1fr);gap:16px;align-items:center;padding:14px 0}
.frow + .frow{border-top:1px solid var(--grid)}
.flabel{font-size:13px;color:var(--muted)}
.fmath{overflow-x:auto;overflow-y:hidden;font-size:21px;padding:2px 0;scrollbar-width:thin}
.fmath math{display:block;margin:0;text-align:left}
.fmath math + math{margin-top:10px}
.fmath math.res{color:var(--muted)}
/* formula applied to the current numbers: values from the controls in blue, results in bold */
.fmath mn.v, .fmath mo.v{color:var(--accent)}
.fmath mn.r{font-weight:700;color:var(--ink)}
.fhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.formulas .fhead h2{font-size:15px;font-weight:600;margin:0 0 2px}
.flegend{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--muted)}
.flegend .lg-v{font-family:var(--math);font-size:15px;color:var(--accent)}
.flegend .lg-r{font-family:var(--math);font-size:15px;font-weight:700;color:var(--ink);margin-left:10px}

/* workspace */
.work{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:18px;align-items:start}
.plot-col{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 12px 10px; min-width:0;
}
.plot-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 2px 10px}
.bar-actions{display:flex;gap:6px;flex-wrap:wrap}
.plot-title{font-size:13px;color:var(--muted);padding:6px 4px}
.plot-wrap{position:relative;height:clamp(300px,50vh,520px)}
canvas#plot{width:100%;height:100%;display:block;touch-action:pan-y;cursor:crosshair}
canvas#plot.dragging{cursor:ew-resize}
canvas#plot.panning{cursor:grabbing}
.readout{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.readout b{font-weight:500;color:var(--ink)}
.readout[hidden]{display:none}
.legend{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 4px 0;font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;padding:2px 4px 2px 8px;border-radius:5px;background:var(--bg)}
.chip .sw{width:18px;height:0;border-top:2px solid var(--accent)}
.chip.pinned .sw{border-top:2px dashed var(--pin)}
.chip button{border:0;background:none;cursor:pointer;color:var(--faint);padding:0 4px;font-size:15px;line-height:1}
.chip button:hover{color:var(--ink)}
.chip:not(.pinned){padding-right:8px}
.hint{color:var(--faint)}
.hint[hidden]{display:none}

/* controls column */
.controls{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.group{padding:16px 18px}
.group + .group{border-top:1px solid var(--line)}
.group h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--ink)}
.param{display:grid;grid-template-columns:1fr 96px;align-items:center;gap:6px 10px;margin-bottom:14px}
.param:last-child{margin-bottom:0}
.param label{font-size:14px;color:var(--muted)}
.param input[type=range]{grid-column:1 / -1}

.result{background:var(--accent-soft)}
.p-big{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.p-sub{font-size:13px;color:var(--muted);margin-top:4px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:14px 0 0;font-size:13.5px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;white-space:nowrap}

@media (max-width:1080px){
  .work{grid-template-columns:1fr}
  .controls{display:grid;grid-template-columns:1fr 1fr}
  .controls .group + .group{border-top:0}
  .controls .group{border-top:1px solid var(--line)}
  .controls .group:nth-child(-n+2){border-top:0}
  .controls .group:nth-child(even){border-left:1px solid var(--line)}
}
@media (max-width:860px){
  .frow{grid-template-columns:1fr;gap:6px}
  .fmath{font-size:18px}
  .formulas{padding:4px 16px}
}
@media (max-width:620px){
  .controls{display:flex}
  .controls .group:nth-child(even){border-left:0}
  .controls .group + .group{border-top:1px solid var(--line)}
}

/* ---- sections below the formulas: about, examples, R code, sources ---- */
.sections{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:18px}
.sect{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px 18px;min-width:0}
.sect-wide{grid-column:1 / -1}
.sect h2{font-size:15px;font-weight:600;margin:0 0 10px}
.sect-lede{margin:-4px 0 12px;font-size:13.5px;color:var(--muted)}
.examples{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.example{
  display:grid;gap:3px;align-content:start;text-align:left;cursor:pointer;
  padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg);
}
.example:hover{border-color:var(--faint)}
.example[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.ex-title{font-size:14px;font-weight:550;line-height:1.3}
.ex-answer{font-size:13px;color:var(--accent)}
.ex-source{font-size:12px;color:var(--faint)}
.code{
  margin:0;padding:12px 14px;overflow-x:auto;border:1px solid var(--grid);border-radius:7px;background:var(--bg);
  font:13px/1.6 ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;font-variant-numeric:normal;
}
.code .cmt{color:var(--faint)}
.sect-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.sect-head h2{margin:0}
.copy{height:26px;padding:0 10px;font-size:12.5px}
.notes, .sources{margin:0;padding-left:18px;font-size:14px;line-height:1.5;color:var(--muted)}
.notes li + li, .sources li + li{margin-top:7px}
.sources em{color:var(--ink);font-style:italic}
@media (max-width:860px){
  .sections{grid-template-columns:minmax(0,1fr)}
  .sect{padding:14px 16px 16px}
}

/* table of variables under the formulas */
.vars-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.vars-table th{
  text-align:left;font-weight:500;font-size:12.5px;color:var(--muted);
  padding:8px 10px;border-bottom:1px solid var(--line);
}
.vars-table td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:baseline}
.vars-table tr:last-child td{border-bottom:0}
.vars-table .v-sym{width:1%;white-space:nowrap;font-size:17px;text-align:center}
.vars-table .v-desc{color:var(--muted);line-height:1.45}
.vars-table .v-desc::first-letter{text-transform:uppercase}
.vars-table .v-val{width:1%;white-space:nowrap;text-align:right;color:var(--ink)}
.vars-table th:last-child{text-align:right}
.about{margin:0 0 14px;max-width:80ch;line-height:1.55}
.about .sym{margin:0 1px;font-size:16px}
.sect h3{font-size:13.5px;font-weight:600;margin:0 0 8px}
@media (max-width:620px){
  .vars-table th, .vars-table td{padding:7px 6px}
}

/* ---- shared controls: probability query, bounds, inverse lookup ---- */
.qmodes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.qmodes button{
  height:34px;padding:0 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);
  cursor:pointer;color:var(--muted);font-size:14px;
}
.qmodes button math{font-size:15px}
.qmodes button:hover{background:var(--hover)}
.qmodes button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.bounds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bounds label{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px}
.bounds label[hidden]{display:none}
.bounds.single{grid-template-columns:1fr}
.qrow{display:grid;grid-template-columns:auto 96px;gap:8px 10px;align-items:center;font-size:14px}
.qrow .lbl{color:var(--muted)}
.qrow .lbl math{font-size:16px}
.qout{font-size:15px;text-align:right;padding-right:9px}
.qrow .btn{grid-column:1 / -1;justify-self:start;margin-top:4px}
.check-top{margin-top:12px}
.note{font-size:12.5px;line-height:1.4;color:var(--faint);margin:-6px 0 14px}
.note.err{color:var(--danger);margin:4px 0 0}
.note.err[hidden]{display:none}
.p-sub math{font-size:15px}
.ex-answer math{font-size:13.5px}

/* row of small buttons under a control (Sort, Add value…) */
.data-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.data-actions [hidden]{display:none}

/* ---- styles/pages/data.css ---- */
/* Pages computed from a list of data values: mean, standard deviation, quartiles. */
.group-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.group-head h2{margin-bottom:10px}
.count{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.data-in{
  display:block;width:100%;min-height:96px;resize:vertical;padding:8px 10px;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);
  font:13.5px/1.55 var(--ui);font-variant-numeric:tabular-nums;
}
.data-in:focus{background:var(--surface)}
.data-in[aria-invalid="true"]{border-color:var(--danger)}
.data-page .note{margin:8px 0 0}

.data-page .facts dd{white-space:normal}

/* ordered data with positions (quartiles) */
.ordered{display:flex;flex-wrap:wrap;gap:4px;padding:2px 0}
.ordered span{
  display:inline-flex;flex-direction:column;align-items:center;min-width:34px;padding:2px 6px 3px;
  border-radius:5px;background:var(--bg);font-size:14px;line-height:1.25;font-variant-numeric:tabular-nums;
}
.ordered i{font-style:normal;font-size:10.5px;color:var(--faint)}
.ordered .on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.ordered .on i{color:var(--accent)}
.ordered .out{color:var(--danger)}
.data-page .plot-wrap{height:clamp(280px,40vh,400px)}
.qtrio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qtrio span{display:flex;flex-direction:column;gap:2px;min-width:0}
.qtrio b{font-size:26px;font-weight:600;overflow-wrap:anywhere}
.qtrio math{font-size:15px;color:var(--muted);font-weight:400}
.p-sub:empty{display:none}

/* paired data: dot swatches in the legend */
.dotsw{width:10px;height:10px;border-radius:50%;display:inline-block}
.dotsw.pos{background:var(--accent)}
.dotsw.neg{background:var(--danger)}
.pair-page .data-in{min-height:140px}
.pair-page .p-big{font-size:26px;letter-spacing:-.01em}

/* ---- styles/pages/prob.css ---- */
/* Probability pages: Venn diagram, Bayes mosaic, expected value table. */

/* table of events / values: name, two numbers, remove button */
.ev-table{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) 24px;gap:6px 8px;align-items:center}
.ev-table.xp{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 24px}
.ev-h{font-size:13px;color:var(--muted);text-align:right;padding-right:9px}
.ev-name{
  min-width:40px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--bg);
  color:var(--ink);cursor:pointer;font-size:15px;padding:0 8px;
}
.ev-name[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ev-del{width:24px;height:24px;border:0;border-radius:5px;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1}
.ev-del:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.ev-del:disabled{opacity:.3;cursor:default}
.venn-page .note, .bayes-page .note, .ev-page .note{margin:10px 0 0}

/* Y = aX + b */
.ab-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab-row label{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.group h2 math{font-weight:400;margin-left:4px}

/* small text under a formula */
.fnote{font-size:13.5px;color:var(--muted);margin:6px 0 0;font-family:var(--ui)}
.venn-page .param{grid-template-columns:1fr 128px}

/* ---- styles/pages/infer.css ---- */
/* Estimation and hypothesis tests: intervals, decisions, contingency table. */
.note.warn{color:var(--danger);margin:8px 0 0}
.note.warn[hidden]{display:none}
.note.seg-note{margin:10px 0 0}
.ci-big{font-size:26px;letter-spacing:-.01em}
.test-big{font-size:26px;color:var(--ink)}
.test-big.rej{color:var(--danger)}
.chip.rej .sw{height:10px;border:0;background:var(--danger);opacity:.35;border-radius:2px}
.chip.pval .sw{height:10px;border:0;background:var(--fill);border-radius:2px}
.fhyp{margin:0;font-size:15px;line-height:1.7;color:var(--ink)}
.fhyp b{font-weight:600}

/* table size */
.size-row{display:grid;grid-template-columns:auto 30px 28px 30px;align-items:center;gap:6px 8px;font-size:14px;color:var(--muted)}
.size-row b{text-align:center;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.btn.sq{width:30px;height:30px;padding:0;justify-content:center}

/* contingency table */
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card-head h2{margin:0}
.card-head .hint{font-size:13px}
.ctable-wrap{overflow-x:auto;padding-bottom:14px}
.ctable{border-collapse:separate;border-spacing:4px;font-variant-numeric:tabular-nums}
.ctable th, .ctable td{padding:0;text-align:center;vertical-align:middle;font-size:13.5px}
.ctable thead th{font-weight:500}
.ctable .nm{width:100%;min-width:84px;height:30px;border:1px solid transparent;border-radius:6px;background:none;color:var(--muted);
  font:500 13px var(--ui);text-align:center;padding:0 6px}
.ctable tbody th .nm{text-align:left}
.ctable .nm:hover, .ctable .nm:focus{border-color:var(--line);background:var(--bg)}
.ctable td.cell{
  position:relative;min-width:104px;border-radius:7px;padding:6px 6px 5px;cursor:pointer;
  background:color-mix(in srgb, var(--accent) calc(var(--heat, 0) * 22%), var(--bg));
  border:1px solid transparent;
}
.ctable td.cell.sel{border-color:var(--accent)}
.ctable .cnt{width:100%;height:30px;text-align:center;background:var(--surface)}
.ctable .exp, .ctable .ctr{display:block;font-size:11.5px;line-height:1.35;color:var(--muted);margin-top:3px}
.ctable .ctr{color:var(--accent);font-weight:600}
.ctable td.low .exp{color:var(--danger)}
.ctable .tot{min-width:70px;color:var(--muted);font-weight:500;padding:0 8px}
.ctable tfoot th{color:var(--muted);font-weight:500;text-align:left;padding-left:8px}
.ctable tbody th{padding-right:2px}
.ctable-card .card-head h2{font-size:15px;font-weight:600}

/* ---- styles/pages/sample-size.css ---- */
/* Sample size (finite population) page. */
.seg.full{display:flex;width:100%}
.seg.full button{flex:1}
.presets{display:flex;gap:6px;margin:-4px 0 12px}
.presets .btn{height:26px;padding:0 10px;font-size:12.5px}
.presets .btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.zline{margin-bottom:8px;font-size:16px;color:var(--muted)}
.zline math{display:inline}
.unit{color:var(--faint);font-size:12.5px}
.result .note{margin:12px 0 0;color:var(--muted)}
.check-gap{margin-bottom:14px}
#meanBox[hidden], #propBox[hidden]{display:none}
.chip.census .sw{border-top:2px dotted var(--faint)}
.seg-gap{margin-bottom:12px}
#pilotRow[hidden], #NRow[hidden]{display:none}

/* ---- styles/pages/placeholder.css ---- */
/* placeholder page */
.empty{
  max-width:520px;margin:12vh auto 0;text-align:left;
}
.empty p{color:var(--muted)}
.empty a{color:var(--accent)}

/* ---- styles/pages/home.css ---- */
/* Home (landing) page. */
.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:30px 36px}
.topic h2{font-size:13.5px;font-weight:600;color:var(--muted);margin:0 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.topic ul{list-style:none;margin:0;padding:0}
.topic li a{display:block;padding:4px 0;color:var(--ink);text-decoration:none;font-size:15px}
.topic li a:hover{color:var(--accent)}
.topic li a.soon{color:var(--faint)}
.topic li a.soon:hover{color:var(--muted)}
/* the home page fills the space down to the footer; the animation takes what is left */
.home{flex:1;display:flex;flex-direction:column;padding-top:4vh}
.home-anim{position:relative;flex:1;min-height:170px;max-height:440px;margin-top:32px}
.home-anim canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.anim-label{position:absolute;left:0;top:0;font-size:12.5px;color:var(--muted);text-decoration:none;transition:opacity .2s}
.anim-label:hover{color:var(--accent)}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:620px){ .home{padding-top:0} .home-anim{min-height:170px} }
</style>
</head>

<div class="app" id="app">
  <div class="topbar">
    <button id="menuBtn" aria-label="Open menu" aria-controls="side" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
    <a class="app-name topbar-name" href="#/">Probest Workbench</a>

    <a class="brand" href="#/"><span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><g stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M5 16H10M22 16H27M5 12V20M27 12V20"/><rect x="10" y="10" width="12" height="12" rx="1.5"/><path d="M15 10V22"/></g></svg></span><span class="app-name">Probest Workbench</span></a>

      </div>
    </div>
  </aside>

  <main id="main">
    <div id="view"></div>
    <footer class="foot" id="foot"></footer>
  </main>
</div>

<script>
/* ---- js/core/app-info.js ---- */
"use strict";
/* ============================================================
   App name, version and links: shown in the sidebar and the footer.
   Keep `version` equal to the one in package.json (the build checks it).
   ============================================================ */
const APP = {
  name: "Probest Workbench",
  author: "L. Akira Rosa",
  version: "0.1.0",
  repo: "https://github.com/akira-rosa/probest",
  license: "MIT",
};

/* ---- js/core/util.js ---- */
"use strict";
/* ============================================================
   Small helpers shared by every file.
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const MINUS = "\u2212";

/* Round to d decimals and drop trailing zeros: trim(1.500) -> "1.5". Always uses a dot. */
function trim(v, d = 4){
  if (!isFinite(v)) return "—";
  let s = (+v).toFixed(d);
  if (s.includes(".")) s = s.replace(/0+$/, "").replace(/\.$/, "");
  if (s === "-0") s = "0";

    c.moveTo(this.pad.l + .5, this.pad.t); c.lineTo(this.pad.l + .5, this.pad.t + this.ph); c.stroke();
    c.fillStyle = C.muted; c.font = `11.5px ${C.font}`;
    c.textAlign = "center"; c.textBaseline = "top";
    for (const v of xt.values) c.fillText(xFmt(v), this.X(v), this.pad.t + this.ph + 8);
    c.textAlign = "right"; c.textBaseline = "middle";
    for (const v of yt.values) c.fillText(yFmt(v), this.pad.l - 8, this.Y(v));
  }
  curve(f, { color, width = 2, dash = [] }){
    this.clip(c => {
      c.beginPath(); c.setLineDash(dash); c.lineWidth = width; c.strokeStyle = color; c.lineJoin = "round";
      let first = true;
      for (let px = this.pad.l; px <= this.pad.l + this.pw; px += 1){
        const y = f(this.ix(px)); if (!isFinite(y)){ first = true; continue; }
        const py = this.Y(y); first ? c.moveTo(px, py) : c.lineTo(px, py); first = false;
      }
      c.stroke(); c.setLineDash([]);
    });
  }
  area(f, a, b, color){
    const lo = Math.max(a, this.x0), hi = Math.min(b, this.x1); if (!(hi > lo)) return;
    this.clip(c => {
      const n = Math.max(2, Math.ceil(this.X(hi) - this.X(lo)));
      c.beginPath(); c.moveTo(this.X(lo), this.Y(this.y0));
      for (let i = 0; i <= n; i++){ const x = lo + (hi - lo) * i / n; c.lineTo(this.X(x), this.Y(f(x))); }
      c.lineTo(this.X(hi), this.Y(this.y0)); c.closePath(); c.fillStyle = color; c.fill();
    });
  }
  vline(x, color, dash = [], y1 = this.y1, width = 1){
    if (x < this.x0 || x > this.x1) return;
    const c = this.ctx, px = Math.round(this.X(x)) + .5;
    c.save(); c.setLineDash(dash); c.strokeStyle = color; c.lineWidth = width;
    c.beginPath(); c.moveTo(px, this.Y(this.y0)); c.lineTo(px, this.Y(Math.min(y1, this.y1))); c.stroke(); c.restore();
  }
  /* Bars of a discrete distribution: pts = [{ x, y, on }]; "on" bars are highlighted. */
  bars(pts, C, w = 0.62){
    this.clip(c => {
      const base = this.Y(this.y0), minW = 1.5;
      for (const b of pts){
        const l = this.X(b.x - w / 2), r = this.X(b.x + w / 2), top = this.Y(b.y);
        c.fillStyle = b.on ? C.accent : C.bar;
        c.fillRect(Math.min(l, (l + r) / 2 - minW / 2), top, Math.max(minW, r - l), base - top);
      }
    });
  }
  /* Draggable marker: vertical line up to y, a knob at y, and a label pill (row 0 or 1) at the top. */
  marker(x, y, label, C, row = 0){
    if (x < this.x0 || x > this.x1) return;
    const c = this.ctx, px = this.X(x), py = this.Y(y);
    this.vline(x, C.accent, [], y, 1.5);
    c.fillStyle = C.surface; c.strokeStyle = C.accent; c.lineWidth = 2;
    c.beginPath(); c.arc(px, py, 5, 0, Math.PI * 2); c.fill(); c.stroke();
    this.pill(px, row ? 30 : 6, label, C, true);
  }
  pill(x, y, text, C, strong){
    const c = this.ctx; c.font = `${strong ? 600 : 500} 12px ${C.font}`;
    const w = c.measureText(text).width + 14, h = 20, l = clamp(x - w / 2, this.pad.l, this.pad.l + this.pw - w);
    c.fillStyle = strong ? C.accent : C.surface; c.strokeStyle = C.accent; c.lineWidth = 1;
    c.beginPath(); c.roundRect(l, y, w, h, 5); c.fill(); c.stroke();
    c.fillStyle = strong ? cssVar("--accent-ink") : C.accent; c.textAlign = "left"; c.textBaseline = "middle";
    c.fillText(text, l + 7, y + h / 2 + .5);
    return [l, l + w];
  }
}

/* ---- js/core/ui.js ---- */
"use strict";
/* ============================================================
   Form controls shared by pages.
   ============================================================ */

/* Text input for numbers (not type=number) so both "1.5" and "1,5" are accepted.
   Arrow keys step by `step` once bindNudge() has run on the page. */
const numInput = (id, step, extra = "") =>
  `<input class="num" id="${id}" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-step="${step}" ${extra}>`;

/* Set a range slider, widening its range if needed, and paint the filled part of the track. */
function setSlider(r, v){
  if (v < +r.min) r.min = v; if (v > +r.max) r.max = v;
  r.value = v; r.style.setProperty("--p", ((v - r.min) / (r.max - r.min) * 100) + "%");
}

/* Arrow Up/Down nudges every .num field inside root (Shift = ×10), like a native number input. */
function bindNudge(root){
  $$(".num", root).forEach(inp => inp.addEventListener("keydown", e => {
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    const v = parseNum(inp.value); if (v == null) return;
    e.preventDefault();
    const step = +inp.dataset.step * (e.shiftKey ? 10 : 1), d = Math.max(0, Num.decimalsFor(step));
    inp.value = loc(trim(v + (e.key === "ArrowUp" ? step : -step), Math.max(d, 4)));
    inp.dispatchEvent(new Event("input")); inp.dispatchEvent(new Event("change"));
  }));
}

/* ============================================================
   Page sections shared by every calculator page (below the graph):
   Examples · Symbols · In R · Good to know · Sources
   ============================================================ */

/* Worked examples as buttons. list: [{ id, title, answer, source }]. */
function examplesHtml(list, active){
  return `<div class="examples">${list.map(e => `
    <button class="example" type="button" data-ex="${e.id}" aria-pressed="${e.id === active}">
      <span class="ex-title">${e.title}</span>
      <span class="ex-answer">${e.answer}</span>
      ${e.source ? `<span class="ex-source">${e.source}</span>` : ""}
    </button>`).join("")}</div>`;
}
function markExample(box, active){
  $$(".example", box).forEach(b => b.setAttribute("aria-pressed", b.dataset.ex === active));
}

/* R code block with a copy button; text after # is shown as a comment. */
function codeHtml(code){
  const body = code.split("\n").map(line => {
    const i = line.indexOf("#");
    return i < 0 ? esc(line) : esc(line.slice(0, i)) + `<span class="cmt">${esc(line.slice(i))}</span>`;
  }).join("\n");
  return `<pre class="code"><code>${body}</code></pre>`;
}
/* Pad code so trailing comments line up: rLine("n0 <- 1", "initial size"). */
const rLine = (code, comment, width = 30) => comment ? (code.length >= width ? code + "  " : code.padEnd(width)) + "# " + comment : code;

/* Copy buttons inside el (bind once per page render). */
function bindCopy(el){
  el.addEventListener("click", async e => {
    const b = e.target.closest("[data-copy]"); if (!b) return;
    const text = b.closest(".sect").querySelector("pre").innerText;
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {}
    if (!ok){
      const ta = Object.assign(document.createElement("textarea"), { value: text });
      ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand("copy"); } catch {}
      ta.remove();
    }
    b.textContent = ok ? t("copied") : t("copyFailed");
    setTimeout(() => { b.textContent = t("copy"); }, 1600);
  });
}

/* Table defining every variable in the formula: rows of [MathML symbol, meaning HTML, current value]. */
const varsTableHtml = rows => `<table class="vars-table">
  <thead><tr><th>${t("varSymbol")}</th><th>${t("varMeaning")}</th><th>${t("varValue")}</th></tr></thead>
  <tbody>${rows.map(([m, d, v]) => `<tr><td class="v-sym"><math>${m}</math></td><td class="v-desc">${d}</td><td class="v-val">${v ?? ""}</td></tr>`).join("")}</tbody>
</table>`;
/* Heading of the formula card, with the key to the colours used in the applied formulas. */
const formulasHead = () => `<div class="fhead"><h2>${t("formulas")}</h2><span class="flegend"><span class="lg-v">${show("1.96")}</span>${t("flegend.v")}<span class="lg-r">384</span>${t("flegend.r")}</span></div>`;
const listHtml = (items, cls) => `<ul class="${cls}">${items.map(i => `<li>${i}</li>`).join("")}</ul>`;

/* The standard block below the formulas: About (short explanation + good to know), Examples, In R, Sources.
   Each page fills #examples and #rcode on update. */
function sectionsHtml({ about, notes, sources }){
  return `<section class="sections">
    <div class="sect sect-wide">
      <h2>${t("about")}</h2>
      <p class="about">${about}</p>

    </div>

      <div id="examples"></div>
    </div>
    <div class="sect sect-wide">
      <div class="sect-head"><h2>${t("inR")}</h2><button class="btn copy" type="button" data-copy>${t("copy")}</button></div>
      <p class="sect-lede">${t("inRHint")}</p>

    </div>
    <div class="sect sect-wide"><h2>${t("sources")}</h2>${listHtml(sources, "sources")}</div>
  </section>`;
}

/* ---- js/core/distpage.js ---- */
"use strict";
/* ============================================================
   Shared page for probability distributions, discrete or continuous.

   Each distribution is a config object turned into a page with
     PAGES["binomial"] = distPage(BINOMIAL);
   The page follows the standard format: graph + controls + result,
   formulas with the table of variables, about, examples, R, sources.

   Config (see pages/binomial.js and pages/normal.js):
     id, key (locale prefix), kind: "discrete" | "continuous"
     params: [{ key, sym, def, min, max, step, int, ok(v, P) }]
     check(P)          → locale key of an error, or null
     support(P)        → [lo, hi]   (hi may be Infinity)
     view(P)           → [lo, hi]   default x-range of the graph
     pf(x, P)          → P(X = x) or the density f(x)
     cdf(x, P)         → F(x) = P(X ≤ x)   (optional for discrete: summed)
     inv(p, P)         → x with F(x) = p   (continuous only)
     mean(P), variance(P)
     math.general()    → right side of p(x) / f(x) with symbols
     math.at(x, P)     → the same with the numbers (discrete: at x)
     math.cdfSteps(v, P, O) → [MathML…] steps from F(v) to its value (continuous)
     math.mean / math.variance: { general(), sub(P) }
     r: { d, p, q, args(P) }  R function names and their parameters
     options: [{ key, def }]  checkboxes (labels "<key>.opt.<key>")
     prob(mode, a, b, P, O)   optional override of the probability
     examples: [{ id, set, source }], notes: [keys], sources: [keys]
   ============================================================ */
function distPage(cfg){
  const K = k => t(`${cfg.key}.${k}`);
  const discrete = cfg.kind === "discrete";
  const MODES = discrete ? ["eq", "le", "ge", "between"] : ["le", "ge", "between", "outside"];

  return function DistributionPage(root){
    /* ---------- state ---------- */
    const defaults = () => {
      const P = {}; for (const p of cfg.params) P[p.key] = p.def;
      return P;
    };
    const S = cfg.state || (cfg.state = {
      P: defaults(), O: Object.fromEntries((cfg.options || []).map(o => [o.key, o.def])),
      ...cfg.initial, view: "pf", pins: [], range: null, qp: "0.95", example: cfg.initial?.example ?? null
    });
    const P = () => S.P;
    const SYMTXT = { mu: "μ", sigma: "σ", lambda: "λ", alpha: "α", beta: "β" };
    const symTxt = k => SYMTXT[k] || k;
    const twoSided = () => S.mode === "between" || S.mode === "outside";

    /* ---------- maths ---------- */
    const support = PP => cfg.support(PP);
    const clampX = x => { const [lo, hi] = support(P()); return clamp(discrete ? Math.round(x) : x, lo, hi); };
    function cdf(x, PP = P()){
      if (cfg.cdf) return cfg.cdf(x, PP);
      const [lo] = support(PP); let s = 0;
      for (let k = lo; k <= Math.floor(x); k++) s += cfg.pf(k, PP);
      return Math.min(1, s);
    }
    const sf = (x, PP = P()) => discrete ? 1 - cdf(x - 1, PP) : 1 - cdf(x, PP);   // P(X ≥ x)
    function prob(st = S){
      const PP = st.P, a = Math.min(st.a, st.b ?? st.a), b = Math.max(st.a, st.b ?? st.a);
      if (cfg.prob){ const r = cfg.prob(st.mode, st.a, st.b, PP, st.O); if (r != null) return r; }
      switch (st.mode){
        case "eq": return discrete ? cfg.pf(st.a, PP) : 0;
        case "le": return cdf(st.a, PP);
        case "ge": return sf(st.a, PP);
        case "between": return Math.max(0, discrete ? cdf(b, PP) - cdf(a - 1, PP) : cdf(b, PP) - cdf(a, PP));
        case "outside": return cdf(a, PP) + sf(b, PP);
      }
    }

    /* ---------- examples ---------- */
    const queryMath = st => {
      const X = M.i("X"), x = M.v(trim(st.a, 4)), y = M.v(trim(st.b ?? st.a, 4)), P_ = M.i("P");
      const in_ = { eq: M.row(X, M.o("="), x), le: M.row(X, M.o("≤"), x), ge: M.row(X, M.o("≥"), x),
        between: M.row(x, M.o("≤"), X, M.o("≤"), y), outside: M.row(X, M.o("≤"), x, M.t(t("or")), X, M.o("≥"), y) }[st.mode];
      return M.row(P_, M.paren(in_));
    };
    const exState = e => ({ ...S, P: { ...defaults(), ...e.set.P }, O: { ...S.O, ...(e.set.O || {}) }, mode: e.set.mode, a: e.set.a, b: e.set.b ?? e.set.a });
    const exList = () => cfg.examples.map(e => {
      const st = exState(e);
      return { id: e.id, title: K("ex." + e.id), source: e.source, answer: `<math>${queryMath(st)}<mo>=</mo>${M.prob(prob(st))}</math>` };
    });
    function loadExample(id){
      const e = cfg.examples.find(x => x.id === id); if (!e) return;
      const st = exState(e);
      Object.assign(S, { P: st.P, O: st.O, mode: st.mode, a: st.a, b: st.b, example: id, range: null });
      update(); fit();
    }

    /* ---------- markup ---------- */
    const modeLabel = m => {
      const X = M.i("X"), x = M.i("x"), a = M.i("a"), b = M.i("b");
      const in_ = { eq: M.row(X, M.o("="), x), le: M.row(X, M.o("≤"), x), ge: M.row(X, M.o("≥"), x),
        between: M.row(a, M.o("≤"), X, M.o("≤"), b), outside: M.row(X, M.o("≤"), a, M.t(t("or")), X, M.o("≥"), b) }[m];
      return M.row(M.i("P"), M.paren(in_));
    };
    const modeBtn = m => `<button data-mode="${m}" aria-pressed="false"><math>${modeLabel(m)}</math></button>`;
    root.innerHTML = `
    <div class="page">
      <header class="page-head"><h1>${K("title")}</h1></header>

      <section class="work">
        <div class="plot-col">
          <div class="plot-bar">
            <div class="seg" role="group" aria-label="${t("graphType")}">
              <button data-view="pf" aria-pressed="true">${discrete ? t("d.viewPf") : t("density")}</button>
              <button data-view="cdf" aria-pressed="false">${t("cumulative")}</button>
            </div>
            <div class="bar-actions">
              <button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button>
              <button class="btn" id="pinBtn" title="${t("pinTitle")}">${t("pin")}</button>
              <button class="btn" id="unpinBtn" hidden>${t("clearPins")}</button>
            </div>
          </div>
          <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${K("title")}"></canvas></div>
          <div class="legend">
            <div class="chips" id="chips"></div>
            <span class="hint" id="hint">${t("d.hint")}</span>
            <span class="readout" id="readout" hidden></span>
          </div>
        </div>

        <aside class="controls" aria-label="${t("controls")}">
          <div class="group">
            <h2>${t("parameters")}</h2>
            ${cfg.params.map(p => `
            <div class="param">
              <label for="p-${p.key}"><span class="sym"><math>${p.sym}</math></span>${K("param." + p.key)}</label>
              ${numInput("p-" + p.key, p.step)}
              <input id="r-${p.key}" type="range" min="${p.min}" max="${p.max}" step="${p.step}" aria-label="${K("param." + p.key)}">
            </div>`).join("")}
            <p class="note err" id="paramErr" hidden></p>
          </div>

          <div class="group">
            <h2>${t("d.query")}</h2>
            <div class="qmodes" role="group" aria-label="${t("d.query")}">${MODES.map(modeBtn).join("")}</div>
            <div class="bounds" id="bounds">
              <label><span class="sym" id="aSym">x</span>${numInput("aN", discrete ? 1 : 0.1)}</label>
              <label id="bLbl"><span class="sym">b</span>${numInput("bN", discrete ? 1 : 0.1)}</label>
            </div>
            ${(cfg.options || []).map(o => `<label class="check check-top"><input type="checkbox" data-opt="${o.key}">${K("opt." + o.key)}</label>`).join("")}
          </div>

          <div class="group result" aria-live="polite">
            <div class="p-big" id="pBig"></div>
            <div class="p-sub" id="pSub"></div>
            <dl class="facts" id="facts"></dl>
          </div>

          ${discrete ? "" : `
          <div class="group">
            <h2>${t("findX")}</h2>
            <div class="qrow">
              <label class="lbl" for="qp"><math><mi>P</mi><mo>(</mo><mi>X</mi><mo>≤</mo><mi>x</mi><mo>)</mo><mo>=</mo></math></label>
              ${numInput("qp", 0.01)}
              <span class="lbl"><math><mi>x</mi><mo>=</mo></math></span>
              <output class="qout" id="qx"></output>
              <button class="btn" id="qUse">${t("markX")}</button>
            </div>
          </div>`}
        </aside>
      </section>

      <section class="formulas" aria-label="${t("formulas")}">
        ${formulasHead()}
        <div class="frow"><span class="flabel">${discrete ? t("d.pf") : t("d.pdf")}</span><div class="fmath" id="fPf"></div></div>
        <div class="frow"><span class="flabel">${t("d.prob")}</span><div class="fmath" id="fProb"></div></div>
        <div class="frow"><span class="flabel">${t("d.moments")}</span><div class="fmath" id="fMom"></div></div>
        <div id="vars"></div>
      </section>

      ${sectionsHtml({
        about: K("about"),
        notes: [...cfg.notes.map(K), discrete ? t("d.note.discrete") : t("d.note.continuous")],
        sources: cfg.sources.map(K),
      })}
    </div>`;

    const el = id => $("#" + id, root);
    const aN = el("aN"), bN = el("bN"), qp = el("qp");

    /* ---------- formulas ---------- */
    const X_ = M.i("X"), P_ = M.i("P"), E_ = M.row(M.i("E"), M.paren(X_)), V_ = M.row(M.i("V"), M.paren(X_));
    const pv = v => M.rprob(v);   // final results in bold; values from the controls are blue (M.v)
    function termList(lo, hi){
      const out = []; for (let k = lo; k <= hi; k++) out.push(M.n(cfg.pf(k, P()).toFixed(4)));
      return out.join(M.o("+"));
    }
    function renderFormulas(){
      const PP = P(), x = M.i("x"), val = prob(), [lo, hi] = support(PP);
      const fx = discrete ? M.row(M.i("p"), M.paren(x)) : M.row(M.i("f"), M.paren(x));
      const pf = discrete
        ? M.row(fx, M.o("="), cfg.math.general(), M.o("="), M.row(M.i("p"), M.paren(M.v(String(S.a)))), M.o("="), cfg.math.at(S.a, PP),
            ...(cfg.math.atNum ? [M.o("="), cfg.math.atNum(S.a, PP)] : []), M.o("="), pv(cfg.pf(S.a, PP)))
        : M.row(fx, M.o("="), cfg.math.general(), M.o("="), cfg.math.at(null, PP));
      el("fPf").innerHTML = M.math(pf);

      const q = queryMath(S), a = Math.min(S.a, S.b), b = Math.max(S.a, S.b), F = v => M.row(M.i("F"), M.paren(M.v(trim(v, 4))));
      let chain;
      if (discrete){
        const many = n => n > 7;
        if (S.mode === "eq") chain = [q, cfg.math.at(S.a, PP), ...(cfg.math.atNum ? [cfg.math.atNum(S.a, PP)] : []), pv(val)];
        else if (S.mode === "le") chain = S.a < lo ? [q, M.n(0)] : many(S.a - lo + 1) ? [q, F(S.a), pv(val)] : [q, termList(lo, S.a), pv(val)];
        else if (S.mode === "ge"){
          const below = M.row(P_, M.paren(M.row(X_, M.o("≤"), M.v(String(S.a - 1)))));
          chain = S.a <= lo ? [q, M.n(1)] : many(S.a - lo)
            ? [q, M.row(M.n(1), M.o(MINUS), below), M.row(M.n(1), M.o(MINUS), F(S.a - 1)), pv(val)]
            : [q, M.row(M.n(1), M.o(MINUS), below), M.row(M.n(1), M.o(MINUS), M.paren(termList(lo, S.a - 1))), pv(val)];
        } else {
          chain = many(b - a + 1) ? [q, M.row(F(b), M.o(MINUS), F(a - 1)), pv(val)] : [q, termList(Math.max(a, lo), Math.min(b, hi)), pv(val)];
        }
      } else {
        const wrap = cfg.math.cdfCompound ? M.paren : (x => x);
        const steps = v => cfg.math.cdfSteps(v, PP, S.O), wsteps = v => steps(v).map(wrap);
        const comb = (fn) => { const sa = steps(a), sb = steps(b); return sa.map((_, i) => fn(sa[i], sb[i])); };
        const gen = { le: [F(S.a)], ge: cfg.math.sfSteps ? [] : [M.row(M.n(1), M.o(MINUS), F(S.a))], between: [M.row(F(b), M.o(MINUS), F(a))],
          outside: [M.row(F(a), M.o("+"), M.n(1), M.o(MINUS), F(b))] }[S.mode];
        const sub = {
          le: steps(S.a),
          ge: cfg.math.sfSteps ? cfg.math.sfSteps(S.a, PP, S.O) : wsteps(S.a).map(s => M.row(M.n(1), M.o(MINUS), s)),
          between: comb((sa, sb) => M.row(wrap(sb), M.o(MINUS), wrap(sa))),
          outside: comb((sa, sb) => M.row(sa, M.o("+"), M.n(1), M.o(MINUS), wrap(sb))),
        }[S.mode];
        chain = [q, ...gen, ...sub, pv(val)];
      }
      const box = el("fProb");
      box.innerHTML = M.math(M.row(chain.join(M.o("="))));
      if (box.scrollWidth > box.clientWidth + 2) box.innerHTML = M.chain(chain, 3);   // wrap only when it does not fit
      if (box.scrollWidth > box.clientWidth + 2) box.innerHTML = M.chain(chain, 2);

      el("fMom").innerHTML =
        M.math(M.row(E_, M.o("="), cfg.math.mean.general(), M.o("="), cfg.math.mean.sub(PP), M.o("="), M.r(trim(cfg.mean(PP), 4)))) +
        M.math(M.row(V_, M.o("="), cfg.math.variance.general(), M.o("="), cfg.math.variance.sub(PP), M.o("="), M.r(trim(cfg.variance(PP), 4))));
    }

    function renderVars(){
      const PP = P(), rows = cfg.params.map(p => [p.sym, K("sym." + p.key), show(trim(PP[p.key], 6))]);
      if (twoSided()) rows.push([M.i("a"), t("d.sym.a"), show(trim(Math.min(S.a, S.b), 4))], [M.i("b"), t("d.sym.b"), show(trim(Math.max(S.a, S.b), 4))]);
      else rows.push([M.i("x"), t("d.sym.x"), show(trim(S.a, 4))]);
      rows.push([E_, t("d.sym.E"), show(trim(cfg.mean(PP), 4))], [V_, t("d.sym.V"), show(trim(cfg.variance(PP), 4))]);
      for (const extra of cfg.extraVars?.(PP, S) || []) rows.push(extra);
      el("vars").innerHTML = varsTableHtml(rows);
    }

    function renderResult(){
      const PP = P(), v = prob();
      el("pBig").textContent = show(fmtProb(v));
      el("pSub").innerHTML = `<math>${queryMath(S)}</math>`;
      el("facts").innerHTML = [
        [t("d.ev"), show(trim(cfg.mean(PP), 4))],
        [t("d.var"), show(trim(cfg.variance(PP), 4))],
        [t("d.sd"), show(trim(Math.sqrt(cfg.variance(PP)), 4))],
      ].map(([k, x]) => `<dt>${k}</dt><dd>${x}</dd>`).join("");
    }

    function renderR(){
      const PP = P(), r = cfg.r, args = r.args(PP), a = Math.min(S.a, S.b), b = Math.max(S.a, S.b), L = [];
      const n = v => trim(v, 6);
      L.push(`# ${K("title")}: ${t("d.r.params")} ${cfg.params.map(p => `${symTxt(p.key)} = ${n(PP[p.key])}`).join(", ")}`);
      if (cfg.r.note) L.push(`# ${cfg.r.note(PP, S.O)}`);
      const line = {
        eq: () => `${r.d}(${n(S.a)}, ${args})`,
        le: () => `${r.p}(${n(S.a)}, ${args})`,
        ge: () => discrete ? `1 - ${r.p}(${n(S.a - 1)}, ${args})` : `1 - ${r.p}(${n(S.a)}, ${args})`,
        between: () => discrete ? `${r.p}(${n(b)}, ${args}) - ${r.p}(${n(a - 1)}, ${args})` : `${r.p}(${n(b)}, ${args}) - ${r.p}(${n(a)}, ${args})`,
        outside: () => `${r.p}(${n(a)}, ${args}) + 1 - ${r.p}(${n(b)}, ${args})`,
      }[S.mode]();
      L.push(rLine(line, `${t("d.r.prob")}: ${fmtProb(prob())}`, 44));
      L.push(rLine(cfg.r.mean(PP), `${t("d.ev")}: ${n(cfg.mean(PP))}`, 44));
      if (!discrete){
        const pq = parseNum(S.qp);
        if (pq > 0 && pq < 1) L.push(rLine(`${r.q}(${n(pq)}, ${args})`, `x ${t("d.r.with")} P(X ≤ x) = ${n(pq)}`, 44));
      }
      el("rcode").innerHTML = codeHtml(L.join("\n"));
    }

    function renderChips(){
      const label = PP => cfg.params.map(p => `${symTxt(p.key)} = ${show(trim(PP[p.key], 4))}`).join(t("listSep"));
      el("chips").innerHTML = `<span class="chip"><span class="sw"></span>${label(P())}</span>` +
        S.pins.map((pp, i) => `<span class="chip pinned"><span class="sw"></span>${label(pp)}<button data-unpin="${i}" aria-label="${t("unpin")}">×</button></span>`).join("");
      el("unpinBtn").hidden = S.pins.length < 2;
    }

    function renderQuantile(){
      if (discrete) return;
      const p = parseNum(qp.value), ok = p != null && p > 0 && p < 1;
      qp.setAttribute("aria-invalid", !ok);
      el("qx").textContent = ok ? show(trim(cfg.inv(p, P(), S.O), 4)) : t("pRange");
    }

    function syncInputs(skip){
      for (const p of cfg.params){
        const inp = el("p-" + p.key), r = el("r-" + p.key), v = P()[p.key];
        if (skip !== inp) inp.value = fmtIn(v, 6);
        setSlider(r, v);
      }
      if (skip !== aN) aN.value = fmtIn(S.a, 4);
      if (skip !== bN) bN.value = fmtIn(S.b, 4);
      $$(".qmodes button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
      $$(".plot-bar .seg button", root).forEach(b => b.setAttribute("aria-pressed", b.dataset.view === S.view));
      $$("[data-opt]", root).forEach(c => { c.checked = !!S.O[c.dataset.opt]; });
      el("bLbl").hidden = !twoSided(); el("bounds").classList.toggle("single", !twoSided());
      el("aSym").textContent = twoSided() ? "a" : "x";
    }

    function update(skip){
      const err = cfg.check?.(P());
      el("paramErr").hidden = !err; if (err) el("paramErr").textContent = K(err);
      if (err){ syncInputs(skip); return; }
      S.a = clampX(S.a); S.b = clampX(S.b);
      syncInputs(skip); renderFormulas(); renderVars(); renderResult(); renderR(); renderChips(); renderQuantile();
      markExample(el("examples"), S.example);
      plot.draw();
    }

    /* ---------- graph ---------- */
    function fit(){
      const [lo, hi] = cfg.view(P());
      if (discrete){ plot.x0 = Math.min(lo, S.a, S.b) - 0.7; plot.x1 = Math.max(hi, S.a, S.b) + 0.7; }
      else {
        // keep the markers in view, with a margin
        const xs = twoSided() ? [S.a, S.b] : [S.a], w = hi - lo;
        plot.x0 = Math.min(lo, ...xs.map(x => x - 0.08 * w)); plot.x1 = Math.max(hi, ...xs.map(x => x + 0.08 * w));
      }
      plot.draw();
    }
    function fitIfLost(){
      const [lo, hi] = cfg.view(P()), r = plot.x1 - plot.x0, w = hi - lo;
      if (S.a < plot.x0 || S.a > plot.x1 || w > r * 2.5 || w < r / 6) fit();
    }
    function inRegion(x){
      const a = Math.min(S.a, S.b), b = Math.max(S.a, S.b);
      return { eq: x === S.a, le: x <= S.a, ge: x >= S.a, between: x >= a && x <= b, outside: x <= a || x >= b }[S.mode];
    }
    function drawPlot(p){
      const C = p.colors(), c = p.ctx, PP = P(), pfView = S.view === "pf";
      if (cfg.check?.(PP)){ p.grid(C); return; }
      const [lo, hi] = support(PP);
      if (discrete){
        const from = Math.max(lo, Math.ceil(p.x0)), to = Math.min(hi, Math.floor(p.x1));
        const ks = []; for (let k = from; k <= to && ks.length < 4000; k++) ks.push(k);
        if (pfView){
          let top = 0; for (const k of ks) top = Math.max(top, cfg.pf(k, PP));
          for (const q of S.pins) for (const k of ks) top = Math.max(top, cfg.pf(k, q));
          p.y0 = 0; p.y1 = (top || 1) * 1.18;
        } else { p.y0 = 0; p.y1 = 1.08; }
        const step = Num.niceStep(p.x1 - p.x0, Math.max(3, p.pw / 70));
        p.grid(C, { xTicks: Num.ticks(p.x0, p.x1, Math.max(3, p.pw / 70)).values.filter(v => Number.isInteger(v)), xFmt: v => String(v) });
        if (pfView){
          for (const q of S.pins){
            c.save(); c.setLineDash([4, 3]); c.strokeStyle = C.pin; c.lineWidth = 1.5;
            for (const k of ks){ const y = cfg.pf(k, q); if (y <= 0) continue; const px = Math.round(p.X(k)) + .5; c.beginPath(); c.moveTo(px - 6, p.Y(y)); c.lineTo(px + 6, p.Y(y)); c.stroke(); }
            c.restore();
          }
          p.bars(ks.map(k => ({ x: k, y: cfg.pf(k, PP), on: inRegion(k) })), C, Math.min(0.62, Math.max(0.1, 1 - 2 / Math.max(1, p.X(1) - p.X(0)))));
        } else {
          c.save(); c.strokeStyle = C.accent; c.lineWidth = 2.2;
          let prev = cdf(from - 1, PP);
          for (let k = from; k <= to + 1; k++){
            const y = cdf(k, PP);
            c.beginPath(); c.moveTo(p.X(k - 1), p.Y(prev)); c.lineTo(p.X(k), p.Y(prev)); c.stroke();
            prev = y;
          }
          c.restore();
          for (const k of ks){ c.fillStyle = inRegion(k) ? C.accent : C.surface; c.strokeStyle = C.accent; c.lineWidth = 1.5;
            c.beginPath(); c.arc(p.X(k), p.Y(cdf(k, PP)), 3.2, 0, Math.PI * 2); c.fill(); c.stroke(); }
        }
      } else {
        const f = pfView ? x => (x < lo || x > hi ? 0 : cfg.pf(x, PP)) : x => cdf(x, PP);
        if (pfView){
          let top = 0; for (let i = 0; i <= 200; i++){ const x = p.x0 + (p.x1 - p.x0) * i / 200; top = Math.max(top, f(x)); for (const q of S.pins) top = Math.max(top, cfg.pf(x, q) || 0); }
          p.y0 = 0; p.y1 = (top || 1) * 1.15;
        } else { p.y0 = 0; p.y1 = 1.08; }
        p.grid(C);
        for (const q of S.pins) p.curve(pfView ? x => (x < cfg.support(q)[0] || x > cfg.support(q)[1] ? 0 : cfg.pf(x, q)) : x => cdf(x, q), { color: C.pin, width: 1.5, dash: [5, 4] });
        if (pfView){
          const a = Math.min(S.a, S.b), b = Math.max(S.a, S.b);
          const regs = { le: [[-Infinity, S.a]], ge: [[S.a, Infinity]], between: [[a, b]], outside: [[-Infinity, a], [b, Infinity]] }[S.mode];
          for (const [u, v] of regs) p.area(f, Math.max(u, lo), Math.min(v, hi), C.fill);
        }
        p.curve(f, { color: C.accent, width: 2.2 });
      }
      // expected value
      const mu = cfg.mean(PP);
      if (pfView && mu >= p.x0 && mu <= p.x1){
        p.vline(mu, C.muted, [3, 3]);
        c.font = `11.5px ${C.font}`; c.fillStyle = C.muted; c.textAlign = "left"; c.textBaseline = "top";
        c.fillText("E(X)", p.X(mu) + 4, p.pad.t + 56);
      }
      // markers
      const yAt = x => pfView ? (discrete ? cfg.pf(x, PP) : cfg.pf(x, PP)) : cdf(x, PP);
      if (twoSided()){
        const a = Math.min(S.a, S.b), b = Math.max(S.a, S.b);
        p.marker(a, yAt(a), `a = ${show(trim(a, 3))}`, C, 0);
        p.marker(b, yAt(b), `b = ${show(trim(b, 3))}`, C, p.X(b) - p.X(a) < 80 ? 1 : 0);
      } else p.marker(S.a, yAt(S.a), `x = ${show(trim(S.a, 3))}`, C, 0);
      if (p.hover != null && !p.drag){
        const hx = discrete ? Math.round(p.hover) : p.hover;
        if (hx >= lo && hx <= hi){
          p.vline(hx, C.faint, [2, 3]);
          c.fillStyle = C.ink; c.beginPath(); c.arc(p.X(hx), p.Y(yAt(hx)), 3, 0, Math.PI * 2); c.fill();
        }
      }
    }
    const plot = new Plot(el("plot"), {
      draw: drawPlot,
      handles: () => twoSided() ? [{ key: "a", x: S.a }, { key: "b", x: S.b }] : [{ key: "a", x: S.a }],
      onFit: fit,
      onHandle(key, x){
        S.example = null;
        const dec = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 200));
        const v = clampX(discrete ? Math.round(x) : +x.toFixed(dec));
        if (key === "a") S.a = v; else S.b = v;
        update();
      },
      onHover(x){
        const r = el("readout"); el("hint").hidden = x != null;
        if (x == null){ r.hidden = true; return; }
        const PP = P(), [lo, hi] = support(PP), hx = discrete ? Math.round(x) : x;
        if (hx < lo || hx > hi){ r.hidden = true; return; }
        const d = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 200));
        r.hidden = false;
        r.innerHTML = discrete
          ? `<span>x <b>${hx}</b></span><span>P(X = x) <b>${show(fmtProb(cfg.pf(hx, PP)))}</b></span><span>F(x) <b>${show(fmtProb(cdf(hx, PP)))}</b></span>`
          : `<span>x <b>${show(hx.toFixed(d))}</b></span><span>f(x) <b>${show(cfg.pf(hx, PP).toFixed(4))}</b></span><span>F(x) <b>${show(fmtProb(cdf(hx, PP)))}</b></span>`;
      }
    });

    /* ---------- events ---------- */
    bindNudge(root);
    bindCopy($(".sections", root));
    const edit = fn => { S.example = null; fn(); };
    for (const p of cfg.params){
      const inp = el("p-" + p.key), r = el("r-" + p.key);
      inp.addEventListener("input", () => {
        let v = parseNum(inp.value); const good = v != null && (!p.int || Number.isInteger(v)) && p.ok(v, P());
        inp.setAttribute("aria-invalid", !good);
        if (good) edit(() => { S.P[p.key] = v; update(inp); });
      });
      inp.addEventListener("change", () => { inp.removeAttribute("aria-invalid"); update(); fitIfLost(); });
      r.addEventListener("input", () => edit(() => { S.P[p.key] = p.int ? Math.round(+r.value) : +r.value; update(); fitIfLost(); }));
    }
    const bound = (inp, key) => {
      inp.addEventListener("input", () => { const v = parseNum(inp.value); if (v != null) edit(() => { S[key] = discrete ? Math.round(v) : v; update(inp); }); });
      inp.addEventListener("change", () => { update(); fitIfLost(); });
    };
    bound(aN, "a"); bound(bN, "b");
    $$(".qmodes button", root).forEach(b => b.addEventListener("click", () => edit(() => {
      const was = twoSided(); S.mode = b.dataset.mode;
      if (twoSided() && !was && S.b <= S.a){ const sd = Math.sqrt(cfg.variance(P())); S.b = clampX(S.a + (discrete ? Math.max(1, Math.round(sd)) : sd)); }
      update();
    })));
    $$(".plot-bar .seg button", root).forEach(b => b.addEventListener("click", () => { S.view = b.dataset.view; update(); }));
    $$("[data-opt]", root).forEach(c => c.addEventListener("change", () => edit(() => { S.O[c.dataset.opt] = c.checked; update(); })));
    el("fitBtn").addEventListener("click", fit);
    el("pinBtn").addEventListener("click", () => {
      const key = JSON.stringify(P());
      if (!S.pins.some(q => JSON.stringify(q) === key)) S.pins.push({ ...P() });
      update();
    });
    el("unpinBtn").addEventListener("click", () => { S.pins = []; update(); });
    el("chips").addEventListener("click", e => { const i = e.target.dataset?.unpin; if (i != null){ S.pins.splice(+i, 1); update(); } });
    if (!discrete){
      qp.addEventListener("input", () => { S.qp = qp.value; renderQuantile(); renderR(); });
      el("qUse").addEventListener("click", () => {
        const p = parseNum(qp.value); if (!(p > 0 && p < 1)) return;
        edit(() => { S.mode = "le"; S.a = +cfg.inv(p, P(), S.O).toFixed(6); update(); fitIfLost(); });
      });
      qp.value = loc(String(S.qp).replace(",", "."));
    }

    el("examples").innerHTML = examplesHtml(exList(), S.example);
    el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });

    const onTheme = () => plot.draw();
    document.addEventListener("themechange", onTheme);

    if (S.range) [plot.x0, plot.x1] = S.range; else fit();
    update();
    return () => { S.range = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
  };
}

/* ---- js/core/datapage.js ---- */
"use strict";
/* ============================================================
   Shared page for formulas computed from a list of data values
   (descriptive statistics): mean, standard deviation, quartiles.

     PAGES["mean"] = dataPage(MEAN);

   The data are typed in a text box and drawn as a dot plot; every dot
   can be dragged to change its value. The page follows the standard
   format: graph + controls + result, formulas with the table of
   variables, about, examples, R, sources.

   Config (see pages/desc/*.js):
     id, key (locale prefix), minN, data (initial values), example (initial id)
     options: [{ key, def }]          checkboxes, labels "<key>.opt.<key>"
     segs: [{ key, def, values }]     segmented choices, labels "<key>.seg.<key>.<value>"
     compute(xs, O)        → R object (pure)
     formulas(R, O)        → [{ label, chain: [MathML…] } | { label, html }]
     vars(R, O)            → rows for varsTableHtml
     result(R, O)          → { big, sub, facts: [[label, value]] }
     answer(R, O)          → example answer (HTML/MathML)
     r(R, O)               → R lines after the data vector
     topSpace, baseGap     → pixels kept free above the dots / below the dots
     dot(i, v, R, O, C)    → { fill, stroke } for a dot (optional)
     back(p, C, R, O, L) / front(p, C, R, O, L) → drawing below / above the dots
     examples: [{ id, data, O, source }], notes: [keys], sources: [keys]
   ============================================================ */

/* Read a list of numbers. Separators: spaces, new lines, semicolons, and commas;
   in Portuguese a comma between digits is the decimal mark ("7,5"). */
function parseData(text){
  const comma = usesComma();
  const s = String(text).replace(/[{}()\[\]]/g, " ").replace(/−/g, "-").trim();
  if (!s) return { values: [], bad: [] };
  const tokens = (comma ? s.split(/[\s;]+|,(?=\s|$)|(?<=\D),|,(?=\D)/) : s.split(/[\s;,]+/)).filter(Boolean);
  const values = [], bad = [];
  for (const tk of tokens){ const v = parseNum(tk); v == null ? bad.push(tk) : values.push(v); }
  return { values, bad };
}
const formatData = xs => xs.map(v => loc(trim(v, 6))).join(usesComma() ? "; " : ", ");

/* x₁ + x₂ + … + xₙ with every term, or the first three and the last one when there are many. */
function sumTerms(terms, max = 8){
  if (terms.length <= max) return M.row(terms.join(M.o("+")));
  return M.row([...terms.slice(0, 3), M.o("⋯"), terms[terms.length - 1]].join(M.o("+")));
}
/* A data value as MathML, in parentheses when negative (for "x − x̄" and sums). */
/* A value going into a formula (blue), in parentheses when negative. */
const nv = (v, d = 6) => v < 0 ? M.paren(M.v(trim(v, d))) : M.v(trim(v, d));

/* The R vector of the data, wrapped to lines of about 64 characters. */
function rVector(xs, name = "x"){
  const items = xs.map(v => trim(v, 6)), lines = [];
  let cur = `${name} <- c(`;
  items.forEach((it, i) => {
    const piece = it + (i < items.length - 1 ? ", " : ")");
    if (cur.length + piece.length > 64 && cur.trim().length > 7){ lines.push(cur.trimEnd()); cur = "       "; }
    cur += piece;
  });
  if (!items.length) cur += ")";
  lines.push(cur);
  return lines;
}

function dataPage(cfg){
  const K = k => t(`${cfg.key}.${k}`);

  return function DataPage(root){
    const S = cfg.state || (cfg.state = {
      data: [...cfg.data], O: Object.fromEntries([...(cfg.options || []), ...(cfg.segs || [])].map(o => [o.key, o.def])),
      example: cfg.example ?? null, range: null
    });

    /* ---------- examples ---------- */
    const exO = e => ({ ...Object.fromEntries([...(cfg.options || []), ...(cfg.segs || [])].map(o => [o.key, o.def])), ...(e.O || {}) });
    const exList = () => cfg.examples.map(e => ({
      id: e.id, title: K("ex." + e.id), source: e.source,
      answer: cfg.answer(cfg.compute(e.data, exO(e)), exO(e))
    }));
    function loadExample(id){
      const e = cfg.examples.find(x => x.id === id); if (!e) return;
      Object.assign(S, { data: [...e.data], O: exO(e), example: id });
      writeText(); update(); fit();
    }

    /* ---------- markup ---------- */
    root.innerHTML = `
    <div class="page data-page">
      <header class="page-head"><h1>${K("title")}</h1></header>

      <section class="work">
        <div class="plot-col">
          <div class="plot-bar">
            <span class="plot-title">${t("dt.dotplot")}</span>
            <div class="bar-actions">
              <button class="btn" id="fitBtn" title="${t("fitTitle")}">${t("fitView")}</button>
            </div>
          </div>
          <div class="plot-wrap"><canvas id="plot" role="img" aria-label="${t("dt.dotplot")}"></canvas></div>
          <div class="legend">
            <div class="chips" id="chips"></div>
            <span class="hint" id="hint">${t("dt.hint")}</span>
          </div>
        </div>

        <aside class="controls" aria-label="${t("controls")}">
          <div class="group">
            <div class="group-head"><h2><label for="dataIn">${t("dt.data")}</label></h2><span class="count" id="count"></span></div>
            <textarea class="data-in" id="dataIn" rows="4" spellcheck="false" autocomplete="off"></textarea>
            <p class="note" id="dataNote">${t("dt.sepHint")}</p>
            <div class="data-actions">
              <button class="btn" id="sortBtn">${t("dt.sort")}</button>
            </div>
          </div>
          ${(cfg.segs || []).map(g => `
          <div class="group">
            <h2>${K("seg." + g.key)}</h2>
            <div class="seg full" role="group" data-seg="${g.key}">
              ${g.values.map(v => `<button data-v="${v}" aria-pressed="false">${K(`seg.${g.key}.${v}`)}</button>`).join("")}
            </div>
          </div>`).join("")}
          ${(cfg.options || []).length ? `<div class="group">${cfg.options.map(o => `<label class="check"><input type="checkbox" data-opt="${o.key}">${K("opt." + o.key)}</label>`).join("")}</div>` : ""}
          <div class="group result" aria-live="polite">
            <div class="p-big" id="big"></div>
            <div class="p-sub" id="sub"></div>
            <dl class="facts" id="facts"></dl>
          </div>
        </aside>
      </section>

      <section class="formulas" aria-label="${t("formulas")}">
        ${formulasHead()}
        <div id="frows"></div>
        <div id="vars"></div>
      </section>

      ${sectionsHtml({ about: K("about"), notes: cfg.notes.map(K), sources: cfg.sources.map(K) })}
    </div>`;

    const el = id => $("#" + id, root), dataIn = el("dataIn");
    let R = null;

    /* ---------- data box ---------- */
    function writeText(){ dataIn.value = formatData(S.data); dataIn.removeAttribute("aria-invalid"); }
    function readText(){
      const { values, bad } = parseData(dataIn.value), note = el("dataNote");
      const few = values.length < cfg.minN;
      note.classList.toggle("err", bad.length > 0 || few);
      note.textContent = bad.length ? t("dt.bad", { v: bad.slice(0, 3).join(" ") }) : few ? t("dt.few", { n: cfg.minN }) : t("dt.sepHint");
      dataIn.setAttribute("aria-invalid", bad.length > 0 || few);
      return bad.length ? null : values;
    }

    /* ---------- render ---------- */
    function renderFormulas(){
      const box = el("frows");
      const rows = cfg.formulas(R, S.O);
      box.innerHTML = rows.map((r, i) => `<div class="frow"><span class="flabel">${r.label}</span><div class="fmath" data-row="${i}">${
        r.chain ? M.math(M.row(r.chain.join(M.o("=")))) : r.html}</div></div>`).join("");
      rows.forEach((r, i) => {
        if (!r.chain) return;
        const f = $(`[data-row="${i}"]`, box);
        if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 3);
        if (f.scrollWidth > f.clientWidth + 2) f.innerHTML = M.chain(r.chain, 2);
      });
      el("vars").innerHTML = varsTableHtml(cfg.vars(R, S.O));
    }
    function renderResult(){
      const r = cfg.result(R, S.O);
      el("big").innerHTML = r.big; el("sub").innerHTML = r.sub;
      el("facts").innerHTML = r.facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    }
    function renderR(){
      const L = [`# ${K("title")}`, ...rVector(S.data), ...cfg.r(R, S.O)];
      el("rcode").innerHTML = codeHtml(L.join("\n"));
    }
    function syncControls(){
      el("count").textContent = t("dt.count", { n: S.data.length });
      $$("[data-seg]", root).forEach(g => $$("button", g).forEach(b => b.setAttribute("aria-pressed", b.dataset.v === S.O[g.dataset.seg])));
      $$("[data-opt]", root).forEach(c => { c.checked = !!S.O[c.dataset.opt]; });
    }
    function update(){
      syncControls();
      if (S.data.length < cfg.minN){ R = null; plot.draw(); return; }
      R = cfg.compute(S.data, S.O);
      renderFormulas(); renderResult(); renderR();
      markExample(el("examples"), S.example);
      plot.draw();
    }

    /* ---------- graph: dot plot ---------- */
    let layout = [];
    function fit(){
      if (!S.data.length){ plot.x0 = 0; plot.x1 = 10; plot.draw(); return; }
      const lo = Math.min(...S.data), hi = Math.max(...S.data), w = hi - lo || Math.max(1, Math.abs(lo) * 0.2);
      plot.x0 = lo - 0.1 * w; plot.x1 = hi + 0.1 * w;
      plot.draw();
    }
    function computeLayout(p){
      const axis = p.pad.t + p.ph, board = axis - (cfg.baseGap ?? 4), top = p.pad.t + (cfg.topSpace ?? 26);
      const order = S.data.map((v, i) => i).sort((a, b) => S.data[a] - S.data[b]);
      const stacks = r => {
        const cols = new Map(), out = [];
        for (const i of order){
          const px = p.X(S.data[i]), col = Math.round(px / (2 * r + 1)), k = cols.get(col) || 0;
          cols.set(col, k + 1); out.push({ i, v: S.data[i], px, k });
        }
        return out;
      };
      let r = 7, L = stacks(r);
      const tall = Math.max(1, ...L.map(d => d.k + 1));
      const fitR = Math.max(2.2, Math.min(7, (board - top) / (2 * tall + 0.5)));
      if (fitR < r){ r = fitR; L = stacks(r); }
      return L.map(d => ({ ...d, r, py: board - r - 1 - d.k * (2 * r + 0.6) }));
    }
    function drawPlot(p){
      const C = p.colors(), c = p.ctx;
      p.y0 = 0; p.y1 = 1;
      p.grid(C, { yTicks: [] });
      layout = computeLayout(p);
      if (!R){ return; }
      cfg.back?.(p, C, R, S.O, layout);
      p.clip(() => {
        for (const d of layout){
          const st = cfg.dot?.(d.i, d.v, R, S.O, C) || {};
          c.fillStyle = st.fill ?? C.muted; c.strokeStyle = st.stroke ?? C.surface; c.lineWidth = st.width ?? 1.2;
          c.beginPath(); c.arc(d.px, d.py, d.r, 0, Math.PI * 2); c.fill(); c.stroke();
        }
      });
      const drag = p.drag?.type === "handle" ? layout.find(d => d.i === p.drag.key) : null;
      if (drag) p.pill(drag.px, Math.max(p.pad.t, drag.py - drag.r - 26), show(trim(drag.v, 4)), C, false);
      cfg.front?.(p, C, R, S.O, layout);
    }
    const plot = new Plot(el("plot"), {
      draw: drawPlot,
      handles: () => layout.map(d => ({ key: d.i, x: d.v, py: d.py, r: d.r + 4 })),
      onFit: fit,
      onHandle(i, x){
        const dec = Num.decimalsFor(Num.niceStep(plot.x1 - plot.x0, 100));
        S.data[i] = +x.toFixed(dec);
        S.example = null; writeText(); update();
      },
    });
    plot.pad.l = 16;

    /* ---------- events ---------- */
    bindCopy($(".sections", root));
    dataIn.addEventListener("input", () => {
      const v = readText(); if (!v) return;
      S.data = v; S.example = null;
      const lost = v.some(x => x < plot.x0 || x > plot.x1);
      update(); if (lost) fit();
    });
    dataIn.addEventListener("change", () => { if (readText() && S.data.length >= cfg.minN) writeText(); });
    el("sortBtn").addEventListener("click", () => { S.data.sort((a, b) => a - b); writeText(); readText(); update(); });
    $$("[data-seg]", root).forEach(g => $$("button", g).forEach(b => b.addEventListener("click", () => {
      S.O[g.dataset.seg] = b.dataset.v; S.example = null; update();
    })));
    $$("[data-opt]", root).forEach(c => c.addEventListener("change", () => { S.O[c.dataset.opt] = c.checked; update(); }));
    el("fitBtn").addEventListener("click", fit);
    el("examples").innerHTML = examplesHtml(exList(), S.example);
    el("examples").addEventListener("click", e => { const b = e.target.closest("[data-ex]"); if (b) loadExample(b.dataset.ex); });

    const onTheme = () => plot.draw();
    document.addEventListener("themechange", onTheme);

    writeText(); readText();
    if (S.range) [plot.x0, plot.x1] = S.range; else fit();
    update();
    return () => { S.range = [plot.x0, plot.x1]; plot.destroy(); document.removeEventListener("themechange", onTheme); };
  };
}

/* ---------- small statistics helpers shared by the descriptive pages ---------- */
const Desc = {
  sum: xs => xs.reduce((s, x) => s + x, 0),
  mean: xs => Desc.sum(xs) / xs.length,
  sorted: xs => [...xs].sort((a, b) => a - b),
  /* Barbetta: value at position pos (1-based) of the ordered data, interpolating linearly. */
  at(sorted, pos){
    const n = sorted.length, k = Math.floor(pos + 1e-9), f = pos - k;
    if (k < 1) return { k: 1, f: 0, v: sorted[0] };
    if (k >= n) return { k: n, f: 0, v: sorted[n - 1] };
    return { k, f: f < 1e-9 ? 0 : f, v: sorted[k - 1] + (f < 1e-9 ? 0 : f) * (sorted[k] - sorted[k - 1]) };
  },
  median: xs => Desc.at(Desc.sorted(xs), (xs.length + 1) / 2).v,
};

/* ---- js/core/board.js ---- */
"use strict";
/* ============================================================
   Free-form canvas for diagrams that are not x–y graphs
   (Venn diagram, Bayes mosaic). Handles size, pixel ratio and
   pointer dragging; the page draws everything itself.

     const b = new Board(canvas, {
       draw(b) { … b.ctx, b.w, b.h … },
       hit(x, y)  → a drag target or null      (cursor "grab" over it)
       drag(target, x, y, dx, dy)              while dragging (pixels)
       click(x, y)                             tap without moving
     });
   ============================================================ */
class Board {
  constructor(canvas, opts){
    Object.assign(this, { c: canvas, ctx: canvas.getContext("2d"), o: opts, w: 0, h: 0, dragging: null });
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(canvas);
    canvas.addEventListener("pointerdown", e => {
      if (e.button !== 0) return;
      const [x, y] = this.local(e), t = this.o.hit?.(x, y);
      this.dragging = { t, x0: x, y0: y, moved: false };
      if (t){ canvas.setPointerCapture(e.pointerId); canvas.classList.add("dragging"); e.preventDefault(); }
    });
    canvas.addEventListener("pointermove", e => {
      const [x, y] = this.local(e), d = this.dragging;
      if (d?.t){
        if (Math.abs(x - d.x0) + Math.abs(y - d.y0) > 2) d.moved = true;
        this.o.drag?.(d.t, x, y, x - d.x0, y - d.y0); this.draw();
      } else if (!d) canvas.style.cursor = this.o.hit?.(x, y) ? "grab" : (this.o.click ? "pointer" : "");
    });
    const end = e => {
      const d = this.dragging; this.dragging = null; canvas.classList.remove("dragging");
      if (d && !d.moved && e?.type === "pointerup"){ const [x, y] = this.local(e); this.o.click?.(x, y); }
      this.o.end?.(); this.draw();
    };
    canvas.addEventListener("pointerup", end);
    canvas.addEventListener("pointercancel", () => end());
  }
  destroy(){ this.ro.disconnect(); }
  local(e){ const r = this.c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  resize(){
    const r = this.c.getBoundingClientRect(); this.dpr = window.devicePixelRatio || 1;
    this.w = r.width; this.h = r.height;
