":"Mayor election, no previous poll","ss.ex.brand":"Market research, at least 60% prefer brand A","ss.ex.pilot":"Pilot sample with variance 16","ss.ex.tv":"Daily time students spend watching TV","ss.ex.hardness":"Hardness of test specimens, pilot sample of 10","ss.sym.n0":"initial sample size, valid for an infinite or very large population","ss.sym.n":"minimum sample size, always rounded up","ss.sym.N":"population size","ss.sym.gamma":"confidence level, such as 95%; α = 1 − γ","ss.sym.z":"standard normal value that leaves γ in the middle: P(−z<sub>γ</sub> &lt; Z &lt; z<sub>γ</sub>) = γ. Also written z<sub>α/2</sub>.","ss.sym.t":"Student’s t value that leaves γ in the middle, with n − 1 degrees of freedom of the pilot sample","ss.sym.eps":"maximum sampling error tolerated (margin of error), in the units of the variable. Barbetta writes E<sub>0</sub>.","ss.sym.sigma":"population standard deviation, from a previous study or from experience","ss.sym.s":"standard deviation of the pilot sample, used in place of σ","ss.sym.df":"degrees of freedom of t: the pilot sample size minus 1","ss.sym.pq":"variance of a proportion. With no estimate of p, its largest value 1/4 (at p = 0.5) is used.","ss.sym.p":"expected proportion. With no estimate, the bound p(1 − p) ≤ 1/4 is used.","ss.note.round":"The sample size is the smallest whole number that gives the required precision, so it is always rounded up, never to the nearest whole number.","ss.note.sigma":"σ is usually unknown. Take it from previous studies or experience, or from a pilot sample. With a pilot sample, Barbetta recommends t<sub>γ</sub> with n − 1 degrees of freedom in place of z<sub>γ</sub>.","ss.note.p":"With no information about p, use p(1 − p) ≤ 1/4. The product is largest at p = 0.5, so the sample is never too small. The same formula plans surveys that estimate several proportions at once, such as election polls.","ss.note.two":"At 95% confidence, z<sub>γ</sub> = 1.96 ≈ 2, so z²/(4ε²) becomes n₀ ≈ 1/ε². For ε = 5%, number of distinct values","mean.r.mean":"mean","mean.r.formula":"the same, from the formula","mean.ex.turmaA":"Final grades, class A","mean.ex.turmaB":"Final grades, class B: same mean, more spread","mean.ex.turmaC":"Final grades, class C: one grade of 0 pulls the mean down","mean.ex.load":"Load time of an application (s), 50 observations","mean.ex.bm":"Nine values of a variable X","mean.ex.bm67":"The same nine values plus 67","mean.note.balance":"Drag any point and watch the mean follow: every value counts, in proportion to how far it is from the others.","mean.note.outlier":"The mean is pulled by outliers. In class C the grade 0 drops the mean to 6 while most grades are 7 or more; the median (7) is more resistant.","mean.note.freq":"With repeated values, multiply each distinct value by its frequency before adding: x̄ = Σxⱼnⱼ / n (Barbetta eq. 3.9).","mean.note.units":"The mean has the same unit as the data. The mean of a population is written μ; x̄ is the mean of a sample.","mean.src.barbetta":"Barbetta, Reis & Bornia, <em>Estatística para cursos de engenharia e informática</em>: section 3.4.1 (equations 3.4 and 3.9), Examples 3.2 and 3.4.","mean.src.bussab":"Bussab & Morettin, <em>Estatística básica</em>: section 3.1 and Example 3.5.","sdp.title":"Standard deviation","sdp.about":"How far the values typically are from their mean. The variance is the average of the squared deviations (xᵢ − x̄)², using n − 1 for a sample; the standard deviation is its square root, in the same unit as the data.","sdp.seg.div":"Denominator","sdp.seg.div.n1":"n − 1 (sample)","sdp.seg.div.n":"n","sdp.f.mean":"Mean","sdp.f.var":"Variance","sdp.f.sd":"Standard deviation","sdp.f.short":"Shortcut formula","sdp.sym.s":"standard deviation of the sample","sdp.sym.s2":"variance of the sample","sdp.sym.dp":"standard deviation, dividing by n","sdp.sym.var":"variance, dividing by n","sdp.sym.xbar":"arithmetic mean of the data","sdp.sym.ss":"sum of the squared deviations from the mean","sdp.sym.sx e median md and three quarters below the upper quartile qs. The box plot draws them, with the extremes and the outliers.","qt.pos":"position","qt.f.sorted":"Ordered data","qt.f.qi":"Lower quartile","qt.f.md":"Median","qt.f.qs":"Upper quartile","qt.f.box":"Box plot","qt.sym.xk":"value in position k of the ordered data","qt.sym.qi":"lower (first) quartile","qt.sym.md":"median (second quartile)","qt.sym.qs":"upper (third) quartile","qt.sym.dq":"interquartile range","qt.sym.lf":"lower limit for outliers","qt.sym.uf":"upper limit for outliers","qt.fact.dq":"Interquartile range dq","qt.fact.out":"Outliers","qt.none":"none","qt.r.q":"qi, md, qs","qt.r.box":"R draws the box with hinges; they can differ slightly","qt.ex.eleven":"Eleven observations","qt.ex.load":"Load time of an application (s), 50 observations","qt.ex.turmaC":"Final grades, class C","qt.ex.even":"Six values: the median of an even count","qt.ex.bm":"Nine values of a variable X","qt.note.pos":"Order the data first. The positions are (n + 1)/4, (n + 1)/2 and 3(n + 1)/4; when a position is fractional, interpolate between the neighbouring values.","qt.note.even":"With an even number of values the median is the average of the two central values: position 3.5 of 3, 5, 6, 7, 10, 11 gives (6 + 7)/2 = 6.5.","qt.note.resist":"The median and the quartiles depend only on the order of the values, so an outlier hardly moves them. Drag the largest point far to the right and compare with the mean.","qt.note.box":"In the box plot the whiskers go to the last values inside qi − 1.5dq and qs + 1.5dq; values beyond are outliers (circles), and beyond 3dq far outliers (crosses).","qt.note.methods":"Books and software use slightly different rules for quartiles. This page follows Barbetta, the same as quantile(x, type = 6) in R; R's default (type 7) can give other values.","qt.src.barbetta":"Barbetta, Reis & Bornia, <em>Estatística para cursos de engenharia e informática</em>: section 3.4.2 (median, quartiles and box plot), Examples dd.note.twice":"In the diagram the overlap is shaded twice: that is the part counted twice in P(A) + P(B).","add.note.excl":"If A and B are mutually exclusive, P(A ∩ B) = 0 and the rule becomes P(A ∪ B) = P(A) + P(B).","add.note.none":"The complement of “A or B” is “neither A nor B”: P(Ā ∩ B̄) = 1 − P(A ∪ B).","add.note.three":"For three events: P(A ∪ B ∪ C) = P(A) + P(B) + P(C) − P(A ∩ B) − P(A ∩ C) − P(B ∩ C) + P(A ∩ B ∩ C).","add.src.barbetta":"Barbetta, Reis & Bornia, <em>Estatística para cursos de engenharia e informática</em>: section 4.2 (equation 4.7), Exercises 3 and 4 of chapter 4.","add.src.bussab":"Bussab & Morettin, <em>Estatística básica</em>: section 5.2.","cond.title":"Conditional probability","cond.about":"The probability of A when we already know that B happened. B becomes the new sample space, and A can only happen in the part of it that is also A: P(A | B) = P(A ∩ B)/P(B).","cond.f.cond":"Conditional probability","cond.f.product":"Product rule","cond.f.other":"The other way round","cond.f.indep":"Independence","cond.indepYes":"Knowing that B happened does not change the probability of A: A and B are independent, and P(A ∩ B) = P(A)·P(B).","cond.indepNo":"Knowing that B happened changes the probability of A: A and B are not independent.","cond.sym.AgB":"probability of A given that B occurred","cond.sym.AB":"probability that A and B both occur","cond.sym.B":"probability of the event known to have occurred","cond.sym.A":"probability of A without any information","cond.sym.BgA":"probability of B given that A occurred","cond.r.indep":"TRUE if independent","cond.ex.milk":"Milk packs: out of specification (A), given that it is UHT (B)","cond.ex.diceA":"Two dice: equal faces (A), given that the sum is at most 5 (B)","cond.ex.diceB":"Two dice: sum at most 5 (A), given equal faces (B)","cond.ex.employees":"Employees who left: because of the duties (A), given the salary (B)","cond.ex.die":"A die: even (A), given 3 or more (B): independent","cond.note.space":"Conditioning shrinks the sample space to B. In the diagram everything outside B is greyed out.","cond.note.order":"P(A | B) and P(B | A) are different: in the dice example they are 0.2 and 0.333.","cond.note.product":"Rearranged, the definition gives the product rule P(A ∩ B) = P(B)·P(A | B), used for draws one after another.","cond.note.indep":"A and B are independent when P(A | B) = P(A), which is the same as P(A ∩ B) = P(A)·P(B). Use the Independent button to see it.","cond.src.barbetta":"Barbetta, Reis & Bornia, <em>Estatística para cursos de engenharia e informática</em>: section 4.3 (equations 4.8 to 4.10), Examples 4.7 and 4.8.","cond.src.bussab":"Bussab & Morettin, <em>Estatística básica</em>: section 5.3.","bayes.title":"Bayes’ theorem","bayes.about":"When the events E₁, …, Eₖ split the sample space and F is observed, Bayes’ theorem updates the probability of each Eⱼ: from the prior P(Eⱼ) to the posterior P(Eⱼ | F). P(F) comes from the theorem of total probability.","bayes.diagram":"Mosaic: the events Eᵢ and the part of each that is F","bayes.hint":"Drag a column’s level to change P(F | Eᵢ) and a divider to change P(Eᵢ). Click a column to choose Eⱼ.","bayes.events":"Events","bayes.add":"Add event","bayes.remove":"Remove event","bayes.equal":"Equal P(Eᵢ)","bayes.equalTitle":"Give every event the same prior probability 1/k","bayes.pick":"Calculate the probability of this event given F","bayes.err.range":"Each probability must be between 0 and 1.","bayes.err.sum":"The P(Eᵢ) must add up to 1 (now {s}).","bayes.err.zero":"P(F) is 0, so F cannot be observed.","bayes.omega":"Ω: column widths P(Eᵢ), shaded heights P(F | Eᵢ)","bayes.onlyF":"F only","bayes.before":"before F","bayes.f.total":"Total probability","bayes.f.bayes":"Bayes’ theorem","bayes.sym.post":"posterior: probability of Eⱼ after observing F","bayes.sym.prior":"prior: probability of Eⱼ before observing F","bayes.sym.lik":"probability of F when Eⱼ occurs","bayes.sym.F":"total probability of F","bayes. .steel":"Hardness of steel, 10 test pieces","ci-mean.ex.nicotine":"Nicotine in 20 cigarettes; the maker claims at most 30 mg","ci-mean.ex.coop":"Cooperative acts of 10 children","ci-mean.ex.blocks":"Engine blocks, 36 bores, 99%; the target is 100 mm","ci-mean.note.meaning":"Confidence γ is about the method: of all the intervals built this way from different samples, a proportion γ contains μ. A given interval either contains μ or not.","ci-mean.note.width":"A higher confidence level gives a wider interval; a larger sample gives a narrower one, since the standard error falls with √n.","ci-mean.note.tz":"t has heavier tails than z, so its intervals are wider; for n > 30 the two are close, and the table’s last row (∞) is z.","ci-mean.note.normal":"For a small sample the interval assumes data from an approximately normal population; for a large one the central limit theorem covers it.","ci-mean.src.barbetta":"Barbetta, Reis & Bornia, <em>Estatística para cursos de engenharia e informática</em>: section 7.3.3 (equations 7.36 and 7.41), Examples 7.4 and 7.5, Table 4, Exercise 12 of chapter 7.","ci-mean.src.bussab":"Bussab & Morettin, <em>Estatística básica</em>: section 11.6.","ci-prop.title":"Confidence interval for a proportion","ci-prop.about":"A range of values that contains the population proportion p with confidence γ, built from the sample proportion p̂ = y/n and its standard error √(p̂(1 − p̂)/n), using the normal approximation.","ci-prop.graph":"Sampling distribution of the proportion, centred on p̂","ci-prop.y":"Number with the attribute","ci-prop.f.phat":"Sample proportion","ci-prop.sym.ic":"interval that contains p with confidence γ","ci-prop.sym.est":"sample proportion","ci-prop.sym.y":"number of elements in the sample with the attribute","ci-prop.ex.systems95":"System A better than B in 60% of 400 workloads, 95%","ci-prop.ex.systems99":"The same, with 99% confidence","ci-prop.ex.happy":"35 of 164 students say they are very happy","ci-prop.ex.brand":"140 of 200 people prefer brand A","ci-prop.ex.buildings":"55% of 200 five-year-old buildings have relevant defects","ci-prop.ex.pads":"18 of 600 brake pads with excessive wear","ci-prop.note.large":"The interval needs a large sample: Barbetta asks for n > 50; another common rule asks for at least 15 observations in the category and 15 outside it.","ci-prop.note.width":"Raising the confidence from 95% to 99% widens the interval: in the systems example from ± 4.8% to ± 6.3%.","ci-prop.note.pct":"Proportions are often reported as percentages: 0.600 ± 0.048 is 60.0% ± 4.8%.","ci-prop.note.size":"To plan the sample size for a chosen margin of error, see the Sample size page.","ci-prop.src.barbetta":"Barbetta, Reis & Bornia, <em>Estatística para cursos de engenharia e informática</em>: section 7.3.2 (equations 7.27 to 7.29, Figure 7.8), Example 7.3, Exercises 10 and 11 of chapter 7.","ci-prop.src.bussab":"Bussab & Morettin, <em>Estatística básica</em>: section 11.6.","test.err.alpha":"α must be between 0% and 50%.","test.err.p0":"p₀ must be between 0 and 1.","test.reject":"Reject H₀","test.accept":"Do not reject H₀","test.lgReject":"Rejection region (area α)","test.lgP":"p-value","test.hint":"Drag the statistic to see when the decision changes.","test.h1":"Alternative hypothesis H₁","test.h1.lt":"One-sided to the left: the evidence sought is a smaller value.","test.h1.ne":"Two-sided: any difference, larger or smaller.","test.h1.gt":"One-sided to the right: the evidence sought is a larger value.","test.data":"Sample","test.alpha":"Significance level","test.alphaLbl":"Significance level","test.tableZ":"Round z to 2 decimals and areas to 4, as in the table","test.tableT":"Round the critical t to 3 decimals, as in the table","test.method.z":"z (σ known)","test.method.t":"t (σ unknown)","test.graphZ":"Standard normal distribution: the statistic when H₀ is true","test.graphT":"Student’s t distribution: the statistic when H₀ is true","test.small":"n·p₀ or n·(1 − p₀) is 5 or less: the no ia e a variância são ambas iguais a λ.","poi.src.barbetta":"Barbetta, Reis & Bornia, <em>Estatística para cursos de engenharia e informática</em>: seção 5.2.4 (equações 5.19 a 5.24), Exemplos 5.4 e 5.5.","poi.src.bussab":"Bussab & Morettin, <em>Estatística básica</em>: seções 6.6 e 6.7 (o processo de Poisson).","uni.title":"Distribuição uniforme","uni.about":"Uma variável contínua com a mesma chance de cair em qualquer ponto de um intervalo [α, β]: todo subintervalo de mesmo comprimento tem a mesma probabilidade.","uni.param.alpha":"Limite inferior","uni.param.beta":"Limite superior","uni.sym.alpha":"menor valor possível","uni.sym.beta":"maior valor possível","uni.err.order":"β precisa ser maior que α.","uni.ex.current":"Corrente em um fio de cobre, de 0 a 20 mA: entre 5 e 10","uni.ex.current10":"Corrente em um fio de cobre: abaixo de 10 mA","uni.ex.spinner":"Ângulo de um ponteiro, de 0° a 360°: primeiro quadrante","uni.note.flat":"A densidade é a constante 1/(β − α), então uma probabilidade é o comprimento do intervalo dividido por β − α.","uni.note.center":"O valor esperado é o ponto médio do intervalo.","uni.src.barbetta":"Barbetta, Reis & Bornia, <em>Estatística para cursos de engenharia e informática</em>: seção 6.2.1 (equações 6.10 a 6.13), Exemplo 6.2.","uni.src.bussab":"Bussab & Morettin, <em>Estatística básica</em>: seção 7.4.","expo.title":"Distribuição exponencial","expo.about":"O tempo (ou a distância) entre ocorrências consecutivas de um processo de Poisson com taxa λ. A chance de esperar mais do que x cai exponencialmente: P(X > x) = e<sup>−λx</sup>.","expo.param.lambda":"Taxa","expo.sym.lambda":"número médio de ocorrências por unidade de tempo; o tempo médio de espera é 1/λ","expo.ex.db":"Resposta de um banco de dados, λ = 2 por minuto: mais de 3 minutos","expo.ex.db23":"Resposta do banco de dados: entre 2 e 3 minutos","expo.ex.logins":"Logins na rede, 25 por hora: nenhum nos próximos 6 minutos","expo.ex.logins23":"Logins na rede: o próximo entre 2 e es, então um valor discrepante quase não os move. Arraste o maior ponto para bem longe à direita e compare com a média.","qt.note.box":"No diagrama em caixas as linhas vão até os últimos valores dentro de qi − 1,5dq e qs + 1,5dq; além disso são valores discrepantes (círculos) e, além de 3dq, muito distantes (cruzes).","qt.note.methods":"Livros e programas usam regras um pouco diferentes para os quartis. Esta página segue o Barbetta, o mesmo que quantile(x, type = 6) no R; o padrão do R (type 7) pode dar outros valores.","qt.src.barbetta":"Barbetta, Reis & Bornia, <em>Estatística para cursos de engenharia e informática</em>: seção 3.4.2 (mediana, quartis e diagrama em caixas), Exemplos 3.2 e 3.4.","qt.src.bussab":"Bussab & Morettin, <em>Estatística básica</em>: seções 3.3 e 3.4, Exemplo 3.5.","exercise":"Exercício","venn.diagram":"Diagrama de Venn","venn.hint":"Arraste um círculo para mudar o quanto A e B se sobrepõem.","venn.scaled":"Círculos reduzidos para caber; a barra é exata.","venn.toScale":"Áreas em escala: Ω tem área 1.","venn.excl":"Mutuamente exclusivos","venn.exclTitle":"P(A ∩ B) = 0: A e B não podem ocorrer juntos","venn.ind":"Independentes","venn.indTitle":"P(A ∩ B) = P(A)·P(B)","venn.probs":"Probabilidades","venn.fracHint":"Decimais ou frações, como 0,25 ou 1/6.","venn.err.range":"Cada probabilidade deve estar entre 0 e 1.","venn.err.big":"P(A ∩ B) não pode ser maior que P(A) ou P(B).","venn.err.small":"P(A ∩ B) deve ser pelo menos P(A) + P(B) − 1, senão P(A ∪ B) passaria de 1.","venn.err.zeroB":"P(B) deve ser maior que 0 para condicionar em B.","venn.onlyA":"Só A","venn.onlyB":"Só B","venn.both":"Ambos","venn.none":"Nenhum","venn.neither":"Nenhum:","venn.relation":"A e B são","venn.isExcl":"mutuamente exclusivos","venn.isInd":"independentes","venn.isDep":"não independentes","venn.barUnion":"O espaço amostral Ω, dividido exatamente","venn.barCond":"Dentro de B, o novo espaço amostral","add.title":"Regra da soma","add.about":"A probabilidade de ocorrer
