<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probest Workbench</title>
<!--
  Development entry point: open this file directly in a browser.
  `npm run build` (or `node build.js`) inlines every local stylesheet and
  script below, in this order, into a single file: dist/index.html.
  To add a file, add a <link> or <script> tag here.
-->
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/page.css">
<link rel="stylesheet" href="styles/pages/data.css">
<link rel="stylesheet" href="styles/pages/prob.css">
<link rel="stylesheet" href="styles/pages/infer.css">
<link rel="stylesheet" href="styles/pages/sample-size.css">
<link rel="stylesheet" href="styles/pages/placeholder.css">
<link rel="stylesheet" href="styles/pages/home.css">
</head>
<body>
<div class="app" id="app">
  <div class="topbar">
    <button id="menuBtn" aria-label="Open menu" aria-controls="side" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
    </button>
    <a class="app-name topbar-name" href="#/">Probest Workbench</a>
  </div>
  <div class="scrim" id="scrim"></div>

  <aside class="side" id="side">
    <a class="brand" href="#/"><span class="mark">σ</span><span class="app-name">Probest Workbench</span></a>
    <div class="side-tools">
      <label class="search">
        <input id="q" type="search" placeholder="Find a formula" aria-label="Find a formula" autocomplete="off">
        <kbd id="kbdHint">Ctrl K</kbd>
      </label>
      <button class="icon-btn" id="foldBtn" type="button"></button>
    </div>
    <nav id="nav" aria-label="Formulas"></nav>
    <div class="side-foot">
      <button class="ghost" id="themeBtn"></button>
      <div class="seg" role="group" id="langSeg">
        <button data-lang="en" title="English" lang="en" aria-pressed="false">EN</button>
        <button data-lang="pt" title="Português" lang="pt-BR" aria-pressed="false">PT</button>
      </div>
    </div>
  </aside>

  <main id="main">
    <div id="view"></div>
    <footer class="foot" id="foot"></footer>
  </main>
</div>

<!-- core: helpers, language, numbers, maths, plotting -->
<script src="js/core/app-info.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/core/format.js"></script>
<script src="js/core/numerics.js"></script>
<script src="js/core/mathml.js"></script>
<script src="js/core/plot.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/distpage.js"></script>
<script src="js/core/datapage.js"></script>
<script src="js/core/board.js"></script>
<script src="js/core/vennpage.js"></script>
<script src="js/core/cipage.js"></script>
<script src="js/core/testpage.js"></script>
<script src="js/core/pairpage.js"></script>
<!-- translations -->
<script src="js/locales/en.js"></script>
<script src="js/locales/pt.js"></script>
<!-- navigation and pages -->
<script src="js/nav.js"></script>
<script src="js/pages/placeholder.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/desc/mean.js"></script>
<script src="js/pages/desc/standard-deviation.js"></script>
<script src="js/pages/desc/quartiles.js"></script>
<script src="js/pages/prob/addition-rule.js"></script>
<script src="js/pages/prob/conditional-probability.js"></script>
<script src="js/pages/prob/bayes.js"></script>
<script src="js/pages/expected-value.js"></script>
<script src="js/pages/dist/binomial.js"></script>
<script src="js/pages/dist/hypergeometric.js"></script>
<script src="js/pages/dist/poisson.js"></script>
<script src="js/pages/dist/uniform.js"></script>
<script src="js/pages/dist/exponential.js"></script>
<script src="js/pages/dist/normal.js"></script>
<script src="js/pages/est/ci-mean.js"></script>
<script src="js/pages/est/ci-proportion.js"></script>
<script src="js/pages/sample-size.js"></script>
<script src="js/pages/tests/test-mean.js"></script>
<script src="js/pages/tests/test-proportion.js"></script>
<script src="js/pages/tests/chi-square.js"></script>
<script src="js/pages/reg/data.js"></script>
<script src="js/pages/reg/correlation.js"></script>
<script src="js/pages/reg/linear-regression.js"></script>
<!-- app shell: starts everything, keep last -->
<script src="js/app.js"></script>
</body>
</html>
